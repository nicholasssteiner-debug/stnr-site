<style>
  :root{
    --g1:#22352a; --g2:#3e5f46; --dark:#2c3e31; --blue:#3f7f95; --red:#e53935; --bg:#f6f6f6; --card:#fff;
    --line:#e1e1e1; --txt:#222; --muted:#6e6e6e; --ok:#3aa757; --warn:#c98a00; --info:#eaf8fb; --infoline:#a8dae5; --sel:#e2e2e2;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:Lato,'Segoe UI',Arial,sans-serif;font-size:15px}
  a{color:inherit}
  .top{position:sticky;top:0;z-index:30;height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;color:#fff;
       background:linear-gradient(90deg,var(--g1),var(--g2) 45%,var(--g1))}
  .top .ham{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:6px}
  .logo{font-weight:400;letter-spacing:.12em;font-size:22px}
  .pill{background:#f2c94c;color:#3a2e00;font-weight:900;font-size:11px;letter-spacing:.08em;padding:4px 9px;border-radius:20px}
  .top .sp{flex:1}
  .top .user{font-size:13px;opacity:.85}
  @media(max-width:600px){.top .user{display:none}}
  .side{position:fixed;top:54px;left:0;bottom:0;width:280px;background:#fff;border-right:1px solid var(--line);z-index:25;
        transform:translateX(-100%);transition:transform .2s;overflow:auto;box-shadow:4px 0 16px rgba(0,0,0,.08)}
  .side.open{transform:none}
  .side .grp{padding:14px 18px 8px;font-weight:700;color:#333}
  .side a{display:block;padding:10px 18px 10px 34px;text-decoration:none;font-size:14px;color:#333}
  .side a.root{padding-left:18px;font-weight:700}
  .side a.on{background:var(--dark);color:#fff;font-weight:700}
  .side a:hover:not(.on){background:#f0f0f0}
  .main{max-width:1200px;margin:0 auto;padding:18px 16px 80px}
  .crumb{color:var(--muted);font-size:14px;margin:6px 0 8px}
  .crumb b{color:#444}
  h1{font-size:28px;margin:0 0 16px;font-weight:700}
  h2{font-size:21px;margin:0 0 12px}
  h3{font-size:17px;margin:0 0 10px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:#333;border-radius:4px;
       padding:9px 16px;font:inherit;font-size:14px;cursor:pointer;font-weight:700;text-decoration:none}
  .btn:hover{filter:brightness(.96)}
  .btn.dark{background:var(--dark);border-color:var(--dark);color:#fff}
  .btn.red{background:var(--red);border-color:var(--red);color:#fff}
  .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
  .btn.grey{background:#ddd;border-color:#ddd;color:#555}
  .btn.sm{padding:5px 10px;font-size:13px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row .sp{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .c3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:820px){.cols{grid-template-columns:1fr}}
  @media(max-width:560px){.c3{grid-template-columns:1fr 1fr}}
  label.f{display:block;font-size:13px;color:#555;margin:12px 0 5px}
  label.f.req::after{content:" *";color:var(--red)}
  input,select,textarea{width:100%;border:1px solid #d5d5d5;border-radius:4px;padding:10px 12px;font:inherit;font-size:14px;background:#fff;color:#222}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(63,127,149,.15)}
  input[type=checkbox]{width:auto}
  textarea{min-height:64px;resize:vertical}
  .muted{color:var(--muted);font-size:13px}
  .na{display:flex;align-items:center;justify-content:center;min-height:180px;font-size:19px;font-weight:700;color:#333}
  .info{background:var(--info);border:1px solid var(--infoline);border-radius:4px;padding:14px;color:#2b6576;font-size:14px;display:flex;gap:14px}
  .info .ic{flex:none;width:38px;height:38px;border-radius:50%;background:#3f7f95;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}
  .warnbox{background:#fff7e0;border:1px solid #f0d58a;color:#7a5a00;border-radius:4px;padding:10px 12px;font-size:14px;margin:10px 0}
  .errbox{background:#fdecec;border:1px solid #f3b4b4;color:#9b1c1c;border-radius:4px;padding:10px 12px;font-size:14px;margin:10px 0}
  .okbox{background:#e8f6ec;border:1px solid #a8dbb6;color:#1f6b35;border-radius:4px;padding:10px 12px;font-size:14px;margin:10px 0}
  .drop{border:2px dashed #ccc;border-radius:4px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;
        text-align:center;padding:16px;cursor:pointer;font-weight:700;font-size:16px}
  .drop:hover{border-color:var(--blue)}
  table.t{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
  table.t th{text-align:left;padding:9px 8px;border-bottom:2px solid var(--line);white-space:nowrap;font-weight:700}
  table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#f4f8f5}
  table.t tr.cur td{background:var(--sel)}
  table.t tr.sint td{font-weight:700;background:#fafafa}
  table.t tr.off td{color:#aaa}
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
  .num{text-align:right;white-space:nowrap}
  .st{display:inline-flex;gap:6px;align-items:flex-start;font-size:13px}
  .st .i{font-weight:900}
  .st.ok .i{color:var(--ok)} .st.wait .i{color:var(--warn)} .st.dev .i{color:var(--red)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 16px;flex-wrap:wrap}
  .tabs button{background:none;border:0;padding:10px 14px;font:inherit;font-size:15px;color:#888;cursor:pointer;border-bottom:3px solid transparent}
  .tabs button.on{color:#222;font-weight:700;border-bottom-color:var(--dark)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:12px 0}
  .chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
  .chips button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px 22px}
  .kv .k{font-size:12.5px;color:var(--muted)} .kv .v{font-size:15px;margin-top:2px}
  .big{font-size:21px;font-weight:700}
  .lanc{border:1px solid var(--line);border-radius:4px;margin-top:12px;overflow:hidden;background:#fff}
  .lanc .hd{background:#3a3a3a;color:#fff;padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .lanc .hd b{flex:1;min-width:200px;font-weight:700}
  .lanc .meta{padding:10px 14px;font-size:13px;color:#444;display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
  .tot{padding:10px 14px;display:flex;gap:22px;flex-wrap:wrap;font-weight:700;font-size:14px}
  .anexo{background:#fff;border:1px solid #bbb;padding:18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.45;max-width:640px}
  .anexo .h{font-weight:900;font-size:15px;border-bottom:1px solid #999;padding-bottom:6px;margin-bottom:8px;font-family:Lato,Arial}
  .anexo table{width:100%;border-collapse:collapse;margin:6px 0}
  .anexo td{border:1px solid #ccc;padding:3px 6px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{background:#fff;border-radius:6px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:20px}
  .modal.wide{max-width:760px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2c3e31;color:#fff;padding:12px 18px;border-radius:6px;z-index:60;
         font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:92vw}
  .miss{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .miss .ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #bbb;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
  .miss.done .ck{background:var(--ok);border-color:var(--ok)}
  .bar{height:10px;background:#e6e6e6;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:12px;background:#eee;color:#555}
  .tag.red{background:#fdecec;color:#9b1c1c}.tag.green{background:#e8f6ec;color:#1f6b35}.tag.yel{background:#fff3cd;color:#7a5a00}
  .hint{font-size:12.5px;color:#2b6576;background:var(--info);border-left:3px solid var(--blue);padding:7px 10px;margin:8px 0;border-radius:2px}
  .rbox{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;background:#fcfcfc}
  .x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer}
  .flow{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch;margin:10px 0}
  .flow div{flex:1;min-width:140px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--dark);padding:10px;border-radius:4px;font-size:13.5px}
  .flow b{display:block;margin-bottom:4px}
  .sticky-send{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;margin:20px -16px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:5}
  .mob-card{display:none}
  .inp-sm{padding:6px 8px;font-size:13px}
  @media(max-width:760px){
    .desk-only{display:none}
    .mob-card{display:block;background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:10px;cursor:pointer;font-size:14px}
    .mob-card div{margin:2px 0}
  }
</style>
</head>

const $ = s => document.querySelector(s);

const r2 = v => Math.round((+v||0)*100)/100;

const dt = iso => iso ? iso.slice(0,10).split('-').reverse().join('/') : '';
const dth = iso => iso ? dt(iso)+' '+iso.slice(11,16) : '';
const pad = n => String(n).padStart(2,'0');
function isoDay(off=0,base){const d=base?new Date(base+'T12:00:00'):new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addMonths(iso,n){const d=new Date(iso+'T12:00:00');d.setMonth(d.getMonth()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function diaMesSeguinte(iso,dia){const d=new Date((iso||isoDay(0)).slice(0,7)+'-01T12:00:00');d.setMonth(d.getMonth()+1);d.setDate(dia);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function nowIso(){const d=new Date();return isoDay(0)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}

const digits = s => String(s||'').replace(/\D/g,'');
function parseMoney(s){const d=digits(s);return d?r2(parseInt(d,10)/100):0}
function toast(msg){const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
function parseLista(id){return $('#'+id).textContent.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const i=l.indexOf(' - ');return [l.slice(0,i).trim(),l.slice(i+3).trim()]})}
const fmtDoc = dd => dd.length===14?dd.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):dd.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4');

/* Chave de acesso (NF-e/NFC-e/CT-e): cUF AAMM CNPJ mod série nNF tpEmis cNF DV */
function dvMod11(s){let p=2,t=0;for(let i=s.length-1;i>=0;i--){t+=+s[i]*p;p=p===9?2:p+1}const r=11-(t%11);return r>=10?0:r}
function gerarChave(cnpj,emissao,modelo,serie,numero){const b='41'+emissao.slice(2,4)+emissao.slice(5,7)+digits(cnpj).padStart(14,'0').slice(-14)+modelo+
  digits(serie||'1').padStart(3,'0').slice(-3)+digits(numero).padStart(9,'0').slice(-9)+'1'+String(10000000+(+digits(numero)*7919)%89999999).slice(-8);return b+dvMod11(b)}
function validarChave(d){const E=[],k=digits(d.chave),f=pessoa(d.forn);
  if(!k)return ['Chave de acesso não informada.'];
  if(k.length!==44)return ['A chave deve ter 44 dígitos (tem '+k.length+').'];
  if(dvMod11(k.slice(0,43))!==+k[43])E.push('Dígito verificador inválido.');
  if(k.slice(6,20)!==digits(f.doc).padStart(14,'0'))E.push('CNPJ da chave ('+fmtDoc(k.slice(6,20))+') diferente do emitente ('+f.doc+').');
  if(MODELO[d.tipo]&&k.slice(20,22)!==MODELO[d.tipo])E.push('Modelo da chave ('+k.slice(20,22)+') não corresponde ao tipo '+d.tipo+'.');
  if(+k.slice(22,25)!==+digits(d.serie||'0'))E.push('Série da chave ('+(+k.slice(22,25))+') diferente da série informada ('+(d.serie||'vazia')+').');
  if(+k.slice(25,34)!==+digits(d.numero))E.push('Número da chave ('+(+k.slice(25,34))+') diferente do número informado ('+d.numero+').');
  if(d.emissao&&k.slice(2,6)!==d.emissao.slice(2,4)+d.emissao.slice(5,7))E.push('Ano/mês da chave ('+k.slice(4,6)+'/20'+k.slice(2,4)+') diferente da emissão ('+dt(d.emissao).slice(3)+').');
  return E}

  if(d.fiscal.status==='pendente')return {txt:'Aprovado - Aguardando Análise Fiscal',cls:'wait',i:'&#9719;'};
  return {txt:'Análise Fiscal Concluída - Aguardando Análise Contábil - Pronto para Pagamento',cls:'ok',i:'&#10004;'};
}
const stHtml=d=>{const s=status(d);return `<span class="st ${s.cls}"><span class="i">${s.i}</span><span>${esc(s.txt)}</span></span>`};
const totRet=d=>r2(d.fiscal.ret.reduce((a,r)=>a+r.valor,0));
const liquido=d=>r2(d.valor-totRet(d)-(+d.pag.desconto||0)+(+d.pag.multa||0));
function periodoLista(p){return String(p||'').split(/[,;\s]+/).map(x=>parseInt(x,10)).filter(n=>n>0)}
function parcelas(d){const per=periodoLista(d.pag.periodo);const n=per.length>1?per.length:Math.max(1,+d.pag.parcelas||1);const L=liquido(d);const base=r2(L/n);const out=[];
  for(let i=0;i<n;i++){let venc='';
    if(per.length>1&&d.emissao)venc=isoDay(per[i],d.emissao);
    else if(d.pag.venc)venc=per.length===1?isoDay(per[0]*i,d.pag.venc):addMonths(d.pag.venc,i);
    out.push({n:i+1,venc,valor:i===n-1?r2(L-base*(n-1)):base})}
  return out}
function dadosPagamento(d){const p=d.pag,b=pessoa(p.benef||d.forn);
  if(p.forma==='Transferência Bancária')return [`Transferência Bancária para ${b.nome} - ${digits(b.doc)}`,`${p.banco} - Ag. ${p.ag}${p.agDv?'-'+p.agDv:''} - Conta ${p.tipoConta} ${p.conta}${p.contaDv?'-'+p.contaDv:''} - BRL`];
  if(p.forma==='PIX')return [`PIX para ${b.nome} - ${digits(b.doc)}`,`Chave: ${p.pix}`];
  if(p.linha)return [`${b.nome} - ${digits(b.doc)}`,p.linha];
  return [`${b.nome} - ${digits(b.doc)}`,''];}

/* =============== FISCAL: simulação de retenções =============== */
function simular(d){const s=d.fiscal.servico;const sv=SERVICOS.find(x=>x.cod===s.cod);const base=r2(s.valor||d.valor);const R=[];
  const lr=s.regime==='Lucro Real ou Presumido'||s.regime==='Cooperativa';
  const lim=(t,al,cond,obsNao)=>{const v=cond?r2(base*al/100):0;R.push({tipo:t,aliq:cond?al:0,base,valor:v&&v<10?0:v,obs:!cond?obsNao:(v<10?'Dispensado: retenção menor que R$ 10,00':'')})};
  lim('IRRF',sv?.ir||0,!!sv&&lr,!sv?'Serviço fiscal não informado':'Não se aplica ao regime '+(s.regime||'—'));
  lim('CSRF',4.65,!!sv&&lr&&sv.csrf,!sv?'Serviço fiscal não informado':!lr?'Não se aplica ao regime '+(s.regime||'—'):'Serviço sem CSRF');
  const inss=(s.tipo==='Cessão de Mão de Obra'||s.tipo==='Empreitada')&&s.dispInss!=='Sim'&&s.regime!=='Microempreendedor Individual';
  R.push({tipo:'INSS',aliq:inss?11:0,base,valor:inss?r2(base*0.11):0,obs:inss?'':s.dispInss==='Sim'?'Dispensa de INSS':'Sem cessão de mão de obra ou empreitada'});
  const iss=!s.semIss&&s.issRet;R.push({tipo:'ISS',aliq:iss?(+s.issAliq||0):0,base,valor:iss?r2(base*(+s.issAliq||0)/100):0,obs:s.semIss?'Não possui ISS':iss?'':'ISS não retido pelo tomador'});
  return R}
function retConfere(d){const R=d.anexo?.dados?.ret;if(!R)return true;const mine={};d.fiscal.ret.forEach(r=>mine[r.tipo]=r2(r.valor));
  return [...new Set([...Object.keys(R),...Object.keys(mine)])].every(k=>r2(R[k]||0)===r2(mine[k]||0))}

/* =============== CONTABILIZAÇÃO =============== */
function subDe(conta,p){const lst=SUBS[conta];if(lst&&lst.length){const s=lst.find(x=>x.sub===p.cod);return s?s.sub+' - '+s.n:''}return (p.cod||digits(p.doc))+' - '+p.nome}
function gerarLanc(d){
  const f=pessoa(d.forn);const ref=`${d.tipo} ${d.numero} ${f.nome} ${dt(d.emissao)}`;const L=[];const fin=d.finalidade;
  d.rateio.forEach(r=>L.push({id:uid(),conta:'',sub:'',depto:r.cc,restr:'0E',valor:r2(r.valor),venc:'',desc:ref,fin:r.desc?fin+' - '+r.desc:fin,aviso:'N'}));
  if(+d.pag.multa)L.push({id:uid(),conta:C_JUROS,sub:'',depto:SEDE,restr:'0E',valor:r2(d.pag.multa),venc:'',desc:'Multa/Juros - '+ref,fin,aviso:'N'});
  d.fiscal.ret.forEach(t=>L.push({id:uid(),conta:RET[t.tipo].conta,sub:'',depto:SEDE,restr:'0A',valor:-r2(t.valor),
    venc:diaMesSeguinte(d.emissao,RET[t.tipo].dia),desc:`Retenção ${RET[t.tipo].nome} - ${ref}`,fin,aviso:'N'}));
  if(+d.pag.desconto)L.push({id:uid(),conta:C_DESC,sub:'',depto:SEDE,restr:'0E',valor:-r2(d.pag.desconto),venc:'',desc:'Desconto obtido - '+ref,fin,aviso:'N'});
  const b=pessoa(d.pag.benef||d.forn);const cc=b.func?cReemb():C_FORN;const ps=parcelas(d);
  ps.forEach(p=>L.push({id:uid(),conta:cc,sub:subDe(cc,b),depto:SEDE,restr:'0A',valor:-p.valor,venc:p.venc,
    desc:`${d.tipo} ${d.numero} ${f.nome} Vcto. ${dt(p.venc)} - ${p.n}/${ps.length}`,fin,aviso:'N'}));
  return {id:String(Date.now())+String(Math.floor(Math.random()*1e6)).padStart(6,'0'),tipo:'Provisionamento',criado:nowIso(),pronto:false,linhas:L};
}
const somaL=(l,sinal)=>r2(l.linhas.filter(x=>sinal>0?x.valor>0:x.valor<0).reduce((a,x)=>a+x.valor,0));
const exigeSub = c => c===C_FORN||c===cReemb()||!!(SUBS[c]&&SUBS[c].length);
function errosLinhas(linhas){const E=[];linhas.forEach((x,i)=>{const p=PL[x.conta];
  if(!x.conta)E.push(`Linha ${i+1}: sem conta`);else if(!p)E.push(`Linha ${i+1}: conta ${x.conta} não existe no plano`);else if(!p.a)E.push(`Linha ${i+1}: conta ${x.conta} não recebe lançamento (só contas de 7 dígitos, 0.0.00.000)`);else if(!p.on)E.push(`Linha ${i+1}: conta ${x.conta} está inativa`);
  if(!DP[x.depto])E.push(`Linha ${i+1}: departamento ${x.depto} não existe`);else if(!DP[x.depto].on)E.push(`Linha ${i+1}: departamento ${x.depto} inativo`);
  if(x.conta&&exigeSub(x.conta)){const sc=(x.sub||'').split(' - ')[0].trim();if(!sc)E.push(`Linha ${i+1}: conta ${x.conta} exige sub conta`);
    else if(SUBS[x.conta]&&SUBS[x.conta].length&&!SUBS[x.conta].some(s=>s.sub===sc))E.push(`Linha ${i+1}: sub conta ${sc} não existe em ${x.conta} no SysContábil (sincronize)`)}});return E}

    ${c&&c.orc!=null?`<div class="muted" style="margin-top:4px">Orçamento disponível: <b style="color:${estouro?'var(--red)':'inherit'}">${brl(c.orc)}</b>${estouro?' — sem orçamento suficiente':''}</div>`:''}
    <div class="cols" style="gap:10px"><div><label class="f req">Valor</label><input inputmode="numeric" data-money data-r="${i}" data-rf="valor" value="${r.valor?brl(r.valor):''}" placeholder="R$ 0,00"></div>
    <div><label class="f">Descrição</label><input data-r="${i}" data-rf="desc" value="${esc(r.desc||'')}"></div></div></div>`}).join('')}</div>
   <div class="row"><button class="btn sm dark" data-act="radd">&#65291; Adicionar rateio</button><button class="btn sm" data-act="rfill" ${falta>0&&d.rateio.length?'':'disabled'}>Lançar restante na última linha</button></div>
   <div id="rsum" style="margin-top:10px">${rsum(d)}</div>
   <div class="hint">A soma do rateio precisa ser igual ao valor do documento. O centro de custo vira o departamento do lançamento de débito.</div></div>`}
function rsum(d){const soma=r2(d.rateio.reduce((a,r)=>a+(+r.valor||0),0));const falta=r2(d.valor-soma);
  return `<b>Rateado:</b> ${brl(soma)} de ${brl(d.valor)} ${falta===0&&d.valor?'<span class="tag green">OK</span>':`<span class="tag red">${falta>0?'Falta '+brl(falta):'Excede '+brl(-falta)}</span>`}`}
const COD_BARRAS = f => f==='Boleto'||f==='Pagamento de Contas e Tributos com Código de Barras';
function pagHtml(d){const p=d.pag;const b=pessoa(p.benef||d.forn);const per=periodoLista(p.periodo);
  const fo=S.pessoas.map(f=>`<option value="${f.id}" ${f.id===(p.benef||d.forn)?'selected':''}>${esc(f.nome+' - '+f.doc)}${f.func?' (funcionário)':''}</option>`).join('');
  const lock=p.padrao&&b.banco?'disabled':'';
  return `<div class="card">
   <div class="row" style="margin-bottom:6px"><button class="btn sm" data-act="reembolso" title="Pagamento para o requisitante, na conta bancária padrão dele">&#128176; Reembolso Padrão</button></div>
   <label class="f req">Forma de Pagamento</label><select data-p="forma"><option value="">Selecione</option>${FORMAS.map(f=>`<option ${f===p.forma?'selected':''}>${f}</option>`).join('')}</select>

   <div class="muted" style="margin-top:4px">Dias contados da emissão para cada parcela (ex.: 30, 60, 90). Vazio = parcelas mensais a partir do vencimento.</div>
   <div class="cols" style="gap:10px"><div><label class="f">Parcelas</label><input type="number" min="1" max="60" data-p="parcelas" value="${per.length>1?per.length:p.parcelas}" ${per.length>1?'disabled':''}></div>

   <div class="cols" style="gap:10px"><div><label class="f">Desconto</label><input inputmode="numeric" data-money data-p="desconto" value="${+p.desconto?brl(p.desconto):''}" placeholder="R$ 0,00"></div>
   <div><label class="f">Multa e Juros/Acrescimos</label><input inputmode="numeric" data-money data-p="multa" value="${+p.multa?brl(p.multa):''}" placeholder="R$ 0,00"></div></div>
   <label class="f req">Beneficiário</label><select data-p="benef">${fo}</select>
   ${p.benef&&d.forn&&p.benef!==d.forn?`<div class="warnbox"><b>Troca de Emitente</b><br>O Emitente selecionado é diferente do beneficiário do pagamento. Por favor revisar o beneficiário do pagamento.${b.func?'<br>Beneficiário funcionário: o crédito vai para <b>'+esc(contaTxt(cReemb()))+'</b>, com o funcionário como subconta.':''}</div>`:''}

     ${b.banco?`<label class="row" style="gap:8px;margin-top:12px"><input type="checkbox" data-p="padrao" ${p.padrao?'checked':''}> Conta Bancária Padrão de ${esc(b.nome)}</label>`:''}
     <label class="f req">Instituição financeira</label><select data-p="banco" ${lock}><option value="">Selecione</option>${BANCOS.map(x=>`<option ${x===p.banco?'selected':''}>${x}</option>`).join('')}</select>

     <div class="c3" style="grid-template-columns:2fr 1fr"><div><label class="f req">Agência</label><input data-p="ag" value="${esc(p.ag)}" ${lock}></div><div><label class="f">Dígito</label><input data-p="agDv" value="${esc(p.agDv)}" ${lock}></div></div>

   ${d.valor&&(p.venc||per.length>1)?`<div class="tw" style="margin-top:12px"><table class="t"><tr><th>Parcela</th><th>Vencimento</th><th class="num">Valor</th></tr>${parcelas(d).map(x=>`<tr><td>${x.n}ª</td><td>${dt(x.venc)}</td><td class="num">${brl(x.valor)}</td></tr>`).join('')}</table></div>
     <div class="muted" style="margin-top:6px">Valor líquido: <b>${brl(liquido(d))}</b>${+p.desconto||+p.multa?' (valor − desconto + multa/juros)':''}. Retenções são aplicadas pelo fiscal.</div>`:''}
   ${p.venc&&p.venc<isoDay(0)?'<div class="errbox">Vencimento no passado.</div>':p.venc&&p.venc<isoDay(3)?'<div class="warnbox">Vencimento muito próximo: o documento ainda passa pelas análises fiscal e contábil.</div>':''}
  </div>`}
function pendencias(d){const P=[];
  if(!d.salvo)P.push('salvar as Informações Básicas');
  if(d.liberado){
    if(!d.rateio.length)P.push('incluir o rateio');
    if(d.rateio.some(r=>!r.cat||!r.cc||!(r.valor>0)))P.push('completar categoria, centro de custo e valor do rateio');
    if(r2(d.rateio.reduce((a,r)=>a+(+r.valor||0),0))!==r2(d.valor))P.push('fechar o rateio no valor do documento');
    const p=d.pag;const per=periodoLista(p.periodo);if(!p.forma)P.push('escolher a forma de pagamento');if(per.length<2&&!p.venc)P.push('informar o vencimento');
    if(COD_BARRAS(p.forma)&&![44,47,48].includes(digits(p.linha).length))P.push('informar a linha digitável (47/48 dígitos)');
    if(p.forma==='PIX'&&!String(p.pix).trim())P.push('informar a chave PIX');
    if(p.forma==='Transferência Bancária'&&(!p.banco||!p.ag||!p.conta))P.push('informar banco, agência e conta');
    if(liquido(d)<=0)P.push('revisar desconto (líquido ficou zerado)');
  }
  if(!d.anexo)P.push('anexar o documento');
  return P}
function resumoEnvio(){const d=curDraft();const P=pendencias(d);const el=$('#pend');if(!el)return;
  el.innerHTML=P.length?'<b>Para enviar falta:</b> '+P.join('; ')+'.':'<b style="color:var(--ok)">Tudo pronto para enviar.</b>';$('#btnEnviar').disabled=!!P.length}

function verificarLote(l){const E=[];const docs=docsLote(l);
  if(!docs.length)E.push('O lote não tem documentos.');
  docs.forEach(d=>{const pre=`${d.codigo} (${d.tipo} ${d.numero}): `;
    if(d.contabil.status!=='concluida')E.push(pre+'análise contábil não está concluída.');
    d.contabil.lanc.forEach(x=>{const s=r2(somaL(x,1)+somaL(x,-1));if(s)E.push(pre+'lançamento com saldo '+brl(s)+'.');errosLinhas(x.linhas).forEach(e=>E.push(pre+e))})});
  l.verif={ok:!E.length,erros:E,em:nowIso()};return l.verif}
const csvTxt = s => String(s||'').replace(/[;\r\n]+/g,' ').trim();
function csvLote(l){const out=[`${ENT};;;;;;;;`];
  docsLote(l).forEach(d=>d.contabil.lanc.forEach(x=>x.linhas.forEach(y=>{
    out.push([digits(y.conta),(y.sub||'').split(' - ')[0].trim(),FUNDO,y.depto,y.restr,String(Math.round(y.valor*100)),y.aviso==='S'?'S':'N',csvTxt(y.desc),y.venc?dt(y.venc):''].join(';'))})));
  return out.join('\r\n')+'\r\n'}
function baixarCsv(l){const txt=csvLote(l);const map={'–':'-','—':'-','“':'"','”':'"','‘':"'",'’':"'",'…':'...'};
  const bytes=new Uint8Array([...txt].map(ch=>{const c=(map[ch]||ch).charCodeAt(0);return c<256?c:63}));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'text/csv;charset=windows-1252'}));
  a.download=`Lote_${(l.numero||l.id).replace(/\W+/g,'')}_${ENT}.csv`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
// Lote no formato de lote do SysContábil (uma partida por linha; D/C e valor positivo)
function lotesParaSys(l){return docsLote(l).flatMap(d=>d.contabil.lanc.map((x,i)=>({
  id:`DRACMA-${(l.numero||l.id).replace(/\W+/g,'')}-${d.codigo.replace(/\W+/g,'')}${d.contabil.lanc.length>1?'-'+(i+1):''}`,

  entries:x.linhas.map(y=>{const sub=(y.sub||'').split(' - ')[0].trim();const comSub=sub&&exigeSub(y.conta);
    return {accountCode:y.conta+(comSub?'.'+sub:''),ccId:y.depto,type:y.valor<0?'C':'D',value:Math.abs(r2(y.valor))}})})))}

const INT={user:null,doc:null,busy:false,erro:'',pronto:false};
let FB=null;
function fb(){if(FB)return FB;if(!window.firebase)return null;
  try{const app=firebase.apps.length?firebase.app():firebase.initializeApp(FB_CFG);FB={auth:firebase.auth(),db:firebase.firestore()};

const intRef=()=>FB.db.collection('users').doc(INT.user.uid).collection('integrations').doc('dracma');
async function lerIntegracao(){try{const s=await intRef().get();INT.doc=s.exists?s.data():null;
  if(INT.doc&&INT.doc.status==='vinculado'&&INT.doc.wsId){if(!S.integ||S.integ.wsId!==INT.doc.wsId){S.integ={wsId:INT.doc.wsId,email:INT.user.email,syncedAt:''};save()}}
  INT.erro=''}catch(e){INT.erro='Não foi possível ler a integração: '+e.message}

// O plano de contas da atividade é o padrão do próprio SysContábil; do DRACMA vão só os centros de custo iniciais
function payloadVinculo(){

function payloadSubcontas(){return S.pessoas.filter(p=>p.cod).map(p=>({parent:p.func?cReemb():C_FORN,sub:String(p.cod),name:p.nome}))}

    <div style="${st==='vinculado'?'border-top-color:var(--ok)':''}"><b>2. Vincular (no SysContábil)</b>Configurações → Integração DRACMA → Vincular. Cria a atividade ${ATIVIDADE}.</div>

   ${st==='pendente'?`<div class="warnbox">Vínculo solicitado em ${dth(new Date(D.solicitadoEm).toISOString())}. Agora abra o <b>SysContábil</b> com o mesmo usuário → <b>Configurações → Integração DRACMA</b> → <b>Vincular</b>.</div>
     <div class="row"><button class="btn sm" data-act="relerint">Verificar novamente</button><span class="sp"></span><button class="btn sm" data-act="solicitar">Reenviar solicitação</button></div>`:''}

async function sincronizar(silencioso){
  if(!fb()||!INT.user)return toast('Entre na Integração com o usuário do SysContábil.');
  if(!INT.doc||INT.doc.status!=='vinculado'||!INT.doc.wsId)return toast('Vínculo ainda não concluído no SysContábil.');
  INT.busy=true;if(route.p==='integracao')rerender();
  try{
    await intRef().set({subcontas:payloadSubcontas(),subcontasEm:Date.now()},{merge:true});
    const ws=await FB.db.collection('users').doc(INT.user.uid).collection('workspaces').doc(INT.doc.wsId).get();
    if(!ws.exists)throw new Error('a atividade '+ATIVIDADE+' não existe mais no SysContábil');
    const st=ws.data().state||{};const acc=Array.isArray(st.accounts)?st.accounts:[];const ccs=Array.isArray(st.costCenters)?st.costCenters:[];
    if(!acc.length)throw new Error('a atividade não tem plano de contas');
    const plano=acc.filter(a=>!a.sub).map(contaDoChart);const existe=new Set(plano.map(p=>p.c));
    const subs=acc.filter(a=>a.sub&&existe.has(a.parent)).map(a=>({c:String(a.parent),sub:String(a.sub),n:a.name}));
    const orc=Object.fromEntries(S.deptos.map(d=>[d.c,d.orc]));
    S.plano=plano;S.subs=subs;S.deptos=ccs.map(c=>({c:String(c.id),n:String(c.name||''),orc:orc[c.id]??null,on:true}));
    S.integ={wsId:INT.doc.wsId,email:INT.user.email,syncedAt:nowIso()};indexar();save();
    if(!silencioso)toast(`Sincronizado: ${plano.length} contas, ${subs.length} subcontas e ${S.deptos.length} centros de custo do SysContábil.`);
  }catch(e){toast('Erro ao sincronizar: '+esc(e.message))}
  INT.busy=false;rerender()}
async function enviarLoteSys(l){
  if(!vinculado())return;
  if(!fb()||!INT.user||!INT.doc||INT.doc.status!=='vinculado'){l.sys={erro:'entre na Integração com o usuário do SysContábil'};save();return}
  try{const batches=lotesParaSys(l);
    await intRef().set({subcontas:payloadSubcontas(),subcontasEm:Date.now()},{merge:true});
    await intRef().collection('lotes').doc(l.id).set({numero:l.numero,entidade:ENT,exportadoEm:Date.now(),batches,importado:false});
    l.sys={enviado:nowIso(),importado:false};toast('Lote enviado ao SysContábil: será importado na atividade '+ATIVIDADE+' ao abri-la.')}
  catch(e){l.sys={erro:e.message}}save()}
let checando=false;
async function checarImportacao(){const l=S.lotes.find(x=>x.id===route.id);if(!l||!l.sys||l.sys.importado||l.sys.erro||checando||!fb()||!INT.user)return;
  checando=true;try{const s=await intRef().collection('lotes').doc(l.id).get();if(s.exists&&s.data().importado){l.sys.importado=true;l.sys.importadoEm=s.data().importadoEm;save();if(route.p==='lote')rerender()}}catch(e){}checando=false}

  salvar(){const d=curDraft();const E=[];
    if(!d.tipo)E.push('Tipo de Documento');if(!d.forn)E.push('Emitente (selecione da lista)');if(!d.emissao)E.push('Data de Emissão');
    if(!d.numero.trim())E.push('Número');if(!(d.valor>0))E.push('Valor');if(!d.finalidade.trim())E.push('Finalidade');
    if(E.length)return alerta('Campos obrigatórios','Preencha: <b>'+E.join(', ')+'</b>.');
    if(d.emissao>isoDay(0))return alerta('Data de emissão','A data de emissão não pode estar no futuro.');
    if(d.chave&&digits(d.chave).length!==44)return alerta('Chave de Acesso','A chave de acesso deve ter 44 dígitos.');
    const dup=S.docs.find(x=>x.id!==d.id&&x.forn===d.forn&&digits(x.numero)===digits(d.numero)&&x.tipo===d.tipo);
    if(dup)return alerta('Documento Duplicado',`Já existe o documento <b>${esc(dup.tipo)} ${esc(dup.numero)}</b> deste emitente (${esc(dup.codigo||'em criação')}, ${brl(dup.valor)}). Verifique antes de continuar.`);
    if(d.anexo&&d.anexo.amostra){const a=d.anexo;const dif=[];if(a.forn!==d.forn)dif.push('emitente');if(digits(a.numero)!==digits(d.numero))dif.push('número');if(r2(a.valor)!==r2(d.valor))dif.push('valor');if(a.emissao!==d.emissao)dif.push('data de emissão');
      if(dif.length)toast('&#9888; Atenção: '+dif.join(', ')+' diferente(s) do anexo.')}
    d.salvo=true;if(!d.liberado){d.liberado=true;if(!d.pag.benef)d.pag.benef=d.forn;if(d.anexo&&d.anexo.venc&&!d.pag.venc)d.pag.venc=d.anexo.venc;
      if(d.anexo&&d.anexo.linha&&!d.pag.linha){d.pag.linha=d.anexo.linha;d.pag.forma=d.pag.forma||'Boleto'}
      if(!d.rateio.length)d.rateio=[{cat:'',cc:DP[SEDE]?SEDE:(deptosAtivos()[0]?.c||''),valor:d.valor,desc:''}]}
    hist(d,'Informações básicas salvas');save();rerender();toast('Documento salvo. Agora preencha Categorias, Centros de Custo e Pagamento.')},
  radd(){const d=curDraft();const soma=r2(d.rateio.reduce((a,r)=>a+(+r.valor||0),0));d.rateio.push({cat:d.rateio.at(-1)?.cat||'',cc:'',valor:Math.max(0,r2(d.valor-soma)),desc:''});save();rerender()},
  rdel(el){const d=curDraft();d.rateio.splice(+el.dataset.i,1);save();rerender()},
  rfill(){const d=curDraft();const soma=r2(d.rateio.reduce((a,r)=>a+(+r.valor||0),0));const last=d.rateio.at(-1);last.valor=r2(last.valor+d.valor-soma);save();rerender()},
  reembolso(){const d=curDraft();const pid=PESSOA_REQ[d.requisitante];const p=pessoa(pid);if(!pid||!p.banco)return toast('O requisitante não tem conta bancária padrão cadastrada.');

    if(d.anexo&&d.anexo.amostra){const a=d.anexo;if(r2(a.valor)!==r2(d.valor)||a.forn!==d.forn||digits(a.numero)!==digits(d.numero))

  aplicarsim(){const d=docAtual();d.fiscal.ret=d.fiscal.sim.filter(r=>r.valor>0).map(r=>({tipo:r.tipo,base:r.base,aliq:r.aliq,valor:r.valor}));d.fiscal.simAplicada=true;

  confFiscal(){const d=docAtual();const F=d.fiscal;const D=d.anexo?.dados||{};
    if(MODELO[d.tipo]){const E=validarChave(d);F.validacao=E;if(E.length){save();rerender();return alerta('Dados da nota não conferem','Corrija os dados do documento antes de confirmar:<br>'+E.map(esc).join('<br>'))}}
    if(D.valorReal!=null&&r2(D.valorReal)!==r2(d.valor))return alerta('Feedback do treinamento',`Olhe o anexo: o valor da nota é <b>${brl(D.valorReal)}</b>, mas o documento foi lançado com <b>${brl(d.valor)}</b>. O fiscal não altera valor: use <b>Devolver</b> com o motivo.`,'warn');
    if(SERV.has(d.tipo)&&(!F.servico?.atualizado||!F.sim))return alerta('Serviço não analisado','Cadastre o serviço (regime do prestador e serviço fiscal), clique em Simular e aplique as retenções antes de confirmar.');
    const fin=()=>{F.status='concluida';F.por=EU;F.em=nowIso();
      F.guias=F.ret.map(r=>({tipo:r.tipo,guia:RET[r.tipo].guia,valor:r.valor,venc:diaMesSeguinte(d.emissao,RET[r.tipo].dia)}));

      if(d.seedKey==='chave')S.flags.m4=true;if(d.seedKey==='nfse'&&retConfere(d)&&F.servico?.cod)S.flags.m5=true;depoisDeConcluir(d)};
    if(D.ret&&!retConfere(d)){const R=D.ret;return confirmar('Retenções não conferem',`A nota destaca: ${Object.entries(R).map(([k,v])=>RET[k].nome+' '+brl(v)).join(' + ')}. Você aplicou: ${F.ret.map(r=>RET[r.tipo].nome+' '+brl(r.valor)).join(' + ')||'nenhuma'}.<br><br>Confirmar mesmo assim?`,fin,'Confirmar mesmo assim')}
    fin()},

  async reenviar(){await enviarLoteSys(loteAtual());rerender()},
  // Centros de custo (antes do vínculo; depois vêm do SysContábil)
  novodepto(){modal(`<h2>Novo departamento</h2><label class="f req">Código</label><input id="ndCod" inputmode="numeric" placeholder="Ex.: 3312920">
    <label class="f req">Nome</label><input id="ndNome"><label class="f">Orçamento disponível</label><input id="ndOrc" placeholder="vazio = não controla">
    <div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn" data-act="mclose">Cancelar</button><button class="btn dark" data-act="ndeptook">Incluir</button></div>`)},
  ndeptook(){const c=digits($('#ndCod').value),n=$('#ndNome').value.trim();if(!c||!n)return toast('Informe código e nome.');if(DP[c])return toast('Já existe o departamento '+c+'.');
    const o=$('#ndOrc').value.trim();S.deptos.push({c,n,orc:o?r2(parseFloat(o.replace(/\./g,'').replace(',','.'))):null,on:true});S.deptos.sort((a,b)=>a.c.localeCompare(b.c));indexar();save();closeModal();ui.dBusca=c;rerender()},
  deldepto(el){const c=el.dataset.c;confirmar('Excluir departamento',`Excluir o departamento <b>${esc(c)}</b>?`,()=>{S.deptos=S.deptos.filter(p=>p.c!==c);indexar();save();rerender()},'Excluir')},
  restdeptos(){confirmar('Restaurar centros de custo','Volta à lista copiada do DRACMA.',()=>{S.deptos=deptosPadrao();indexar();save();rerender()},'Restaurar')},
  // Integração
  async fblogin(){const e=$('#fbEmail').value.trim(),p=$('#fbSenha').value;if(!e||!p)return toast('Informe e-mail e senha.');INT.busy=true;
    try{await FB.auth.signInWithEmailAndPassword(e,p)}catch(err){INT.erro={'auth/invalid-credential':'E-mail ou senha incorretos.','auth/wrong-password':'E-mail ou senha incorretos.','auth/user-not-found':'E-mail ou senha incorretos.','auth/too-many-requests':'Muitas tentativas. Aguarde alguns minutos.','auth/network-request-failed':'Sem conexão.'}[err.code]||('Não foi possível entrar: '+err.message);rerender()}
    INT.busy=false},
  async fblogout(){await FB.auth.signOut()},
  relerint(){lerIntegracao()},
  async solicitar(){INT.busy=true;rerender();
    try{const p=payloadVinculo();await intRef().set({entidade:ENT,atividade:ATIVIDADE,email:INT.user.email,status:'pendente',solicitadoEm:Date.now(),
        centros:p.centros,subcontas:payloadSubcontas(),subcontasEm:Date.now()},{merge:true});
      toast('Vínculo solicitado. Agora abra o SysContábil → Configurações → Integração DRACMA → Vincular.');await lerIntegracao()}
    catch(e){INT.erro='Erro ao solicitar vínculo: '+e.message}
    INT.busy=false;rerender()},
  desvincular(){confirmar('Desvincular','O DRACMA deixa de usar o plano e os centros de custo do SysContábil (o último sincronizado continua aqui, editável). A atividade no SysContábil não é apagada.',async()=>{
    try{await intRef().set({status:'desvinculado',desvinculadoEm:Date.now()},{merge:true})}catch(e){}S.integ=null;save();await lerIntegracao();rerender()},'Desvincular')}
};
function finCont(d){d.contabil.status='concluida';d.contabil.por=EU;d.contabil.porMim=true;hist(d,'Análise contábil confirmada');depoisDeConcluir(d)}
function enviarDoc(d){if(!d.codigo)d.codigo=novoCodigo();d.etapa='revisao';d.enviadoEm=nowIso();d.devolucao=null;
  d.fiscal=novoFiscal();d.fiscal.status=FISCAL.has(d.tipo)?'pendente':'nao_aplica';d.contabil={status:'aguardando',lanc:[],motivo:''};
  hist(d,'Documento enviado e aprovado');ui.draft=null;save();rerender();
  modal(`<h2>Documento enviado</h2><div class="okbox">${esc(d.tipo)} ${esc(d.numero)} — ${brl(d.valor)} foi enviado com o código <b>${esc(d.codigo)}</b>.<br>
   ${d.fiscal.status==='pendente'?'Status: <b>Aprovado - Aguardando Análise Fiscal</b>.':'Esse tipo não passa por análise fiscal. Próxima etapa: <b>Análise Contábil</b>.'}</div>
   <div class="row"><span class="sp"></span><button class="btn" data-act="mclose">Continuar cadastrando</button><a class="btn dark" href="#/doc/${d.id}" data-act="mclose">Abrir na Revisão</a></div>`)}
function importarXml(txt,nome){let x;try{x=new DOMParser().parseFromString(txt,'text/xml')}catch(e){}
  const g=t=>x?.getElementsByTagName(t)[0]?.textContent?.trim()||'';
  const emit=x?.getElementsByTagName('emit')[0];const cnpj=emit?(emit.getElementsByTagName('CNPJ')[0]||emit.getElementsByTagName('CPF')[0])?.textContent.trim():'';
  const nomeE=emit?.getElementsByTagName('xNome')[0]?.textContent.trim();const vNF=parseFloat(g('vNF'));
  if(!cnpj||!nomeE||!vNF){closeModal();return alerta('XML inválido','Não encontrei emitente e valor de NF-e neste arquivo. Use o XML de uma NF-e (modelo 55).')}
  let f=S.pessoas.find(z=>digits(z.doc)===cnpj);if(!f){f={id:'u'+uid(),cod:String(5000+S.pessoas.length),nome:nomeE,doc:fmtDoc(cnpj),regime:''};S.pessoas.push(f)}
  const d=curDraft();d.tipo='NFe';d.forn=f.id;d.numero=g('nNF');d.serie=g('serie');d.emissao=(g('dhEmi')||g('dEmi')).slice(0,10);d.valor=r2(vNF);
  d.chave=digits(x.getElementsByTagName('infNFe')[0]?.getAttribute('Id')||g('chNFe'));d.salvo=false;d.origemXml=true;
  const it=[...x.getElementsByTagName('prod')].map(p=>[p.getElementsByTagName('xProd')[0]?.textContent,+p.getElementsByTagName('qCom')[0]?.textContent,+p.getElementsByTagName('vUnCom')[0]?.textContent]);
  d.anexo={tipo:'nfe',xml:true,nome,forn:f.id,numero:d.numero,serie:d.serie,chave:d.chave,emissao:d.emissao,valor:d.valor,dados:{itens:it}};
  save();closeModal();rerender();toast('XML importado: emitente, série, número, chave, emissão e valor preenchidos. Complete a Finalidade e salve.')}

/* =============== EVENTOS =============== */
document.addEventListener('click',e=>{const ln=e.target.closest('a[href^="#/"]');if(ln){e.preventDefault();if(ln.dataset.act==='mclose')closeModal();go(ln.getAttribute('href'));return}
  const el=e.target.closest('[data-act]');if(!el)return;const f=A[el.dataset.act];if(f){if(el.tagName==='A')e.preventDefault();f(el,e)}});
document.addEventListener('change',e=>{const el=e.target;const k=el.dataset.actChange;
  if(k==='next'){S.prefs.next=el.checked;save()}
  else if(k==='pfiltro'){ui.pFiltro=el.value;rerender()}
  else if(k==='reemb'){S.cfg=S.cfg||{};S.cfg.reemb=el.value;indexar();save();rerender();toast('Reembolsos a funcionário passam a creditar '+esc(contaTxt(el.value))+'.')}
  else if(k==='arquivo'){const file=el.files[0];if(!file)return;const d=curDraft();d.anexo={arquivo:true,nome:file.name,mime:file.type,url:/^image\//.test(file.type)?URL.createObjectURL(file):''};save();rerender()}
  else if(k==='xmlfile'){const file=el.files[0];if(!file)return;file.text().then(t=>importarXml(t,file.name))}
  else if(['tipo','emissao'].includes(el.dataset.b)){const d=curDraft();d[el.dataset.b]=el.value;d.salvo=false;save();rerender()}
  else if(el.dataset.b==='forn'){const d=curDraft();const v=el.value.trim().toLowerCase();const f=S.pessoas.find(z=>(z.nome+' - '+z.doc).toLowerCase()===v)||S.pessoas.find(z=>v&&(z.nome.toLowerCase().includes(v)||digits(z.doc)===digits(v)&&digits(v).length>=11));
    d.forn=f?f.id:'';d.salvo=false;if(d.liberado&&f&&!d.pag.benef)d.pag.benef=f.id;save();rerender();if(!f&&v)toast('Emitente não encontrado. Selecione da lista ou adicione a pessoa.')}
  else if(el.dataset.r!=null&&['cat','cc'].includes(el.dataset.rf)){const d=curDraft();d.rateio[+el.dataset.r][el.dataset.rf]=el.value;save();rerender()}
  else if(el.dataset.p==='padrao'){const d=curDraft();d.pag.padrao=el.checked;aplicarBancoPadrao(d);save();rerender()}
  else if(el.dataset.p==='benef'){const d=curDraft();d.pag.benef=el.value;d.pag.padrao=!!pessoa(el.value).banco&&d.pag.forma==='Transferência Bancária';if(!d.pag.padrao)Object.assign(d.pag,{banco:'',ag:'',agDv:'',conta:'',contaDv:''});aplicarBancoPadrao(d);save();rerender()}
  else if(el.dataset.p==='forma'){const d=curDraft();d.pag.forma=el.value;if(el.value==='Transferência Bancária'&&pessoa(d.pag.benef).banco&&!d.pag.conta){d.pag.padrao=true;aplicarBancoPadrao(d)}save();rerender()}
  else if(el.dataset.p&&['venc','parcelas','periodo','banco','tipoConta'].includes(el.dataset.p)){const d=curDraft();d.pag[el.dataset.p]=el.dataset.p==='parcelas'?Math.max(1,Math.min(60,+el.value||1)):el.value;save();rerender()}
  else if(el.dataset.p&&['desconto','multa'].includes(el.dataset.p)){rerender()}
  else if(el.dataset.fd){const d=docAtual();const fld=el.dataset.fd;const old=d[fld];const v=fld==='chave'?digits(el.value):el.value.trim();if(v===old)return;d[fld]=v;d.fiscal.validacao=null;
    hist(d,`Dado do documento alterado na análise fiscal: ${fld==='emissao'?'data de emissão':fld} de "${fld==='emissao'?dt(old):old}" para "${fld==='emissao'?dt(v):v}"`);save();rerender()}
  else if(el.dataset.sv){const d=docAtual();const s=d.fiscal.servico;const f=el.dataset.sv;
    if(f==='semIss'||f==='issRet')s[f]=el.checked;else if(f==='issAliq')s[f]=parseFloat(el.value.replace(',','.'))||0;else if(f==='valor')s[f]=parseMoney(el.value);else s[f]=el.value;
    d.fiscal.sim=null;save();if(f==='semIss')rerender()}
  else if(el.dataset.ln!=null){const d=docAtual();const l=d.contabil.lanc[+el.dataset.ln];const x=l.linhas[+el.dataset.i];const fld=el.dataset.lf;
    if(fld==='conta'){const c=el.value.split(' - ')[0].trim();x.conta=PL[c]?c:digits(c);if(x.conta&&!PL[x.conta])toast('Conta '+esc(x.conta)+' não existe no plano de contas.');else if(x.conta&&!PL[x.conta].a)toast('A conta '+esc(x.conta)+' é sintética. Escolha uma analítica.');
      if(SUBS[x.conta]?.length&&!SUBS[x.conta].some(s=>s.sub===(x.sub||'').split(' - ')[0]))x.sub=''}
    else x[fld]=fld==='valor'?r2(parseFloat(el.value.replace(/\./g,'').replace(',','.'))||0):el.value;
    l.pronto=false;save();redrawDoc()}
  else if(el.dataset.ret!=null){const d=docAtual();d.fiscal.ret[+el.dataset.ret].valor=parseMoney(el.value);save();rerender()}
  else if(el.dataset.pl){const p=PL[el.dataset.pl];if(!p)return;const f=el.dataset.pf;
    if(f==='n'){p.n=el.value.trim()||p.n}else if(f==='on'){p.on=el.checked}indexar();save();rerender()}
  else if(el.dataset.dp){const p=DP[el.dataset.dp];if(!p)return;const f=el.dataset.df;
    if(f==='n'){p.n=el.value.trim()||p.n}else if(f==='orc'){const v=el.value.trim();p.orc=v?r2(parseFloat(v.replace(/\./g,'').replace(',','.'))||0):null}else if(f==='on'){p.on=el.checked}indexar();save();rerender()}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.hasAttribute('data-money')){if(el.dataset.sv)return;const v=parseMoney(el.value);el.value=v?brl(v):'';
    if(el.dataset.b==='valor'){const d=curDraft();d.valor=v;d.salvo=false;save();resumoEnvio();const r=$('#rsum');if(r)r.innerHTML=rsum(d)}
    else if(el.dataset.r!=null){const d=curDraft();d.rateio[+el.dataset.r].valor=v;save();const r=$('#rsum');if(r)r.innerHTML=rsum(d);resumoEnvio()}
    else if(el.dataset.p){const d=curDraft();d.pag[el.dataset.p]=v;save();resumoEnvio()}
    return}
  if(['numero','finalidade','serie','chave'].includes(el.dataset.b)){const d=curDraft();d[el.dataset.b]=el.dataset.b==='chave'?digits(el.value):el.value;d.salvo=false;save();resumoEnvio()}
  else if(el.dataset.r!=null&&el.dataset.rf==='desc'){const d=curDraft();d.rateio[+el.dataset.r].desc=el.value;save()}
  else if(el.dataset.p&&['linha','pix','ag','agDv','conta','contaDv'].includes(el.dataset.p)){const d=curDraft();d.pag[el.dataset.p]=el.value;save();resumoEnvio()}
  else if(['busca','pBusca','dBusca'].includes(el.id)){ui[el.id]=el.value;const pos=el.selectionStart;rerender();const b=$('#'+el.id);b.focus();b.setSelectionRange(pos,pos)}
});
window.addEventListener('popstate',()=>render());window.addEventListener('hashchange',()=>render());

load();checkMissoes();render();fb();carregarPlanoSys();
