<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Pendências</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; color: #223; background: #eef2f5; }
  header { background: #2c5f7c; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; }
  header .info { font-size: 12.5px; text-align: right; opacity: .92; line-height: 1.5; }
  .wrap { padding: 18px 24px 40px; max-width: 1600px; margin: 0 auto; }

  .cartoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .cartao { background: #fff; border-radius: 6px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer; border: 2px solid transparent; transition: border-color .15s; }
  .cartao.ativo { border-color: #2c5f7c; }
  .cartao .conta { font-size: 12px; color: #667; }
  .cartao .nome { font-weight: 600; font-size: 15px; margin: 2px 0 8px; }
  .cartao .grande { font-size: 30px; font-weight: 700; line-height: 1; }
  .cartao .grande.zero { color: #3a8a5c; }
  .cartao .grande.alerta { color: #c23b3b; }
  .cartao .sub { font-size: 12.5px; color: #556; margin-top: 6px; line-height: 1.5; }
  .cartao .regra { font-size: 11.5px; color: #889; margin-top: 8px; font-style: italic; }

  .barra { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .chip { padding: 6px 12px; border: 1px solid #c9d6e2; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; color: #345; user-select: none; }
  .chip.on { background: #2c5f7c; color: #fff; border-color: #2c5f7c; }
  .chip .n { opacity: .75; font-size: 12px; margin-left: 4px; }
  input[type=search] { padding: 7px 12px; border: 1px solid #c9d6e2; border-radius: 20px; font: inherit; font-size: 13px; min-width: 260px; }
  .barra .espaco { flex: 1; }
  .barra .total { font-size: 13px; color: #556; }

  .painel { background: #fff; border-radius: 6px; box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  .painel h2 { margin: 0; padding: 12px 16px; font-size: 15px; font-weight: 600; background: #f4f7fa; border-bottom: 1px solid #e3e9ef; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .painel h2 .desc { font-weight: 400; font-size: 12.5px; color: #667; }
  .rolagem { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 9px 10px; background: #fafcfd; border-bottom: 2px solid #dde5ec; font-weight: 600; color: #345; white-space: nowrap; cursor: pointer; user-select: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  th .seta { opacity: .45; font-size: 11px; margin-left: 3px; }
  td { padding: 8px 10px; border-bottom: 1px solid #eef2f5; vertical-align: top; }
  tr:hover td { background: #f7fafc; }
  tr.alerta td:first-child { box-shadow: inset 4px 0 0 #c23b3b; }
  tr.baixa td:first-child { box-shadow: inset 4px 0 0 #96a; }
  .sub { font-family: Consolas, monospace; font-size: 12.5px; color: #456; }
  .nome { font-weight: 500; }
  .hist { color: #667; font-size: 12.5px; max-width: 360px; }
  .dias { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .dias.ja { background: #fbe4e4; color: #b22; }
  .dias.falta { background: #edf1f5; color: #567; }
  .dias.hoje { background: #fff2cc; color: #8a6d00; }
  .par { display: inline-block; padding: 2px 7px; border-radius: 4px; background: #efe6f6; color: #74a; font-size: 11.5px; margin-left: 6px; white-space: nowrap; }
  .vazio { padding: 30px; text-align: center; color: #889; }
  .nota { font-size: 12.5px; color: #667; margin: 14px 2px 0; line-height: 1.55; }
  .nota b { color: #345; }
  @media (max-width: 900px) { .cartoes { grid-template-columns: 1fr; } input[type=search] { min-width: 100%; } }

  /* ---- trela de login (só quando servido pelo site; local abre direto) ---- */
  #gate { position: fixed; inset: 0; background: #2c5f7c; display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  #gate .caixa { background: #fff; border-radius: 8px; padding: 34px 30px; width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.3); text-align: center; }
  #gate h1 { color: #2c5f7c; font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  #gate p.sub { color: #8aa8bd; font-size: 13px; margin: 0 0 22px; }
  #gate label { display: block; text-align: left; font-size: 13px; color: #556; margin: 12px 0 4px; }
  #gate input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #c9d6e2; border-radius: 4px; font-family: inherit; }
  #gate input:focus { outline: none; border-color: #5b9bd5; }
  #gate button { width: 100%; margin-top: 20px; padding: 11px; background: #2c5f7c; color: #fff; border: none; border-radius: 4px; font-size: 15px; font-family: inherit; cursor: pointer; }
  #gate button:hover { background: #24506a; }
  #gate .erro { color: #b3423a; font-size: 13px; margin-top: 12px; min-height: 18px; }
  body.trancado header, body.trancado .wrap { visibility: hidden; }
</style>
</head>
<body>
<div id="gate">
  <div class="caixa">
    <h1>Monitor de Pendências</h1>
    <p class="sub">Acesso restrito</p>
    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">
      <button type="submit">Entrar</button>
      <div class="erro" id="erro"></div>
    </form>
  </div>
</div>
<header>
  <h1>Monitor de Pendências</h1>
  <div class="info">Adiantamentos de viagem · Adiantamentos a fornecedores · Fornecedores a pagar<br>
    Gerado em <b id="gerado">—</b> · base: itens em aberto na alocação</div>
</header>

<div class="wrap">
  <div class="cartoes" id="cartoes"></div>

  <div class="barra">
    <span class="chip on" data-f="alerta">Em alerta <span class="n" id="n-alerta"></span></span>
    <span class="chip" data-f="alocar">Falta alocar (provável par) <span class="n" id="n-alocar"></span></span>
    <span class="chip" data-f="pendencia">Todas as pendências <span class="n" id="n-pend"></span></span>
    <span class="chip" data-f="baixa">Baixas sem vínculo <span class="n" id="n-baixa"></span></span>
    <input type="search" id="busca" placeholder="buscar subconta, nome, histórico, referência…">
    <span class="espaco"></span>
    <span class="total" id="total-lista"></span>
  </div>

  <div class="painel">
    <h2><span id="titulo-lista">—</span><span class="desc" id="regra-lista"></span></h2>
    <div class="rolagem"><table id="tabela"></table></div>
  </div>

  <p class="nota" id="nota"></p>
</div>

const fmtN = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const brl = v => fmtN.format(v);
const dt = s => s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : "—";
const NOMES = { pendencia: "pendência", baixa: "baixa sem vínculo" };

let contaAtiva = null, filtro = "alerta", ordem = { campo: "dias_alerta", desc: true };

function iniciar() {
  document.getElementById("gerado").textContent = DADOS.gerado;
  const contas = Object.keys(DADOS.contas);
  // abre na primeira conta que tiver alerta; senão, na primeira
  contaAtiva = contas.find(c => DADOS.contas[c].em_alerta > 0) || contas[0];
  montarCartoes();
  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    ch.classList.add("on"); filtro = ch.dataset.f; render();
  }));
  document.getElementById("busca").addEventListener("input", render);
  render();
}

function montarCartoes() {
  const el = document.getElementById("cartoes");
  el.innerHTML = Object.entries(DADOS.contas).map(([cc, c]) => `
    <div class="cartao ${cc === contaAtiva ? "ativo" : ""}" data-conta="${cc}">
      <div class="conta">${cc}</div>
      <div class="nome">${c.nome}</div>
      <div class="grande ${c.em_alerta ? "alerta" : "zero"}">${c.em_alerta}</div>
      <div class="sub">${c.em_alerta === 1 ? "alerta real" : "alertas reais"} · R$ ${brl(c.valor_alerta)}
        ${c.alerta_par ? `<br><span style="color:#74a">+${c.alerta_par} em alerta com provável par · R$ ${brl(c.valor_alerta_par)} — só falta alocar</span>` : ""}<br>
        ${c.pendencias} pendência${c.pendencias === 1 ? "" : "s"} em aberto · R$ ${brl(c.valor_pend)}
        ${c.baixas ? `<br>${c.baixas} baixa${c.baixas === 1 ? "" : "s"} sem vínculo · R$ ${brl(c.valor_baixas)}` : ""}</div>
      <div class="regra">alerta: ${c.regra}</div>
    </div>`).join("");
  el.querySelectorAll(".cartao").forEach(cd => cd.addEventListener("click", () => {
    contaAtiva = cd.dataset.conta;
    el.querySelectorAll(".cartao").forEach(x => x.classList.toggle("ativo", x.dataset.conta === contaAtiva));
    render();
  }));
}

function itensFiltrados() {
  const q = document.getElementById("busca").value.trim().toLowerCase();
  return DADOS.itens.filter(i => {
    if (i.conta !== contaAtiva) return false;
    if (filtro === "alerta" && !(i.em_alerta && !i.par)) return false;   // alerta REAL: sem par
    if (filtro === "alocar" && !i.par) return false;                     // os dois lados do par
    if (filtro === "pendencia" && i.lado !== "pendencia") return false;
    if (filtro === "baixa" && i.lado !== "baixa") return false;
    if (q && ![i.sub, i.nome, i.hist, i.ref, i.dep].some(v => (v || "").toLowerCase().includes(q))) return false;
    return true;
  });
}

function ordenar(lista) {
  const { campo, desc } = ordem;
  return [...lista].sort((a, b) => {
    let va = a[campo], vb = b[campo];
    if (va == null) va = desc ? -Infinity : Infinity;
    if (vb == null) vb = desc ? -Infinity : Infinity;
    if (typeof va === "string") return desc ? vb.localeCompare(va) : va.localeCompare(vb);
    return desc ? vb - va : va - vb;
  });
}

const COLS = [
  ["sub", "Subconta"], ["nome", "Nome"], ["dep", "Depto"], ["lanc", "Lançamento"], ["venc", "Vencimento"],
  ["pend", "Pendente (R$)", "num"], ["situacao", "Situação"], ["data_alerta", "Alerta em"],
  ["dias_alerta", "Dias", "num"], ["hist", "Histórico"], ["ref", "Ref."],
];

function render() {
  const c = DADOS.contas[contaAtiva];
  const todos = DADOS.itens.filter(i => i.conta === contaAtiva);
  document.getElementById("n-alerta").textContent = todos.filter(i => i.em_alerta && !i.par).length;
  document.getElementById("n-alocar").textContent = todos.filter(i => i.par).length;
  document.getElementById("n-pend").textContent = todos.filter(i => i.lado === "pendencia").length;
  document.getElementById("n-baixa").textContent = todos.filter(i => i.lado === "baixa").length;
  document.getElementById("titulo-lista").textContent = `${contaAtiva} — ${c.nome}`;
  document.getElementById("regra-lista").textContent = `regra de alerta: ${c.regra}`;

  const lista = ordenar(itensFiltrados());
  const soma = lista.reduce((s, i) => s + Math.abs(i.pend), 0);
  document.getElementById("total-lista").textContent = `${lista.length} item${lista.length === 1 ? "" : "s"} · R$ ${brl(soma)}`;

  const tb = document.getElementById("tabela");
  if (!lista.length) {
    tb.innerHTML = `<tbody><tr><td class="vazio" colspan="${COLS.length}">Nenhum item neste recorte 🎉</td></tr></tbody>`;
  } else {
    const th = COLS.map(([k, t, cls]) =>
      `<th class="${cls || ""}" data-c="${k}">${t}${ordem.campo === k ? `<span class="seta">${ordem.desc ? "▼" : "▲"}</span>` : ""}</th>`).join("");
    const tr = lista.map(i => {
      const dias = i.dias_alerta > 0 ? `<span class="dias ja">+${i.dias_alerta} d</span>`
        : i.dias_alerta === 0 ? `<span class="dias hoje">hoje</span>`
          : `<span class="dias falta">${i.dias_alerta} d</span>`;
      const par = i.par ? `<span class="par" title="mesmo valor e subconta de um item do outro lado — provável falta de alocação">provável par</span>` : "";
      return `<tr class="${i.em_alerta ? "alerta" : ""} ${i.lado === "baixa" ? "baixa" : ""}">
        <td class="sub">${i.sub}</td><td class="nome">${i.nome}${par}</td><td>${i.dep}</td>
        <td>${dt(i.lanc)}</td><td>${dt(i.venc)}</td>
        <td class="num">${brl(i.pend)}</td><td>${i.situacao}</td>
        <td>${dt(i.data_alerta)}</td><td class="num">${dias}</td>
        <td class="hist">${i.hist}</td><td>${i.ref}</td></tr>`;
    }).join("");
    tb.innerHTML = `<thead><tr>${th}</tr></thead><tbody>${tr}</tbody>`;
    tb.querySelectorAll("th").forEach(h => h.addEventListener("click", () => {
      const k = h.dataset.c;
      if (ordem.campo === k) ordem.desc = !ordem.desc; else ordem = { campo: k, desc: k === "dias_alerta" || k === "pend" };
      render();
    }));
  }

  document.getElementById("nota").innerHTML =
    `<b>Como ler:</b> <b>Dias</b> positivo = já passou da data de alerta há tantos dias; negativo = faltam tantos dias para entrar em alerta.
     <b>Pendência</b> = item aberto do lado normal da conta (${c.natureza === "D" ? "débito: adiantamento concedido" : "crédito: título a pagar"}).
     <b>Baixa sem vínculo</b> = item aberto do lado oposto — uma baixa/pagamento que não foi alocado ao seu título.
     Quando uma baixa tem o <b>mesmo valor</b> de uma pendência da <b>mesma subconta</b>, os dois viram <i>provável par</i>:
     o título quase certamente já foi acertado e só falta <b>alocar</b> no sistema — por isso ele sai do "Em alerta" e vai para "Falta alocar".
     <b>Em alerta</b> mostra só o que está vencido pela regra <u>e</u> não tem baixa correspondente: é o que realmente precisa de ação.
     Valores negativos são débito, positivos crédito (convenção do sistema). Só o ano corrente — anos anteriores não têm alocação item a item.`;
}

/* Trela simples, igual à do painel Análise Financeira: no site (http/https)
   exige usuário e senha; aberto do disco (file://) entra direto. A sessão
   vale para todos os sistemas da pasta /anp (mesma chave anp_ok). */

  document.body.classList.add("trancado");
  document.getElementById("gate").style.display = "flex";
  document.getElementById("usuario").focus();
  document.getElementById("form-login").addEventListener("submit", function (e) {
    e.preventDefault();
    var u = document.getElementById("usuario").value.trim();
    var s = document.getElementById("senha").value;
    if (u === "ANP@IASD" && s === "Anp1622") {
      sessionStorage.setItem("anp_ok", "1");
      document.getElementById("gate").style.display = "none";
      document.body.classList.remove("trancado");
    } else {
      document.getElementById("erro").textContent = "Usuário ou senha incorretos.";
      document.getElementById("senha").value = "";
    }
  });
})();

iniciar();
</script>
