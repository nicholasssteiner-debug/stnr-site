/* 11. MAIORES DESPESAS ---------------------------------------------- */
registra("ranking", "20 Maiores Despesas", () => {
  const ano = anoRef, mes = mesRef;
  // contas ANALÍTICAS de despesa (não as sintéticas do De/Para da DRE),
  // que é o nível em que o modelo lista as maiores despesas
  const analiticas = despesasAnaliticas12(ano, mes);
  // Fora da conta: depreciação (como no modelo) e TRANSFERÊNCIAS INTERNAS —
  // contas "TI-" e as contrapartidas "(-)Transf." andam em par e se anulam;
  // deixá-las dentro colocaria no topo do ranking dinheiro que nunca saiu.
  const ehTransfInterna = (conta, nome) => /^TI-|^\(-\)\s*Transf|Transf\. p\//i.test(nome || "");
  const porConta = new Map(); const excluidas = []; const contras = [];
  for (const [conta, r] of analiticas) {
    if (conta.startsWith("4123") || /deprecia|amortiza/i.test(r.nome || "")) continue;
    if (ehTransfInterna(conta, r.nome)) {
      if (r.total > 0) excluidas.push([conta, r]); else contras.push([conta, r]);
      continue;
    }
    if (r.total <= 0) { contras.push([conta, r]); continue; }
    porConta.set(conta, r);
  }
  const totContra = contras.reduce((s, [, r]) => s + r.total, 0);
  const ord = [...porConta.entries()].sort((a, b) => b[1].total - a[1].total).slice(0, 20);
  const totGeral = [...porConta.values()].reduce((s, r) => s + r.total, 0);
  const somaTop = ord.reduce((s, [, r]) => s + r.total, 0);
  const maior = ord.length ? ord[0][1].total : 0;

  let html = `<div class="rolagem"><table><thead><tr><th>#</th><th>Conta</th><th>Descrição</th>
    <th class="num">Valor (12 meses)</th><th class="num">(AV) %</th></tr></thead><tbody>`;
  ord.forEach(([conta, r], i) => {
    const w = maior ? (r.total / maior * 100).toFixed(1) : 0;
    html += `<tr><td>${i + 1}</td><td>${conta}</td><td>${r.nome || "—"}</td>
      <td class="num" style="background:linear-gradient(to left, rgba(44,95,124,.16) ${w}%, transparent ${w}%)">${n(r.total)}</td>
      <td class="num">${pct(totGeral ? r.total / totGeral : null)}</td></tr>`;
  });
  html += `<tr class="total"><td></td><td></td><td>SOMA DAS 20 MAIORES</td>
    <td class="num">${n(somaTop)}</td>
    <td class="num">${pct(totGeral ? somaTop / totGeral : null)}</td></tr>`;
  html += `<tr><td></td><td></td><td>Despesa bruta (${porConta.size} contas)</td>
    <td class="num">${n(totGeral)}</td><td class="num">100,00%</td></tr>`;
  html += `<tr><td></td><td></td><td>(−) Transferências e reclassificações</td>
    <td class="num">${n(totContra)}</td><td class="num">${pct(totGeral ? totContra / totGeral : null)}</td></tr>`;
  html += `<tr class="total"><td></td><td></td><td>(=) DESPESA LÍQUIDA</td>
    <td class="num">${n(totGeral + totContra)}</td><td class="num"></td></tr>`;
  html += `</tbody></table></div>`;

  let nota = "";
  if (excluidas.length) {
    const ord2 = excluidas.sort((a, b) => b[1].total - a[1].total).slice(0, 6);
    nota = `<div class="aviso" style="margin-top:12px"><b>Transferências internas fora do ranking.</b>
      Estas contas têm contrapartida de mesmo valor e se anulam — entrariam no topo sem representar
      saída de dinheiro: ` + ord2.map(([c, r]) => `${c} ${r.nome} (${n(r.total)})`).join("; ") +
      `. Repare também que contas como <b>4122507</b> aparecem pelo valor <b>bruto</b>: boa parte vira
      imobilizado via "(−)Transf. p/Imobilizado", que está na linha de transferências no rodapé.
      Se alguma dessas contas for despesa de verdade para a sua análise, me avise que eu trago de volta.</div>`;
  }
  return painel(`20 Maiores Despesas — 12 meses até ${NOMES_MESES[mes - 1]}/${ano}`,
    "Contas analíticas, desconsiderando depreciação e amortização, como no modelo.", html + nota);
});

/* ---------- helpers de montagem ---------- */
function cabecalhoAnos(rotulo, colunas) {
  return `<div class="rolagem"><table><thead><tr><th>${rotulo}</th>` +
    colunas.map(c => `<th class="num">${c.ano}${c.mes < 12 ? " até " + NOMES_MESES[c.mes - 1] : ""}</th>`).join("") +
    `</tr></thead><tbody>`;
}
/* A explicação fica recolhida: quem já conhece o relatório não precisa ler
   de novo toda vez, e quem precisa abre. Na impressão sai sempre aberta. */
function painel(titulo, desc, html) {
  return `<div class="painel"><h2>${titulo}</h2>
    <details class="porque"><summary>como isto é calculado</summary>
      <p class="desc">${desc}</p></details>${html}</div>`;
}

/* ---------- seletor de posição (ano e mês) ---------- */
function montarPeriodo() {
  const selA = document.getElementById("sel-ano"), selM = document.getElementById("sel-mes");
  selA.innerHTML = anos.map(a => `<option value="${a}"${a === anoRef ? " selected" : ""}>${a}</option>`).join("");
  const ultimo = mesFimAno[anoRef] || 12;
  selM.innerHTML = NOMES_MESES.map((nm, i) =>
    `<option value="${i + 1}"${i + 1 === mesRef ? " selected" : ""}${i + 1 > ultimo ? " disabled" : ""}>${nm}</option>`).join("");

  const fechado = mesComparavel(anoRef);
  const dica = document.getElementById("periodo-dica");
  if (mesRef > fechado)
    dica.innerHTML = `⚠️ <b>${NOMES_MESES[mesRef - 1]}</b> ainda não parece fechado — a receita do mês ` +
      `não foi toda lançada, então o resultado sai pior do que é. O último mês completo é ` +
      `<b>${NOMES_MESES[fechado - 1]}</b>.`;
  else
    dica.textContent = `Anos anteriores entram fechados em dezembro; ${anoRef} vai até ${NOMES_MESES[mesRef - 1]}.`;

  selA.onchange = () => {
    anoRef = +selA.value;
    mesRef = mesComparavel(anoRef);      // ao trocar de ano, volta para o último mês fechado
    montarPeriodo(); desenhar();
  };
  selM.onchange = () => { mesRef = +selM.value; montarPeriodo(); desenhar(); };
}

/* ---------- filtro de escola ---------- */
function escolasDisponiveis() {
  // só entram as que têm movimento de resultado — ADRA, CADEC e afins são
  // departamentos residuais e só ocupariam espaço na barra
  const s = new Set();
  const peso = new Map();
  for (const l of linhasDRE) {
    if (!l.dep) continue;
    const e = partesDepto(l.dep, l.depNome).escola;
    peso.set(e, (peso.get(e) || 0) + Math.abs(l.saldo));
  }
  for (const [e, v] of peso) if (v >= 50000) s.add(e);
  const ordem = Object.entries(ESCOLAS).sort((a, b) => a[0].localeCompare(b[0])).map(x => x[1]);
  return [...s].sort((a, b) => {
    const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "pt-BR");
  });
}

function montarFiltroEscola() {
  const alvo = document.getElementById("escolas-chips");
  const lista = escolasDisponiveis();
  alvo.innerHTML = [["", "Todas"], ...lista.map(e => [e, e])].map(([v, r]) =>
    `<button type="button" class="chip-esc${(escolaRef || "") === v ? " ativo" : ""}" data-esc="${v}">${r}</button>`).join("") +
    (escolaRef ? `<span class="foco-aviso">mostrando só ${escolaRef} — os blocos "por Unidade" seguem comparando todas</span>` : "");
  alvo.querySelectorAll(".chip-esc").forEach(b =>
    b.addEventListener("click", () => definirEscola(b.dataset.esc || null)));
}

function definirEscola(esc) {
  escolaRef = esc;
  montarFiltroEscola();
  desenhar();
}

/* Clique num gráfico filtra a escola — é o que faz a página virar exploração. */
function ligarCliquesEscola(raiz) {
  raiz.querySelectorAll("[data-filtra]").forEach(el =>
    el.addEventListener("click", () => definirEscola(
      el.getAttribute("data-filtra") === escolaRef ? null : el.getAttribute("data-filtra"))));
}

/* Os controles redesenham o bloco a cada movimento; o foco volta para o
   mesmo slider, senão arrastar com o teclado se perderia. */
function ligarSimulacao(raiz) {
  raiz.querySelectorAll("[data-sim]").forEach(el => el.addEventListener("input", () => {
    simPremissas[el.dataset.sim] = +el.value;
    const id = el.id, pos = el.value;
    desenhar();
    const novo = document.getElementById(id);
    if (novo) { novo.focus(); novo.value = pos; }
  }));
  const zerar = raiz.querySelector("#sim-zerar");
  if (zerar) zerar.addEventListener("click", () => {
    simPremissas = { mensalidade: 0, alunos: 0, pessoal: 0, adm: 0, subvencao: 0 };
    desenhar();
  });
}

/* ---------- navegação ---------- */
let blocoAtivo = BLOCOS[0].id;
/* =====================================================================
   O QUE O USUÁRIO GUARDA
   Metas, cenários e anotações ficam no navegador de quem usa. É de
   propósito: são decisões dele, não dado contábil — não entram na
   planilha nem sobem para o site.
   ===================================================================== */
const DB = {
  ler(chave, padrao) {
    try {
      const v = localStorage.getItem("anp_analise_" + chave);
      return v === null ? padrao : JSON.parse(v);
    } catch (e) { return padrao; }
  },
  grava(chave, valor) {
    try { localStorage.setItem("anp_analise_" + chave, JSON.stringify(valor)); }
    catch (e) { /* navegador sem storage: vale só nesta sessão */ }
  },
};
let metas = DB.ler("metas", {});

/* Margem operacional de cada escola no recorte atual — é o número que a meta
   cobra: sem subvenção, para medir a operação e não o repasse. */
function desempenhoEscolas() {
  return escolasDisponiveis().map(e => {
    const d = dreCorte(anoRef, mesRef, e);
    const b = k => d.porBloco.get(k) || 0;
    const subv = b(DRE3.subv);
    let rec = 0;
    for (const [k, v] of d.porBloco) if (BLOCOS_RECEITA.has(k)) rec += v;
    const recOp = rec - subv, resOp = d.total - subv;
    return { escola: e, receita: rec, resultado: d.total, recOp, resOp,
             // percentual sobre base irrisoria nao diz nada: a Sede vive de
             // subvencao, entao sem ela a 'margem' daria -2.100%
             margem: (recOp > 50000 && Math.abs(resOp / recOp) <= 3) ? resOp / recOp : null };
  });
}
const metaDe = esc => (metas[esc] !== undefined ? metas[esc] : (metas.__geral !== undefined ? metas.__geral : 8));

/* ---------- METAS ---------- */
registra("metas", "Metas", () => {
  const itens = desempenhoEscolas();
  const metaGeral = metas.__geral !== undefined ? metas.__geral : 8;

  let html = '<div class="rolagem"><table class="bp"><thead><tr>' +
    '<th>Escola</th><th class="num">Meta de margem</th><th class="num">Margem real</th>' +
    '<th class="num">Diferença</th><th class="num">Resultado hoje</th>' +
    '<th class="num">Resultado na meta</th><th>Situação</th>' +
    '</tr></thead><tbody>';
  let nOk = 0, nFora = 0, faltaTotal = 0;
  for (const r of itens) {
    const meta = metaDe(r.escola) / 100;
    const alvo = r.recOp * meta;
    const falta = alvo - r.resOp;
    const dentro = r.margem !== null && r.margem >= meta;
    if (r.margem !== null) { if (dentro) nOk++; else { nFora++; faltaTotal += falta; } }
    const pp = r.margem === null ? null : (r.margem - meta) * 100;
    html += '<tr class="bp-item"><td><b>' + r.escola + '</b></td>' +
      '<td class="num"><input type="number" class="in-meta" data-escola="' + r.escola +
        '" value="' + metaDe(r.escola) + '" step="0.5" min="-50" max="60"> %</td>' +
      '<td class="num">' + (r.margem === null ? "–" : pct(r.margem)) + '</td>' +
      '<td class="num ' + (pp === null ? "" : sinal(pp)) + '">' +
        (pp === null ? "–" : (pp > 0 ? "+" : "") + fmtP.format(pp) + " pp") + '</td>' +
      '<td class="num ' + sinal(r.resOp) + '">' + n(r.resOp) + '</td>' +
      '<td class="num">' + n(alvo) + '</td>' +
      '<td>' + (r.margem === null ? '<span style="color:#99a">sem base operacional</span>'
        : dentro ? '<span class="selo selo-ok">na meta</span>'
                 : '<span class="selo selo-alerta">faltam ' + n(falta) + '</span>') + '</td></tr>';
  }
  html += '</tbody></table></div>';

  const comMargem = itens.filter(r => r.margem !== null);
  const graf = grafBarrasH({
    rotulos: comMargem.map(r => r.escola),
    valores: comMargem.map(r => (r.margem - metaDe(r.escola) / 100) * 100),
    fmt: v => (v > 0 ? "+" : "") + fmtP.format(v) + " pp",
    filtravel: true,
  });

  const cartoes = '<div class="cartoes" style="grid-template-columns:repeat(3,1fr)">' +
    '<div class="cartao"><div class="titulo">Dentro da meta</div>' +
      '<div class="valor positivo">' + nOk + '</div>' +
      '<div class="faixa">de ' + (nOk + nFora) + ' escolas</div></div>' +
    '<div class="cartao"><div class="titulo">Abaixo da meta</div>' +
      '<div class="valor ' + (nFora ? "negativo" : "") + '">' + nFora + '</div>' +
      '<div class="faixa">precisam de atenção</div></div>' +
    '<div class="cartao"><div class="titulo">Falta para todas baterem</div>' +
      '<div class="valor ' + (faltaTotal > 0 ? "negativo" : "positivo") + '">' + n(faltaTotal) + '</div>' +
      '<div class="faixa">somando só quem está fora</div></div></div>';

  const controle = '<div class="painel"><h2>🎯 Meta de margem operacional</h2>' +
    '<details class="porque"><summary>como isto é calculado</summary>' +
    '<p class="desc">A meta é cobrada sobre a <b>margem operacional</b> — resultado e receita ' +
    '<i>sem</i> subvenção. É de propósito: com subvenção dentro, uma escola bate a meta por causa ' +
    'do repasse e não da operação. "Resultado na meta" é quanto ela faria se cumprisse. ' +
    'As metas ficam gravadas neste navegador.</p></details>' +
    '<div class="sim-linha" style="max-width:480px">' +
      '<label for="meta-geral">Meta padrão de todas</label>' +
      '<input type="range" id="meta-geral" min="-10" max="30" step="0.5" value="' + metaGeral + '">' +
      '<output>' + fmtP.format(metaGeral) + '%</output></div>' +
    '<p class="desc" style="margin:8px 0 0">Pode ajustar escola por escola direto na tabela.' +
      '<button type="button" class="nav-btn" id="meta-igualar" style="margin-left:8px">Igualar todas à padrão</button></p>' +
    '</div>';

  return controle + cartoes +
    painel("Distância para a meta", "Quantos pontos percentuais cada escola está acima ou abaixo. Verde para cima, vermelho para baixo.", graf) +
    painel("Metas por escola", "Edite a meta de cada uma na coluna da esquerda — ela grava sozinha.", html);
});

/* ---------- COMPARAR DUAS ESCOLAS ---------- */
let compA = null, compB = null;
registra("comparar", "Comparar", () => {
  const lista = escolasDisponiveis();
  if (lista.length < 2) return painel("Comparar", "Preciso de pelo menos duas escolas com movimento.", "");
  if (!compA || lista.indexOf(compA) < 0) compA = lista[0];
  if (!compB || lista.indexOf(compB) < 0 || compB === compA) compB = lista.find(e => e !== compA);

  const sel = (id, val) => '<select id="' + id + '">' + lista.map(e =>
    '<option value="' + e + '"' + (e === val ? " selected" : "") + '>' + e + '</option>').join("") + '</select>';
  const barra = '<div class="periodo" style="padding:0 0 10px"><label>Comparar</label>' +
    sel("comp-a", compA) + '<label>com</label>' + sel("comp-b", compB) +
    '<button type="button" class="nav-btn" id="comp-troca">⇄ inverter</button></div>';

  const dA = dreCorte(anoRef, mesRef, compA), dB = dreCorte(anoRef, mesRef, compB);
  const v = (d, k) => d.porBloco.get(k) || 0;
  const linhas = [
    ["Prestação de Serviços", DRE3.prest, 1],
    ["Subvenções Recebidas", DRE3.subv, 1],
    ["Outras Receitas Recorrentes", "Outras Receitas Recorrentes", 1],
    ["Despesas com Pessoal", DRE3.pessoal, -1],
    ["Administrativas e Gerais", DRE3.adm, -1],
    ["Educação, Assistência e Orientação Social", DRE3.educ, -1],
    ["Outorgamentos", "Outorgamentos", -1],
  ];
  const chavesRec = [DRE3.prest, DRE3.subv, "Outras Receitas Recorrentes"];
  const recA = chavesRec.reduce((s, k) => s + v(dA, k), 0);
  const recB = chavesRec.reduce((s, k) => s + v(dB, k), 0);

  let tab = '<div class="rolagem"><table class="bp"><thead><tr><th></th><th></th>' +
    '<th class="num">' + compA + '</th><th class="num">' + compB + '</th>' +
    '<th class="num">Diferença</th><th class="num">% rec. ' + compA + '</th>' +
    '<th class="num">% rec. ' + compB + '</th></tr></thead><tbody>';
  for (const [rot, bloco, sg] of linhas) {
    const a = v(dA, bloco) * sg, b = v(dB, bloco) * sg, d = a - b;
    tab += '<tr class="bp-item"><td></td><td>' + rot + '</td>' +
      '<td class="num">' + n(a) + '</td><td class="num">' + n(b) + '</td>' +
      '<td class="num ' + (d ? sinal(d * sg) : "") + '">' + (d ? (d > 0 ? "+" : "") + n(d) : "–") + '</td>' +
      '<td class="num">' + (recA ? pct(Math.abs(a) / recA) : "–") + '</td>' +
      '<td class="num">' + (recB ? pct(Math.abs(b) / recB) : "–") + '</td></tr>';
  }
  const dif = dA.total - dB.total;
  tab += '<tr class="bp-total"><td></td><td>RESULTADO</td>' +
    '<td class="num ' + sinal(dA.total) + '">' + n(dA.total) + '</td>' +
    '<td class="num ' + sinal(dB.total) + '">' + n(dB.total) + '</td>' +
    '<td class="num ' + sinal(dif) + '">' + (dif > 0 ? "+" : "") + n(dif) + '</td>' +
    '<td></td><td></td></tr></tbody></table></div>';

  const graf = grafBarras({
    rotulos: ["Prestação", "Pessoal", "Adm e Gerais", "Resultado"],
    series: [
      { nome: compA, cor: VIZ.serie,
        valores: [v(dA, DRE3.prest), -v(dA, DRE3.pessoal), -v(dA, DRE3.adm), dA.total] },
      { nome: compB, cor: VIZ.serie2,
        valores: [v(dB, DRE3.prest), -v(dB, DRE3.pessoal), -v(dB, DRE3.adm), dB.total] },
    ],
  });

  // leitura automática: onde nasce a diferença de margem
  let frase = "";
  if (recA > 50000 && recB > 50000) {
    const pA = -v(dA, DRE3.pessoal) / recA, pB = -v(dB, DRE3.pessoal) / recB;
    const quem = pA > pB ? compA : compB;
    frase = '<p class="desc">Pessoal consome <b>' + pct(Math.max(pA, pB)) + '</b> da receita em <b>' +
      quem + '</b>, contra ' + pct(Math.min(pA, pB)) + ' na outra — é geralmente aí que a ' +
      'diferença de margem nasce.</p>';
  }

  return painel(compA + " × " + compB + " — " + NOMES_MESES[mesRef - 1] + "/" + anoRef,
    "As duas DREs lado a lado, com a diferença calculada linha a linha.",
    barra + frase + graf + tab);
});

/* ---------- interações de metas e comparação ---------- */
function ligarMetasComparar(raiz) {
  raiz.querySelectorAll(".in-meta").forEach(el => el.addEventListener("change", () => {
    metas[el.dataset.escola] = +el.value;
    DB.grava("metas", metas); desenhar();
  }));
  const geral = raiz.querySelector("#meta-geral");
  if (geral) geral.addEventListener("input", () => {
    metas.__geral = +geral.value; DB.grava("metas", metas);
    const id = geral.id, pos = geral.value;
    desenhar();
    const novo = document.getElementById(id);
    if (novo) { novo.focus(); novo.value = pos; }
  });
  const igualar = raiz.querySelector("#meta-igualar");
  if (igualar) igualar.addEventListener("click", () => {
    const g = metas.__geral !== undefined ? metas.__geral : 8;
    metas = { __geral: g }; DB.grava("metas", metas); desenhar();
  });
  const a = raiz.querySelector("#comp-a"), b = raiz.querySelector("#comp-b");
  if (a) a.addEventListener("change", () => { compA = a.value; desenhar(); });
  if (b) b.addEventListener("change", () => { compB = b.value; desenhar(); });
  const troca = raiz.querySelector("#comp-troca");
  if (troca) troca.addEventListener("click", () => {
    const t = compA; compA = compB; compB = t; desenhar();
  });
}

/* Grupos da barra de navegacao: agrupa os blocos por assunto. */
const GRUPOS = [
  ["Demonstrações", ["balanco", "balanco-unidade", "dre", "dre-unidade"]],
  ["Posição", ["capital", "disponivel", "imobilizado"]],
  ["Gestão", ["metas", "comparar", "simulacao"]],
  ["Operação", ["prestacao", "pessoal", "adm", "ranking"]],
  ["Pessoas", ["funcionarios", "rescisoes"]],
];

function montarNavegacao() {
  const btn = b => `<button type="button" class="nav-btn${b.id === blocoAtivo ? " ativa" : ""}" data-bloco="${b.id}">${b.titulo}</button>`;
  const usados = new Set(GRUPOS.flatMap(g => g[1]));
  const sobra = BLOCOS.filter(b => !usados.has(b.id));
  document.getElementById("navegacao").innerHTML =
    GRUPOS.map(([rot, ids], i) => {
      const bs = ids.map(id => BLOCOS.find(b => b.id === id)).filter(Boolean);
      if (!bs.length) return "";
      return (i ? `<span class="nav-sep"></span>` : "") +
        `<span class="nav-grupo"><b>${rot}</b>${bs.map(btn).join("")}</span>`;
    }).join("") +
    (sobra.length ? `<span class="nav-sep"></span>` + sobra.map(btn).join("") : "") +
    `<span style="flex:1"></span><button type="button" class="nav-btn" id="abrir-impressao">🖨️ Relatórios</button>`;
  document.querySelectorAll("#navegacao .nav-btn[data-bloco]").forEach(b => b.addEventListener("click", () => {
    blocoAtivo = b.dataset.bloco; montarNavegacao(); desenhar();
  }));
  document.getElementById("abrir-impressao").addEventListener("click", abrirImpressao);
}

/* ---------- relatório: escolher os blocos e imprimir ---------- */
const DEMONSTRACOES = ["balanco", "balanco-unidade", "dre", "dre-unidade"];
let impSelecionado = new Set(DEMONSTRACOES);

function montarItensImpressao() {
  document.getElementById("impressao-itens").innerHTML = BLOCOS.map(b =>
    `<label style="display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer">
       <input type="checkbox" value="${b.id}" ${impSelecionado.has(b.id) ? "checked" : ""}> ${b.titulo}
     </label>`).join("");
  document.querySelectorAll("#impressao-itens input").forEach(cb =>
    cb.addEventListener("change", () => {
      if (cb.checked) impSelecionado.add(cb.value); else impSelecionado.delete(cb.value);
    }));
}

function abrirImpressao() {
  const p = document.getElementById("painel-impressao");
  const abrindo = p.style.display === "none";
  p.style.display = abrindo ? "" : "none";
  if (abrindo) { montarItensImpressao(); p.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
}

/* Monta os blocos escolhidos num container próprio e chama a impressão.
   Cada bloco ganha cabeçalho com a entidade e o carimbo dos dados, porque a
   folha impressa sai do contexto da tela. */
function gerarRelatorio() {
  const escolhidos = BLOCOS.filter(b => impSelecionado.has(b.id));
  if (!escolhidos.length) { alert("Marque pelo menos um bloco para o relatório."); return; }
  const carimbo = document.getElementById("carimbo").textContent.trim();
  const hoje = new Date().toLocaleDateString("pt-BR");
  const alvo = document.getElementById("impressao");
  alvo.innerHTML = escolhidos.map(b => {
    let corpo;
    try { corpo = b.render(); }
    catch (e) { corpo = `<div class="aviso">Não consegui montar "${b.titulo}": ${e.message}</div>`; }
    return `<section class="bloco-imp">
        <div class="imp-cabecalho">
          <h2>${b.titulo}</h2>
          <span class="ent">Análise Financeira — Educação ANP</span>
        </div>${corpo}
        <div class="imp-rodape">${carimbo} · relatório gerado em ${hoje}</div>
      </section>`;
  }).join("");
  window.print();
}

document.getElementById("imp-gerar").addEventListener("click", gerarRelatorio);
document.getElementById("imp-fechar").addEventListener("click", abrirImpressao);
document.getElementById("imp-todos").addEventListener("click", () => {
  impSelecionado = new Set(BLOCOS.map(b => b.id)); montarItensImpressao();
});
document.getElementById("imp-nenhum").addEventListener("click", () => {
  impSelecionado = new Set(); montarItensImpressao();
});
document.getElementById("imp-demonstracoes").addEventListener("click", () => {
  impSelecionado = new Set(DEMONSTRACOES); montarItensImpressao();
});
function desenhar() {
  const bloco = BLOCOS.find(b => b.id === blocoAtivo);
  try {
    document.getElementById("conteudo").innerHTML = bloco.render();
    ligarDicas(document.getElementById("conteudo"));
    ligarCliquesEscola(document.getElementById("conteudo"));
    ligarSimulacao(document.getElementById("conteudo"));
    ligarMetasComparar(document.getElementById("conteudo"));
  } catch (e) {
    document.getElementById("conteudo").innerHTML =
      `<div class="painel"><div class="aviso">Não consegui montar "${bloco.titulo}": ${e.message}</div></div>`;
  }
  window.scrollTo(0, 0);
}

carregar().then(() => {
    mesRef = mesComparavel(anoRef);   // começa no último mês fechado
    montarPeriodo(); montarFiltroEscola(); montarNavegacao(); desenhar();
  })
  .catch(e => {
    document.getElementById("conteudo").innerHTML =
      `<div class="painel"><div class="aviso"><b>Não consegui carregar os dados:</b> ${e.message}<br>
       Esta página lê a mesma planilha do painel (<code>../dados.xlsx</code>).</div></div>`;
  });
</script>
