<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio de Refeições</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            body { background: white !important; }
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:text-xs { font-size: 0.75rem !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:border-black { border-color: black !important; }
            .print\:bg-transparent { background-color: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div id="root"></div>

    <!-- Módulo Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseAPI = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ÍCONES ---
        const Icon = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props} />;
        const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
        const Calculator = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
        const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;

        // --- DEFAULTS ---
        const CATEGORIAS = ['Fixos', 'Totalmente Isentos', 'Isentos por Salário', 'Não Isentos', 'Outras Entidades', 'Rescisões'];
        const basePrices = { almoco: 35, outras: 35, depMeiaAlmoco: 7, depMeiaOutras: 7, depIntAlmoco: 35, depIntOutras: 35 };
        const DEFAULT_SETTINGS = {
          fixedRate: 165,
          dependentLimit: 3,
          mealTimes: { cafe: { start: '05:00', end: '10:00' }, almoco: { start: '10:01', end: '15:00' }, janta: { start: '15:01', end: '23:59' } },
          categoryRules: {
            'Totalmente Isentos': { weekday: { ...basePrices, almoco: 0, outras: 0 }, weekend: { ...basePrices, almoco: 0, outras: 0 } },
            'Isentos por Salário': { weekday: { ...basePrices, almoco: 0 }, weekend: { ...basePrices, almoco: 0 } },
            'Não Isentos': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Outras Entidades': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Rescisões': { weekday: { ...basePrices }, weekend: { ...basePrices } }
          }
        };

        const LoginView = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const handleSubmit = (e) => {
                e.preventDefault();
                if (!onLogin(email, password)) setError('Credenciais inválidas.');
            };
            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-xl shadow-lg border p-8">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-blue-600 p-3 rounded-xl mb-4"><Calculator className="h-8 w-8 text-white" /></div>
                            <h1 className="text-2xl font-bold text-slate-800">RateioRefeições</h1>
                        </div>
                        {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-6">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <input type="text" required value={email} onChange={e => setEmail(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Login" />
                            <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Senha" />
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg flex items-center justify-center"><Lock className="w-4 h-4 mr-2" /> Entrar</button>
                        </form>
                    </div>
                </div>
            );
        };

        function RateioApp({ firebaseApi }) {
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, collection } = firebaseApi;

          const USER_FIREBASE_CONFIG = {
              apiKey: "AIzaSyBIAhPGUpyWC_J_P0iPfDQrnUDbTrHaNRI",
              authDomain: "rateio-fc8b0.firebaseapp.com",
              projectId: "rateio-fc8b0",
              storageBucket: "rateio-fc8b0.firebasestorage.app",
              messagingSenderId: "1035068788064",
              appId: "1:1035068788064:web:6cb011eb1bc3c0e39d2205"
          };

          const { auth, db, envAppId } = useMemo(() => {
              const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : USER_FIREBASE_CONFIG;
              const app = initializeApp(config);
              return { auth: getAuth(app), db: getFirestore(app), envAppId: typeof __app_id !== 'undefined' ? __app_id : 'rateio-prod' };
          }, []);

          const [user, setUser] = useState(null);
          const [dataLoaded, setDataLoaded] = useState(false);
          const [appUser, setAppUser] = useState(null);
          const [activeTab, setActiveTab] = useState('import');
          
          const [appUsers, setAppUsers] = useState([{ id: 1, email: 'nicholas.ganhadeiro@adventistas.org', password: 'Fap1624', role: 'admin' }]);
          const [settings, setSettings] = useState(DEFAULT_SETTINGS);
          const [employees, setEmployees] = useState([]);
          const [rawScans, setRawScans] = useState([]);
          const [manualCharges, setManualCharges] = useState([]);
          const [period, setPeriod] = useState('04/2026');

          useEffect(() => {
              const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
              };
              initAuth();
              const unsubscribe = onAuthStateChanged(auth, setUser);
              return () => unsubscribe();
          }, [auth]);

          useEffect(() => {
              if (!user) return;
              const loadData = async () => {
                try {
                  const appId = envAppId;
                  // Caminhos de 6 segmentos para DOCUMENTOS (Even) conforme regra 1
                  const usersSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'appUsers'));
                  if (usersSnap.exists()) setAppUsers(usersSnap.data().list || []);

                  const settingsSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'settings'));
                  if (settingsSnap.exists()) setSettings(settingsSnap.data());

                  const empSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'employees'));
                  if (empSnap.exists()) setEmployees(empSnap.data().list || []);

                  const stateSnap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'state', 'current'));
                  if (stateSnap.exists()) {
                     setPeriod(stateSnap.data().period || '04/2026');
                     setManualCharges(stateSnap.data().manualCharges || []);
                     setRawScans(stateSnap.data().rawScans || []);
                  }
                } catch (e) { console.error("Firestore Error:", e); }
                finally { setDataLoaded(true); }
              };
              loadData();
          }, [user, db, envAppId]);

          useEffect(() => {
              if (!user || !dataLoaded) return;
              const timer = setTimeout(() => {
                  const appId = envAppId;
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'appUsers'), { list: appUsers });
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'settings'), settings);
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'configs', 'employees'), { list: employees });
                  setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'state', 'current'), { period, manualCharges, rawScans });
              }, 1000);
              return () => clearTimeout(timer);
          }, [appUsers, settings, employees, period, manualCharges, rawScans, user, dataLoaded]);

          const processedData = useMemo(() => {
            const empMap = {};
            employees.forEach(e => { empMap[e.code] = { ...e, totalValue: e.category === 'Fixos' ? settings.fixedRate : 0, records: [] }; });

            rawScans.forEach(scan => {
              const isDep = scan.fullCode.includes('-');
              const baseCode = isDep ? scan.fullCode.split('-')[0] : scan.fullCode;
              if (!empMap[baseCode]) empMap[baseCode] = { code: baseCode, name: scan.name || 'Desconhecido', category: 'Não Isentos', totalValue: 0, records: [] };
              const emp = empMap[baseCode];
              if (emp.category === 'Fixos') return;

              const [dateStr, timeStr] = scan.dateTime.split(' ');
              const t = timeStr || '12:00';
              let mealType = 'almoco';
              if (t >= settings.mealTimes.cafe.start && t <= settings.mealTimes.cafe.end) mealType = 'cafe';
              else if (t >= settings.mealTimes.janta.start && t <= settings.mealTimes.janta.end) mealType = 'janta';

              const dayType = (()=>{
                  if(!dateStr) return 'weekday';
                  const [d, m, y] = dateStr.split('/');
                  const date = new Date(y, m-1, d);
                  const dow = date.getDay();
                  return (dow===0 || dow===6 || (dow===5 && mealType==='janta')) ? 'weekend' : 'weekday';
              })();

              const rules = settings.categoryRules[emp.category]?.[dayType] || basePrices;
              let charge = 0;

              if (isDep) {
                const parts = scan.fullCode.split('-');
                let seq = 1; let type = null;
                if (parts.length === 3) { seq = parseInt(parts[1]); type = parseInt(parts[2]); }
                else if (parts.length === 2) { 
                    const s = parts[1]; 
                    if (s.length >= 2) { seq = parseInt(s.substring(0, s.length-1)); type = parseInt(s.substring(s.length-1)); }
                    else { seq = parseInt(s); }
                }
                if (seq > settings.dependentLimit) charge = (mealType === 'almoco' ? rules.depIntAlmoco : rules.depIntOutras);
                else {
                    const finalType = type !== null ? type : 1;
                    if (finalType === 0) charge = 0;
                    else if (finalType === 1) charge = (mealType === 'almoco' ? rules.depMeiaAlmoco : rules.depMeiaOutras);
                    else charge = (mealType === 'almoco' ? rules.depIntAlmoco : rules.depIntOutras);
                }
              } else {
                charge = mealType === 'almoco' ? rules.almoco : rules.outras;
              }
              emp.totalValue += charge;
            });
            manualCharges.forEach(mc => { if (empMap[mc.code]) empMap[mc.code].totalValue += Number(mc.amount); });
            return Object.values(empMap).filter(e => e.totalValue > 0 || e.category === 'Fixos');
          }, [rawScans, employees, settings, manualCharges]);

          if (!dataLoaded) return <div className="min-h-screen flex items-center justify-center font-bold text-blue-600">Sincronizando Banco de Dados...</div>;
          if (!appUser) return <LoginView onLogin={(e, p) => { const f = appUsers.find(u => u.email.toLowerCase() === e.toLowerCase() && u.password === p); if (f) { setAppUser(f); return true; } return false; }} />;

          return (
            <div className="min-h-screen flex flex-col">
              <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
                <div className="flex items-center gap-2"><div className="bg-blue-600 p-2 rounded text-white"><Calculator /></div><h1 className="font-bold text-xl">RateioRefeições</h1></div>
                <nav className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                  <button onClick={() => setActiveTab('import')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'import' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Importar</button>
                  <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'dashboard' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Relatórios</button>
                  {appUser.role === 'admin' && <button onClick={() => setActiveTab('config')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'config' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Config</button>}
                </nav>
                <div className="flex items-center gap-4"><span className="text-xs font-bold text-slate-500">{appUser.email}</span><button onClick={() => setAppUser(null)} className="text-red-500"><LogOut /></button></div>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto p-6">
                {activeTab === 'import' && (
                  <div className="bg-white p-8 rounded-xl shadow-sm border text-center">
                    <Upload className="mx-auto h-12 w-12 text-blue-500 mb-4" />
                    <h2 className="text-xl font-bold mb-4">Importar CSV</h2>
                    <input type="file" accept=".csv" onChange={e => {
                        const file = e.target.files[0]; if(!file) return;
                        const reader = new FileReader();
                        reader.onload = ev => {
                            const lines = ev.target.result.split('\n'); const parsed = [];
                            for(let i=1; i<lines.length; i++) {
                                const p = lines[i].trim().split(';');
                                if(p.length >= 2) parsed.push({ fullCode: p[0].trim(), dateTime: p[1].trim(), name: p[2] || '' });
                            }
                            setRawScans(parsed); setActiveTab('dashboard');
                        };
                        reader.readAsText(file);
                    }} className="text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 cursor-pointer" />
                  </div>
                )}

                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="bg-white p-6 rounded-xl border">
                            <p className="text-xs font-bold text-slate-400 uppercase">Total Geral</p>
                            <p className="text-3xl font-black">R$ {processedData.reduce((a,b)=>a+b.totalValue,0).toFixed(2).replace('.',',')}</p>
                        </div>
                        <button onClick={()=>{
                            const rows = [['Conta','Sub','Valor','Desc']];
                            processedData.forEach(e => rows.push(['1135001', e.code, (e.totalValue*100).toFixed(0), `Refeicao ${period}`]));
                            const blob = new Blob(['\uFEFF'+rows.map(r=>r.join(';')).join('\n')], {type:'text/csv'});
                            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `Rateio.csv`; link.click();
                        }} className="bg-green-600 text-white rounded-xl font-bold">Exportar CSV</button>
                    </div>
                    <div className="bg-white rounded-xl border overflow-hidden">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b">
                          <tr><th className="px-6 py-4">Cód.</th><th className="px-6 py-4">Nome</th><th className="px-6 py-4">Categoria</th><th className="px-6 py-4 text-right">Valor</th></tr>
                        </thead>
                        <tbody>
                          {processedData.map((emp, i) => (
                            <tr key={i} className="border-b last:border-0">
                              <td className="px-6 py-4">{emp.code}</td><td className="px-6 py-4 font-bold">{emp.name}</td>
                              <td className="px-6 py-4 text-xs uppercase">{emp.category}</td>
                              <td className="px-6 py-4 text-right font-black text-blue-600">R$ {emp.totalValue.toFixed(2).replace('.',',')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'config' && (
                  <div className="bg-white p-8 rounded-xl border space-y-8">
                    <section>
                      <h2 className="font-bold mb-4 border-b">Regras</h2>
                      <div className="grid grid-cols-2 gap-4">
                        <input type="number" value={settings.dependentLimit} onChange={e => setSettings({...settings, dependentLimit: Number(e.target.value)})} className="border p-2 rounded" />
                        <input type="number" value={settings.fixedRate} onChange={e => setSettings({...settings, fixedRate: Number(e.target.value)})} className="border p-2 rounded" />
                      </div>
                    </section>
                    <section>
                      <h2 className="font-bold mb-4 border-b">Utilizadores</h2>
                      <div className="flex gap-2 mb-4">
                        <input id="u" placeholder="Login" className="border p-2 rounded flex-1" />
                        <input id="p" placeholder="Senha" className="border p-2 rounded w-32" />
                        <button onClick={()=>{
                          const email = document.getElementById('u').value; const pass = document.getElementById('p').value;
                          if(email && pass) setAppUsers([...appUsers, {id: Date.now(), email, password: pass, role: 'user'}]);
                        }} className="bg-blue-600 text-white px-4 rounded">Adicionar</button>
                      </div>
                      {appUsers.map(u => <div key={u.id} className="p-2 border-b flex justify-between"><span>{u.email}</span><button onClick={()=>setAppUsers(appUsers.filter(x=>x.id!==u.id))}><Trash2 size={16}/></button></div>)}
                    </section>
                  </div>
                )}
              </main>
            </div>
          );
        }

        function AppLoader() {
           const [api, setApi] = useState(window.FirebaseAPI);
           useEffect(() => { if (!api) { const h = () => setApi(window.FirebaseAPI); window.addEventListener('firebase-loaded', h); return () => window.removeEventListener('firebase-loaded', h); } }, [api]);
           if (!api) return <div className="min-h-screen flex items-center justify-center font-bold text-slate-400">Iniciando...</div>;
           return <RateioApp firebaseApi={api} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppLoader />);
    </script>
</body>
</html>
