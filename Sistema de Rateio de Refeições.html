<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio de Refeições</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para transpilar o JSX no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Ocultar barra de rolagem em áreas específicas */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Regras para Impressão / PDF */
        @media print {
            body { background: white !important; }
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:text-xs { font-size: 0.75rem !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:border-black { border-color: black !important; }
            .print\:bg-transparent { background-color: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div id="root"></div>

    <!-- Módulo de Importação do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseAPI = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ÍCONES INLINE ---
        const Icon = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props} />;
        const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
        const Users = (p) => <Icon {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></Icon>;
        const Calculator = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Icon>;
        const FileSpreadsheet = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M8 17h2"/><path d="M14 13h2"/><path d="M14 17h2"/></Icon>;
        const Download = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></Icon>;
        const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const Edit = (p) => <Icon {...p}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></Icon>;
        const AlertCircle = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></Icon>;
        const CheckCircle2 = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></Icon>;
        const Clock = (p) => <Icon {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></Icon>;
        const Printer = (p) => <Icon {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></Icon>;
        const FilePlus = (p) => <Icon {...p}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></Icon>;
        const ChevronDown = (p) => <Icon {...p}><polyline points="6 9 12 15 18 9"/></Icon>;
        const Sliders = (p) => <Icon {...p}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></Icon>;
        const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;
        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;

        // --- CONFIGURAÇÕES INICIAIS ---
        const CATEGORIAS = [
          'Fixos', 
          'Totalmente Isentos', 
          'Isentos por Salário', 
          'Não Isentos', 
          'Outras Entidades', 
          'Rescisões'
        ];

        const basePrices = { almoco: 35, outras: 35, depMeiaAlmoco: 7, depMeiaOutras: 7, depIntAlmoco: 35, depIntOutras: 35 };
        const isentosPrices = { almoco: 0, outras: 35, depMeiaAlmoco: 7, depMeiaOutras: 7, depIntAlmoco: 35, depIntOutras: 35 };
        const totalmenteIsentosPrices = { almoco: 0, outras: 0, depMeiaAlmoco: 7, depMeiaOutras: 7, depIntAlmoco: 35, depIntOutras: 35 };

        const DEFAULT_SETTINGS = {
          fixedRate: 165,
          dependentLimit: 3,
          mealTimes: {
            cafe: { start: '05:00', end: '10:00' },
            almoco: { start: '10:01', end: '15:00' },
            janta: { start: '15:01', end: '23:59' }
          },
          categoryRules: {
            'Totalmente Isentos': { weekday: { ...totalmenteIsentosPrices }, weekend: { ...totalmenteIsentosPrices } },
            'Isentos por Salário': { weekday: { ...isentosPrices }, weekend: { ...isentosPrices } }, 
            'Não Isentos': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Outras Entidades': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Rescisões': { weekday: { ...basePrices }, weekend: { ...basePrices } }
          }
        };

        const MOCK_EMPLOYEES = [
          { code: '4214', name: 'João Silva', category: 'Isentos por Salário' },
          { code: '1001', name: 'Maria Souza', category: 'Fixos' }
        ];

        // --- FUNÇÕES UTILITÁRIAS ---
        const getMealType = (timeStr, mealTimes) => {
          if (!timeStr) return 'almoco';
          const t = timeStr.trim();
          if (t >= mealTimes.cafe.start && t <= mealTimes.cafe.end) return 'cafe';
          if (t >= mealTimes.almoco.start && t <= mealTimes.almoco.end) return 'almoco';
          if (t >= mealTimes.janta.start && t <= mealTimes.janta.end) return 'janta';
          return 'almoco'; 
        };

        const isWeekend = (dateStr, mealType) => {
          if (!dateStr) return false;
          const parts = dateStr.split('/');
          if (parts.length !== 3) return false;
          const [day, month, year] = parts;
          const date = new Date(year, month - 1, day);
          const dayOfWeek = date.getDay();
          if (dayOfWeek === 0 || dayOfWeek === 6) return true;
          if (dayOfWeek === 5 && mealType === 'janta') return true;
          return false;
        };

        // --- COMPONENTES ---

        const LoginView = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const success = onLogin(email, password);
                if (!success) setError('Usuário ou senha incorretos.');
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-blue-600 p-3 rounded-xl mb-4">
                                <Calculator className="h-8 w-8 text-white" />
                            </div>
                            <h1 className="text-2xl font-bold text-slate-800">RateioRefeições</h1>
                            <p className="text-sm text-slate-500 mt-1">Faça login para continuar</p>
                        </div>
                        {error && (
                            <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-6 flex items-center">
                                <AlertCircle className="w-4 h-4 mr-2" /> {error}
                            </div>
                        )}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Login</label>
                                <input type="text" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" placeholder="seu.email@exemplo.com" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-shadow" placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center">
                                <Lock className="w-4 h-4 mr-2" /> Entrar
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        const ImportView = ({ period, setPeriod, handleFileUpload }) => (
          <div className="max-w-3xl mx-auto mt-8 bg-white p-8 rounded-xl shadow-sm border border-slate-200">
            <h2 className="text-2xl font-bold text-slate-800 mb-6 flex items-center">
              <Upload className="mr-3 text-blue-600 w-6 h-6" /> Importar Relatório de Refeições
            </h2>
            <div className="mb-6">
              <label className="block text-sm font-medium text-slate-700 mb-2">Período de Apuração (MM/AAAA)</label>
              <input type="text" value={period} onChange={(e) => setPeriod(e.target.value)} className="w-48 px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Ex: 04/2026" />
            </div>
            <div className="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center hover:bg-slate-50 transition-colors">
              <FileSpreadsheet className="mx-auto h-12 w-12 text-slate-400 mb-4" />
              <p className="text-sm text-slate-600 mb-4">Selecione o arquivo CSV do relógio no formato: <br/><strong>Código; Data e Hora; Nome</strong></p>
              <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-medium inline-block transition-colors">
                Selecionar Arquivo CSV
                <input type="file" accept=".csv" className="hidden" onChange={handleFileUpload} />
              </label>
            </div>
          </div>
        );

        const DashboardView = ({ processedData, exportToCSV, period }) => {
          const [selectedCategory, setSelectedCategory] = useState('Todas');
          const [dashSearch, setDashSearch] = useState('');

          const filteredData = useMemo(() => {
            let data = processedData;
            if (selectedCategory !== 'Todas') data = data.filter(emp => emp.category === selectedCategory);
            if (dashSearch) {
              const lower = dashSearch.toLowerCase();
              data = data.filter(emp => emp.name.toLowerCase().includes(lower) || emp.code.includes(lower));
            }
            return data;
          }, [processedData, selectedCategory, dashSearch]);

          const totalValue = processedData.reduce((acc, emp) => acc + emp.totalValue, 0);

          return (
            <div className="space-y-6">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4 print:hidden">
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 md:col-span-2">
                  <p className="text-sm font-medium text-slate-500 mb-1">Total a ser Rateado</p>
                  <h3 className="text-3xl font-bold text-slate-800">R$ {totalValue.toFixed(2).replace('.', ',')}</h3>
                </div>
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center gap-2">
                  <button onClick={exportToCSV} className="w-full flex items-center justify-center bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg font-medium text-sm">
                    <Download className="mr-2 h-4 w-4" /> Exportar CSV
                  </button>
                </div>
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-center gap-2">
                  <button onClick={() => window.print()} className="w-full flex items-center justify-center bg-slate-800 hover:bg-slate-900 text-white px-3 py-2 rounded-lg font-medium text-sm">
                    <Printer className="mr-2 h-4 w-4" /> Salvar PDF
                  </button>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="border-b border-slate-200 bg-slate-50 p-4 print:hidden flex flex-col md:flex-row justify-between items-center gap-4">
                  <div className="flex p-1 gap-1 overflow-x-auto bg-slate-200/50 rounded-lg w-full md:w-auto scrollbar-hide">
                    <button onClick={() => setSelectedCategory('Todas')} className={`px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap ${selectedCategory === 'Todas' ? 'bg-white shadow text-blue-700' : 'text-slate-600 hover:text-slate-900'}`}>Visão Geral</button>
                    {CATEGORIAS.map(cat => (
                      <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1.5 rounded-md text-xs font-medium whitespace-nowrap ${selectedCategory === cat ? 'bg-white shadow text-blue-700' : 'text-slate-600 hover:text-slate-900'}`}>{cat}</button>
                    ))}
                  </div>
                  <div className="relative w-full md:w-64">
                    <Search className="w-4 h-4 absolute left-3 top-2.5 text-slate-400" />
                    <input type="text" placeholder="Filtrar resultados..." value={dashSearch} onChange={e => setDashSearch(e.target.value)} className="w-full pl-9 pr-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white" />
                  </div>
                </div>

                <div className="p-0 md:p-6">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b-2 border-slate-200 text-sm text-slate-600">
                          <th className="py-3 px-4 font-semibold">Cód.</th>
                          <th className="py-3 px-4 font-semibold">Funcionário</th>
                          <th className="py-3 px-4 font-semibold">Categoria</th>
                          <th className="py-3 px-4 font-semibold text-right">Valor Final (R$)</th>
                        </tr>
                      </thead>
                      <tbody>
                        {filteredData.map((emp, idx) => (
                          <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50">
                            <td className="py-3 px-4 font-medium">{emp.code}</td>
                            <td className="py-3 px-4">{emp.name}</td>
                            <td className="py-3 px-4"><span className="px-2 py-1 bg-slate-100 rounded text-xs">{emp.category}</span></td>
                            <td className="py-3 px-4 text-right font-bold">{emp.totalValue.toFixed(2).replace('.', ',')}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const ManualChargeView = ({ employees, manualCharges, setManualCharges, showNotification }) => {
          const [newCharge, setNewCharge] = useState({ code: '', date: '', amount: '', reason: '' });
          const [searchTerm, setSearchTerm] = useState('');
          const [showDropdown, setShowDropdown] = useState(false);

          const handleAddCharge = () => {
            if (!newCharge.code || !newCharge.amount) return showNotification("Selecione um funcionário e digite um valor", "error");
            const emp = employees.find(e => e.code === newCharge.code);
            setManualCharges([...manualCharges, { 
              id: Date.now(), ...newCharge, 
              name: emp ? emp.name : 'Desconhecido',
              amount: Number(newCharge.amount) 
            }]);
            setNewCharge({ code: '', date: '', amount: '', reason: '' });
            setSearchTerm('');
            showNotification("Cobrança manual adicionada com sucesso!");
          };

          const filteredEmployees = employees.filter(e => `${e.code} ${e.name}`.toLowerCase().includes(searchTerm.toLowerCase()));

          return (
            <div className="max-w-4xl mx-auto space-y-6">
              <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 className="text-xl font-bold text-slate-800 mb-6 flex items-center"><FilePlus className="mr-2 text-blue-600 w-6 h-6" /> Adicionar Cobrança Manual</h2>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                  <div className="md:col-span-2 relative">
                    <label className="block text-sm font-medium text-slate-700 mb-1">Funcionário</label>
                    <input type="text" placeholder="Busque por nome ou código..." value={searchTerm} onFocus={() => setShowDropdown(true)} onChange={e => setSearchTerm(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                    {showDropdown && (
                      <ul className="absolute z-10 w-full bg-white border rounded-lg shadow-lg max-h-48 overflow-y-auto mt-1">
                        {filteredEmployees.map(e => (
                          <li key={e.code} className="px-4 py-2 hover:bg-blue-50 cursor-pointer text-sm" onClick={() => { setSearchTerm(`${e.code} - ${e.name}`); setNewCharge({...newCharge, code: e.code}); setShowDropdown(false); }}>
                            <strong>{e.code}</strong> - {e.name}
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Valor (R$)</label>
                    <input type="number" placeholder="Ex: 50.00" value={newCharge.amount} onChange={e => setNewCharge({...newCharge, amount: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                  </div>
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">Data</label>
                    <input type="date" value={newCharge.date} onChange={e => setNewCharge({...newCharge, date: e.target.value})} className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                  </div>
                </div>
                <button onClick={handleAddCharge} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">Adicionar ao Rateio</button>
              </div>
            </div>
          );
        };

        const ConfigView = ({ settings, setSettings, employees, setEmployees, appUsers, setAppUsers, appUserRole, showNotification }) => {
          const [configTab, setConfigTab] = useState('regras');
          const [newAppUser, setNewAppUser] = useState({ email: '', password: '', role: 'user' });

          const handleSaveAppUser = () => {
             if (!newAppUser.email || !newAppUser.password) return showNotification("Preencha login e senha", "error");
             if (appUsers.find(u => u.email === newAppUser.email)) return showNotification("Esse login já existe", "error");
             setAppUsers([...appUsers, { id: Date.now(), ...newAppUser }]);
             setNewAppUser({ email: '', password: '', role: 'user' });
             showNotification("Acesso criado com sucesso!");
          };

          return (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col xl:flex-row min-h-[600px]">
              <div className="w-full xl:w-64 border-r border-slate-200 bg-slate-50 p-4 shrink-0">
                <nav className="space-y-1 flex flex-row xl:flex-col overflow-x-auto xl:overflow-visible scrollbar-hide">
                  <button onClick={() => setConfigTab('regras')} className={`shrink-0 flex items-center px-3 py-2 text-sm font-medium rounded-lg ${configTab === 'regras' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Regras</button>
                  <button onClick={() => setConfigTab('logins')} className={`shrink-0 flex items-center px-3 py-2 text-sm font-medium rounded-lg ${configTab === 'logins' ? 'bg-blue-100 text-blue-700' : 'text-slate-600'}`}>Logins</button>
                </nav>
              </div>
              <div className="flex-1 p-8">
                {configTab === 'logins' && (
                  <div>
                    <h2 className="text-xl font-bold mb-4">Gestão de Acessos</h2>
                    <div className="flex gap-2 mb-6">
                      <input type="text" placeholder="Email" value={newAppUser.email} onChange={e => setNewAppUser({...newAppUser, email: e.target.value})} className="border p-2 rounded flex-1" />
                      <input type="password" placeholder="Senha" value={newAppUser.password} onChange={e => setNewAppUser({...newAppUser, password: e.target.value})} className="border p-2 rounded w-32" />
                      <button onClick={handleSaveAppUser} className="bg-blue-600 text-white px-4 py-2 rounded">Criar</button>
                    </div>
                    <table className="w-full text-sm">
                      <thead><tr className="border-b"><th>Login</th><th>Nível</th></tr></thead>
                      <tbody>
                        {appUsers.map(u => (
                          <tr key={u.id} className="border-b"><td className="py-2">{u.email}</td><td>{u.role}</td></tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
                {configTab === 'regras' && (
                  <div>
                    <h2 className="text-xl font-bold mb-4">Configurações Gerais</h2>
                    <div className="grid grid-cols-2 gap-4">
                      <div>
                        <label className="block text-sm mb-1">Taxa Fixos</label>
                        <input type="number" value={settings.fixedRate} onChange={e => setSettings({...settings, fixedRate: Number(e.target.value)})} className="border w-full p-2 rounded" />
                      </div>
                      <div>
                        <label className="block text-sm mb-1">Cota Dependentes</label>
                        <input type="number" value={settings.dependentLimit} onChange={e => setSettings({...settings, dependentLimit: Number(e.target.value)})} className="border w-full p-2 rounded" />
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          );
        };

        function RateioApp({ firebaseApi }) {
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, collection } = firebaseApi;

          const USER_FIREBASE_CONFIG = {
              apiKey: "AIzaSyBIAhPGUpyWC_J_P0iPfDQrnUDbTrHaNRI",
              authDomain: "rateio-fc8b0.firebaseapp.com",
              projectId: "rateio-fc8b0",
              storageBucket: "rateio-fc8b0.firebasestorage.app",
              messagingSenderId: "1035068788064",
              appId: "1:1035068788064:web:6cb011eb1bc3c0e39d2205"
          };

          const { auth, db, envAppId } = useMemo(() => {
              const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : USER_FIREBASE_CONFIG;
              const app = initializeApp(config);
              const auth = getAuth(app);
              const db = getFirestore(app);
              const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'rateio-app';
              return { auth, db, envAppId };
          }, []);

          const [user, setUser] = useState(null);
          const [dataLoaded, setDataLoaded] = useState(false);
          const [appUser, setAppUser] = useState(null);
          
          const [appUsers, setAppUsers] = useState([{ id: 1, email: 'nicholas.ganhadeiro@adventistas.org', password: 'Fap1624', role: 'admin' }]);
          const [activeTab, setActiveTab] = useState('import');
          const [settings, setSettings] = useState(DEFAULT_SETTINGS);
          const [employees, setEmployees] = useState(MOCK_EMPLOYEES);
          const [period, setPeriod] = useState('04/2026');
          const [rawScans, setRawScans] = useState([]);
          const [manualCharges, setManualCharges] = useState([]); 
          const [processedData, setProcessedData] = useState([]);
          const [notification, setNotification] = useState(null);

          useEffect(() => {
              const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              };
              initAuth();
              const unsubscribe = onAuthStateChanged(auth, setUser);
              return () => unsubscribe();
          }, [auth]);

          useEffect(() => {
              if (!user) return;
              const loadData = async () => {
                try {
                  // Caminhos corrigidos com IDs de documento específicos para evitar erros de segmentos
                  const appUsersSnap = await getDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'appUsers', 'main'));
                  if (appUsersSnap.exists()) setAppUsers(appUsersSnap.data().list);

                  const settingsSnap = await getDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'settings', 'main'));
                  if (settingsSnap.exists()) {
                      const saved = settingsSnap.data();
                      if (saved.categoryRules && !saved.categoryRules['Totalmente Isentos']) {
                          saved.categoryRules['Totalmente Isentos'] = DEFAULT_SETTINGS.categoryRules['Totalmente Isentos'];
                      }
                      setSettings(saved);
                  }

                  const empSnap = await getDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'employees', 'main'));
                  if (empSnap.exists()) setEmployees(empSnap.data().list);

                  const stateSnap = await getDoc(doc(db, 'artifacts', envAppId, 'users', user.uid, 'state', 'current'));
                  if (stateSnap.exists()) {
                     setPeriod(stateSnap.data().period || '04/2026');
                     setManualCharges(stateSnap.data().manualCharges || []);
                     setRawScans(stateSnap.data().rawScans || []);
                  }
                } catch (error) {
                  console.error("Erro ao carregar dados do Firebase:", error);
                } finally {
                  setDataLoaded(true);
                }
              };
              loadData();
          }, [user, db, envAppId]);

          // Persistência com caminhos corrigidos
          useEffect(() => {
              if (!user || !dataLoaded) return;
              const timer = setTimeout(() => {
                  setDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'appUsers', 'main'), { list: appUsers });
              }, 500);
              return () => clearTimeout(timer);
          }, [appUsers, user, dataLoaded, db, envAppId]);

          useEffect(() => {
              if (!user || !dataLoaded) return;
              const timer = setTimeout(() => {
                  setDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'settings', 'main'), settings);
              }, 500);
              return () => clearTimeout(timer);
          }, [settings, user, dataLoaded, db, envAppId]);

          useEffect(() => {
              if (!user || !dataLoaded) return;
              const timer = setTimeout(() => {
                  setDoc(doc(db, 'artifacts', envAppId, 'public', 'data', 'employees', 'main'), { list: employees });
              }, 500);
              return () => clearTimeout(timer);
          }, [employees, user, dataLoaded, db, envAppId]);

          useEffect(() => {
              if (!user || !dataLoaded) return;
              const timer = setTimeout(() => {
                  setDoc(doc(db, 'artifacts', envAppId, 'users', user.uid, 'state', 'current'), { period, manualCharges, rawScans });
              }, 500);
              return () => clearTimeout(timer);
          }, [period, manualCharges, rawScans, user, dataLoaded, db, envAppId]);

          const handleAppLogin = (email, password) => {
              const foundUser = appUsers.find(u => u.email === email && u.password === password);
              if (foundUser) { setAppUser(foundUser); return true; }
              return false;
          };

          const handleAppLogout = () => { setAppUser(null); setActiveTab('import'); };

          const processScans = (scans, empList, currentSettings, manuals) => {
            const empMap = {};
            empList.forEach(emp => {
              empMap[emp.code] = { ...emp, totalValue: 0, records: [] };
              if (emp.category === 'Fixos') empMap[emp.code].totalValue = currentSettings.fixedRate;
            });

            scans.forEach(scan => {
              const isDependent = scan.fullCode.includes('-');
              const baseCode = isDependent ? scan.fullCode.split('-')[0] : scan.fullCode;
              if (!empMap[baseCode]) empMap[baseCode] = { code: baseCode, name: scan.name || 'Desconhecido', category: 'Não Isentos', totalValue: 0, records: [] };
              
              const emp = empMap[baseCode];
              if (emp.category === 'Fixos' || emp.category === 'Totalmente Isentos') return;
              
              const [dateStr, timeStr] = scan.dateTime.split(' ');
              const mealType = getMealType(timeStr, currentSettings.mealTimes);
              const dayType = isWeekend(dateStr, mealType) ? 'weekend' : 'weekday';
              const rules = currentSettings.categoryRules[emp.category]?.[dayType] || basePrices;

              let charge = 0;
              if (isDependent) {
                const parts = scan.fullCode.split('-');
                const seq = parseInt(parts[1]) || 1;
                const limit = currentSettings.dependentLimit || 3;
                charge = seq > limit ? rules.depIntAlmoco : rules.depMeiaAlmoco;
              } else {
                charge = mealType === 'almoco' ? rules.almoco : rules.outras;
              }
              emp.totalValue += charge;
            });

            manuals.forEach(mc => {
              if (empMap[mc.code]) empMap[mc.code].totalValue += Number(mc.amount);
            });

            return Object.values(empMap);
          };

          useEffect(() => {
            if (dataLoaded) setProcessedData(processScans(rawScans, employees, settings, manualCharges));
          }, [rawScans, settings, employees, manualCharges, dataLoaded]);

          const handleFileUpload = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              const lines = event.target.result.split('\n');
              const parsed = [];
              for (let i = 1; i < lines.length; i++) {
                const parts = lines[i].trim().split(';');
                if (parts.length >= 2) parsed.push({ fullCode: parts[0].trim(), dateTime: parts[1].trim(), name: parts[2] ? parts[2].trim() : '' });
              }
              setRawScans(parsed);
              showNotification(`Sucesso! ${parsed.length} registros processados.`);
              setActiveTab('dashboard');
            };
            reader.readAsText(file);
          };

          const exportToCSV = () => {
            const rows = [['Conta', 'Subconta', 'Valor', 'Finalidade']];
            processedData.forEach(emp => {
              if (emp.totalValue > 0) rows.push(['1135001', emp.code, (emp.totalValue * 100).toFixed(0), `Refeições ${period}`]);
            });
            const content = rows.map(r => r.join(';')).join('\n');
            const blob = new Blob(['\uFEFF' + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Rateio_${period.replace('/', '_')}.csv`;
            link.click();
          };

          const showNotification = (msg, type = 'success') => {
            setNotification({ msg, type });
            setTimeout(() => setNotification(null), 4000);
          };

          if (!dataLoaded) return <div className="min-h-screen flex items-center justify-center">Sincronizando...</div>;
          if (!appUser) return <LoginView onLogin={handleAppLogin} />;

          return (
            <div className="min-h-screen pb-12">
              <header className="bg-white border-b px-6 py-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">
                <div className="flex items-center space-x-2">
                  <div className="bg-blue-600 p-2 rounded-lg text-white"><Calculator /></div>
                  <h1 className="text-xl font-bold">RateioRefeições</h1>
                </div>
                <nav className="flex gap-2">
                  <button onClick={() => setActiveTab('import')} className={`px-4 py-2 rounded ${activeTab === 'import' ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}`}>Importar</button>
                  <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded ${activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}`}>Relatórios</button>
                  {appUser.role === 'admin' && <button onClick={() => setActiveTab('config')} className={`px-4 py-2 rounded ${activeTab === 'config' ? 'bg-blue-600 text-white' : 'hover:bg-slate-100'}`}>Configurações</button>}
                </nav>
                <button onClick={handleAppLogout} className="text-red-600 p-2"><LogOut /></button>
              </header>

              <main className="max-w-6xl mx-auto p-6">
                {activeTab === 'import' && <ImportView period={period} setPeriod={setPeriod} handleFileUpload={handleFileUpload} />}
                {activeTab === 'dashboard' && <DashboardView processedData={processedData} exportToCSV={exportToCSV} period={period} />}
                {activeTab === 'config' && <ConfigView settings={settings} setSettings={setSettings} employees={employees} setEmployees={setEmployees} appUsers={appUsers} setAppUsers={setAppUsers} appUserRole={appUser.role} showNotification={showNotification} />}
              </main>
            </div>
          );
        }

        function AppLoader() {
           const [firebaseApi, setFirebaseApi] = useState(window.FirebaseAPI);
           useEffect(() => {
              if (!firebaseApi) {
                 const handleLoad = () => setFirebaseApi(window.FirebaseAPI);
                 window.addEventListener('firebase-loaded', handleLoad);
                 return () => window.removeEventListener('firebase-loaded', handleLoad);
              }
           }, [firebaseApi]);
           if (!firebaseApi) return <div className="min-h-screen flex items-center justify-center">Iniciando...</div>;
           return <RateioApp firebaseApi={firebaseApi} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppLoader />);
    </script>
</body>
</html>
