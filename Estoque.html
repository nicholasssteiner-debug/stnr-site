<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root { --bg:#0f0f17; --card:#1a1a27; --border:#2d2d3a; --accent:#6c63ff; --accent-hover:#8b85ff; --text:#fff; --muted:rgba(255,255,255,.65); --danger:#ff5c7a; --ok:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; letter-spacing:.03em; }
  header h1 span { color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:18px; }
  .btn { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { background:var(--accent-hover); }
  .btn.danger { color:var(--danger); }
  .btn.sm { padding:5px 9px; font-size:12px; }
  input { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .group { cursor:pointer; transition:.15s; }
  .group:hover { border-color:var(--accent); transform:translateY(-2px); }
  .group h3 { margin:0 0 6px; font-size:16px; }
  .plus { display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--accent); border-style:dashed; min-height:96px; cursor:pointer; }
  .plus:hover { border-color:var(--accent); }
  .tabs { display:flex; gap:6px; margin:4px 0 16px; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:14px; }
  .tab.on { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; }
  .row > .fit { flex:none; }
  .item { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:8px; flex-wrap:wrap; }
  .item .info { flex:1; min-width:140px; }
  .item .info b { display:block; font-size:15px; }
  .item svg { background:#fff; border-radius:6px; padding:4px; max-width:170px; height:auto; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
  .tag.sold { color:var(--danger); border-color:var(--danger); }
  .tag.free { color:var(--ok); border-color:var(--ok); }
  .total { font-size:22px; font-weight:700; text-align:right; margin:12px 0; }
  .empty { text-align:center; padding:30px; color:var(--muted); }
  .msg { min-height:18px; font-size:13px; margin-top:6px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; width:100%; max-width:420px; max-height:90vh; overflow:auto; }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <button class="btn hidden" id="back">← Grupos</button>
  <h1 id="title">Estoque <span>•</span></h1>
  <span class="muted" id="cloud" title="Sincronização com a nuvem">⏳</span>
</header>
<main id="app"></main>

<script>
const KEY = 'stnr_estoque_v1';
let db = load();
let view = { screen: 'home', groupId: null, tab: 'estoque' };
let cart = {}; // groupId -> [itemId]

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.groups) return d; } catch (e) {}
  return { groups: [], seq: 1000, noteSeq: 0, updatedAt: 0 };
}
function save() {
  db.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(db));
  pushCloud();
}

/* ---------- Nuvem (Firebase) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyD1X4SsLtWWKTX_O7OzWEpIzA0E8Bm1CBw",
  authDomain: "faturas-e-extratos.firebaseapp.com",
  projectId: "faturas-e-extratos",
  storageBucket: "faturas-e-extratos.firebasestorage.app",
  messagingSenderId: "461188792473",
  appId: "1:461188792473:web:f09bae1f7ddc5698dab808",
  measurementId: "G-XJFVH7JYPQ"
};
let cloudDoc = null, pushTimer = null;
const denied = e => e.code === 'permission-denied' ? 'as regras do Firestore negam a coleção "estoque_app".' : e.message;
function cloudStatus(t, tip) { const el = document.getElementById('cloud'); if (el) { el.textContent = t; el.title = tip || ''; } }
function pushCloud() {
  if (!cloudDoc) return;
  clearTimeout(pushTimer);
  cloudStatus('⏳', 'Salvando na nuvem…');
  pushTimer = setTimeout(() => {
    cloudDoc.set({ json: JSON.stringify(db), updatedAt: db.updatedAt })
      .then(() => cloudStatus('☁️', 'Salvo na nuvem'))
      .catch(e => cloudStatus('⚠️', 'Falha ao salvar na nuvem: ' + denied(e)));
  }, 400);
}
function initCloud() {
  if (typeof firebase === 'undefined' || !firebase.firestore) { cloudStatus('📴', 'Sem Firebase — usando só este navegador'); return; }
  try {
    firebase.initializeApp(firebaseConfig);
    cloudDoc = firebase.firestore().collection('estoque_app').doc('principal');
  } catch (e) { cloudStatus('⚠️', e.message); return; }
  cloudDoc.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists) { if (db.groups.length) pushCloud(); else cloudStatus('☁️', 'Conectado'); return; }
    const d = snap.data();
    if ((d.updatedAt || 0) > (db.updatedAt || 0)) {
      try { db = JSON.parse(d.json); } catch (e) { return; }
      localStorage.setItem(KEY, JSON.stringify(db));
      const a = document.activeElement;
      if (!(a && a.tagName === 'INPUT')) render();
    } else if ((d.updatedAt || 0) < (db.updatedAt || 0)) { pushCloud(); return; }
    cloudStatus('☁️', 'Sincronizado');
  }, e => cloudStatus('⚠️', denied(e)));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const group = () => db.groups.find(g => g.id === view.groupId);
const $ = id => document.getElementById(id);

function go(screen, groupId, tab) {
  view = { screen, groupId: groupId || null, tab: tab || 'estoque' };
  render();
}
$('back').onclick = () => go('home');

function render() {
  const g = view.screen === 'group' ? group() : null;
  if (view.screen === 'group' && !g) return go('home');
  $('back').classList.toggle('hidden', !g);
  $('title').innerHTML = g ? esc(g.name) : 'Estoque <span>•</span>';
  $('app').innerHTML = g ? renderGroup(g) : renderHome();
  drawBarcodes();
  if (g && view.tab === 'marcado') $('code') && $('code').focus();
}

function drawBarcodes() {
  document.querySelectorAll('svg[data-code]').forEach(el => {
    try { JsBarcode(el, el.dataset.code, { format: 'CODE128', height: 40, width: 1.6, fontSize: 13, margin: 2 }); } catch (e) {}
  });
}

/* ---------- Home ---------- */
function renderHome() {
  const cards = db.groups.map(g => {
    const free = g.items.filter(i => !i.sold).length;
    return `<div class="card group" onclick="go('group','${g.id}')">
      <h3>${esc(g.name)}</h3>
      <div class="muted">${g.items.length} item(ns) · ${free} em estoque</div>
      <div class="muted">${g.notes.length} nota(s)</div></div>`;
  }).join('');
  return `<div class="grid"><div class="card plus" onclick="newGroup()" title="Novo grupo">+</div>${cards}</div>
    ${db.groups.length ? '' : '<div class="empty">Clique no + para criar o primeiro grupo.</div>'}`;
}

function newGroup() {
  modal(`<h2>Novo grupo</h2><label>Nome do grupo</label><input id="m1" autofocus>`, () => {
    const name = $('m1').value.trim(); if (!name) return false;
    db.groups.push({ id: uid(), name, items: [], notes: [] }); save(); render();
  });
}
function delGroup(id) {
  if (!confirm('Excluir este grupo com todos os itens e notas?')) return;
  db.groups = db.groups.filter(g => g.id !== id); save(); go('home');
}

/* ---------- Grupo ---------- */
function renderGroup(g) {
  const tabs = [['estoque','Estoque'],['marcado','Marcado'],['historico','Histórico']]
    .map(([k, n]) => `<div class="tab ${view.tab === k ? 'on' : ''}" onclick="go('group','${g.id}','${k}')">${n}</div>`).join('');
  let body = '';
  if (view.tab === 'estoque') body = renderEstoque(g);
  else if (view.tab === 'marcado') body = renderMarcado(g);
  else body = renderHistorico(g);
  return `<div class="tabs">${tabs}</div>${body}
    <div style="margin-top:30px;text-align:center"><button class="btn sm danger" onclick="delGroup('${g.id}')">Excluir grupo</button></div>`;
}

function renderEstoque(g) {
  const list = g.items.map(i => `<div class="card item">
      <div class="info"><b>${esc(i.name)}</b><span class="muted">${brl(i.price)}</span>
        <span class="tag ${i.sold ? 'sold' : 'free'}">${i.sold ? 'vendido' : 'em estoque'}</span></div>
      <svg data-code="${i.code}"></svg>
      <div><button class="btn sm" onclick="printLabel('${i.id}')">Imprimir</button>
      <button class="btn sm danger" onclick="delItem('${i.id}')">✕</button></div></div>`).join('');
  return `<div class="card" style="margin-bottom:14px">
      <div class="row"><div><label>Nome do item</label><input id="iname"></div>
      <div><label>Valor (R$)</label><input id="iprice" type="number" step="0.01" min="0" inputmode="decimal"></div></div>
      <div style="margin-top:12px"><button class="btn primary" onclick="addItem()">Adicionar e gerar código de barras</button></div>
      <div class="msg" id="imsg"></div></div>
    ${list || '<div class="empty">Nenhum item neste grupo.</div>'}`;
}

function addItem() {
  const g = group(), name = $('iname').value.trim(), price = parseFloat($('iprice').value);
  if (!name || isNaN(price) || price < 0) { const m = $('imsg'); m.className = 'msg err'; m.textContent = 'Informe nome e valor.'; return; }
  db.seq++;
  g.items.unshift({ id: uid(), name, price, code: String(db.seq), sold: false });
  save(); render();
  $('iname').focus();
}
function delItem(id) {
  if (!confirm('Excluir este item?')) return;
  const g = group(); g.items = g.items.filter(i => i.id !== id);
  (cart[g.id] = (cart[g.id] || []).filter(x => x !== id)); save(); render();
}
function printLabel(id) {
  const i = group().items.find(x => x.id === id);
  const svg = document.querySelector(`svg[data-code="${i.code}"]`).outerHTML;
  const w = window.open('', '_blank');
  w.document.write(`<title>${esc(i.name)}</title><body style="font-family:sans-serif;text-align:center;margin:20px"><div>${esc(i.name)} — ${brl(i.price)}</div>${svg}<script>onload=()=>print()<\/script>`);
  w.document.close();
}

/* ---------- Marcado ---------- */
function renderMarcado(g) {
  const ids = cart[g.id] = (cart[g.id] || []).filter(id => g.items.some(i => i.id === id && !i.sold));
  const items = ids.map(id => g.items.find(i => i.id === id));
  const total = items.reduce((s, i) => s + i.price, 0);
  const rows = items.map(i => `<div class="card item">
      <div class="info"><b>${esc(i.name)}</b><span class="muted">${i.code}</span></div>
      <div>${brl(i.price)}</div><button class="btn sm danger" onclick="unmark('${i.id}')">✕</button></div>`).join('');
  return `<div class="card" style="margin-bottom:14px">
      <label>Código de barras</label>
      <div class="row"><input id="code" inputmode="numeric" autocomplete="off" placeholder="Digite ou leia o código e pressione Enter"
        onkeydown="if(event.key==='Enter')mark()"><button class="btn primary fit" onclick="mark()">Enviar</button></div>
      <div class="msg" id="cmsg"></div></div>
    ${rows || '<div class="empty">Nenhum item marcado.</div>'}
    ${items.length ? `<div class="total">Total: ${brl(total)}</div>
      <label>Nome de quem está comprando</label><input id="buyer" placeholder="Nome do comprador">
      <div style="margin-top:12px"><button class="btn primary" onclick="makeNote()">Gerar nota</button></div>` : ''}`;
}
function flash(text, ok) { const m = $('cmsg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } }
function mark() {
  const g = group(), input = $('code'), code = input.value.trim(); if (!code) return;
  const it = g.items.find(i => i.code === code);
  const list = cart[g.id] = cart[g.id] || [];
  const buyer = $('buyer') ? $('buyer').value : '';
  let msg, ok = false;
  if (!it) msg = 'Código não encontrado neste grupo.';
  else if (it.sold) msg = `"${it.name}" já foi vendido.`;
  else if (list.includes(it.id)) msg = `"${it.name}" já está marcado.`;
  else { list.push(it.id); msg = `"${it.name}" marcado.`; ok = true; }
  render();
  if ($('buyer')) $('buyer').value = buyer;
  flash(msg, ok);
  $('code').focus();
}
function unmark(id) { const g = group(); cart[g.id] = cart[g.id].filter(x => x !== id); render(); }

function makeNote() {
  const g = group(), buyer = $('buyer').value.trim();
  if (!buyer) { flash('Informe o nome do comprador.', false); $('buyer').focus(); return; }
  const items = cart[g.id].map(id => g.items.find(i => i.id === id));
  db.noteSeq++;
  const note = { id: uid(), num: db.noteSeq, buyer, date: new Date().toISOString(),
    items: items.map(i => ({ name: i.name, code: i.code, price: i.price })),
    total: items.reduce((s, i) => s + i.price, 0) };
  items.forEach(i => i.sold = true);
  g.notes.unshift(note); cart[g.id] = []; save();
  downloadNote(g, note);
  go('group', g.id, 'historico');
}

/* ---------- Histórico / notas ---------- */
function renderHistorico(g) {
  if (!g.notes.length) return '<div class="empty">Nenhuma nota gerada.</div>';
  return g.notes.map(n => `<div class="card item">
    <div class="info"><b>Nota nº ${String(n.num).padStart(4, '0')} — ${esc(n.buyer)}</b>
      <span class="muted">${new Date(n.date).toLocaleString('pt-BR')} · ${n.items.length} item(ns)</span></div>
    <div><b>${brl(n.total)}</b></div>
    <div><button class="btn sm" onclick="viewNote('${n.id}')">Ver</button>
    <button class="btn sm" onclick="dl('${n.id}')">Baixar</button>
    <button class="btn sm danger" onclick="delNote('${n.id}')">✕</button></div></div>`).join('');
}
function noteHTML(g, n) {
  const rows = n.items.map(i => `<tr><td>${esc(i.name)}</td><td>${i.code}</td><td style="text-align:right">${brl(i.price)}</td></tr>`).join('');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Nota ${String(n.num).padStart(4,'0')} - ${esc(n.buyer)}</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;color:#111}
h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
.t{text-align:right;font-size:20px;font-weight:700}.m{color:#555;font-size:13px}</style></head><body>
<h1>${esc(g.name)}</h1><div class="m">Nota nº ${String(n.num).padStart(4,'0')} · ${new Date(n.date).toLocaleString('pt-BR')}</div>
<p><b>Comprador:</b> ${esc(n.buyer)}</p>
<table><tr><th>Item</th><th>Código</th><th style="text-align:right">Valor</th></tr>${rows}</table>
<div class="t">Total: ${brl(n.total)}</div></body></html>`;
}
function downloadNote(g, n) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([noteHTML(g, n)], { type: 'text/html' }));
  a.download = `Nota ${String(n.num).padStart(4, '0')} - ${n.buyer.replace(/[\\/:*?"<>|]/g, '')}.html`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const findNote = id => group().notes.find(n => n.id === id);
function dl(id) { downloadNote(group(), findNote(id)); }
function viewNote(id) {
  const w = window.open('', '_blank'); w.document.write(noteHTML(group(), findNote(id))); w.document.close();
}
function delNote(id) {
  if (!confirm('Excluir esta nota? Os itens voltam para o estoque.')) return;
  const g = group(), n = findNote(id);
  n.items.forEach(ni => { const it = g.items.find(i => i.code === ni.code); if (it) it.sold = false; });
  g.notes = g.notes.filter(x => x.id !== id); save(); render();
}

/* ---------- Modal ---------- */
function modal(html, onOk) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}<div class="actions"><button class="btn" id="mc">Cancelar</button><button class="btn primary" id="mo">Criar</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('#mc').onclick = close;
  bg.querySelector('#mo').onclick = () => { if (onOk() !== false) close(); };
  bg.querySelector('input').onkeydown = e => { if (e.key === 'Enter') bg.querySelector('#mo').click(); };
  bg.querySelector('input').focus();
}

render();
initCloud();
</script>
</body>
</html>
