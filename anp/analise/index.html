<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --azul-escuro: #2c5f7c;
    --azul-header: #33607d;
    --azul-tabela: #2c5f7c;
    --azul-claro: #5b9bd5;
    --cinza-titulo: #8aa8bd;
    --fundo: #eef1f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: #334; font-size: 14px;
         font-family: "Segoe UI", Tahoma, sans-serif; }
  header { background: var(--azul-header); color: #fff; padding: 14px 22px;
           display: flex; align-items: center; gap: 18px; }
  header h1 { margin: 0; font-size: 21px; font-weight: 600; flex: 1; text-align: center; }
  header .info { font-size: 12px; text-align: right; line-height: 1.45; min-width: 170px; }
  .voltar { color: #fff; text-decoration: none; font-size: 13px; border: 1px solid rgba(255,255,255,.45);
            padding: 6px 13px; border-radius: 3px; white-space: nowrap; }
  .voltar:hover { background: rgba(255,255,255,.14); }

  .periodo { display: flex; align-items: center; gap: 8px; padding: 12px 22px 0; flex-wrap: wrap; }
  .periodo label { font-size: 13px; color: #567; font-weight: 600; }
  .periodo select { padding: 6px 10px; border: 1px solid #c9d6e2; border-radius: 3px;
    font-family: inherit; font-size: 13px; color: #345; background: #fff; }
  .periodo-dica { font-size: 12px; color: #8a9aa8; }
  .chip-esc { padding: 5px 12px; border: 1px solid #c9d6e2; border-radius: 14px; background: #fff;
    font-family: inherit; font-size: 12.5px; color: #567; cursor: pointer; }
  .chip-esc:hover { border-color: var(--azul-claro); color: var(--azul-escuro); }
  .chip-esc.ativo { background: var(--azul-tabela); border-color: var(--azul-tabela);
    color: #fff; font-weight: 600; }
  .viz [data-filtra] { cursor: pointer; }
  .foco-aviso { font-size: 12px; color: #2c5f7c; background: #eaf2f8; border: 1px solid #cfe0ec;
    border-radius: 3px; padding: 4px 10px; }
  .navegacao { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 22px 0; }
  .nav-btn { padding: 7px 14px; border: 1px solid #c9d6e2; border-radius: 3px; background: #fff;
             font-family: inherit; font-size: 13px; color: #567; cursor: pointer; }
  .nav-btn:hover { border-color: var(--azul-claro); color: var(--azul-escuro); }
  .nav-btn.ativa { background: var(--azul-tabela); border-color: var(--azul-tabela); color: #fff; font-weight: 600; }

  main { padding: 14px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
  .painel { background: #fff; border: 1px solid #dde4ea; border-radius: 4px; padding: 16px 18px; }
  .painel h2 { margin: 0 0 4px; font-size: 16px; color: var(--cinza-titulo); font-weight: 600; }
  .desc { font-size: 12.5px; color: #778; margin: 0 0 12px; }

  .cartoes { display: grid; gap: 12px; margin-bottom: 4px; }
  .cartao { background: #fff; border: 1px solid #dde4ea; border-radius: 4px; padding: 12px 14px; text-align: center; }
  .cartao .titulo { font-size: 12px; color: #8198ab; margin-bottom: 5px; }
  .cartao .valor { font-size: 24px; font-weight: 600; color: var(--azul-escuro); }
  .cartao .faixa { font-size: 11.5px; color: #8a9aa8; margin-top: 4px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th { background: var(--azul-tabela); color: #fff; padding: 7px 10px; text-align: left;
             font-weight: 600; white-space: nowrap; position: sticky; top: 0; }
  th.num, td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody td { padding: 5px 10px; border-bottom: 1px solid #e9eef2; }
  tr.grupo td { background: #eef3f8; font-weight: 600; }
  tr.total td { background: #e3ecf3; font-weight: 700; border-top: 2px solid var(--azul-tabela); }
  tr.sub td:first-child { padding-left: 26px; color: #566; }
  .rolagem { overflow-x: auto; }

  /* Balanço no formato da demonstração: seções, grupos com régua e itens recuados */
  table.bp tbody td { border-bottom: none; padding: 3px 10px; }
  table.bp tr.bp-secao td { padding-top: 14px; font-weight: 700; font-size: 14px;
    color: var(--azul-escuro); letter-spacing: .3px; }
  table.bp tr.bp-grupo td { font-weight: 700; padding-top: 7px; }
  table.bp tr.bp-grupo td.num { border-bottom: 2px solid #8aa8bd; }
  table.bp tr.bp-item td { color: #4a5a68; }
  table.bp tr.bp-item td:nth-child(2) { padding-left: 4px; }
  table.bp td.bp-cod { color: #94a7b6; font-size: 12px; white-space: nowrap; width: 54px; }
  table.bp tr.bp-total td { font-weight: 700; padding: 8px 10px; background: #eef3f8;
    border-top: 2px solid var(--azul-tabela); border-bottom: 2px solid var(--azul-tabela); }
  table.bp tr.bp-conf td { padding-top: 10px; color: #778; font-size: 12.5px; }
  table.bp tr.bp-item:hover td { background: #f6f9fb; }
  table.bp th.col-destaque { background: #24506a; }
  table.bp td:last-child { background: #f4f7fa; }
  /* descrição numa linha só e colunas de ano com largura confortável */
  table.bp td:nth-child(2), table.bp tr.bp-grupo td:first-child,
  table.bp tr.bp-total td:first-child { white-space: nowrap; min-width: 300px; }
  table.bp th.num, table.bp td.num { min-width: 128px; }
  table.bp thead th:first-child { width: 54px; }
  .positivo { color: #2e7d4f; } .negativo { color: #b3423a; }
  .selo { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 600; }
  .selo-ok { background: #e2f3e8; color: #2e7d4f; } .selo-alerta { background: #fbe4e2; color: #b3423a; }
  .aviso { background: #fff8e6; border: 1px solid #f0dca8; border-radius: 4px; padding: 10px 14px;
           font-size: 12.5px; color: #765; }

  /* ---------- gráficos ---------- */
  .viz { margin: 4px 0 14px; }
  .viz svg { width: 100%; height: auto; display: block; }
  .viz-legenda { display: flex; gap: 16px; font-size: 12px; color: #52514e; margin-bottom: 6px; }
  .viz-legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .viz-legenda i { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .dica-viz { position: fixed; z-index: 50; display: none; pointer-events: none;
    background: #223; color: #fff; padding: 7px 10px; border-radius: 4px;
    font-size: 12px; line-height: 1.5; box-shadow: 0 3px 10px rgba(0,0,0,.25); max-width: 280px; }

  /* navegação agrupada */
  .nav-grupo { display: flex; align-items: center; gap: 6px; }
  .nav-grupo > b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .6px;
    color: #9fb0bd; font-weight: 700; margin-right: 2px; }
  .nav-sep { width: 1px; align-self: stretch; background: #d7dfe6; margin: 2px 6px; }

  /* explicação recolhível */
  details.porque { margin: -2px 0 12px; }
  details.porque > summary { cursor: pointer; font-size: 12px; color: #6a8599; list-style: none;
    display: inline-flex; align-items: center; gap: 5px; user-select: none; }
  details.porque > summary::-webkit-details-marker { display: none; }
  details.porque > summary::before { content: "▸"; font-size: 10px; }
  details.porque[open] > summary::before { content: "▾"; }
  details.porque > summary:hover { color: var(--azul-escuro); }
  details.porque .desc { margin: 7px 0 0; }

  /* ---------- simulação ---------- */
  .sim-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 10px 26px; margin: 10px 0 14px; }
  .sim-linha { display: grid; grid-template-columns: 190px 1fr 74px; align-items: center; gap: 10px; }
  .sim-linha label { font-size: 13px; color: #4a5a68; }
  .sim-linha input[type=range] { width: 100%; accent-color: #2a78d6; cursor: pointer; }
  .sim-linha output { font-size: 13px; font-weight: 700; text-align: right;
    font-variant-numeric: tabular-nums; color: #52514e; }  .in-meta { width: 62px; padding: 3px 6px; border: 1px solid #c9d6e2; border-radius: 3px;
    font-family: inherit; font-size: 12.5px; text-align: right; color: #345; }
  .in-meta:focus { outline: 2px solid var(--azul-claro); outline-offset: 1px; }
  .carregando { padding: 40px; text-align: center; color: #8198ab; }

  /* ---------- relatório impresso ---------- */
  #impressao { display: none; }
  .imp-cabecalho { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--azul-tabela);
    padding-bottom: 6px; margin-bottom: 10px; }
  .imp-cabecalho h2 { margin: 0; font-size: 15px; color: var(--azul-escuro); flex: 1; }
  .imp-cabecalho .ent { font-size: 11px; color: #778; }
  .imp-rodape { margin-top: 8px; font-size: 10px; color: #99a; }

  @media print {
    details.porque > summary { display: none; }
    details.porque .desc { display: block !important; }
    @page { size: A4 landscape; margin: 9mm 8mm; }
    body { background: #fff; font-size: 10px; }
    header, .navegacao, #conteudo, #painel-impressao { display: none !important; }
    #impressao { display: block !important; }
    .bloco-imp { break-inside: avoid-page; break-after: page; }
    .bloco-imp:last-child { break-after: auto; }
    .painel { border: none; border-radius: 0; padding: 0; margin: 0; }
    .painel h2 { font-size: 13px; }
    .desc { font-size: 9.5px; }
    table { font-size: 9px; }
    thead th { position: static; padding: 4px 6px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    tbody td, table.bp tbody td { padding: 2px 6px; }
    table.bp td:nth-child(2) { min-width: 0; }
    table.bp th.num, table.bp td.num { min-width: 0; }
    .rolagem { overflow: visible; }
    .cartoes { display: grid !important; }
    .cartao { border: 1px solid #ccd; }
    .cartao .valor { font-size: 15px; }
    tr.bp-total td, tr.grupo td, tr.total td, .selo, .positivo, .negativo,
    table.bp th.col-destaque, table.bp td:last-child {
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
/* =====================================================================
   ANÁLISE FINANCEIRA — APRESENTAÇÃO
   Página irmã do painel: lê a mesma ../dados.xlsx e monta os blocos da
   apresentação mensal (Balanço, DRE, Capital Operativo, Disponível,
   Imobilizado, Prestação de Serviço, Pessoal e Despesas), cada um com a
   série dos anos que a extração traz.
   ===================================================================== */

/* ---------- formatação ---------- */
const fmt = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
const fmtP = new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const n = v => (v == null || !isFinite(v)) ? "—" : fmt.format(Math.round(v));
const pct = v => (v == null || !isFinite(v)) ? "—" : fmtP.format(v * 100) + "%";
const sinal = v => v < 0 ? "negativo" : "positivo";
const NOMES_MESES = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];

/* ---------- De/Para do Balanço (aba "Contas BP" dos parâmetros) ---------- */
const MAPA_BP = [
  ["1112001","ATIVO CIRCULANTE",1,"Disponível",1],
  ["1113001","ATIVO CIRCULANTE",1,"Disponível",1],
  ["1131000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1132000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1135000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1136000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1137000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1138500","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1139000","ATIVO CIRCULANTE",1,"Contas a Receber",2],
  ["1160000","ATIVO CIRCULANTE",1,"Despesas Antecipadas",3],
  ["1211000","ATIVO NÃO CIRCULANTE",2,"Realizável a Longo Prazo",4],
  ["1215000","ATIVO NÃO CIRCULANTE",2,"Realizável a Longo Prazo",4],
  ["1216000","ATIVO NÃO CIRCULANTE",2,"Realizável a Longo Prazo",4],
  ["1219000","ATIVO NÃO CIRCULANTE",2,"Realizável a Longo Prazo",4],
  ["1230000","ATIVO NÃO CIRCULANTE",2,"Imobilizado",5],
  ["1240000","ATIVO NÃO CIRCULANTE",2,"Imobilizado",5],
  ["2130100","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2130300","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2130500","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2130600","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2130800","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2131000","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2135000","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2136000","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2137000","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2139000","PASSIVO CIRCULANTE",3,"Contas a Pagar",6],
  ["2141000","PASSIVO CIRCULANTE",3,"Provisões",7],
  ["2142000","PASSIVO CIRCULANTE",3,"Provisões",7],
  ["2143000","PASSIVO CIRCULANTE",3,"Provisões",7],
  ["2150000","PASSIVO CIRCULANTE",3,"Fundos em Confiança",8],
  ["2311000","PATRIMÔNIO LÍQUIDO",4,"Patrimônio Social",9],
  ["2320000","PATRIMÔNIO LÍQUIDO",4,"Patrimônio Social",9],
];
/* Estrutura oficial do balanço denominacional (códigos A1xx/A2xx), ligada ao
   nosso plano de contas por PREFIXO. A casa mais específica ganha: "1113"
   (aplicações) tem de ser testada antes de "111" (caixa e bancos). */
const ESTRUTURA_BP = [
  { secao: "ATIVO", grupos: [
    { titulo: "ATIVO CIRCULANTE", itens: [
      ["A111", "Caixa e Equivalentes de Caixa", ["1111", "1112"]],
      ["A112", "Aplicações Financeiras", ["1113"]],
      ["A113", "Contas a Receber", ["113"]],
      ["A114", "Estoques", ["114"]],
      ["A116", "Despesas Antecipadas", ["116"]],
      ["", "Outras Contas do Circulante", ["115", "117", "118", "119", "110"]],
    ]},
    { titulo: "ATIVO NÃO CIRCULANTE", itens: [
      ["A121", "Realizável a Longo Prazo", ["121"]],
      ["A131", "Investimentos", ["122"]],
      ["A132", "Imobilizado", ["123"]],
      ["A133", "Intangível", ["124"]],
      ["", "Outras Contas do Não Circulante", ["125", "126", "127", "128", "129", "120"]],
    ]},
  ]},
  { secao: "PASSIVO", grupos: [
    { titulo: "PASSIVO CIRCULANTE", itens: [
      ["A213", "Contas a Pagar", ["213"]],
      ["A214", "Passivos por Competência e Outros", ["214"]],
      ["A215", "Fundos em Confiança", ["215"]],
      ["A216", "Adiantamentos Recebidos", ["216"]],
      ["", "Outras Contas do Circulante", ["210", "211", "212", "217", "218", "219"]],
    ]},
    { titulo: "PASSIVO NÃO CIRCULANTE", itens: [
      ["A221", "Exigível a Longo Prazo", ["22"]],
    ]},
  ]},
];
/* prefixo -> item, do mais longo para o mais curto */
const ITENS_BP = (() => {
  const lista = [];
  for (const s of ESTRUTURA_BP)
    for (const g of s.grupos)
      for (const [cod, nome, prefixos] of g.itens)
        for (const p of prefixos) lista.push({ p, cod, nome, grupo: g.titulo, secao: s.secao });
  return lista.sort((a, b) => b.p.length - a.p.length);
})();
const ehPL = conta => conta.startsWith("23");
function itemBP(conta) {
  for (const i of ITENS_BP) if (conta.startsWith(i.p)) return i;
  return conta[0] === "1"
    ? { cod: "", nome: "Outras Contas do Ativo", grupo: "ATIVO NÃO CIRCULANTE", secao: "ATIVO" }
    : { cod: "", nome: "Outras Contas do Passivo", grupo: "PASSIVO CIRCULANTE", secao: "PASSIVO" };
}

const GRUPOS_BP = MAPA_BP
  .map(([c, grupo, og, sub, os]) => ({ prefixo: c.replace(/0+$/, ""), grupo, og, sub, os }))
  .sort((a, b) => b.prefixo.length - a.prefixo.length);
function classificaBP(conta) {
  for (const g of GRUPOS_BP) if (conta.startsWith(g.prefixo)) return g;
  if (conta[0] === "1") return { grupo: "ATIVO", og: 1, sub: "Outras Contas do Ativo", os: 90 };
  return { grupo: "PASSIVO", og: 3, sub: "Outras Contas do Passivo", os: 91 };
}

/* ---------- escola/serviço a partir do departamento ---------- */
const ESCOLAS = { "3310":"Sede","3311":"CAL","3312":"CAM","3313":"EAM",
                  "3314":"EAC","3315":"EAA","3316":"CALGP","3317":"CAME" };
/* A escola sai do CÓDIGO do departamento, não do nome: a contabilidade chama
   de "CAM" e o APS de "CAM-Z4", e os dois precisam cair na mesma linha. */
function partesDepto(cod, nome) {
  let p = String(nome || "").split(" - ").map(s => s.trim()).filter(Boolean);
  if (p.length && /^\d+$/.test(p[0])) p = p.slice(1);
  const porCodigo = ESCOLAS[String(cod).slice(0, 4)];
  const servico = p.length >= 2 ? p.slice(1).join(" - ") : (p[0] || String(cod));
  if (porCodigo) return { escola: porCodigo, servico };
  return { escola: p.length >= 2 ? p[0] : "Outros", servico };
}

/* ---------- estado ---------- */
let dados = [];        // linhas brutas da aba Dados
let regrasDRE = [];    // De/Para da DRE
let linhasDRE = [];    // linhas já com sinal da DRE aplicado
let pessoal = [];      // movimentação de funcionários e rescisões (já agregada)
let anos = [];
let ehAnalitica = () => true;
let mesFimAno = {};    // ano -> último mês com movimento
let anoRef = 0;        // ano de referência da apresentação
let mesRef = 12;       // posição: o mês em que o balanço é tirado
let escolaRef = null;  // escola em foco; null = o campo inteiro
/* Vale para TODOS os blocos, menos os dois "por Unidade" — esses existem
   justamente para comparar as escolas entre si, e filtrá-los deixaria uma
   coluna só. Neles, clicar numa escola é o que LIGA este filtro. */
const naEscola = (dep, depNome) =>
  !escolaRef || (dep && partesDepto(dep, depNome).escola === escolaRef);
/* Mês de corte de cada ano: o ano de referência vai até o mês escolhido,
   os anteriores vão fechados em dezembro. */
const mesDoAno = a => a === anoRef ? mesRef : 12;
const anosAteRef = () => anos.filter(a => a <= anoRef);

/* ---------- leitura ---------- */
const limpa = v => String(v ?? "").trim().replace(/\.0$/, "");

async function carregar() {
  const resp = await fetch("../dados.xlsx", { cache: "no-store" });
  if (!resp.ok) throw new Error("não encontrei a planilha ../dados.xlsx");
  const wb = XLSX.read(await resp.arrayBuffer(), { type: "array" });

  let abaDados = null, abaDRE = null, abaMeta = null, abaPessoal = null;
  for (const nome of wb.SheetNames) {
    const json = XLSX.utils.sheet_to_json(wb.Sheets[nome], { defval: null });
    if (!json.length) continue;
    const cols = Object.keys(json[0]).map(k => k.trim().toLowerCase());
    if (!abaPessoal && cols.includes("tipo") && cols.includes("quantidade")) abaPessoal = json;
    else if (!abaMeta && cols.includes("chave") && cols.includes("valor")) abaMeta = json;
    else if (!abaDRE && cols.includes("sinal") && cols.includes("conta")) abaDRE = json;
    else if (!abaDados && cols.includes("ano") && cols.includes("conta")) abaDados = json;
  }
  if (!abaDados) throw new Error("a aba de dados não foi encontrada na planilha");

  const val = (l, nome) => {
    const par = Object.entries(l).find(([k]) => k.trim().toLowerCase() === nome.toLowerCase());
    return par ? par[1] : null;
  };
  const chaves = Object.keys(abaDados[0]);
  const acha = nome => chaves.find(k => k.trim().toLowerCase() === nome.toLowerCase());
  const cMes = acha("Mês") || acha("Mes");
  const cDep = acha("Departamento"), cDepNome = acha("Nome_Depto");

  dados = abaDados.map(l => ({
    Ano: +l[acha("Ano")],
    Mes: l[cMes] == null ? null : +l[cMes],
    Entidade: limpa(l[acha("Entidade")]),
    Conta: limpa(l[acha("Conta")]),
    NomeConta: String(l[acha("Nome_Conta")] ?? "").trim(),
    Subconta: String(l[acha("Subconta")] ?? "").trim(),
    Dep: cDep ? limpa(l[cDep]) : "",
    DepNome: cDepNome ? String(l[cDepNome] ?? "").trim() : "",
    Legal: +l[acha("Saldo_Legal")] || 0,
    Ajust: +l[acha("Saldo_Ajustado")] || 0,
  })).filter(d => d.Ano && d.Mes != null && isFinite(d.Mes));

  if (abaDRE) {
    regrasDRE = abaDRE
      .filter(l => val(l, "sinal") != null && val(l, "conta") != null)
      .map(l => ({
        sinal: String(val(l, "sinal")).trim(),
        conta: limpa(val(l, "conta")),
        dre2: String(val(l, "dre 2") ?? "").trim(),
        dre3: String(val(l, "dre 3") ?? "").trim(),
      }));
  }
  if (abaPessoal) {
    pessoal = abaPessoal.map(l => ({
      tipo: String(val(l, "tipo") ?? "").trim(),
      ano: +val(l, "ano") || 0,
      mes: +val(l, "mes") || 0,
      dep: limpa(val(l, "departamento")),
      depNome: String(val(l, "nome_depto") ?? "").trim(),
      qtd: +val(l, "quantidade") || 0,
      valor: +val(l, "valor") || 0,
    })).filter(p => p.tipo);
  }
  if (abaMeta) {
    const linha = abaMeta.find(l => String(val(l, "chave") ?? "").trim().toLowerCase() === "atualizado");
    if (linha) document.getElementById("carimbo").textContent =
      "Atualizado em " + String(val(linha, "valor") ?? "").trim();
  }
  preparar();
}

function preparar() {
  anos = [...new Set(dados.map(d => d.Ano))].sort((a, b) => a - b);

  // contas sintéticas (que já somam as filhas) ficam de fora dos totais
  const codigos = [...new Set(dados.map(d => d.Conta))];
  const sinteticas = new Set();
  for (const c of codigos) {
    if (!/00$/.test(c)) continue;
    const tronco = c.replace(/0+$/, "");
    if (!tronco) continue;
    for (const o of codigos) if (o !== c && o.startsWith(tronco)) { sinteticas.add(c); break; }
  }
  ehAnalitica = c => !sinteticas.has(c);

  // último mês com movimento de resultado em cada ano
  for (const a of anos) mesFimAno[a] = 0;
  for (const d of dados) {
    if (d.Subconta || d.Mes < 1) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    if ((d.Conta[0] === "3" || d.Conta[0] === "4") && d.Mes > mesFimAno[d.Ano]) mesFimAno[d.Ano] = d.Mes;
  }

  // Posição inicial: o último mês que parece FECHADO. O mês corrente costuma
  // ter despesa lançada e receita ainda não — abri-lo por padrão mostraria um
  // resultado pior do que a realidade.
  anoRef = anos[anos.length - 1] || new Date().getFullYear();

  // linhas da DRE com o sinal aplicado (mesma regra do painel)
  const porConta = {};
  for (const r of regrasDRE) (porConta[r.conta] = porConta[r.conta] || []).push(r);
  linhasDRE = [];
  for (const d of dados) {
    if (d.Subconta || !d.Mes) continue;
    const regras = porConta[d.Conta];
    if (!regras) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    for (const r of regras)
      linhasDRE.push({ Ano: d.Ano, Mes: d.Mes, conta: d.Conta, nome: d.NomeConta,
                       dep: d.Dep, depNome: d.DepNome, dre2: r.dre2, dre3: r.dre3,
                       saldo: (r.sinal === "+" ? base : -base) * -1 });
  }
}

/* ---------- cálculos ---------- */
/* Nomes dos blocos da DRE, iguais aos do De/Para (aba "Contas DRE"). */
const DRE3 = {
  prest: "Prestação de Serviços",
  dizimo: "Dízimo Líquidos de Repasses",
  pessoal: "Despesas Com Pessoal",
  adm: "Administrativas e Gerais",
  educ: "Educação, Assistência E Orientação Social",
  subv: "Subvenções Recebidas",
};
const BLOCOS_RECEITA = new Set([DRE3.prest, DRE3.dizimo, DRE3.subv,
  "Outras Receitas Recorrentes", "Doações E Contribuições Recebidas"]);

/* Saldo de balanço por conta analítica, acumulado da abertura até mesFim. */
function balanco(ano, mesFim) {
  const contas = new Map();
  let ativo = 0, passPL = 0;
  for (const d of dados) {
    if (d.Subconta) continue;
    const g = d.Conta[0];
    if (g !== "1" && g !== "2") continue;
    if (d.Ano !== ano || d.Mes > mesFim) continue;
    if (!ehAnalitica(d.Conta)) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    const cls = classificaBP(d.Conta);
    const ehAtivo = cls.grupo.startsWith("ATIVO");
    const valor = ehAtivo ? base : -base;
    const reg = contas.get(d.Conta) || { conta: d.Conta, nome: d.NomeConta, ...cls, total: 0 };
    reg.total += valor;
    if (!reg.nome && d.NomeConta) reg.nome = d.NomeConta;
    contas.set(d.Conta, reg);
    if (ehAtivo) ativo += valor; else passPL += valor;
  }
  return { contas: [...contas.values()], ativo, passPL };
}

/* Resultado da DRE do ano (jan..mesFim), por bloco. */
function dreAno(ano, mesFim = 12, filtro = null) {
  const porBloco = new Map();
  let total = 0, receita = 0, despesa = 0;
  for (const l of linhasDRE) {
    if (l.Ano !== ano || l.Mes > mesFim) continue;
    if (!naEscola(l.dep, l.depNome)) continue;
    if (filtro && !filtro(l)) continue;
    total += l.saldo;
    const ehRec = BLOCOS_RECEITA.has(l.dre3);
    if (ehRec) receita += l.saldo; else despesa -= l.saldo;
    const k = l.dre3 || l.dre2 || "Outros";
    porBloco.set(k, (porBloco.get(k) || 0) + l.saldo);
  }
  return { total, receita, despesa, porBloco };
}

/* DRE numa JANELA de 12 meses terminando em (anoFim, mesFim) — é o que o
   modelo pede em "despesas essenciais (12 meses)". Num ano incompleto, pega
   o resto do ano anterior para fechar os 12. */
function dreJanela12(anoFim, mesFim) {
  const porBloco = new Map();
  let total = 0, receita = 0, despesa = 0;
  for (const l of linhasDRE) {
    const dentro = (l.Ano === anoFim && l.Mes <= mesFim) ||
                   (l.Ano === anoFim - 1 && l.Mes > mesFim);
    if (!dentro || !naEscola(l.dep, l.depNome)) continue;
    total += l.saldo;
    if (BLOCOS_RECEITA.has(l.dre3)) receita += l.saldo; else despesa -= l.saldo;
    const k = l.dre3 || l.dre2 || "Outros";
    porBloco.set(k, (porBloco.get(k) || 0) + l.saldo);
  }
  return { total, receita, despesa, porBloco };
}

/* Despesa das contas ANALÍTICAS de classe 4, numa janela de 12 meses. */
function despesasAnaliticas12(anoFim, mesFim) {
  const mapa = new Map();
  for (const d of dados) {
    if (d.Subconta || d.Conta[0] !== "4" || !ehAnalitica(d.Conta)) continue;
    if (d.Mes < 1 || !naEscola(d.Dep, d.DepNome)) continue;
    const dentro = (d.Ano === anoFim && d.Mes <= mesFim) ||
                   (d.Ano === anoFim - 1 && d.Mes > mesFim);
    if (!dentro) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    const reg = mapa.get(d.Conta) || { nome: d.NomeConta, total: 0 };
    reg.total += base;
    if (!reg.nome && d.NomeConta) reg.nome = d.NomeConta;
    mapa.set(d.Conta, reg);
  }
  return mapa;
}

/* Último mês do ano cuja receita de serviços já parece lançada por inteiro.
   O mês corrente costuma ter despesa lançada e receita ainda não — incluí-lo
   na comparação ano a ano inventa uma queda que não existe. */
function mesComparavel(ano) {
  const porMes = [];
  for (let m = 1; m <= 12; m++) {
    let s = 0;
    for (const l of linhasDRE)
      if (l.Ano === ano && l.Mes === m && l.dre3 === "Prestação de Serviços"
          && naEscola(l.dep, l.depNome)) s += l.saldo;
    if (s) porMes.push([m, s]);
  }
  if (!porMes.length) return 12;
  const ord = porMes.map(([, s]) => s).sort((a, b) => a - b);
  const mediana = ord[Math.floor(ord.length / 2)];
  let ultimo = 0;
  for (const [m, s] of porMes) if (s >= mediana * 0.5) ultimo = Math.max(ultimo, m);
  return ultimo || 12;
}

/* Série de um bloco da DRE por ano, sempre na MESMA janela de meses. Só
   assim a comparação ano a ano é honesta enquanto o ano corrente não fecha:
   comparar 12 meses de 2025 com 10 meses de 2026 inventa uma queda. */
function serieBloco(bloco, mesLimite) {
  const lista = anosAteRef();
  const s = lista.map(() => 0);
  for (const l of linhasDRE) {
    if (l.Mes > mesLimite || l.dre3 !== bloco) continue;
    if (!naEscola(l.dep, l.depNome)) continue;
    const i = lista.indexOf(l.Ano);
    if (i >= 0) s[i] += l.saldo;
  }
  return s;
}

/* Linhas de crescimento comparável, para reaproveitar nos blocos. */
function linhasCrescimento(rotulo, serieComp, mesLimite, inverter) {
  const v = inverter ? serieComp.map(x => -x) : serieComp;
  const jan = `Jan–${NOMES_MESES[mesLimite - 1]}`;
  let h = `<tr class="sub"><td>${rotulo} — mesmo período (${jan})</td>` +
    v.map(x => `<td class="num">${n(x)}</td>`).join("") + `</tr>`;
  h += `<tr><td>Crescimento sobre o ano anterior (${jan})</td>` + v.map((x, i) =>
    `<td class="num ${i === 0 ? "" : sinal(x - v[i - 1])}">${i === 0 ? "—" : pct(v[i - 1] ? x / v[i - 1] - 1 : null)}</td>`).join("") + `</tr>`;
  const prim = v[0], ult = v[v.length - 1];
  h += `<tr class="total"><td>Crescimento de ${anosAteRef()[0]} a ${anoRef} (${jan})</td>` +
    v.map((_, i) => i === v.length - 1
      ? `<td class="num ${sinal(ult - prim)}">${pct(prim ? ult / prim - 1 : null)}</td>` : `<td></td>`).join("") + `</tr>`;
  return h;
}

/* Soma de contas do razão (não-DRE) por prefixo, no ano. */
function somaContas(ano, mesFim, teste, acumulado) {
  let s = 0;
  for (const d of dados) {
    if (d.Subconta || d.Ano !== ano) continue;
    if (!naEscola(d.Dep, d.DepNome)) continue;
    if (!ehAnalitica(d.Conta)) continue;
    if (!acumulado && d.Mes < 1) continue;
    if (d.Mes > mesFim) continue;
    if (!teste(d.Conta, d.NomeConta)) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    s += base;
  }
  return s;
}

/* =====================================================================
   GRÁFICOS
   Paleta validada com o script do guia de visualização:
     azul #2a78d6 ↔ vermelho #d03b3b  — polaridade (passa CVD, ΔE 23,8)
     azul #2a78d6 + laranja #eb6834   — duas séries (passa CVD, ΔE 24,7)
   Verde/vermelho foi descartado de propósito: reprova em deuteranopia
   (ΔE 4,1), ou seja, quem tem daltonismo não distingue lucro de prejuízo.
   O sinal também é dado pela direção da barra, nunca só pela cor.
   ===================================================================== */
const VIZ = {
  serie: "#2a78d6", serie2: "#eb6834", neg: "#d03b3b",
  grade: "#e1e0d9", eixo: "#c3c2b7", tinta: "#898781",
};

/* ---------- dica flutuante ---------- */
let dicaEl = null;
function ligarDicas(raiz) {
  if (!dicaEl) {
    dicaEl = document.createElement("div");
    dicaEl.className = "dica-viz";
    document.body.appendChild(dicaEl);
  }
  raiz.querySelectorAll("[data-dica]").forEach(alvo => {
    alvo.addEventListener("mouseenter", e => {
      dicaEl.innerHTML = alvo.getAttribute("data-dica");
      dicaEl.style.display = "block";
      mover(e);
    });
    alvo.addEventListener("mousemove", mover);
    alvo.addEventListener("mouseleave", () => { dicaEl.style.display = "none"; });
  });
  function mover(e) {
    const m = 14, l = dicaEl.offsetWidth, a = dicaEl.offsetHeight;
    let x = e.clientX + m, y = e.clientY + m;
    if (x + l > innerWidth - 8) x = e.clientX - l - m;
    if (y + a > innerHeight - 8) y = e.clientY - a - m;
    dicaEl.style.left = x + "px"; dicaEl.style.top = y + "px";
  }
}

/* escala "bonita" para os passos da grade */
function passoBonito(bruto) {
  const exp = Math.pow(10, Math.floor(Math.log10(Math.abs(bruto) || 1)));
  const norm = bruto / exp;
  return (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * exp;
}

/* Barras verticais. series = [{nome, cor, valores:[]}].
   Série única não leva legenda — o título já diz o que é. */
function grafBarras({ rotulos, series, altura = 200, fmt = n, porSinal = false,
                      referencia = null, rotuloRef = "" }) {
  const L = 760, A = altura, esq = 8, dir = 8, topo = 18, base = A - 30;
  const todos = series.flatMap(s => s.valores).concat(referencia == null ? [] : [referencia]);
  let max = Math.max(0, ...todos), min = Math.min(0, ...todos);
  const passo = passoBonito((max - min) / 4 || 1);
  max = Math.ceil(max / passo) * passo; min = Math.floor(min / passo) * passo;
  const y = v => base - (v - min) / ((max - min) || 1) * (base - topo);

  let svg = "";
  for (let v = min; v <= max + 1e-6; v += passo) {
    const yy = y(v);
    svg += `<line x1="${esq}" y1="${yy}" x2="${L - dir}" y2="${yy}" stroke="${v === 0 ? VIZ.eixo : VIZ.grade}" stroke-width="1"/>`;
    svg += `<text x="${esq}" y="${yy - 3}" font-size="9.5" fill="${VIZ.tinta}">${fmt(v)}</text>`;
  }

  const nG = rotulos.length, largG = (L - esq - dir) / nG;
  const nS = series.length;
  const largB = Math.min(54, (largG * 0.62) / nS);
  const vao = 2;   // respiro de 2px entre barras vizinhas, como manda o guia

  rotulos.forEach((rot, i) => {
    const centro = esq + largG * (i + 0.5);
    const total = nS * largB + (nS - 1) * vao;
    series.forEach((s, j) => {
      const v = s.valores[i] || 0;
      const x = centro - total / 2 + j * (largB + vao);
      const cor = porSinal ? (v < 0 ? VIZ.neg : VIZ.serie) : (s.cor || VIZ.serie);
      const yTopo = y(Math.max(v, 0)), alt = Math.max(1.5, Math.abs(y(v) - y(0)));
      // ponta arredondada só do lado do valor, ancorada na linha do zero
      const r = Math.min(4, alt);
      const d = v >= 0
        ? `M${x},${yTopo + alt} v${-(alt - r)} q0,${-r} ${r},${-r} h${largB - 2 * r} q${r},0 ${r},${r} v${alt - r} z`
        : `M${x},${yTopo} v${alt - r} q0,${r} ${r},${r} h${largB - 2 * r} q${r},0 ${r},${-r} v${-(alt - r)} z`;
      svg += `<path d="${d}" fill="${cor}"/>`;
    });
    svg += `<text x="${centro}" y="${base + 15}" text-anchor="middle" font-size="11" fill="${VIZ.tinta}">${rot}</text>`;
    const dica = `<b>${rot}</b>` + series.map(s =>
      `<br>${nS > 1 ? s.nome + ": " : ""}${fmt(s.valores[i] || 0)}`).join("");
    svg += `<rect x="${esq + largG * i}" y="${topo}" width="${largG}" height="${base - topo}" fill="#000" fill-opacity="0" data-dica="${dica}"/>`;
  });

  if (referencia != null) {
    const yy = y(referencia);
    svg += `<line x1="${esq}" y1="${yy}" x2="${L - dir}" y2="${yy}" stroke="${VIZ.serie2}" stroke-width="2" stroke-dasharray="6 4"/>`;
    svg += `<text x="${L - dir}" y="${yy - 4}" text-anchor="end" font-size="10" font-weight="600" fill="${VIZ.serie2}">${rotuloRef} ${fmt(referencia)}</text>`;
  }

  const legenda = nS > 1 ? `<div class="viz-legenda">` + series.map(s =>
    `<span><i style="background:${s.cor}"></i>${s.nome}</span>`).join("") + `</div>` : "";
  return `<div class="viz">${legenda}<svg viewBox="0 0 ${L} ${A}" xmlns="http://www.w3.org/2000/svg">${svg}</svg></div>`;
}

/* Barras horizontais — bom para ranking por unidade, nome inteiro à esquerda. */
function grafBarrasH({ rotulos, valores, fmt = n, porSinal = true, altura = null, filtravel = false }) {
  const L = 760, linhaH = 26, rotuloW = 96, dir = 86;
  const A = altura || (rotulos.length * linhaH + 14);
  const max = Math.max(0, ...valores), min = Math.min(0, ...valores);
  const span = (max - min) || 1;
  const x0 = rotuloW, x1 = L - dir;
  const x = v => x0 + (v - min) / span * (x1 - x0);
  const zero = x(0);

  let svg = `<line x1="${zero}" y1="2" x2="${zero}" y2="${A - 8}" stroke="${VIZ.eixo}" stroke-width="1"/>`;
  rotulos.forEach((rot, i) => {
    const v = valores[i] || 0, cy = 8 + i * linhaH, h = 14;
    const cor = porSinal ? (v < 0 ? VIZ.neg : VIZ.serie) : VIZ.serie;
    const xa = Math.min(zero, x(v)), larg = Math.max(1.5, Math.abs(x(v) - zero));
    const r = Math.min(4, larg);
    const d = v >= 0
      ? `M${xa},${cy} h${larg - r} q${r},0 ${r},${r} v${h - 2 * r} q0,${r} ${-r},${r} h${-(larg - r)} z`
      : `M${xa + larg},${cy} h${-(larg - r)} q${-r},0 ${-r},${r} v${h - 2 * r} q0,${r} ${r},${r} h${larg - r} z`;
    svg += `<path d="${d}" fill="${cor}"/>`;
    svg += `<text x="${x0 - 8}" y="${cy + h / 2 + 4}" text-anchor="end" font-size="11.5" fill="#4a5a68">${rot}</text>`;
    // o valor vai SEMPRE à direita: posto à esquerda, o número da barra
    // negativa cai em cima do nome da unidade
    const xr = Math.max(zero, xa + larg) + 6;
    svg += `<text x="${xr}" y="${cy + h / 2 + 4}" text-anchor="start" font-size="11" font-weight="600" fill="${v < 0 ? VIZ.neg : "#2c5f7c"}">${fmt(v)}</text>`;
    const clique = filtravel ? ` data-filtra="${rot}"` : "";
    svg += `<rect x="0" y="${cy - 4}" width="${L}" height="${linhaH}" fill="#000" fill-opacity="0"${clique} data-dica="<b>${rot}</b><br>${fmt(v)}${filtravel ? "<br><i>clique para ver só esta escola</i>" : ""}"/>`;
  });
  return `<div class="viz"><svg viewBox="0 0 ${L} ${A}" xmlns="http://www.w3.org/2000/svg">${svg}</svg></div>`;
}

/* ---------- blocos da apresentação ---------- */
const BLOCOS = [];
const registra = (id, titulo, render) => BLOCOS.push({ id, titulo, render });

/* 1. BALANÇO ------------------------------------------------------- */
/* ---------- cortes: um ano inteiro, ou uma escola dentro do ano ---------- */
const cel = x => `<td class="num${x < 0 ? " negativo" : ""}">${x ? n(x) : "–"}</td>`;

/* Balanço de um corte. escola = null -> consolidado (a entidade inteira). */
function balancoCorte(ano, mes, escola) {
  const itens = new Map();
  let plAbertura = 0, plMovimento = 0, verbas = 0;
  for (const d of dados) {
    if (d.Subconta) continue;
    const g = d.Conta[0];
    if (g !== "1" && g !== "2") continue;
    if (d.Ano !== ano || d.Mes > mes) continue;
    if (!ehAnalitica(d.Conta)) continue;
    if (escola && (!d.Dep || partesDepto(d.Dep, d.DepNome).escola !== escola)) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    if (ehPL(d.Conta)) {
      if (d.Conta.startsWith("232")) verbas += -base;
      else if (d.Mes === 0) plAbertura += -base;
      else plMovimento += -base;
      continue;
    }
    const it = itemBP(d.Conta);
    const valor = it.secao === "ATIVO" ? base : -base;
    const k = [it.secao, it.grupo, it.cod, it.nome].join("|");
    itens.set(k, (itens.get(k) || 0) + valor);
  }
  const resultado = dreCorte(ano, mes, escola).total;
  return { itens, plAbertura, verbas, variacao: plMovimento + resultado,
           pl: plAbertura + plMovimento + resultado + verbas };
}

/* DRE de um corte. */
function dreCorte(ano, mes, escola) {
  const porBloco = new Map();
  let total = 0;
  for (const l of linhasDRE) {
    if (l.Ano !== ano || l.Mes > mes) continue;
    if (escola && (!l.dep || partesDepto(l.dep, l.depNome).escola !== escola)) continue;
    total += l.saldo;
    const k = l.dre3 || l.dre2 || "Outros";
    porBloco.set(k, (porBloco.get(k) || 0) + l.saldo);
  }
  return { total, porBloco };
}

function cabecalho(colunas) {
  return `<div class="rolagem"><table class="bp"><thead><tr><th></th><th></th>` +
    colunas.map(c => `<th class="num${c.destaque ? " col-destaque" : ""}">${c.rotulo}` +
      (c.sub ? `<br><span style="font-weight:400;font-size:11px">${c.sub}</span>` : "") + `</th>`).join("") +
    `</tr></thead><tbody>`;
}

/* Colunas das unidades: uma por escola, mais o consolidado. */
function colunasUnidades() {
  const ano = anoRef, mes = mesRef;
  // ordem do plano de contas (Sede, CAL, CAM, ...), como no modelo; o que não
  // está no mapa de escolas vai para o fim
  const ordem = Object.entries(ESCOLAS).sort((a, b) => a[0].localeCompare(b[0])).map(x => x[1]);
  const escolas = new Set();
  for (const d of dados) if (d.Dep) escolas.add(partesDepto(d.Dep, d.DepNome).escola);
  const cols = [...escolas]
    .sort((a, b) => {
      const ia = ordem.indexOf(a), ib = ordem.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b, "pt-BR");
    })
    .map(e => ({ rotulo: e, sub: "", ano, mes, escola: e }));
  cols.push({ rotulo: "CONSOLIDADO", sub: NOMES_MESES[mes - 1] + "/" + ano,
              ano, mes, escola: null, destaque: true });
  return cols;
}

/* Tira as unidades sem nenhum número na tabela — ADRA, Escritório e afins
   só poluiriam a largura. O consolidado nunca sai. */
function semColunasVazias(colunas, porCol, temDado) {
  const manter = colunas.map((c, i) => !c.escola || temDado(porCol[i]));
  return {
    colunas: colunas.filter((_, i) => manter[i]),
    porCol: porCol.filter((_, i) => manter[i]),
  };
}

function colunasAnos() {
  // só até o ano de referência: numa posição de 2025 não existe coluna de 2026
  return anos.filter(a => a <= anoRef).map(a => {
    const mes = mesDoAno(a);
    return { rotulo: String(a), sub: mes < 12 ? "até " + NOMES_MESES[mes - 1] : "", ano: a, mes, escola: null };
  });
}

/* ---------- BALANÇO: a mesma tabela para os dois cortes ---------- */
function tabelaBalanco(colunas, porCol) {
  const soma = (filtro, i) => {
    let s = 0;
    for (const [k, val] of porCol[i].itens) if (filtro(k.split("|"))) s += val;
    return s;
  };
  let html = cabecalho(colunas);
  for (const s of ESTRUTURA_BP) {
    html += `<tr class="bp-secao"><td colspan="${colunas.length + 2}">${s.secao}</td></tr>`;
    for (const g of s.grupos) {
      html += `<tr class="bp-grupo"><td colspan="2">${g.titulo}</td>` +
        colunas.map((_, i) => cel(soma(pt => pt[0] === s.secao && pt[1] === g.titulo, i))).join("") + `</tr>`;
      for (const [cod, nome] of g.itens) {
        const k = [s.secao, g.titulo, cod, nome].join("|");
        const vals = colunas.map((_, i) => porCol[i].itens.get(k) || 0);
        if (!cod && !vals.some(x => x)) continue;   // linha de sobra só aparece se tiver saldo
        html += `<tr class="bp-item"><td class="bp-cod">${cod}</td><td>${nome}</td>` +
          vals.map(cel).join("") + `</tr>`;
      }
    }
    if (s.secao === "ATIVO")
      html += `<tr class="bp-total"><td colspan="2">TOTAL DO ATIVO</td>` +
        colunas.map((_, i) => cel(soma(pt => pt[0] === "ATIVO", i))).join("") + `</tr>`;
  }
  html += `<tr class="bp-grupo"><td colspan="2">PATRIMÔNIO LÍQUIDO</td>` +
    porCol.map(a => cel(a.pl)).join("") + `</tr>`;
  html += `<tr class="bp-item"><td></td><td><b>PATRIMÔNIO SOCIAL</b></td>` +
    colunas.map(() => `<td></td>`).join("") + `</tr>`;
  html += `<tr class="bp-item"><td class="bp-cod">A231</td><td>Saldo Inicial 01/01</td>` +
    porCol.map(a => cel(a.plAbertura)).join("") + `</tr>`;
  for (const rot of ["Constit. e Reversão de Verbas Disponíveis", "Correção Monetária do Patrimônio",
                     "Transf. Patrimonial — Entidades Internas", "Patrimônio de Cisão — Entidades Congêneres",
                     "Doações e Subvenções para o Imobilizado", "Capital Integralizado / a Integralizar no Período",
                     "Ajuste de Avaliação Patrimonial", "Ajuste de Exercícios Anteriores"])
    html += `<tr class="bp-item"><td></td><td>${rot}</td>` +
      colunas.map(() => `<td class="num">–</td>`).join("") + `</tr>`;
  html += `<tr class="bp-item"><td></td><td><b>Variação Patrimonial</b></td>` +
    porCol.map(a => cel(a.variacao)).join("") + `</tr>`;
  html += `<tr class="bp-item"><td class="bp-cod">A232</td><td>Verbas Disponíveis</td>` +
    porCol.map(a => cel(a.verbas)).join("") + `</tr>`;
  // Conta corrente interdepartamental: a partida dobrada cruza departamentos
  // (o recebível fica numa escola e o caixa que o liquida fica na Sede), então
  // a coluna de uma unidade sozinha não fecharia. O modelo resolve com as
  // linhas "InterDepartamentos"; aqui aparece o saldo líquido. No consolidado
  // ela é zero — os dois lados se encontram.
  const inter = colunas.map((_, i) =>
    soma(pt => pt[0] === "ATIVO", i) - soma(pt => pt[0] === "PASSIVO", i) - porCol[i].pl);
  if (inter.some(x => Math.abs(x) >= 1))
    html += `<tr class="bp-item"><td></td><td>Conta Corrente Interdepartamental</td>` +
      inter.map(cel).join("") + `</tr>`;
  const totPass = colunas.map((_, i) => soma(pt => pt[0] === "PASSIVO", i) + porCol[i].pl + inter[i]);
  html += `<tr class="bp-total"><td colspan="2">TOTAL DO PASSIVO E PATR. LÍQUIDO</td>` +
    totPass.map(cel).join("") + `</tr>`;
  html += `<tr class="bp-conf"><td colspan="2">Conferência (ativo − passivo)</td>` +
    colunas.map((_, i) => {
      const dif = soma(pt => pt[0] === "ATIVO", i) - totPass[i];
      return `<td class="num"><span class="selo ${Math.abs(dif) < 1 ? "selo-ok" : "selo-alerta"}">${
        Math.abs(dif) < 1 ? "fecha" : n(dif)}</span></td>`;
    }).join("") + `</tr>`;
  return html + `</tbody></table></div>`;
}

/* ---------- DRE: a mesma tabela para os dois cortes ---------- */
const DRE_RECEITAS = [
  ["A311", "Dízimos Líquidos de Repasses", DRE3.dizimo],
  ["A313", "Doações e Contribuições Recebidas", "Doações E Contribuições Recebidas"],
  ["A314", "Prestação de Serviços", DRE3.prest],
  ["A318B", "Outras Receitas Recorrentes", "Outras Receitas Recorrentes"],
];
const DRE_DESPESAS = [
  ["A411", "Despesas com Pessoal", DRE3.pessoal],
  ["A412", "Administrativas e Gerais", DRE3.adm],
  ["A414", "Educação, Assistência e Orientação Social", DRE3.educ],
  ["A419", "Subvenções, Contribuições e Doações Enviadas", "Outorgamentos"],
];

function tabelaDRE(colunas, porCol, mostrarParticipacao) {
  const b = (i, bloco) => porCol[i].porBloco.get(bloco) || 0;
  const usados = new Set([...DRE_RECEITAS, ...DRE_DESPESAS].map(x => x[2]).concat([DRE3.subv]));
  const extras = [...new Set(porCol.flatMap(d => [...d.porBloco.keys()]))].filter(k => !usados.has(k));
  const extraRec = extras.filter(k => porCol.some(d => (d.porBloco.get(k) || 0) > 0));
  const extraDesp = extras.filter(k => !extraRec.includes(k));

  const totRec = colunas.map((_, i) => DRE_RECEITAS.reduce((s, [, , bl]) => s + b(i, bl), 0)
    + extraRec.reduce((s, k) => s + b(i, k), 0));
  const totDesp = colunas.map((_, i) => -(DRE_DESPESAS.reduce((s, [, , bl]) => s + b(i, bl), 0)
    + extraDesp.reduce((s, k) => s + b(i, k), 0)));
  const subv = colunas.map((_, i) => b(i, DRE3.subv));
  const opSemSubv = colunas.map((_, i) => totRec[i] - totDesp[i]);
  const resultado = porCol.map(d => d.total);

  const item = (cod, nome, vals) => `<tr class="bp-item"><td class="bp-cod">${cod}</td><td>${nome}</td>` +
    vals.map(cel).join("") + `</tr>`;

  let html = cabecalho(colunas);
  html += `<tr class="bp-grupo"><td colspan="2">RECEITAS</td>` + totRec.map(cel).join("") + `</tr>`;
  for (const [cod, nome, bloco] of DRE_RECEITAS)
    html += item(cod, nome, colunas.map((_, i) => b(i, bloco)));
  for (const k of extraRec) html += item("", k, colunas.map((_, i) => b(i, k)));

  html += `<tr class="bp-grupo"><td colspan="2">DESPESAS</td>` + totDesp.map(cel).join("") + `</tr>`;
  for (const [cod, nome, bloco] of DRE_DESPESAS)
    html += item(cod, nome, colunas.map((_, i) => -b(i, bloco)));
  for (const k of extraDesp) html += item("", k, colunas.map((_, i) => -b(i, k)));

  html += `<tr class="bp-total"><td colspan="2">RESULTADO OPERACIONAL S/ SUBVENÇÕES</td>` +
    opSemSubv.map(cel).join("") + `</tr>`;
  html += item("A319", "Subvenções Recebidas Líquidas", subv);
  html += `<tr class="bp-total"><td colspan="2">RESULTADO DO EXERCÍCIO</td>` +
    resultado.map(cel).join("") + `</tr>`;

  if (mostrarParticipacao) {
    const cons = resultado[resultado.length - 1];
    html += `<tr class="bp-item"><td></td><td><i>(% com relação ao resultado consolidado)</i></td>` +
      resultado.map(v => `<td class="num${v < 0 ? " negativo" : ""}">${pct(cons ? v / cons : null)}</td>`).join("") + `</tr>`;
  } else {
    html += `<tr class="bp-item"><td></td><td>Margem sobre a receita</td>` +
      colunas.map((_, i) => `<td class="num">${pct(totRec[i] ? resultado[i] / totRec[i] : null)}</td>`).join("") + `</tr>`;
    html += `<tr class="bp-item"><td></td><td>Margem sem subvenção</td>` +
      colunas.map((_, i) => `<td class="num">${pct(totRec[i] ? opSemSubv[i] / totRec[i] : null)}</td>`).join("") + `</tr>`;
  }
  return html + `</tbody></table></div>`;
}

const PERC_MINIMO = 0.26;   // % das despesas essenciais recomendado
registra("capital", "Capital Operativo", () => {
  const colunas = anosAteRef().map(a => ({ ano: a, mes: mesDoAno(a) }));

    const d = dreJanela12(c.ano, c.mes);
    const analiticas = despesasAnaliticas12(c.ano, c.mes);
    let deprec = 0;
    for (const [conta, r] of analiticas)
      if (conta.startsWith("4123") || /deprecia|amortiza/i.test(r.nome || "")) deprec += r.total;
    const subvRec = d.porBloco.get("Subvenções Recebidas") || 0;

    const subvLiq = outorg - subvRec;

    for (const x of bal.contas) { if (x.og === 1) circAtivo += x.total; if (x.og === 3) circPass += x.total; }
    const disponivel = circAtivo - circPass;
    const minimo = essenciais * PERC_MINIMO;
    return { ...c, operacionais, deprec, subvLiq, essenciais, circAtivo, circPass,
             disponivel, minimo, superavit: disponivel - minimo,

  html += linha("Ativo Circulante", "circAtivo");

    <div class="cartao"><div class="titulo">Superávit / Déficit</div>

/* =====================================================================
   SIMULAÇÃO DE RESULTADO
   O chefe mexe nas premissas e vê o ano recalcular na hora. Parte do
   realizado da janela de 12 meses (não de um ano parcial, senão a base já
   nasceria torta) e aplica os ajustes em cada bloco da DRE.
   ===================================================================== */
let simPremissas = { mensalidade: 0, alunos: 0, pessoal: 0, adm: 0, subvencao: 0 };

function simBase() {
  const d = dreJanela12(anoRef, mesRef);
  const b = k => d.porBloco.get(k) || 0;
  return {
    prest: b(DRE3.prest),
    outras: b("Outras Receitas Recorrentes") + b("Doações E Contribuições Recebidas") + b(DRE3.dizimo),
    subv: b(DRE3.subv),
    pessoal: -b(DRE3.pessoal),
    adm: -b(DRE3.adm),
    outrasDesp: -(b(DRE3.educ) + b("Outorgamentos")),
  };
}

/* receita de serviço move com preço E com volume: (1+reajuste)×(1+alunos) */
function simAplicar(base, p) {
  const prest = base.prest * (1 + p.mensalidade / 100) * (1 + p.alunos / 100);
  const subv = base.subv * (1 + p.subvencao / 100);
  const pessoal = base.pessoal * (1 + p.pessoal / 100);
  const adm = base.adm * (1 + p.adm / 100);
  const receita = prest + base.outras + subv;
  const despesa = pessoal + adm + base.outrasDesp;
  return { prest, subv, pessoal, adm, receita, despesa,
           resultado: receita - despesa,
           operacional: (receita - subv) - despesa };
}

registra("simulacao", "Simulação de Resultado", () => {
  const base = simBase();
  const atual = simAplicar(base, { mensalidade: 0, alunos: 0, pessoal: 0, adm: 0, subvencao: 0 });
  const sim = simAplicar(base, simPremissas);
  const alvo = escolaRef ? ` — ${escolaRef}` : "";

  const controles = [
    ["mensalidade", "Reajuste de mensalidade", -20, 30, 0.5],
    ["alunos", "Variação de alunos", -30, 30, 0.5],
    ["pessoal", "Despesa com pessoal", -20, 30, 0.5],
    ["adm", "Administrativas e gerais", -30, 40, 0.5],
    ["subvencao", "Subvenções recebidas", -100, 50, 1],
  ].map(([k, rot, min, max, passo]) => `
    <div class="sim-linha">
      <label for="sim-${k}">${rot}</label>
      <input type="range" id="sim-${k}" data-sim="${k}" min="${min}" max="${max}" step="${passo}" value="${simPremissas[k]}">
      <output class="${simPremissas[k] < 0 ? "negativo" : simPremissas[k] > 0 ? "positivo" : ""}">${
        simPremissas[k] > 0 ? "+" : ""}${fmtP.format(simPremissas[k])}%</output>
    </div>`).join("");

  const delta = sim.resultado - atual.resultado;
  const cartoes = `<div class="cartoes" style="grid-template-columns:repeat(4,1fr)">
    <div class="cartao"><div class="titulo">Resultado hoje</div>
      <div class="valor ${sinal(atual.resultado)}">${n(atual.resultado)}</div>
      <div class="faixa">12 meses até ${NOMES_MESES[mesRef - 1]}/${anoRef}</div></div>
    <div class="cartao"><div class="titulo">Resultado simulado</div>
      <div class="valor ${sinal(sim.resultado)}">${n(sim.resultado)}</div>
      <div class="faixa">com as premissas ao lado</div></div>
    <div class="cartao"><div class="titulo">Diferença</div>
      <div class="valor ${sinal(delta)}">${delta > 0 ? "+" : ""}${n(delta)}</div>
      <div class="faixa">${atual.resultado ? (delta / Math.abs(atual.resultado) * 100).toFixed(1).replace(".", ",") + "%" : "—"}</div></div>
    <div class="cartao"><div class="titulo">Margem operacional</div>
      <div class="valor ${sinal(sim.operacional)}">${
        sim.receita - sim.subv ? pct(sim.operacional / (sim.receita - sim.subv)) : "—"}</div>
      <div class="faixa">sem subvenção</div></div></div>`;

  const linha = (rot, a, s) => {
    const d = s - a;
    return `<tr class="bp-item"><td></td><td>${rot}</td>
      <td class="num">${n(a)}</td><td class="num">${n(s)}</td>
      <td class="num ${d ? sinal(d) : ""}">${d ? (d > 0 ? "+" : "") + n(d) : "–"}</td></tr>`;
  };
  let tab = `<div class="rolagem"><table class="bp"><thead><tr><th></th><th></th>
    <th class="num">Hoje</th><th class="num">Simulado</th><th class="num">Diferença</th>
    </tr></thead><tbody>`;
  tab += `<tr class="bp-grupo"><td colspan="2">RECEITAS</td><td class="num">${n(atual.receita)}</td>
    <td class="num">${n(sim.receita)}</td><td class="num">${n(sim.receita - atual.receita)}</td></tr>`;
  tab += linha("Prestação de Serviços", atual.prest, sim.prest);
  tab += linha("Subvenções Recebidas", atual.subv, sim.subv);
  tab += linha("Outras receitas", base.outras, base.outras);
  tab += `<tr class="bp-grupo"><td colspan="2">DESPESAS</td><td class="num">${n(atual.despesa)}</td>
    <td class="num">${n(sim.despesa)}</td><td class="num">${n(sim.despesa - atual.despesa)}</td></tr>`;
  tab += linha("Despesas com Pessoal", atual.pessoal, sim.pessoal);
  tab += linha("Administrativas e Gerais", atual.adm, sim.adm);
  tab += linha("Demais despesas", base.outrasDesp, base.outrasDesp);
  tab += `<tr class="bp-total"><td colspan="2">RESULTADO</td>
    <td class="num">${n(atual.resultado)}</td><td class="num">${n(sim.resultado)}</td>
    <td class="num ${sinal(delta)}">${delta > 0 ? "+" : ""}${n(delta)}</td></tr>`;
  tab += `</tbody></table></div>`;

  const graf = grafBarras({
    rotulos: ["Hoje", "Simulado"],
    series: [{ nome: "Resultado", valores: [atual.resultado, sim.resultado] }],
    porSinal: true, altura: 170,
  });

  const painelSim = `<div class="painel">
      <h2>🎚️ Premissas${alvo}</h2>
      <details class="porque"><summary>como isto é calculado</summary>
        <p class="desc">A base é o <b>realizado dos últimos 12 meses</b> até a posição escolhida —
        não um ano parcial, senão a comparação já nasceria torta. A receita de serviço move por
        preço <i>e</i> por volume ao mesmo tempo: (1 + reajuste) × (1 + alunos). As demais receitas
        e despesas que você não mexe ficam paradas.</p></details>
      <div class="sim-grade">${controles}</div>
      <button type="button" class="nav-btn" id="sim-zerar">Zerar premissas</button>
    </div>`;

  return painelSim + cartoes +
    painel("Resultado: hoje × simulado", "O quanto as premissas mudam o ano.", graf + tab);
});

/* 6. DISPONÍVEL E APLICAÇÕES --------------------------------------- */
registra("disponivel", "Disponível e Aplicações", () => {
  const ano = anoRef, mes = mesRef;
  const bal = balanco(ano, mes);
  const disp = bal.contas.filter(c => c.sub === "Disponível").sort((a, b) => b.total - a.total);
  const total = disp.reduce((s, c) => s + c.total, 0);

  let html = `<div class="rolagem"><table><thead><tr><th>Conta</th><th>Descrição</th>
    <th class="num">Saldo</th><th class="num">(AV) %</th></tr></thead><tbody>`;
  for (const c of disp)
    html += `<tr><td>${c.conta}</td><td>${c.nome || "—"}</td>
      <td class="num">${n(c.total)}</td><td class="num">${pct(total ? c.total / total : null)}</td></tr>`;
  html += `<tr class="total"><td></td><td>TOTAL DISPONÍVEL</td>
    <td class="num">${n(total)}</td><td class="num">100,00%</td></tr></tbody></table></div>`;

  // rendimento das aplicações (receita financeira)
  const rend = anosAteRef().map(a => somaContas(a, a === ano ? mes : 12,
    (conta, nome) => /rendiment|aplica/i.test(nome || "") && conta[0] === "3", false));
  let htmlR = `<div class="rolagem"><table><thead><tr><th>Ano</th>
    <th class="num">Rendimento de Aplicações</th></tr></thead><tbody>`;
  anosAteRef().forEach((a, i) => { htmlR += `<tr><td>${a}</td><td class="num">${n(-rend[i])}</td></tr>`; });
  htmlR += `</tbody></table></div>`;

  return painel(`Disponível — ${NOMES_MESES[mes - 1]}/${ano}`,
      "Caixa, bancos e aplicações financeiras, conta a conta.", html) +
    painel("Rendimento das Aplicações", "Receita financeira reconhecida em cada ano.", htmlR);
});

/* 7. IMOBILIZADO E BENS EM FORMAÇÃO -------------------------------- */
registra("imobilizado", "Imobilizado", () => {
  const colunas = anosAteRef().map(a => ({ ano: a, mes: mesDoAno(a) }));
  const imob = colunas.map(c => somaContas(c.ano, c.mes, co => co.startsWith("123") || co.startsWith("124"), true));
  const bens = colunas.map(c => somaContas(c.ano, c.mes, co => co.startsWith("1231"), true));
  const deprec = colunas.map(c => -somaContas(c.ano, c.mes,
    (co, nome) => co.startsWith("4123") || /deprecia|amortiza/i.test(nome || ""), false));

  let html = cabecalhoAnos("Item", colunas);
  html += `<tr class="total"><td>Imobilizado + Intangível</td>` + imob.map(v => `<td class="num">${n(v)}</td>`).join("") + `</tr>`;
  html += `<tr class="sub"><td>dos quais Bens em Formação</td>` + bens.map(v => `<td class="num">${n(v)}</td>`).join("") + `</tr>`;
  html += `<tr class="sub"><td>Depreciação do período</td>` + deprec.map(v => `<td class="num">${n(v)}</td>`).join("") + `</tr>`;
  html += `<tr><td>Crescimento sobre o ano anterior</td>` + imob.map((v, i) =>
    `<td class="num">${i === 0 ? "—" : pct(imob[i - 1] ? v / imob[i - 1] - 1 : null)}</td>`).join("") + `</tr>`;
  html += `</tbody></table></div>`;

  // bens em formação, conta a conta
  const ano = anoRef, mes = mesRef;
  const detalhe = new Map();
  for (const d of dados) {
    if (d.Subconta || d.Ano !== ano || d.Mes > mes) continue;
    if (!d.Conta.startsWith("1231") || !ehAnalitica(d.Conta)) continue;
    const base = d.Mes === 12 ? d.Ajust : d.Legal;
    if (!base) continue;
    const reg = detalhe.get(d.Conta) || { nome: d.NomeConta, total: 0 };
    reg.total += base; detalhe.set(d.Conta, reg);
  }
  let htmlB = `<div class="rolagem"><table><thead><tr><th>Conta</th><th>Descrição</th>
    <th class="num">Saldo</th></tr></thead><tbody>`;
  for (const [conta, r] of [...detalhe.entries()].sort((a, b) => b[1].total - a[1].total))
    htmlB += `<tr><td>${conta}</td><td>${r.nome || "—"}</td><td class="num">${n(r.total)}</td></tr>`;
  htmlB += `<tr class="total"><td></td><td>TOTAL</td><td class="num">${n(
    [...detalhe.values()].reduce((s, r) => s + r.total, 0))}</td></tr></tbody></table></div>`;

  const grafImob = grafBarras({
    rotulos: colunas.map(c => String(c.ano) + (c.mes < 12 ? "/" + NOMES_MESES[c.mes - 1] : "")),
    series: [{ nome: "Imobilizado + Intangível", valores: imob }],
  });
  return painel("Imobilizado", "Saldo acumulado do imobilizado e intangível em cada ano.", grafImob + html) +
    painel(`Bens em Formação — ${NOMES_MESES[mes - 1]}/${ano}`,
      "Obras e aquisições ainda não transferidas para o imobilizado.", htmlB);
});

/* 8. PRESTAÇÃO DE SERVIÇO ------------------------------------------ */
registra("prestacao", "Prestação de Serviço", () => {
  const colunas = anosAteRef().map(a => ({ ano: a, mes: mesDoAno(a) }));
  const serie = colunas.map(c => dreAno(c.ano, c.mes).porBloco.get("Prestação de Serviços") || 0);

  let html = cabecalhoAnos("Prestação de Serviços", colunas);
  html += `<tr class="total"><td>Receita de Prestação de Serviços</td>` +
    serie.map(v => `<td class="num">${n(v)}</td>`).join("") + `</tr>`;
  const mesLim = mesRef;
  html += linhasCrescimento("Prestação de Serviços", serieBloco("Prestação de Serviços", mesLim), mesLim, false);
  html += `</tbody></table></div>`;

  // por escola
  const ano = anoRef, mes = mesRef;
  const porEscola = new Map();
  for (const l of linhasDRE) {
    if (l.dre3 !== "Prestação de Serviços" || !l.dep) continue;
    const { escola } = partesDepto(l.dep, l.depNome);
    const reg = porEscola.get(escola) || anosAteRef().map(() => 0);
    const i = anosAteRef().indexOf(l.Ano);
    if (i >= 0 && l.Mes <= (l.Ano === ano ? mes : 12)) reg[i] += l.saldo;
    porEscola.set(escola, reg);
  }
  let htmlE = cabecalhoAnos("Unidade", colunas);
  const ordE = [...porEscola.entries()].sort((a, b) => b[1][anosAteRef().length - 1] - a[1][anosAteRef().length - 1]);
  for (const [escola, v] of ordE)
    htmlE += `<tr><td><b>${escola}</b></td>` + v.map(x => `<td class="num">${n(x)}</td>`).join("") + `</tr>`;
  htmlE += `<tr class="total"><td>TOTAL</td>` + anosAteRef().map((_, i) =>
    `<td class="num">${n(ordE.reduce((s, [, v]) => s + v[i], 0))}</td>`).join("") + `</tr></tbody></table></div>`;

  const grafPrest = grafBarras({
    rotulos: colunas.map(c => String(c.ano) + (c.mes < 12 ? "/" + NOMES_MESES[c.mes - 1] : "")),
    series: [{ nome: "Prestação de Serviços", valores: serie }],
  });
  return painel("Prestação de Serviço", "Faturamento do campo e crescimento ano a ano.", grafPrest + html) +
    painel("Faturamento por Unidade", "A mesma receita, aberta por escola.", htmlE);
});

/* 9. PESSOAL -------------------------------------------------------- */
registra("pessoal", "Despesas com Pessoal", () => {
  const colunas = anosAteRef().map(a => ({ ano: a, mes: mesDoAno(a) }));
  const porAno = colunas.map(c => dreAno(c.ano, c.mes));
  const pessoal = porAno.map(d => -(d.porBloco.get("Despesas Com Pessoal") || 0));
  const prest = porAno.map(d => d.porBloco.get("Prestação de Serviços") || 0);

  let html = cabecalhoAnos("Pessoal", colunas);
  html += `<tr class="total"><td>Despesas com Pessoal</td>` + pessoal.map(v => `<td class="num">${n(v)}</td>`).join("") + `</tr>`;
  html += `<tr><td>% sobre a Prestação de Serviços</td>` + pessoal.map((v, i) =>
    `<td class="num">${pct(prest[i] ? v / prest[i] : null)}</td>`).join("") + `</tr>`;
  const mesLimP = mesRef;
  html += linhasCrescimento("Despesas com Pessoal", serieBloco("Despesas Com Pessoal", mesLimP), mesLimP, true);
  html += `</tbody></table></div>`;

  // abertura por conta no ano corrente
  const ano = anoRef, mes = mesRef;
  const porConta = new Map();
  for (const l of linhasDRE) {
    if (l.Ano !== ano || l.Mes > mes || l.dre3 !== "Despesas Com Pessoal") continue;
    const reg = porConta.get(l.conta) || { nome: l.nome, total: 0 };
    reg.total -= l.saldo; porConta.set(l.conta, reg);
  }
  const ordC = [...porConta.entries()].sort((a, b) => b[1].total - a[1].total);
  const totC = ordC.reduce((s, [, r]) => s + r.total, 0);
  let htmlC = `<div class="rolagem"><table><thead><tr><th>Conta</th><th>Descrição</th>
    <th class="num">Valor</th><th class="num">(AV) %</th></tr></thead><tbody>`;
  for (const [conta, r] of ordC)
    htmlC += `<tr><td>${conta}</td><td>${r.nome || "—"}</td><td class="num">${n(r.total)}</td>
      <td class="num">${pct(totC ? r.total / totC : null)}</td></tr>`;
  htmlC += `<tr class="total"><td></td><td>TOTAL</td><td class="num">${n(totC)}</td>
    <td class="num">100,00%</td></tr></tbody></table></div>`;

  const grafPes = grafBarras({
    rotulos: colunas.map(c => String(c.ano) + (c.mes < 12 ? "/" + NOMES_MESES[c.mes - 1] : "")),
    series: [{ nome: "Despesas com Pessoal", valores: pessoal }],
  });
  return painel("Despesas com Pessoal", "Evolução e peso sobre a receita de serviços.", grafPes + html) +
    painel(`Composição — ${ano} até ${NOMES_MESES[mes - 1]}`, "Conta a conta.", htmlC);
});

/* 9b. MOVIMENTAÇÃO DE FUNCIONÁRIOS ---------------------------------- */
registra("funcionarios", "Movimentação de Funcionários", () => {
  if (!pessoal.length) return painel("Movimentação de Funcionários",
    "A planilha ainda não traz a aba de pessoal. Rode o Atualizar Dados uma vez.", "");

  const soma = (tipo, ano) => pessoal
    .filter(p => p.tipo === tipo && (!ano || p.ano === ano) && naEscola(p.dep, p.depNome))
    .reduce((s, p) => s + p.qtd, 0);
  const ativos = soma("Ativos");

  // por ano
  let html = cabecalhoAnos("Movimento", anosAteRef().map(a => ({ ano: a, mes: 12 })));
  html += `<tr class="sub"><td>Admitidos no ano</td>` +
    anosAteRef().map(a => `<td class="num">${n(soma("Admitidos", a))}</td>`).join("") + `</tr>`;
  html += `<tr class="sub"><td>Desligados no ano</td>` +
    anosAteRef().map(a => `<td class="num">${n(soma("Desligados", a))}</td>`).join("") + `</tr>`;
  html += `<tr class="total"><td>Saldo do ano (admitidos − desligados)</td>` +
    anosAteRef().map(a => { const v = soma("Admitidos", a) - soma("Desligados", a);
      return `<td class="num ${sinal(v)}">${n(v)}</td>`; }).join("") + `</tr>`;
  html += `<tr><td>Rotatividade sobre o quadro atual</td>` +
    anosAteRef().map(a => `<td class="num">${pct(ativos ? soma("Desligados", a) / ativos : null)}</td>`).join("") + `</tr>`;
  html += `</tbody></table></div>`;

  // quadro atual por escola
  const porEscola = new Map();
  for (const p of pessoal) {
    if (!p.dep) continue;
    const { escola } = partesDepto(p.dep, p.depNome);
    const reg = porEscola.get(escola) || { ativos: 0, adm: 0, des: 0 };
    const anoAtual = anoRef;
    if (p.tipo === "Ativos") reg.ativos += p.qtd;
    if (p.tipo === "Admitidos" && p.ano === anoAtual) reg.adm += p.qtd;
    if (p.tipo === "Desligados" && p.ano === anoAtual) reg.des += p.qtd;
    porEscola.set(escola, reg);
  }
  const itens = [...porEscola.entries()].map(([escola, r]) => ({ escola, ...r }))
    .filter(r => r.ativos || r.adm || r.des).sort((a, b) => b.ativos - a.ativos);
  let htmlE = `<div class="rolagem"><table><thead><tr><th>Unidade</th>
    <th class="num">Ativos hoje</th><th class="num">Admitidos ${anoRef}</th>
    <th class="num">Desligados ${anoRef}</th>
    <th class="num">Saldo</th><th class="num">(AV) % do quadro</th></tr></thead><tbody>`;
  const totA = itens.reduce((s, r) => s + r.ativos, 0);
  for (const r of itens) {
    const saldo = r.adm - r.des;
    htmlE += `<tr><td><b>${r.escola}</b></td><td class="num">${n(r.ativos)}</td>
      <td class="num">${n(r.adm)}</td><td class="num">${n(r.des)}</td>
      <td class="num ${sinal(saldo)}">${n(saldo)}</td>
      <td class="num">${pct(totA ? r.ativos / totA : null)}</td></tr>`;
  }
  htmlE += `<tr class="total"><td>TOTAL</td><td class="num">${n(totA)}</td>
    <td class="num">${n(itens.reduce((s, r) => s + r.adm, 0))}</td>
    <td class="num">${n(itens.reduce((s, r) => s + r.des, 0))}</td>
    <td class="num">${n(itens.reduce((s, r) => s + r.adm - r.des, 0))}</td>
    <td class="num">100,00%</td></tr></tbody></table></div>`;

  const cartoes = `<div class="cartoes" style="grid-template-columns:repeat(3,1fr)">
    <div class="cartao"><div class="titulo">Funcionários Ativos</div>
      <div class="valor">${n(ativos)}</div><div class="faixa">quadro de hoje</div></div>
    <div class="cartao"><div class="titulo">Admitidos em ${anoRef}</div>
      <div class="valor">${n(soma("Admitidos", anoRef))}</div></div>
    <div class="cartao"><div class="titulo">Desligados em ${anoRef}</div>
      <div class="valor">${n(soma("Desligados", anoRef))}</div></div></div>`;

  const anosG = anosAteRef();
  const grafMov = grafBarras({
    rotulos: anosG.map(String),
    series: [
      { nome: "Admitidos", cor: VIZ.serie, valores: anosG.map(a => soma("Admitidos", a)) },
      { nome: "Desligados", cor: VIZ.serie2, valores: anosG.map(a => soma("Desligados", a)) },
    ],
  });
  return cartoes + painel("Admissões × Desligamentos",
    "Entradas e saídas em cada ano. Quando as barras se igualam, o quadro só repõe.", grafMov) +
    painel("Movimentação de Funcionários",
      "Admissões e desligamentos por ano. O quadro de ativos é a foto de hoje, não do fim de cada ano.", html) +
    painel("Quadro por Unidade", "Funcionários ativos e movimento do ano em cada escola.", htmlE);
});

/* 9c. RESCISÕES ------------------------------------------------------ */
registra("rescisoes", "Rescisões", () => {
  const resc = pessoal.filter(p => p.tipo === "Rescisao" && naEscola(p.dep, p.depNome));
  if (!resc.length) return painel("Rescisões",
    "A planilha ainda não traz a aba de pessoal. Rode o Atualizar Dados uma vez.", "");

  const porAno = anosAteRef().map(a => {
    const f = resc.filter(p => p.ano === a);
    return { pessoas: f.reduce((s, p) => s + p.qtd, 0), valor: f.reduce((s, p) => s + p.valor, 0) };
  });
  let html = cabecalhoAnos("Rescisões", anosAteRef().map(a => ({ ano: a, mes: 12 })));
  html += `<tr class="sub"><td>Rescisões pagas</td>` +
    porAno.map(r => `<td class="num">${n(r.pessoas)}</td>`).join("") + `</tr>`;
  html += `<tr class="total"><td>Valor líquido pago</td>` +
    porAno.map(r => `<td class="num">${n(r.valor)}</td>`).join("") + `</tr>`;
  html += `<tr><td>Custo médio por rescisão</td>` +
    porAno.map(r => `<td class="num">${n(r.pessoas ? r.valor / r.pessoas : null)}</td>`).join("") + `</tr>`;
  html += `</tbody></table></div>`;

  // mês a mês do ano corrente
  const ano = anoRef;
  let htmlM = `<div class="rolagem"><table><thead><tr><th>Mês</th>
    <th class="num">Rescisões</th><th class="num">Valor líquido</th>
    <th class="num">Custo médio</th></tr></thead><tbody>`;
  let tq = 0, tv = 0;
  for (let m = 1; m <= 12; m++) {
    const f = resc.filter(p => p.ano === ano && p.mes === m);
    if (!f.length) continue;
    const q = f.reduce((s, p) => s + p.qtd, 0), v = f.reduce((s, p) => s + p.valor, 0);
    tq += q; tv += v;
    htmlM += `<tr><td>${NOMES_MESES[m - 1]}</td><td class="num">${n(q)}</td>
      <td class="num">${n(v)}</td><td class="num">${n(q ? v / q : null)}</td></tr>`;
  }
  htmlM += `<tr class="total"><td>TOTAL ${ano}</td><td class="num">${n(tq)}</td>
    <td class="num">${n(tv)}</td><td class="num">${n(tq ? tv / tq : null)}</td></tr></tbody></table></div>`;

  // por escola no ano corrente
  const porEscola = new Map();
  for (const p of resc) {
    if (p.ano !== ano || !p.dep) continue;
    const { escola } = partesDepto(p.dep, p.depNome);
    const reg = porEscola.get(escola) || { q: 0, v: 0 };
    reg.q += p.qtd; reg.v += p.valor; porEscola.set(escola, reg);
  }
  let htmlE = `<div class="rolagem"><table><thead><tr><th>Unidade</th>
    <th class="num">Rescisões</th><th class="num">Valor líquido</th>
    <th class="num">(AV) %</th></tr></thead><tbody>`;
  const ordE = [...porEscola.entries()].sort((a, b) => b[1].v - a[1].v);
  for (const [escola, r] of ordE)
    htmlE += `<tr><td><b>${escola}</b></td><td class="num">${n(r.q)}</td>
      <td class="num">${n(r.v)}</td><td class="num">${pct(tv ? r.v / tv : null)}</td></tr>`;
  htmlE += `</tbody></table></div>`;

  const mesesComResc = [];
  for (let m = 1; m <= 12; m++) {
    const f = resc.filter(p => p.ano === ano && p.mes === m);
    if (f.length) mesesComResc.push({ m, v: f.reduce((s, p) => s + p.valor, 0) });
  }
  const grafResc = grafBarras({
    rotulos: mesesComResc.map(x => NOMES_MESES[x.m - 1]),
    series: [{ nome: "Valor líquido pago", valores: mesesComResc.map(x => x.v) }],
  });
  return painel(`Custo das Rescisões — ${ano}`, "Quanto saiu de caixa em cada mês.", grafResc) +
    painel("Rescisões", "Quantidade e custo líquido das rescisões em cada ano.", html) +
    painel(`Rescisões mês a mês — ${ano}`, "Valor pago no mês do desligamento.", htmlM) +
    painel(`Rescisões por Unidade — ${ano}`, "Onde o custo se concentrou.", htmlE);
});
