                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Cartão Corporativo *</label>
                        <select name="cartao" value={formData.cartao} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                          <option value="" disabled>Selecione um meio de pagamento...</option>
                          {cartoes.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Valores e Datas</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Data *</label>
                        <input type="date" name="dataCompra" value={formData.dataCompra} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Valor Total (R$) *</label>
                        <input type="number" step="0.01" name="valor" placeholder="0.00" value={formData.valor} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm font-medium bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Parcelamento *</label>
                        <input type="number" name="parcelas" min="1" placeholder="Ex: 1 (À vista)" value={formData.parcelas} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
                      </div>
                    </div>
                  </div>
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Documentação e Rateio</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Nota Fiscal *</label>
                        <select name="possuiNf" value={formData.possuiNf} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                          <option value="Sim">Sim, possui</option><option value="É adiantamento ( NF com entrega posterior )">Adiantamento (Entrega Posterior)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Número da NF/Fatura {formData.possuiNf === 'Sim' ? '*' : ''}</label>
                        <input type="text" name="numNota" placeholder="Ex: 0012345" value={formData.numNota} onChange={handleInputChange} required={formData.possuiNf === 'Sim'} disabled={formData.possuiNf !== 'Sim'} className={`w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ${formData.possuiNf !== 'Sim' ? 'opacity-50 cursor-not-allowed' : ''}`}/>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 gap-6 mb-6">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Fornecedor *</label>
                        <input type="text" name="fornecedor" placeholder="Nome da empresa" value={formData.fornecedor} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
                      </div>
                      <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                        <label className="block text-sm font-bold text-slate-800 mb-3 flex items-center"><Building size={16} className="mr-2 text-slate-500" /> Departamentos Envolvidos *</label>
                        <datalist id="rateio-depts">{departamentos.map(d => <option key={d.id} value={`${d.codigo} - ${d.nome}`} />)}</datalist>
                        <div className="space-y-3">
                            {formData.rateio.map((item, index) => {
                                const isValidDept = departamentos.some(d => `${d.codigo} - ${d.nome}` === item);
                                return (
                                <div key={index} className="flex flex-col sm:flex-row items-center gap-2 relative group rateio-row">
                                    <span className="bg-slate-200 text-slate-500 font-mono text-xs px-2 py-1 rounded hidden sm:block">{index+1}</span>
                                    <div className="flex-1 w-full relative">
                                        <input type="text" list="rateio-depts" placeholder="Pesquise o departamento... (Aperte Enter para confirmar)" value={item} onChange={e => handleRateioChange(index, e.target.value)} onKeyDown={e => handleSetorKeyDown(e, index)} required className={`w-full px-3 py-2.5 text-sm border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors ${isValidDept ? 'italic font-semibold text-blue-700 bg-blue-50 border-blue-200' : 'bg-white border-slate-300 text-slate-700'}`}/>
                                    </div>
                                    <button type="button" onClick={() => removeRateio(index)} disabled={formData.rateio.length === 1} title="Remover departamento" className={`p-2.5 rounded-md border flex-shrink-0 transition-colors ${formData.rateio.length === 1 ? 'bg-slate-100 border-slate-200 text-slate-300 cursor-not-allowed' : 'bg-white border-slate-300 text-rose-500 hover:bg-rose-50 hover:border-rose-300 shadow-sm'}`}><Trash2 size={16} /></button>
                                </div>
                            )})}
                        </div>
                        <button type="button" onClick={addRateio} className="mt-4 text-xs font-bold uppercase tracking-wider text-blue-600 hover:text-white hover:bg-blue-600 border border-blue-200 flex items-center bg-white px-4 py-2 rounded-md transition-colors shadow-sm"><Plus size={14} className="mr-1" /> Adicionar Outro Departamento</button>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1.5">Observações Adicionais *</label>
                      <textarea name="observacao" placeholder="Informação complementar relevante sobre esta transação..." value={formData.observacao} onChange={handleInputChange} required rows="3" className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
                    </div>
                  </div>
                  <div className="pt-6 border-t border-slate-100 flex justify-end">
                    {editingEntryId ? <button type="button" onClick={cancelEdit} className="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 mr-4 transition-colors">Cancelar Edição</button> : <button type="button" onClick={() => setFormData(initialFormState)} className="px-5 py-2.5 text-sm font-medium text-slate-600 hover:text-slate-900 mr-4 transition-colors">Limpar Campos</button>}
                    <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2.5 px-6 rounded-md shadow-sm transition-colors flex items-center"><Plus size={16} className="mr-2" /> {editingEntryId ? 'Atualizar Lançamento' : 'Gravar Lançamento'}</button>
                  </div>
                </form>
              </div>
            </div>
          );

          const renderTable = () => (
            <div className="space-y-6 animate-in fade-in duration-500">
               <div className="flex flex-col md:flex-row md:items-end justify-between border-b border-slate-200 pb-4">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900">Registo Central</h2>
                    <p className="text-slate-500 text-sm mt-1">Gestão, filtro e pesquisa de todos os lançamentos registados.</p>
                  </div>
                  <div className="mt-4 md:mt-0 flex items-center text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-md border border-slate-200">
                    <TableIcon size={16} className="mr-2 text-slate-400" /> {filteredEntries.length} Resultados
                  </div>
              </div>

              <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
                <div className="flex items-center mb-4 text-xs font-bold text-slate-800 uppercase tracking-wider"><Filter size={14} className="mr-2 text-slate-400" /> Filtros Avançados</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-4">
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Data exata</label><input type="date" value={filterData} onChange={e=>setFilterData(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Natureza</label><select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todos</option><option value="Compra">Compra</option><option value="Cancelamento">Cancelamento</option><option value="Devolução">Devolução</option></select></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Cartão Usado</label><select value={filterCartao} onChange={e=>setFilterCartao(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todos</option>{cartoes.map(c=><option key={c.id} value={c.nome}>{c.nome}</option>)}</select></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Departamento</label><select value={filterSetor} onChange={e=>setFilterSetor(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todos</option>{departamentos.map(d=><option key={d.id} value={`${d.codigo} - ${d.nome}`}>{d.nome}</option>)}</select></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Situação NF</label><select value={filterPossuiNf} onChange={e=>setFilterPossuiNf(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todas</option><option value="Sim">Sim</option><option value="É adiantamento ( NF com entrega posterior )">Adiantamento</option></select></div>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 pt-4 border-t border-slate-100">
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Valor Contém</label><input type="number" placeholder="Ex: 150" value={filterValor} onChange={e=>setFilterValor(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Nº Parcelas</label><input type="number" placeholder="Ex: 3" value={filterParcelas} onChange={e=>setFilterParcelas(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Pesquisar NF</label><input type="text" placeholder="Nº da fatura" value={filterNumNota} onChange={e=>setFilterNumNota(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Fornecedor</label><input type="text" placeholder="Nome empresa..." value={filterFornecedor} onChange={e=>setFilterFornecedor(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                  <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Observações</label><input type="text" placeholder="Termo na obs..." value={filterObservacao} onChange={e=>setFilterObservacao(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"/></div>
                </div>
              </div>

              <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="min-w-full divide-y divide-slate-200">
                    <thead className="bg-slate-50">
                      <tr>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Data</th>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Natureza</th>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Cartão</th>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Valor Total</th>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider text-center">Parcelas</th>
                        <th scope="col" className="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Fornecedor & Departamentos</th>
                        <th scope="col" className="px-6 py-3 text-right text-xs font-semibold text-slate-500 uppercase tracking-wider">Ações</th>
                      </tr>
                    </thead>
                    <tbody className="bg-white divide-y divide-slate-100">
                      {filteredEntries.length === 0 ? (
                        <tr><td colSpan="7" className="px-6 py-12 text-center text-slate-400 text-sm">Sem registos correspondentes com os filtros atuais.</td></tr>
                      ) : (
                        filteredEntries.map(entry => (
                          <tr key={entry.id} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-slate-900 align-top">{entry.dataCompra ? new Date(entry.dataCompra).toLocaleDateString('pt-BR', {timeZone:'UTC'}) : '-'}</td>
                            <td className="px-6 py-4 whitespace-nowrap align-top"><span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider border ${entry.status === 'Compra' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : entry.status === 'Cancelamento' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-amber-50 text-amber-700 border-amber-200'}`}>{entry.status}</span></td>
                            <td className="px-6 py-4 whitespace-nowrap text-xs font-medium text-slate-500 align-top">{entry.cartao}</td>
                            <td className="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-900 text-right align-top">R$ {entry.valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                            <td className="px-6 py-4 whitespace-nowrap text-sm text-center text-slate-500 font-medium align-top">{entry.parcelas === 1 ? '1X (À vista)' : `${entry.parcelas}X`}</td>
                            <td className="px-6 py-4 text-sm text-slate-500 max-w-[250px] align-top">
                              <span className="font-semibold text-slate-800 block truncate" title={entry.fornecedor}>{entry.fornecedor || 'Sem fornecedor'}</span>
                              {entry.rateio && entry.rateio.length > 0 ? (
                                  <div className="mt-1.5 space-y-1">{entry.rateio.map((r, i) => (<div key={i} className="flex items-center text-[10px] leading-tight text-slate-500 border-b border-slate-100 pb-1 last:border-0 last:pb-0"><span className="truncate" title={r.setor || r}>• {r.setor || r}</span></div>))}</div>
                              ) : (<span className="text-[11px] text-slate-400 block truncate mt-1" title={entry.setor}>{entry.setor || 'N/A'}</span>)}
                              {entry.numNota && <span className="text-[10px] font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 mt-2 inline-block shadow-sm">NF: {entry.numNota}</span>}
                            </td>
                            <td className="px-6 py-4 whitespace-nowrap text-right text-sm font-medium align-top">
                              <div className="flex items-center justify-end space-x-2">
                                <button onClick={() => handleInitiateAction(entry, 'edit')} className="text-slate-400 hover:text-blue-600 transition-colors bg-white p-1.5 rounded-md border border-slate-200 hover:border-blue-200 shadow-sm" title="Corrigir Lançamento"><Pencil size={16}/></button>
                                <button onClick={() => handleInitiateAction(entry, 'delete')} className="text-slate-400 hover:text-rose-600 transition-colors bg-white p-1.5 rounded-md border border-slate-200 hover:border-rose-200 shadow-sm" title="Excluir Transação"><Trash2 size={16}/></button>
                              </div>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );

          const renderGerencia = () => (
            <div className="space-y-8 animate-in fade-in duration-500">
              <div className="border-b border-slate-200 pb-4">
                  <h2 className="text-2xl font-bold text-slate-900">Painel de Administração</h2>
                  <p className="text-slate-500 text-sm mt-1">Configuração de estruturas e gestão de acessos do sistema.</p>
              </div>

              <section className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50 px-6 py-4 border-b border-slate-200">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center"><Building size={16} className="mr-2 text-slate-400"/> Departamentos e Cartões</h3>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-2 divide-y lg:divide-y-0 lg:divide-x divide-slate-100">
                  <div className="p-6">
                    <div className="mb-8">
                      <div className="flex justify-between items-center mb-3">
                        <h4 className="font-semibold text-slate-800 text-sm">Importação via CSV</h4>
                        <select value={csvEncoding} onChange={e=>setCsvEncoding(e.target.value)} className="p-1 border border-slate-200 rounded text-xs text-slate-500 bg-slate-50 focus:ring-1 focus:ring-blue-500"><option value="UTF-8">UTF-8</option><option value="ISO-8859-1">ISO-Excel</option></select>
                      </div>
                      <label className="flex flex-col items-center justify-center w-full h-20 border-2 border-slate-200 border-dashed rounded-md cursor-pointer bg-slate-50 hover:bg-slate-100 transition-colors mb-2">
                          <div className="flex items-center space-x-2 text-slate-500"><Upload size={18} /><span className="text-sm font-medium">Selecionar Ficheiro .CSV</span></div>
                          <input type="file" onChange={handleCsvUpload} ref={fileInputRef} className="hidden" accept=".csv" />
                      </label>
                      <p className="text-[10px] text-slate-400 leading-tight">O ficheiro deve conter as colunas "Código" e "Nome Depto".</p>
                    </div>

                    <div className="mb-6">
                      <h4 className="font-semibold text-slate-800 text-sm mb-3">{editingDeptId ? 'Editar Departamento' : 'Adicionar Manualmente'}</h4>
                      <form onSubmit={handleAddDept} className="space-y-3 bg-slate-50 p-4 rounded-md border border-slate-100">
                        <input type="text" placeholder="Código (ex: 11015)" value={newDeptCodigo} onChange={e=>setNewDeptCodigo(e.target.value)} required className="w-full px-3 py-2 text-sm border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500" />
                        <input type="text" placeholder="Nome do Departamento" value={newDeptNome} onChange={e=>setNewDeptNome(e.target.value)} required className="w-full px-3 py-2 text-sm border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500" />
                        <div className="flex gap-2">
                          {editingDeptId && <button type="button" onClick={cancelEditDept} className="flex-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-100 font-medium py-2 rounded-md text-sm transition-colors">Cancelar</button>}
                          <button type="submit" className="flex-1 bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 rounded-md text-sm transition-colors">{editingDeptId ? 'Atualizar' : 'Gravar'}</button>
                        </div>
                      </form>
                    </div>

                    <h4 className="font-semibold text-slate-800 text-sm mb-2">Departamentos Ativos ({departamentos.length})</h4>
                    <div className="h-40 overflow-y-auto border border-slate-100 rounded-md bg-white custom-scrollbar">
                      <table className="w-full text-xs text-left divide-y divide-slate-100">
                        <thead className="bg-slate-50 sticky top-0"><tr className="text-slate-500"><th className="px-3 py-2">Cód.</th><th className="px-3 py-2">Departamento</th><th className="px-3 py-2"></th></tr></thead>
                        <tbody className="divide-y divide-slate-50">
                          {departamentos.length === 0 && <tr><td colSpan="3" className="px-3 py-4 text-center text-slate-400">Nenhum departamento</td></tr>}
                          {departamentos.map(d=>(
                            <tr key={d.id} className="hover:bg-slate-50">
                              <td className="px-3 py-2 text-slate-400">{d.codigo}</td>
                              <td className="px-3 py-2 font-medium text-slate-700 truncate max-w-[120px]" title={d.nome}>{d.nome}</td>
                              <td className="px-3 py-2 text-right flex justify-end space-x-1">
                                <button onClick={()=>handleEditDept(d)} className="text-slate-400 hover:text-blue-500 p-1"><Pencil size={14}/></button>
                                <button onClick={()=>handleRemoveDept(d.id)} className="text-slate-400 hover:text-rose-500 p-1"><Trash2 size={14}/></button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="p-6">
                    <h4 className="font-semibold text-slate-800 text-sm mb-4">{editingCartaoId ? 'Editar Cartão' : 'Cartões de Pagamento'}</h4>
                    <form onSubmit={handleAddCartao} className="flex gap-2 mb-6">
                      <input type="text" required placeholder="Nome do Novo Cartão..." value={newCartaoNome} onChange={e=>setNewCartaoNome(e.target.value)} className="flex-1 border border-slate-200 p-2 rounded-md text-sm focus:ring-1 focus:ring-blue-500"/>
                      {editingCartaoId && <button type="button" onClick={cancelEditCartao} className="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 px-3 py-2 rounded-md text-sm font-medium transition-colors">Cancelar</button>}
                      <button className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-md text-sm font-medium transition-colors">{editingCartaoId ? 'Atualizar' : 'Adicionar'}</button>
                    </form>
                    
                    <h4 className="font-semibold text-slate-800 text-sm mb-2">Cartões Ativos ({cartoes.length})</h4>
                    <div className="h-[26rem] overflow-y-auto border border-slate-100 rounded-md bg-white divide-y divide-slate-50 custom-scrollbar">
                      {cartoes.length === 0 && <div className="p-4 text-center text-xs text-slate-400">Sem cartões.</div>}
                      {cartoes.map(c=>(
                        <div key={c.id} className="flex justify-between items-center px-4 py-3 hover:bg-slate-50 transition-colors">
                          <div className="flex items-center text-sm font-medium text-slate-700"><CreditCard size={14} className="mr-2 text-slate-400"/> {c.nome}</div>
                          <div className="flex space-x-1">
                            <button onClick={()=>handleEditCartao(c)} className="text-slate-400 hover:text-blue-500 p-1.5 bg-white border border-slate-100 rounded shadow-sm hover:border-blue-200"><Pencil size={12}/></button>
                            <button onClick={()=>handleRemoveCartao(c.id)} className="text-slate-400 hover:text-rose-500 p-1.5 bg-white border border-slate-100 rounded shadow-sm hover:border-rose-200"><Trash2 size={12}/></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </section>

              <section className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center"><Users size={16} className="mr-2 text-slate-400"/> Gestão de Acessos</h3>
                  <span className="text-xs font-medium bg-slate-200 text-slate-600 px-2 py-1 rounded-full">{users.length} Contas</span>
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-3 divide-y lg:divide-y-0 lg:divide-x divide-slate-100">
                  <div className="p-6">
                    <h4 className="font-semibold text-slate-800 text-sm mb-4">{editingUserId ? 'Editar Utilizador' : 'Nova Conta'}</h4>
                    <form onSubmit={handleAddUser} className="space-y-4">
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Nome de Utilizador</label><input type="text" required value={newUserName} onChange={e=>setNewUserName(e.target.value)} className="w-full text-sm p-2 border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500"/></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">E-mail Corporativo</label><input type="email" required value={newUserEmail} onChange={e=>setNewUserEmail(e.target.value)} className="w-full text-sm p-2 border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500"/></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Palavra-passe</label><input type="text" required value={newUserSenha} onChange={e=>setNewUserSenha(e.target.value)} className="w-full text-sm p-2 border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500"/></div>
                      <div><label className="block text-xs font-semibold text-slate-500 mb-1">Perfil de Acesso</label><select value={newUserRole} onChange={e=>setNewUserRole(e.target.value)} className="w-full text-sm p-2 border border-slate-200 rounded-md focus:ring-1 focus:ring-blue-500"><option value="registrador">Registrador</option><option value="admin">Administrador</option></select></div>
                      <div className="flex gap-2 pt-2">
                        {editingUserId && <button type="button" onClick={cancelEditUser} className="flex-1 bg-white border border-slate-200 text-slate-600 hover:bg-slate-50 font-medium py-2 rounded-md text-sm transition-colors">Cancelar</button>}
                        <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-md text-sm transition-colors">{editingUserId ? 'Atualizar Conta' : 'Criar Conta'}</button>
                      </div>
                    </form>
                  </div>
                  <div className="p-0 lg:col-span-2 overflow-x-auto">
                    <table className="min-w-full text-sm text-left divide-y divide-slate-200">
                      <thead className="bg-slate-50"><tr className="text-xs text-slate-500 uppercase"><th className="px-6 py-3 font-semibold">Conta</th><th className="px-6 py-3 font-semibold">Segurança</th><th className="px-6 py-3 font-semibold text-right">Ação</th></tr></thead>
                      <tbody className="divide-y divide-slate-100">
                        {users.map(u=>(
                          <tr key={u.id} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-4"><div className="font-medium text-slate-900">{u.nome}</div><div className="text-xs text-slate-400">{u.email}</div></td>
                            <td className="px-6 py-4">
                              <div className="flex items-center space-x-2 mb-1">
                                {u.role === 'admin' ? <Shield size={14} className="text-blue-600"/> : <User size={14} className="text-slate-400"/>}
                                <span className={`text-xs font-bold uppercase tracking-wider ${u.role==='admin'?'text-blue-700':'text-slate-600'}`}>{u.role === 'admin' ? 'Administrador' : 'Registrador'}</span>
                              </div>
                              <div className="text-xs font-mono bg-slate-100 text-slate-500 px-2 py-0.5 rounded w-fit" title="Senha">***{u.senha.slice(-3)}</div>
                            </td>
                            <td className="px-6 py-4 text-right flex items-center justify-end space-x-2 mt-2">
                              <button onClick={()=>handleEditUser(u)} className="p-1.5 rounded-md border shadow-sm transition-colors bg-white border-slate-200 text-slate-400 hover:text-blue-600 hover:border-blue-200"><Pencil size={16}/></button>
                              <button onClick={()=>handleRemoveUser(u.id)} disabled={u.id===currentUser.id} className={`p-1.5 rounded-md border shadow-sm transition-colors ${u.id===currentUser.id ? 'opacity-30 border-slate-200' : 'bg-white border-slate-200 text-slate-400 hover:text-rose-600 hover:border-rose-200'}`}><Trash2 size={16}/></button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </section>
            </div>
          );

          if (!currentUser) return (
            <div className="min-h-screen bg-slate-900 flex flex-col justify-center py-12 px-6 sm:px-8 lg:px-10 relative overflow-hidden">
              <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
              
              <div className="relative z-10 w-full max-w-md mx-auto">
                <div className="bg-white p-8 rounded-2xl shadow-2xl border border-slate-100">
                  <div className="flex justify-center mb-6">
                    <div className="bg-slate-50 p-3 rounded-xl border-2 border-slate-100 shadow-inner w-20 h-20 flex items-center justify-center">
                      <img src="https://i.postimg.cc/zvrsLmbd/Gemini_Generated_Image_g9png6g9png6g9pn_removebg_preview.png" alt="Logo" className="w-full h-full object-contain" onError={e=>{e.target.onerror=null;e.target.src='https://cdn-icons-png.flaticon.com/512/4341/4341764.png';}} />
                    </div>
                  </div>
                  <h2 className="text-2xl font-bold text-slate-900 text-center mb-2 tracking-tight">COFRE - Controle Operacional Financeiro de Recursos e Estoque</h2>
                  <p className="text-sm text-slate-500 text-center mb-8">Acesso restrito a colaboradores autorizados.</p>
                  
                  {loadingData ? (
                    <div className="flex flex-col items-center justify-center py-8">
                      <Loader2 className="w-8 h-8 text-blue-600 animate-spin mb-3" />
                      <p className="text-slate-400 text-sm font-medium">A sincronizar com a nuvem...</p>
                    </div>
                  ) : (
                    <form onSubmit={handleLogin} className="space-y-5">
                      {loginError && <div className="bg-rose-50 text-rose-600 text-sm p-3 rounded-lg flex items-center font-medium border border-rose-100"><AlertTriangle size={16} className="mr-2"/>{loginError}</div>}
                      <div>
                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5">Endereço de E-mail</label>
                        <input type="email" placeholder="nome@dominio.com" value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} required className="w-full p-3 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 focus:bg-white" />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5">Palavra-passe</label>
                        <input type="password" placeholder="••••••••" value={loginSenha} onChange={e=>setLoginSenha(e.target.value)} required className="w-full p-3 text-sm border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-slate-50 focus:bg-white" />
                      </div>
                      <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-colors shadow-md mt-2 flex justify-center items-center">
                        Aceder ao Sistema <ChevronRight size={16} className="ml-1"/>
                      </button>
                    </form>
                  )}
                </div>
                <div className="text-center mt-6 text-slate-400 text-xs">
                  &copy; {new Date().getFullYear()} FinDashboard Corp. Sistema Interno.
                </div>
              </div>
            </div>
          );

          return (
            <div className="min-h-screen bg-slate-50 text-slate-900 font-sans flex flex-col">
              
              {/* MODAL DE SEGURANÇA PARA EXCLUSÃO */}
              {authModalOpen && targetEntry && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                  <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-sm border border-slate-200 animate-in zoom-in-95 duration-200">
                    <div className="flex items-center text-rose-600 mb-4"><Shield size={24} className="mr-2"/><h3 className="text-xl font-bold tracking-tight">Autorização Obrigatória</h3></div>
                    <p className="text-slate-600 text-sm mb-6 leading-relaxed">Foi solicitada a <strong className="text-slate-900">exclusão</strong> do registo avaliado em <strong className="text-slate-900">R$ {targetEntry.valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</strong>. Esta ação requer validação superior.</p>
                    
                    {authRequests.find(r=>r.id===targetEntry.id.toString()) ? (
                      <div className="space-y-4">
                        <div className="bg-slate-50 p-3 rounded border border-slate-200 text-xs text-slate-500 text-center font-medium">Aguardando código do Administrador...</div>
                        <input type="text" maxLength="6" placeholder="000000" value={authCode} onChange={e=>setAuthCode(e.target.value)} className="w-full text-center text-3xl tracking-[0.5em] p-4 border border-slate-300 rounded-lg font-mono text-slate-800 focus:ring-2 focus:ring-rose-500 outline-none"/>
                        <div className="flex gap-2">
                           <button onClick={closeAuthModal} className="w-1/3 bg-slate-100 text-slate-600 font-bold py-3 rounded-lg hover:bg-slate-200">Sair</button>
                           <button onClick={handleConfirmAuthCode} className="w-2/3 bg-rose-600 text-white font-bold py-3 rounded-lg hover:bg-rose-700 shadow-sm">Validar</button>
                        </div>
                      </div>
                    ) : (
                      <div className="flex gap-2">
                        <button onClick={closeAuthModal} className="flex-1 bg-white border border-slate-200 text-slate-600 font-medium py-2.5 rounded-lg hover:bg-slate-50">Cancelar</button>
                        <button onClick={handleRequestAuthCode} className="flex-1 bg-slate-900 text-white font-medium py-2.5 rounded-lg hover:bg-slate-800 shadow-sm">Pedir Código</button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* HEADER Sólido/Escuro - Estilo SaaS */}
              <header className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-40 shadow-sm">
                <div className="max-w-[1400px] mx-auto px-4 lg:px-6 h-16 flex justify-between items-center">
                  <div className="flex items-center space-x-3">
                    <div className="bg-white p-1 rounded w-8 h-8 flex items-center justify-center">
                      <img src="https://i.postimg.cc/zvrsLmbd/Gemini_Generated_Image_g9png6g9png6g9pn_removebg_preview.png" alt="Logo" className="w-full h-full object-contain" onError={e=>{e.target.onerror=null;e.target.src='https://cdn-icons-png.flaticon.com/512/4341/4341764.png';}} />
                    </div>
                    <span className="font-semibold tracking-wide text-[13px] hidden xl:block border-l border-slate-700 pl-3 ml-1">COFRE - Controle Operacional Financeiro de Recursos e Estoque</span>
                  </div>
                  
                  <div className="flex items-center space-x-1 sm:space-x-2 h-full">
                    {/* Navegação principal ligada ao Header */}
                    <nav className="flex h-full mr-2 overflow-x-auto hide-scrollbar">
                      <button onClick={()=>setActiveTab('dashboard')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'dashboard' ? 'border-blue-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}>Painel</button>
                      <button onClick={()=>setActiveTab('form')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'form' ? 'border-blue-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}>Lançar</button>
                      <button onClick={()=>setActiveTab('table')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'table' ? 'border-blue-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}>Consultas</button>
                      <button onClick={()=>setActiveTab('rota')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'rota' ? 'border-blue-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}>R.O.T.A.</button>
                      
                      {/* NOVAS ABAS */}
                      <button onClick={()=>setActiveTab('vinculo')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'vinculo' ? 'border-emerald-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}><Link size={14} className="mr-1.5"/> Vínculos</button>
                      <button onClick={()=>setActiveTab('lancamento')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'lancamento' ? 'border-amber-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}><FileSpreadsheet size={14} className="mr-1.5"/> Lançamentos</button>
                      
                      {currentUser.role === 'admin' && <button onClick={()=>setActiveTab('gerencia')} className={`px-3 sm:px-4 h-full flex items-center text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${activeTab === 'gerencia' ? 'border-blue-500 text-white bg-slate-800/50' : 'border-transparent text-slate-400 hover:text-white hover:bg-slate-800/30'}`}>Admin</button>}
                    </nav>

                    {/* Ferramentas do Utilizador */}
                    <div className="flex items-center space-x-3 border-l border-slate-700 pl-3 sm:pl-4">
                      {currentUser.role === 'admin' && (
                        <div className="relative">
                          <button onClick={()=>setShowNotifications(!showNotifications)} className={`p-2 rounded-md transition-colors ${showNotifications||authRequests.length>0||boletoAlerts.length>0 ? 'text-white bg-slate-800' : 'text-slate-400 hover:text-white hover:bg-slate-800'}`}>
                            <Bell size={18}/>
                            {(authRequests.length>0 || boletoAlerts.length>0) && <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full animate-pulse border border-slate-900"></span>}
                          </button>
                          
                          {/* Menu de Notificações Pop-up */}
                          {showNotifications && (
                            <div className="absolute right-0 mt-3 w-80 bg-white rounded-lg shadow-xl border border-slate-200 text-slate-800 animate-in slide-in-from-top-2 z-50">
                              <div className="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-lg">
                                <span className="text-xs font-bold uppercase tracking-wider text-slate-600">Pendências e Alertas</span>
                                {(authRequests.length>0 || boletoAlerts.length>0) && <span className="bg-rose-100 text-rose-700 text-[10px] px-2 py-0.5 rounded-full font-bold">{authRequests.length + boletoAlerts.length}</span>}
                              </div>
                              <div className="max-h-72 overflow-y-auto divide-y divide-slate-50">
                                {authRequests.length === 0 && boletoAlerts.length === 0 ? <p className="px-4 py-8 text-center text-sm text-slate-400">Sistema sem pendências.</p> : 
                                  <>
                                      {boletoAlerts.map(req=>(
                                        <div key={req.id} onClick={()=>{setNavTargetMenu('boleto'); setActiveTab('lancamento'); setShowNotifications(false);}} className="p-4 hover:bg-slate-50 relative group cursor-pointer">
                                          <p className="text-xs font-bold text-amber-600 mb-0.5 flex items-center"><AlertCircle size={14} className="mr-1"/> Vencimento de Boleto</p>
                                          <p className="text-sm font-medium text-slate-800 leading-tight mb-2 pr-4">{req.emitenteNota || 'S/ Fornecedor'}</p>
                                          <div className="flex justify-between items-center text-xs">
                                            <span className="text-slate-500">Valor: <strong className="text-slate-700">{formatCurrency(req.valorTotalFinal)}</strong></span>
                                            <span className="text-rose-600 font-bold">{req.diffDays === 0 ? 'Vence Hoje!' : req.diffDays < 0 ? `Atrasado ${Math.abs(req.diffDays)} dias` : `Faltam ${req.diffDays} dias`}</span>
                                          </div>
                                        </div>
                                      ))}
                                      {authRequests.map(req=>(
                                        <div key={req.id} className="p-4 hover:bg-slate-50 relative group">
                                          <button onClick={(e)=>{e.stopPropagation(); handleDismissNotification(req.id);}} className="absolute top-3 right-3 text-slate-300 hover:text-slate-600 opacity-0 group-hover:opacity-100"><X size={14}/></button>
                                          <p className="text-xs font-semibold text-rose-600 mb-0.5 flex items-center"><Shield size={12} className="mr-1"/> {req.requestedBy} solicitou:</p>
                                          <p className="text-sm font-medium text-slate-800 leading-tight mb-3 pr-4">{req.entryDesc}</p>
                                          <div className="bg-slate-100 border border-slate-200 rounded p-2 text-center">
                                            <span className="text-[10px] text-slate-500 uppercase font-bold tracking-wider block mb-0.5">Autorização gerada</span>
                                            <span className="font-mono text-lg tracking-[0.2em] font-bold text-slate-900">{req.code}</span>
                                          </div>
                                        </div>
                                      ))}
                                  </>
                                }
                              </div>
                            </div>
                          )}
                        </div>
                      )}
                      
                      <div className="hidden lg:block text-right pr-2">
                        <div className="text-sm font-medium leading-none text-slate-200">{currentUser.nome.split(' ')[0]}</div>
                        <div className="text-[10px] font-bold tracking-wider uppercase text-slate-500 mt-1">{currentUser.role === 'admin' ? 'Admin' : 'Membro'}</div>
                      </div>
                      
                      <button onClick={handleLogout} className="text-slate-400 hover:text-rose-400 hover:bg-slate-800 p-2 rounded-md transition-colors" title="Encerrar Sessão">
                        <LogOut size={18}/>
                      </button>
                    </div>
                  </div>
                </div>
              </header>

              <main className="flex-1 w-full max-w-[1400px] mx-auto p-4 sm:p-6 lg:p-8">
                {activeTab === 'dashboard' && renderDashboard()}
                {activeTab === 'form' && renderForm()}
                {activeTab === 'table' && renderTable()}
                {activeTab === 'rota' && <RotaTab departamentos={departamentos} />}
                {activeTab === 'vinculo' && <VinculoTab entries={entries} rotasAtivas={rotasAtivas} rotasFinalizadas={rotasFinalizadas} vinculos={vinculos} currentUser={currentUser} cartoes={cartoes} departamentos={departamentos} />}
                {activeTab === 'lancamento' && <LancamentoTab vinculos={vinculos} currentUser={currentUser} cartoes={cartoes} navTargetMenu={navTargetMenu} />}
                {activeTab === 'gerencia' && currentUser.role === 'admin' && renderGerencia()}
              </main>
              
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
