<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rateio de Refeições</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Para transpilar o JSX no navegador) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        @media print {
            body { background: white !important; }
            .print\:hidden { display: none !important; }
            .print\:block { display: block !important; }
            .print\:border-none { border: none !important; }
            .print\:shadow-none { box-shadow: none !important; }
            .print\:text-xs { font-size: 0.75rem !important; }
            .print\:p-0 { padding: 0 !important; }
            .print\:m-0 { margin: 0 !important; }
            .print\:border-black { border-color: black !important; }
            .print\:bg-transparent { background-color: transparent !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div id="root"></div>

    <!-- Módulo de Importação do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseAPI = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection
        };
        window.dispatchEvent(new Event('firebase-loaded'));
    </script>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- ÍCONES ---
        const Icon = (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props} />;
        const Upload = (p) => <Icon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></Icon>;
        const Calculator = (p) => <Icon {...p}><rect x="4" y="2" width="16" height="20" rx="2" ry="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="16" y1="14" x2="16" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></Icon>;
        const Search = (p) => <Icon {...p}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>;
        const Plus = (p) => <Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
        const Trash2 = (p) => <Icon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Icon>;
        const LogOut = (p) => <Icon {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Icon>;
        const Lock = (p) => <Icon {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>;

        // --- CONFIGURAÇÕES PADRÃO ---
        const CATEGORIAS = ['Fixos', 'Totalmente Isentos', 'Isentos por Salário', 'Não Isentos', 'Outras Entidades', 'Rescisões'];
        const basePrices = { almoco: 35, outras: 35, depMeiaAlmoco: 7, depMeiaOutras: 7, depIntAlmoco: 35, depIntOutras: 35 };
        const DEFAULT_SETTINGS = {
          fixedRate: 165,
          dependentLimit: 3,
          mealTimes: { cafe: { start: '05:00', end: '10:00' }, almoco: { start: '10:01', end: '15:00' }, janta: { start: '15:01', end: '23:59' } },
          categoryRules: {
            'Totalmente Isentos': { weekday: { ...basePrices, almoco: 0, outras: 0 }, weekend: { ...basePrices, almoco: 0, outras: 0 } },
            'Isentos por Salário': { weekday: { ...basePrices, almoco: 0 }, weekend: { ...basePrices, almoco: 0 } },
            'Não Isentos': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Outras Entidades': { weekday: { ...basePrices }, weekend: { ...basePrices } },
            'Rescisões': { weekday: { ...basePrices }, weekend: { ...basePrices } }
          }
        };

        // --- COMPONENTE LOGIN ---
        const LoginView = ({ onLogin }) => {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                const success = onLogin(email, password);
                if (!success) setError('Usuário ou senha incorretos.');
            };

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-xl shadow-lg border border-slate-200 p-8">
                        <div className="flex flex-col items-center mb-8">
                            <div className="bg-blue-600 p-3 rounded-xl mb-4"><Calculator className="h-8 w-8 text-white" /></div>
                            <h1 className="text-2xl font-bold text-slate-800">RateioRefeições</h1>
                            <p className="text-sm text-slate-500 mt-1">Faça login para continuar</p>
                        </div>
                        {error && <div className="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-6 flex items-center">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-5">
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Login</label>
                                <input type="text" required value={email} onChange={(e) => setEmail(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="seu.email@adventistas.org" />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                                <input type="password" required value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="••••••••" />
                            </div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center">
                                <Lock className="w-4 h-4 mr-2" /> Entrar
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE PRINCIPAL APP ---
        function RateioApp({ firebaseApi }) {
          const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, getDoc, collection } = firebaseApi;

          const USER_FIREBASE_CONFIG = {
              apiKey: "AIzaSyBIAhPGUpyWC_J_P0iPfDQrnUDbTrHaNRI",
              authDomain: "rateio-fc8b0.firebaseapp.com",
              projectId: "rateio-fc8b0",
              storageBucket: "rateio-fc8b0.firebasestorage.app",
              messagingSenderId: "1035068788064",
              appId: "1:1035068788064:web:6cb011eb1bc3c0e39d2205"
          };

          const { auth, db, envAppId } = useMemo(() => {
              const config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : USER_FIREBASE_CONFIG;
              const app = initializeApp(config);
              const auth = getAuth(app);
              const db = getFirestore(app);
              const envAppId = typeof __app_id !== 'undefined' ? __app_id : 'rateio-app';
              return { auth, db, envAppId };
          }, []);

          const [user, setUser] = useState(null);
          const [dataLoaded, setDataLoaded] = useState(false);
          const [appUser, setAppUser] = useState(null);
          
          const [appUsers, setAppUsers] = useState([{ id: 1, email: 'nicholas.ganhadeiro@adventistas.org', password: 'Fap1624', role: 'admin' }]);
          const [settings, setSettings] = useState(DEFAULT_SETTINGS);
          const [employees, setEmployees] = useState(MOCK_EMPLOYEES);
          const [period, setPeriod] = useState('04/2026');
          const [rawScans, setRawScans] = useState([]);
          const [manualCharges, setManualCharges] = useState([]);
          const [activeTab, setActiveTab] = useState('import');
          const [notification, setNotification] = useState(null);

          // 1. Auth Inicial
          useEffect(() => {
              const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                  await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                  await signInAnonymously(auth);
                }
              };
              initAuth();
              const unsubscribe = onAuthStateChanged(auth, setUser);
              return () => unsubscribe();
          }, [auth]);

          // 2. Carregar Dados do Firestore (Caminhos Corrigidos - Segmentos Pares)
          useEffect(() => {
              if (!user) return;
              const loadData = async () => {
                try {
                  const appId = envAppId;
                  
                  // Coleções e Documentos de configuração compartilhado
                  const usersSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appUsers', 'main'));
                  if (usersSnap.exists()) setAppUsers(usersSnap.data().list || []);

                  const settingsSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'));
                  if (settingsSnap.exists()) setSettings(settingsSnap.data());

                  const empSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', 'main'));
                  if (empSnap.exists()) setEmployees(empSnap.data().list || []);

                  // Estado privado da sessão
                  const stateSnap = await getDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'state', 'current'));
                  if (stateSnap.exists()) {
                     setPeriod(stateSnap.data().period || '04/2026');
                     setManualCharges(stateSnap.data().manualCharges || []);
                     setRawScans(stateSnap.data().rawScans || []);
                  }
                } catch (e) {
                  console.error("Erro no Firebase:", e);
                } finally {
                  setDataLoaded(true);
                }
              };
              loadData();
          }, [user, db, envAppId]);

          // 3. Salvamento Automático
          useEffect(() => {
              if (!user || !dataLoaded) return;
              const appId = envAppId;
              const timer = setTimeout(() => {
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'appUsers', 'main'), { list: appUsers });
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'main'), settings);
                  setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'employees', 'main'), { list: employees });
                  setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'state', 'current'), { period, manualCharges, rawScans });
              }, 800);
              return () => clearTimeout(timer);
          }, [appUsers, settings, employees, period, manualCharges, rawScans, user, dataLoaded]);

          // --- LÓGICA DE CÁLCULO ---
          const processedData = useMemo(() => {
            const empMap = {};
            employees.forEach(e => {
              empMap[e.code] = { ...e, totalValue: e.category === 'Fixos' ? settings.fixedRate : 0, records: [] };
            });

            rawScans.forEach(scan => {
              const isDep = scan.fullCode.includes('-');
              const baseCode = isDep ? scan.fullCode.split('-')[0] : scan.fullCode;
              if (!empMap[baseCode]) empMap[baseCode] = { code: baseCode, name: scan.name || 'Desconhecido', category: 'Não Isentos', totalValue: 0, records: [] };
              
              const emp = empMap[baseCode];
              if (emp.category === 'Fixos') return;

              const [dateStr, timeStr] = scan.dateTime.split(' ');
              const t = timeStr || '12:00';
              let mealType = 'almoco';
              if (t >= settings.mealTimes.cafe.start && t <= settings.mealTimes.cafe.end) mealType = 'cafe';
              else if (t >= settings.mealTimes.janta.start && t <= settings.mealTimes.janta.end) mealType = 'janta';

              const dayType = isWeekend(dateStr, mealType) ? 'weekend' : 'weekday';
              const rules = settings.categoryRules[emp.category]?.[dayType] || basePrices;

              let charge = 0;
              let reason = '';

              if (isDep) {
                const parts = scan.fullCode.split('-');
                let seq = 1;
                let type = null;
                if (parts.length === 3) { seq = parseInt(parts[1]); type = parseInt(parts[2]); }
                else if (parts.length === 2) { 
                    const s = parts[1]; 
                    if (s.length >= 2) { seq = parseInt(s.substring(0, s.length-1)); type = parseInt(s.substring(s.length-1)); }
                    else { seq = parseInt(s); }
                }

                if (seq > settings.dependentLimit) {
                    charge = mealType === 'almoco' ? rules.depIntAlmoco : rules.depIntOutras;
                    reason = `Dep. Inteira (Acima da Cota)`;
                } else {
                    const finalType = type !== null ? type : 1;
                    if (finalType === 0) charge = 0;
                    else if (finalType === 1) charge = mealType === 'almoco' ? rules.depMeiaAlmoco : rules.depMeiaOutras;
                    else charge = mealType === 'almoco' ? rules.depIntAlmoco : rules.depIntOutras;
                    reason = `Dep. ${finalType === 0 ? 'Isento' : finalType === 1 ? 'Meia' : 'Inteira'}`;
                }
              } else {
                charge = mealType === 'almoco' ? rules.almoco : rules.outras;
                reason = mealType === 'almoco' ? 'Almoço' : 'Outra Ref.';
              }

              emp.totalValue += charge;
              emp.records.push({ ...scan, charge, reason: `${reason} (${mealType})` });
            });

            manualCharges.forEach(mc => {
              if (empMap[mc.code]) {
                empMap[mc.code].totalValue += Number(mc.amount);
                empMap[mc.code].records.push({ dateTime: mc.date || 'Manual', charge: Number(mc.amount), reason: `Manual: ${mc.reason || ''}` });
              }
            });

            return Object.values(empMap).filter(e => e.totalValue > 0 || e.category === 'Fixos');
          }, [rawScans, employees, settings, manualCharges]);

          const handleAppLogin = (email, password) => {
            const found = appUsers.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
            if (found) { setAppUser(found); return true; }
            return false;
          };

          if (!dataLoaded) return <div className="min-h-screen flex items-center justify-center font-bold text-blue-600">Sincronizando Sistema...</div>;
          if (!appUser) return <LoginView onLogin={handleAppLogin} />;

          return (
            <div className="min-h-screen flex flex-col">
              <header className="bg-white border-b px-6 py-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
                <div className="flex items-center gap-2">
                  <div className="bg-blue-600 p-2 rounded text-white"><Calculator /></div>
                  <h1 className="font-bold text-xl">RateioRefeições</h1>
                </div>
                <nav className="flex gap-1 bg-slate-100 p-1 rounded-lg">
                  <button onClick={() => setActiveTab('import')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'import' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Importar</button>
                  <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'dashboard' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Relatórios</button>
                  {appUser.role === 'admin' && <button onClick={() => setActiveTab('config')} className={`px-4 py-2 rounded-md text-sm font-medium ${activeTab === 'config' ? 'bg-white shadow text-blue-600' : 'text-slate-600'}`}>Ajustes</button>}
                </nav>
                <div className="flex items-center gap-4">
                  <span className="text-xs font-bold text-slate-500 hidden md:block">{appUser.email}</span>
                  <button onClick={() => setAppUser(null)} className="text-red-500 p-2 hover:bg-red-50 rounded"><LogOut /></button>
                </div>
              </header>

              <main className="flex-1 max-w-6xl w-full mx-auto p-6">
                {activeTab === 'import' && (
                  <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 text-center">
                    <Upload className="mx-auto h-12 w-12 text-blue-500 mb-4" />
                    <h2 className="text-xl font-bold mb-4">Importar Marcações</h2>
                    <input type="file" accept=".csv" onChange={(e) => {
                      const file = e.target.files[0];
                      if (!file) return;
                      const reader = new FileReader();
                      reader.onload = (ev) => {
                        const lines = ev.target.result.split('\n');
                        const parsed = [];
                        for(let i=1; i<lines.length; i++) {
                          const p = lines[i].trim().split(';');
                          if(p.length >= 2) parsed.push({ fullCode: p[0].trim(), dateTime: p[1].trim(), name: p[2] || '' });
                        }
                        setRawScans(parsed);
                        setActiveTab('dashboard');
                      };
                      reader.readAsText(file);
                    }} className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer" />
                  </div>
                )}

                {activeTab === 'dashboard' && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p className="text-xs font-bold text-slate-400 uppercase">Total do Período</p>
                        <p className="text-3xl font-black text-slate-800">R$ {processedData.reduce((a, b) => a + b.totalValue, 0).toFixed(2).replace('.', ',')}</p>
                      </div>
                      <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                        <p className="text-xs font-bold text-slate-400 uppercase">Funcionários Ativos</p>
                        <p className="text-3xl font-black text-slate-800">{processedData.length}</p>
                      </div>
                      <button onClick={() => {
                        const rows = [['Conta', 'Subconta', 'Valor', 'Finalidade']];
                        processedData.forEach(e => rows.push(['1135001', e.code, (e.totalValue * 100).toFixed(0), `Refeições ${period}`]));
                        const blob = new Blob(['\uFEFF' + rows.map(r => r.join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = `Rateio_${period.replace('/', '_')}.csv`;
                        link.click();
                      }} className="bg-green-600 text-white font-bold rounded-xl flex flex-col items-center justify-center hover:bg-green-700 transition-colors">
                        <Upload className="mb-1 rotate-180" /> Exportar CSV Contábil
                      </button>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                      <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b border-slate-200">
                          <tr>
                            <th className="px-6 py-4 font-bold">Cód.</th>
                            <th className="px-6 py-4 font-bold">Nome</th>
                            <th className="px-6 py-4 font-bold">Categoria</th>
                            <th className="px-6 py-4 font-bold text-right">Valor Final (R$)</th>
                          </tr>
                        </thead>
                        <tbody>
                          {processedData.map((emp, i) => (
                            <tr key={i} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-4 font-medium text-slate-600">{emp.code}</td>
                              <td className="px-6 py-4 font-bold text-slate-800">{emp.name}</td>
                              <td className="px-6 py-4"><span className="px-2 py-1 bg-slate-100 rounded text-[10px] font-bold uppercase text-slate-500">{emp.category}</span></td>
                              <td className="px-6 py-4 text-right font-black text-blue-600">R$ {emp.totalValue.toFixed(2).replace('.', ',')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {activeTab === 'config' && (
                  <div className="bg-white p-8 rounded-xl shadow-sm border border-slate-200 space-y-8">
                    <section>
                      <h2 className="text-xl font-bold mb-4 border-b pb-2">Regras de Negócio</h2>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                          <label className="block text-sm font-bold text-slate-700 mb-2">Cota Máxima de Dependentes</label>
                          <input type="number" value={settings.dependentLimit} onChange={e => setSettings({...settings, dependentLimit: Number(e.target.value)})} className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500" />
                          <p className="text-xs text-slate-400 mt-1">Dependentes excedentes são cobrados como Inteira automaticamente.</p>
                        </div>
                        <div>
                          <label className="block text-sm font-bold text-slate-700 mb-2">Mensalidade (Fixos)</label>
                          <input type="number" value={settings.fixedRate} onChange={e => setSettings({...settings, fixedRate: Number(e.target.value)})} className="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500" />
                        </div>
                      </div>
                    </section>

                    <section>
                      <h2 className="text-xl font-bold mb-4 border-b pb-2">Gestão de Acessos</h2>
                      <div className="flex flex-wrap gap-2 mb-4">
                        <input id="newLogin" placeholder="Novo Login (Email)" className="flex-1 border p-2 rounded-lg" />
                        <input id="newPass" placeholder="Senha" className="w-32 border p-2 rounded-lg" />
                        <button onClick={() => {
                          const email = document.getElementById('newLogin').value;
                          const pass = document.getElementById('newPass').value;
                          if(!email || !pass) return;
                          setAppUsers([...appUsers, { id: Date.now(), email, password: pass, role: 'user' }]);
                          document.getElementById('newLogin').value = '';
                          document.getElementById('newPass').value = '';
                        }} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">Criar Conta</button>
                      </div>
                      <div className="border rounded-lg overflow-hidden">
                        {appUsers.map((u, i) => (
                          <div key={i} className="flex justify-between items-center p-3 border-b last:border-0 hover:bg-slate-50">
                            <div><p className="font-bold text-sm">{u.email}</p><p className="text-[10px] text-slate-400 uppercase">{u.role}</p></div>
                            {u.id !== 1 && <button onClick={() => setAppUsers(appUsers.filter(x => x.id !== u.id))} className="text-red-400 p-2"><Trash2 size={16}/></button>}
                          </div>
                        ))}
                      </div>
                    </section>
                  </div>
                )}
              </main>
            </div>
          );
        }

        // --- CARREGADOR PRINCIPAL ---
        function AppLoader() {
           const [firebaseApi, setFirebaseApi] = useState(window.FirebaseAPI);
           useEffect(() => {
              if (!firebaseApi) {
                 const handleLoad = () => setFirebaseApi(window.FirebaseAPI);
                 window.addEventListener('firebase-loaded', handleLoad);
                 return () => window.removeEventListener('firebase-loaded', handleLoad);
              }
           }, [firebaseApi]);
           if (!firebaseApi) return <div className="min-h-screen flex items-center justify-center font-bold text-slate-400">Iniciando Firebase...</div>;
           return <RateioApp firebaseApi={firebaseApi} />;
        }

        const isWeekend = (d, m) => { if(!d) return false; const [day, month, year] = d.split('/'); const date = new Date(year, month-1, day); const dow = date.getDay(); return dow===0 || dow===6 || (dow===5 && m==='janta'); };
        const MOCK_EMPLOYEES = [{ code: '1001', name: 'Nicholas Ganhadeiro', category: 'Fixos' }];

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppLoader />);
    </script>
