<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAZA - Verificação e Autorização de Zona Acadêmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Exo+2:ital,wght@1,900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Exo 2', 'sans-serif'],
                    },
                    colors: {
                        cyan: { 400: '#00d9e6', 500: '#00f2ff' },
                        navy: { 900: '#06162e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #06162e; font-family: 'Inter', sans-serif; color: #e6f1ff; margin: 0; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .logo-font { font-family: 'Exo 2', sans-serif; font-style: italic; letter-spacing: -0.02em; }
        .glow-text { text-shadow: 0 0 25px rgba(0, 217, 230, 0.5); }
        
        /* CORREÇÃO DO FOCO (O "Detalhe Circulando") */
        input, textarea, select { 
            background: rgba(255, 255, 255, 0.05) !important; 
            border: 1px solid rgba(255, 255, 255, 0.1) !important; 
            color: white !important; 
            outline: none; 
            transition: all 0.2s; 
        }
        /* Efeito de anel neon forte ao focar */
        input:focus, select:focus, textarea:focus { 
            border-color: #00d9e6 !important; 
            box-shadow: 0 0 0 3px rgba(0, 217, 230, 0.4), 0 0 20px rgba(0, 217, 230, 0.2) !important; 
        }

        .btn-primary { background: #00d9e6; color: #06162e; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { background: #00f2ff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 217, 230, 0.4); }
        .status-badge { font-weight: 800; text-transform: uppercase; font-size: 0.6rem; padding: 0.2rem 0.5rem; border-radius: 0.3rem; }
        
        /* Estilos para input file */
        input[type="file"]::file-selector-button {
            margin-right: 20px; border: none; background: #00d9e6; padding: 10px 20px;
            border-radius: 10px; color: #06162e; cursor: pointer; font-weight: bold;
        }

        /* Estilo para abas */
        .tab-btn { transition: all 0.3s ease; border: 1px solid transparent; }
        .tab-btn.active { background: #00d9e6; color: #06162e; font-weight: 900; box-shadow: 0 0 15px rgba(0, 217, 230, 0.3); }
        .tab-btn.inactive { background: rgba(255,255,255,0.05); color: #94a3b8; border-color: rgba(255,255,255,0.1); }
        .tab-btn.inactive:hover { background: rgba(255,255,255,0.1); color: white; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #06162e; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d9e6; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Container para Notificações (Toasts) -->
    <div id="toast-container" class="fixed bottom-4 left-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
    
    <button id="fullscreenBtn" class="fixed bottom-4 right-4 z-50 bg-white/5 hover:bg-cyan-400/20 text-gray-400 hover:text-cyan-400 p-3 rounded-full backdrop-blur-sm border border-white/5 transition-all shadow-lg group" title="Tela Cheia">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, onSnapshot, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- 1. HELPERS E TOAST ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800/90 border-gray-700';
            let icon = 'ℹ️';
            
            if (type === 'success') { bgClass = 'bg-green-900/90 border-green-700 text-green-100'; icon = '✅'; } 
            else if (type === 'error') { bgClass = 'bg-red-900/90 border-red-700 text-red-100'; icon = '❌'; } 
            else if (type === 'warning') { bgClass = 'bg-amber-900/90 border-amber-700 text-amber-100'; icon = '⚠️'; } 
            else { bgClass = 'bg-blue-900/90 border-blue-700 text-blue-100'; icon = '⏳'; }
            
            toast.className = `${bgClass} backdrop-blur-md border px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform transition-all duration-500 translate-y-10 opacity-0 pointer-events-auto min-w-[250px] max-w-sm`;
            toast.innerHTML = `<span class="text-lg">${icon}</span><span class="text-xs font-bold uppercase tracking-wide">${message}</span>`;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-10'); setTimeout(() => toast.remove(), 500); }, 4000);
        }

        function log(msg, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${msg}`);
            if(type === 'error' || type === 'success' || msg.includes("Iniciando") || msg.includes("Conectando") || msg.includes("Bem-vindo") || msg.includes("Local")) {
                showToast(msg, type);
            }
        }

        function getLogoHTML(sizeClass = "text-6xl") {
            return `<div class="logo-font ${sizeClass} font-black select-none flex items-center justify-center gap-[2px]"><span class="text-white">VA</span><span class="text-[#00d9e6] glow-text relative" style="top: 2px;">7</span><span class="text-white">A</span></div>`;
        }

        function getStatusColor(s) {
            if (s === 'aprovado') return 'border-cyan-400';
            if (s === 'pendente') return 'border-amber-400';
            if (s === 'recusado' || s === 'nao_compareceu') return 'border-red-400';
            return 'border-gray-500';
        }

        function getStatusBadgeColor(s) {
            if (s === 'aprovado') return 'bg-cyan-400/20 text-cyan-400';
            if (s === 'pendente') return 'bg-amber-400/20 text-amber-400';
            if (s === 'recusado' || s === 'nao_compareceu') return 'bg-red-400/20 text-red-400';
            return 'bg-gray-500/20 text-gray-400';
        }

        // --- 2. CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_BQH9Re7ynHnGyynxbY2dOMS5MlgN7Jc",
            authDomain: "vaza-84361.firebaseapp.com",
            projectId: "vaza-84361",
            storageBucket: "vaza-84361.firebasestorage.app",
            messagingSenderId: "362255002224",
            appId: "1:362255002224:web:ea3eb4d7c6d37ceb4062b5",
            measurementId: "G-YGPYBVJ2E4"
        };

        let app, auth, db;
        const appId = 'vaza-app-production';
        let userProfile = null;
        let isLoading = false;
        let isAuthReady = false;

        const LOCAL_USERS = {
            'admin': { name: 'Super Admin', role: 'admin', password: 'Fap1624' },
            'portaria': { name: 'Portaria (Local)', role: 'portaria', password: '123' },
            'preceptoria': { name: 'Preceptor (Local)', role: 'preceptor', password: '123' },
            '1001': { name: 'Aluno Teste', role: 'aluno', password: '123' }
        };

        try { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); } catch (e) { console.error(e); }

        document.getElementById('fullscreenBtn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        // --- 3. FUNÇÕES GLOBAIS IMPORTANTES (DEFINIDAS PRIMEIRO) ---

        // Função de deletar usuário (CORRIGIDA E GLOBAL)
        window.deleteUser = async (id) => {
            if(!confirm(`Tem certeza que deseja EXCLUIR o usuário "${id}"? Esta ação não pode ser desfeita.`)) return;
            showLoading(true);
            try { 
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', id)); 
                showToast("Usuário excluído com sucesso.", 'success'); 
                if(window.renderAdminUserList) window.renderAdminUserList(); 
            } catch(e) { 
                log("Erro ao excluir: " + e.message, 'error'); 
            } finally {
                showLoading(false);
            }
        };

        window.atualizarPedido = async (id, status) => {
            showLoading(true);
            try {
                if (!db) throw new Error("Banco de dados não conectado.");
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'solicitacoes', id), { status });
                showToast(`Pedido ${status.replace('_', ' ')} com sucesso!`, 'success');
            } catch (e) {
                console.error(e);
                let msg = e.message;
                if (msg.includes("permission-denied")) msg = "Permissão negada. Domínio não autorizado no Firebase?";
                showToast("Erro: " + msg, 'error');
            } finally {
                showLoading(false);
            }
        };

        window.seedUsers = async () => {
            if(!confirm("Resetar banco de dados?\nIsso criará o usuário admin (Fap1624) e outros de teste.")) return;
            showToast("Iniciando processo...", 'info');
            showLoading(true);
            try {
                if(!auth.currentUser) await signInAnonymously(auth);
                const users = [
                    { id: 'admin', data: { name: 'Administrador', role: 'admin', password: 'Fap1624' } },
                    { id: 'portaria', data: { name: 'Portaria Central', role: 'portaria', password: '123' } },
                    { id: 'preceptoria', data: { name: 'Coordenação Acadêmica', role: 'preceptor', password: '123' } },
                    { id: '1001', data: { name: 'Ana Souza', role: 'aluno', password: '123' } }
                ];
                for(const u of users) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', u.id), u.data);
                showToast("Sucesso! Admin: admin / Fap1624", 'success');
            } catch (error) { showToast("Erro: " + error.message, 'error'); } 
            finally { showLoading(false); }
        };

        window.safeSeedUsers = () => {
            if (typeof window.seedUsers === 'function') window.seedUsers();
            else alert("Carregando sistema...");
        };

        window.handleManualAddUser = async (roleOverride) => {
            const role = roleOverride || document.getElementById('new_role').value;
            const id = document.getElementById('new_id').value;
            const name = document.getElementById('new_name').value;
            const pass = document.getElementById('new_pass').value;
            if(!role || !id || !name || !pass) { showToast("Preencha todos os campos", 'error'); return; }
            
            showLoading(true);
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', id), { role, name, password: pass });
                showToast("Usuário adicionado!", 'success');
                document.getElementById('new_id').value = ''; document.getElementById('new_name').value = '';
                if(window.renderAdminUserList) window.renderAdminUserList();
            } catch (e) { showToast("Erro: " + e.message, 'error'); } finally { showLoading(false); }
        };

        // --- 4. LÓGICA DE LOGIN E RENDERIZAÇÃO ---

        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login_user').value.trim();
            const pass = document.getElementById('login_pass').value.trim();
            if(!identifier || !pass) return;

            showLoading(true);
            try {
                if (isAuthReady) {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', identifier);
                    const userSnap = await getDoc(userDocRef);
                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        if (userData.password === pass) {
                            userProfile = { uid: identifier, name: userData.name, role: userData.role };
                            showToast(`Bem-vindo, ${userData.name}!`, 'success');
                            render();
                            return; 
                        } else {
                            showToast("Senha incorreta (Nuvem).", 'error');
                            showLoading(false);
                            return;
                        }
                    }
                }
            } catch (err) { console.warn("Falha no Firebase, tentando local...", err); }

            if (LOCAL_USERS[identifier]) {
                const localUser = LOCAL_USERS[identifier];
                if (localUser.password === pass) {
                    userProfile = { uid: identifier, name: localUser.name, role: localUser.role };
                    showToast("⚠️ Modo Local ativado", 'warning');
                    render();
                } else { showToast("Senha incorreta.", 'error'); }
            } else { showToast("Usuário não encontrado.", 'error'); }
            showLoading(false);
        }

        function render() {
            const container = document.getElementById('app');
            if (!userProfile) renderLogin(container);
            else renderDashboard(container);
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-400/10 rounded-full blur-[100px]"></div>
                    <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[100px]"></div>
                    <div class="max-w-md w-full glass-card p-12 rounded-[2.5rem] shadow-2xl relative z-10">
                        ${isLoading ? `<div class="absolute inset-0 bg-[#06162e]/90 z-50 flex flex-col items-center justify-center rounded-[2.5rem] backdrop-blur-sm"><span class="text-cyan-400 text-xs font-bold uppercase tracking-widest animate-pulse">Carregando...</span></div>` : ''}
                        <div class="text-center mb-12">${getLogoHTML("text-7xl")}<p class="text-cyan-400/60 text-[10px] font-bold uppercase tracking-[0.15em] mt-4 leading-relaxed">Verificação e Autorização de<br>Zona Acadêmica</p></div>
                        <form id="loginForm" class="space-y-6">
                            <div class="relative group"><label class="block text-[10px] font-bold text-gray-500 uppercase ml-1 mb-2 tracking-[0.2em] text-center">Identificação</label><input type="text" id="login_user" class="w-full p-4 rounded-2xl text-lg text-center font-bold" placeholder="ID / RA / Admin" required></div>
                            <div class="relative group"><label class="block text-[10px] font-bold text-gray-500 uppercase ml-1 mb-2 tracking-[0.2em] text-center">Credencial</label><input type="password" id="login_pass" class="w-full p-4 rounded-2xl text-lg text-center font-bold" placeholder="Senha" required></div>
                            <button type="submit" class="w-full btn-primary py-5 rounded-2xl shadow-lg mt-4 text-sm font-black tracking-widest">Entrar</button>
                        </form>
                        <div class="mt-8 pt-6 border-t border-white/5 text-center"><button onclick="window.safeSeedUsers()" class="text-[10px] text-gray-500 hover:text-cyan-400 transition-colors uppercase tracking-wider font-bold">[ Criar Usuários de Teste ]</button></div>
                    </div>
                </div>`;
            const form = document.getElementById('loginForm');
            if(form) form.onsubmit = handleLogin;
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    <nav class="bg-[#06162e]/80 backdrop-blur-md border-b border-white/5 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
                        <div class="flex items-center gap-4">${getLogoHTML("text-3xl")}<span class="bg-cyan-400/10 border border-cyan-400/20 text-cyan-400 px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">${userProfile.role}</span></div>
                        <div class="flex items-center gap-6"><div class="text-right hidden md:block"><p class="text-xs font-bold text-white tracking-wide">${userProfile.name}</p><p class="text-[9px] text-cyan-400/60 uppercase font-black tracking-widest mt-0.5">ID: ${userProfile.uid}</p></div><button id="logoutBtn" class="bg-white/5 hover:bg-red-500/10 hover:text-red-400 text-gray-400 px-5 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all border border-transparent hover:border-red-500/20">Sair</button></div>
                    </nav>
                    <main id="dashboard-content" class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-8"></main>
                </div>`;
            document.getElementById('logoutBtn').onclick = () => { userProfile = null; render(); };
            const content = document.getElementById('dashboard-content');
            
            if (userProfile.role === 'admin') renderAdminDashboard(content);
            else if (userProfile.role === 'aluno') renderAluno(content);
            else if (userProfile.role === 'preceptor') renderPreceptor(content);
            else renderPortaria(content);
        }

        // --- 5. TELAS ESPECÍFICAS ---

        // ADMIN
        function renderAdminDashboard(container) {
            container.innerHTML = `
                <div class="mb-8 flex flex-wrap gap-3 justify-center md:justify-start border-b border-white/10 pb-6">
                    <button onclick="window.switchTab('management')" id="tab-management" class="tab-btn active px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Gestão</button>
                    <button onclick="window.switchTab('aluno')" id="tab-aluno" class="tab-btn inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Aluno</button>
                    <button onclick="window.switchTab('preceptor')" id="tab-preceptor" class="tab-btn inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Preceptor</button>
                    <button onclick="window.switchTab('portaria')" id="tab-portaria" class="tab-btn inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Portaria</button>
                </div>
                <div id="admin-view-area"></div>
            `;
            window.switchTab = (view) => {
                document.querySelectorAll('.tab-btn').forEach(btn => { btn.classList.remove('active'); btn.classList.add('inactive'); });
                document.getElementById(`tab-${view}`).classList.replace('inactive', 'active');
                const area = document.getElementById('admin-view-area');
                if(view === 'management') renderAdminTools(area);
                else if(view === 'aluno') renderAluno(area);
                else if(view === 'preceptor') renderPreceptor(area);
                else if(view === 'portaria') renderPortaria(area);
            };
            window.switchTab('management');
        }

        // FUNÇÃO DE LISTA DE USUÁRIOS (GLOBAL)
        window.renderAdminUserList = async () => {
            const list = document.getElementById('admin-users-list');
            if(!list) return;
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'usuarios'));
            list.innerHTML = snap.empty ? '<tr><td colspan="5" class="p-4 text-center italic">Vazio.</td></tr>' : 
            snap.docs.map(d => `<tr class="border-b border-white/5"><td class="p-3 font-bold text-[10px] text-cyan-400">${d.data().role.toUpperCase()}</td><td class="p-3 text-xs">${d.id}</td><td class="p-3 font-bold">${d.data().name}</td><td class="p-3 text-xs opacity-50">${d.data().password}</td><td class="p-3 text-right"><button onclick="window.deleteUser('${d.id}')" class="text-red-500 font-bold text-[10px] hover:text-red-400 transition-colors uppercase border border-red-500/30 px-2 py-1 rounded">EXCLUIR</button></td></tr>`).join('');
        };

        function renderAdminTools(container) {
            container.innerHTML = `
                <div class="grid lg:grid-cols-2 gap-8">
                    <div class="glass-card p-8 rounded-[2rem]"><h2 class="font-bold text-white text-lg mb-4">👤 Novo Usuário</h2><div class="space-y-4">
                        <select id="new_role" class="w-full p-3 rounded-xl text-sm font-bold text-navy-900"><option value="aluno">Aluno</option><option value="preceptor">Preceptor</option><option value="portaria">Portaria</option><option value="admin">Admin</option></select>
                        <input type="text" id="new_id" class="w-full p-3 rounded-xl text-sm" placeholder="Login (RA/ID)">
                        <input type="text" id="new_name" class="w-full p-3 rounded-xl text-sm" placeholder="Nome Completo">
                        <input type="text" id="new_pass" class="w-full p-3 rounded-xl text-sm" placeholder="Senha" value="123">
                        <button onclick="window.handleManualAddUser()" class="w-full btn-primary py-3 rounded-xl text-xs font-black">CADASTRAR</button>
                    </div></div>
                    <div class="glass-card p-8 rounded-[2rem]"><h2 class="font-bold text-white text-lg mb-4">📋 Usuários</h2><div class="overflow-auto max-h-60"><table class="w-full text-left text-white text-sm"><tbody id="admin-users-list"></tbody></table></div></div>
                </div>`;
            window.renderAdminUserList();
        }

        // ALUNO
        async function renderAluno(container) {
            container.innerHTML = `<div class="grid lg:grid-cols-5 gap-8"><div class="lg:col-span-2 space-y-6"><div class="glass-card p-8 rounded-[2rem] relative overflow-hidden"><h2 class="font-bold text-white text-lg mb-8 uppercase tracking-wide flex items-center gap-2"><span class="w-1.5 h-1.5 bg-cyan-400 rounded-full"></span> Nova Saída</h2><div class="space-y-5"><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Destino</label><input type="text" id="destino" class="w-full p-4 rounded-xl text-sm font-semibold" placeholder="Ex: Biblioteca Central"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Motivo</label><textarea id="motivo" class="w-full p-4 rounded-xl text-sm font-semibold" rows="3" placeholder="Ex: Pesquisa para TCC"></textarea></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Dia Saída</label><input type="date" id="data_saida" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Hora Saída</label><input type="time" id="h_saida" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Dia Retorno</label><input type="date" id="data_volta" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Hora Retorno</label><input type="time" id="h_volta" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div></div><button id="btnSolicitar" class="w-full btn-primary py-4 rounded-xl text-xs font-black tracking-wider mt-2">Solicitar Autorização</button></div></div></div><div class="lg:col-span-3"><h2 class="font-bold text-sm mb-6 text-gray-500 uppercase tracking-widest pl-2">Meus Pedidos</h2><div id="lista-pedidos-aluno" class="space-y-4"></div></div></div>`;
            
            const today = new Date().toISOString().split('T')[0];
            const dataSaidaEl = document.getElementById('data_saida');
            const dataVoltaEl = document.getElementById('data_volta');
            if(dataSaidaEl) dataSaidaEl.value = today;
            if(dataVoltaEl) dataVoltaEl.value = today;

            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.ra === userProfile.uid);
                const listEl = document.getElementById('lista-pedidos-aluno'); if(!listEl) return;
                listEl.innerHTML = docs.sort((a,b) => b.criadoEm.localeCompare(a.criadoEm)).map(s => `<div class="glass-card p-6 rounded-2xl flex justify-between items-center hover:bg-white/[0.05] transition-all group border-l-4 ${getStatusColor(s.status)}"><div><span class="status-badge ${getStatusBadgeColor(s.status)}">${s.status}</span><p class="font-bold text-white text-base mt-2 group-hover:text-cyan-400 transition-colors">${s.motivo}</p><p class="text-[10px] text-gray-500 uppercase mt-1 tracking-wider flex items-center gap-2"><span>${s.destino}</span></p></div><div class="text-right pl-4 border-l border-white/5"><p class="text-xs font-bold text-gray-400 mb-1">Saída: ${s.data_saida} ${s.h_saida}</p><p class="text-sm font-black text-cyan-400 whitespace-nowrap">Volta: ${s.data_volta} ${s.h_volta}</p></div></div>`).join('') || '<p class="text-gray-500 italic text-center">Nenhum pedido.</p>';
            });

            document.getElementById('btnSolicitar').onclick = async () => {
                const d_saida = document.getElementById('data_saida').value, h_saida = document.getElementById('h_saida').value;
                const d_volta = document.getElementById('data_volta').value, h_volta = document.getElementById('h_volta').value;
                const dest = document.getElementById('destino').value, mot = document.getElementById('motivo').value;
                if(!d_saida || !h_saida || !d_volta || !h_volta || !dest || !mot) { showToast("Preencha tudo!", 'warning'); return; }
                const btn = document.getElementById('btnSolicitar'); btn.innerText = "ENVIANDO..."; btn.disabled = true;
                try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes'), { ra: userProfile.uid, aluno: userProfile.name, destino: dest, motivo: mot, data_saida: d_saida, h_saida, data_volta: d_volta, h_volta, status: 'pendente', criadoEm: new Date().toISOString() }); document.getElementById('destino').value = ''; document.getElementById('motivo').value = ''; showToast("Enviado!", 'success'); } catch (e) { showToast("Erro: " + e.message, 'error'); } finally { btn.innerText = "Solicitar Autorização"; btn.disabled = false; }
            };
        }

        // PRECEPTOR
        function renderPreceptor(container) {
            container.innerHTML = `<div class="mb-6 flex gap-3 border-b border-white/10 pb-4"><button onclick="window.precTab('req')" id="ptab-req" class="tab-btn active px-4 py-2 rounded-lg text-xs font-bold uppercase">Solicitações</button><button onclick="window.precTab('block')" id="ptab-block" class="tab-btn inactive px-4 py-2 rounded-lg text-xs font-bold uppercase">Bloqueios</button><button onclick="window.precTab('new')" id="ptab-new" class="tab-btn inactive px-4 py-2 rounded-lg text-xs font-bold uppercase">Cadastrar Aluno</button></div><div id="preceptor-area"></div>`;
            window.precTab = (t) => {
                document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.add('inactive'); });
                document.getElementById(`ptab-${t}`).classList.replace('inactive', 'active');
                const area = document.getElementById('preceptor-area');
                if(t==='req') renderPreceptorRequests(area);
                if(t==='block') renderPreceptorBlocks(area);
                if(t==='new') renderPreceptorNewStudent(area);
            };
            renderPreceptorRequests(document.getElementById('preceptor-area'));
        }

        function renderPreceptorRequests(area) {
            area.innerHTML = `<div class="glass-card p-4 rounded-xl mb-6 grid grid-cols-1 md:grid-cols-3 gap-4"><input type="text" id="filter_name" onkeyup="window.filterRequests()" class="p-3 rounded-lg text-sm bg-black/20 text-white placeholder-gray-500" placeholder="Filtrar por Nome..."><input type="text" id="filter_ra" onkeyup="window.filterRequests()" class="p-3 rounded-lg text-sm bg-black/20 text-white placeholder-gray-500" placeholder="Filtrar por RA..."><input type="date" id="filter_date" onchange="window.filterRequests()" class="p-3 rounded-lg text-sm bg-black/20 text-white text-gray-400"></div><div id="req-list" class="grid md:grid-cols-2 gap-4"></div>`;
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                window.allRequests = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.status === 'pendente');
                window.filterRequests(); 
            });
            window.filterRequests = () => {
                const nameF = document.getElementById('filter_name').value.toLowerCase();
                const raF = document.getElementById('filter_ra').value.toLowerCase();
                const dateF = document.getElementById('filter_date').value;
                const filtered = window.allRequests.filter(r => {
                    const matchName = r.aluno.toLowerCase().includes(nameF);
                    const matchRa = r.ra.toLowerCase().includes(raF);
                    const matchDate = !dateF || r.data_saida === dateF;
                    return matchName && matchRa && matchDate;
                });
                const listEl = document.getElementById('req-list');
                if(!listEl) return;
                listEl.innerHTML = filtered.map(s => `<div class="glass-card p-6 rounded-2xl relative overflow-hidden border-l-4 border-amber-400"><div class="flex justify-between mb-2"><h3 class="font-bold text-white">${s.aluno} <span class="text-xs text-gray-500 font-normal">(${s.ra})</span></h3><span class="text-xs text-amber-400 font-bold">PENDENTE</span></div><p class="text-xs text-gray-400 mb-2">Saída: ${s.data_saida} às ${s.h_saida} | Volta: ${s.data_volta} às ${s.h_volta}</p><div class="bg-black/30 p-3 rounded-lg mb-4 text-xs italic text-gray-300">"${s.motivo}"</div><div class="flex gap-2"><button onclick="window.atualizarPedido('${s.id}', 'aprovado')" class="flex-1 btn-primary py-2 rounded-lg text-[10px] font-black">APROVAR</button><button onclick="window.atualizarPedido('${s.id}', 'recusado')" class="flex-1 bg-red-500/20 text-red-400 py-2 rounded-lg text-[10px] font-bold hover:bg-red-500/30">NEGAR</button></div></div>`).join('') || '<p class="col-span-full text-center text-gray-500 italic">Nenhuma solicitação encontrada.</p>';
            };
        }

        function renderPreceptorBlocks(area) {
            area.innerHTML = `<div class="glass-card p-8 rounded-[2rem] max-w-lg mx-auto"><h2 class="font-bold text-white text-lg mb-4">🚫 Bloquear Aluno</h2><div class="space-y-4"><input type="text" id="block_ra" class="w-full p-3 rounded-xl text-sm" placeholder="RA do Aluno"><div class="grid grid-cols-2 gap-3"><div><label class="text-[10px] uppercase font-bold text-gray-500">Início</label><input type="date" id="block_start" class="w-full p-3 rounded-xl text-sm"></div><div><label class="text-[10px] uppercase font-bold text-gray-500">Fim</label><input type="date" id="block_end" class="w-full p-3 rounded-xl text-sm"></div></div><textarea id="block_reason" class="w-full p-3 rounded-xl text-sm" placeholder="Motivo do bloqueio..." rows="2"></textarea><button onclick="window.createBlock()" class="w-full bg-red-500 hover:bg-red-600 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider">Criar Bloqueio</button></div></div>`;
            window.createBlock = async () => {
                const ra = document.getElementById('block_ra').value;
                const start = document.getElementById('block_start').value;
                const end = document.getElementById('block_end').value;
                const reason = document.getElementById('block_reason').value;
                if(!ra || !start || !end) { showToast("Preencha os dados obrigatórios.", 'error'); return; }
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', ra);
                const userSnap = await getDoc(userRef);
                if(!userSnap.exists()) { showToast("Aluno não encontrado no sistema.", 'error'); return; }
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'bloqueios'), { ra, start, end, reason, createdBy: userProfile.name });
                showToast(`Bloqueio criado para ${userSnap.data().name}`, 'success');
                document.getElementById('block_ra').value = '';
            };
        }

        function renderPreceptorNewStudent(area) {
            area.innerHTML = `<div class="glass-card p-8 rounded-[2rem] max-w-lg mx-auto"><h2 class="font-bold text-white text-lg mb-4">🎓 Cadastrar Novo Aluno</h2><div class="space-y-4"><input type="text" id="new_id" class="w-full p-3 rounded-xl text-sm" placeholder="RA do Aluno"><input type="text" id="new_name" class="w-full p-3 rounded-xl text-sm" placeholder="Nome Completo"><input type="text" id="new_pass" class="w-full p-3 rounded-xl text-sm" placeholder="Senha Inicial" value="123"><button onclick="window.handleManualAddUser('aluno')" class="w-full btn-primary py-3 rounded-xl text-xs font-black">CADASTRAR</button></div></div>`;
        }

        // PORTARIA
        function renderPortaria(container) {
            container.innerHTML = `<div class="grid lg:grid-cols-3 gap-6 mb-6"><div class="lg:col-span-2"><h2 class="font-bold text-white text-xl mb-4 flex items-center gap-2"><span class="w-2 h-2 bg-cyan-400 rounded-full"></span> Autorizados (Aguardando Saída)</h2><div class="flex gap-2 mb-4"><input type="text" id="port_filter_text" onkeyup="window.filterPortaria()" class="w-full p-3 rounded-lg text-sm bg-black/20 text-white placeholder-gray-500" placeholder="Nome ou RA..."><input type="date" id="port_filter_date" onchange="window.filterPortaria()" class="p-3 rounded-lg text-sm bg-black/20 text-white text-gray-400"></div><div id="port-list" class="space-y-3"></div></div><div class="glass-card p-6 rounded-2xl h-fit"><h2 class="font-bold text-gray-400 text-sm uppercase mb-4 tracking-widest">Últimas Saídas / Histórico</h2><div id="port-history" class="space-y-2 text-xs text-gray-500">Carregando...</div></div></div>`;
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                const all = snap.docs.map(d => ({id: d.id, ...d.data()}));
                window.portariaApproved = all.filter(s => s.status === 'aprovado');
                const history = all.filter(s => s.status === 'finalizado' || s.status === 'nao_compareceu').sort((a,b) => b.criadoEm.localeCompare(a.criadoEm)).slice(0, 10);
                const histEl = document.getElementById('port-history');
                if(histEl) histEl.innerHTML = history.map(h => `<div class="flex justify-between py-2 border-b border-white/5"><span class="${h.status === 'finalizado' ? 'text-cyan-400' : 'text-red-400'} font-bold">${h.aluno}</span><span>${h.status === 'finalizado' ? 'SAIU' : 'FALTOU'}</span></div>`).join('') || 'Sem histórico recente.';
                window.filterPortaria(); 
            });
            window.filterPortaria = () => {
                const textF = document.getElementById('port_filter_text').value.toLowerCase();
                const dateF = document.getElementById('port_filter_date').value;
                const filtered = window.portariaApproved.filter(r => {
                    const matchText = r.aluno.toLowerCase().includes(textF) || r.ra.toLowerCase().includes(textF);
                    const matchDate = !dateF || r.data_saida === dateF;
                    return matchText && matchDate;
                });
                const listEl = document.getElementById('port-list');
                if(!listEl) return;
                listEl.innerHTML = filtered.map(s => `<div class="glass-card p-5 rounded-xl border-l-4 border-cyan-400 flex flex-col md:flex-row justify-between items-center gap-4"><div><h3 class="font-bold text-white text-lg">${s.aluno}</h3><p class="text-[10px] text-gray-400 uppercase tracking-widest">${s.ra} • Destino: ${s.destino}</p><p class="text-xs text-cyan-300 mt-1 font-mono">Saída: ${s.data_saida} às ${s.h_saida}</p></div><div class="flex gap-2 w-full md:w-auto"><button onclick="window.atualizarPedido('${s.id}', 'finalizado')" class="flex-1 md:flex-none bg-cyan-400 hover:bg-cyan-300 text-navy-900 px-6 py-3 rounded-xl text-xs font-black uppercase shadow-[0_0_15px_rgba(0,217,230,0.4)]">CONFIRMAR SAÍDA</button><button onclick="window.atualizarPedido('${s.id}', 'nao_compareceu')" class="flex-1 md:flex-none bg-gray-700 hover:bg-gray-600 text-white px-4 py-3 rounded-xl text-xs font-bold uppercase">NÃO COMPARECEU</button></div></div>`).join('') || '<p class="text-gray-500 italic text-center py-10">Ninguém aguardando saída com esses filtros.</p>';
            };
        }

        function showLoading(val) { 
            isLoading = val; 
            const app = document.getElementById('app');
            if (!userProfile && app) renderLogin(app);
        }

        async function init() {
            render(); 
            try {
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout conexão")), 5000));
                await Promise.race([signInAnonymously(auth), timeoutPromise]);
                log("Sistema Conectado!", 'success');
            } catch (error) {
                log("Falha na conexão inicial: " + error.message, 'error');
            }
            onAuthStateChanged(auth, (user) => { 
                isAuthReady = !!user;
                if (!userProfile) render(); 
            });
        }

        init();
    </script>
</body>
</html>
