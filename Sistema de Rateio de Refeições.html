                if (code && dateTime) {
                  parsedScans.push({ fullCode: code.trim(), dateTime: dateTime.trim(), name: name ? name.trim() : '' });
                }
              }
              setRawScans(parsedScans);
              showNotification(`Sucesso! ${parsedScans.length} registros processados.`);
              setActiveTab('dashboard');
            };
            reader.readAsText(file);
          };

          const exportToCSV = () => {
            if (processedData.length === 0) {
              showNotification("Não há dados para exportar.", "error");
              return;
            }

            const headers = ['Conta', 'Subconta', 'Fundo', 'Departamento', 'Restrição', 'Valor', 'Aviso', 'Finalidade'];
            const rows = [headers.join(';')];

            CATEGORIAS.forEach(categoria => {
              const empsInCategory = processedData.filter(emp => emp.category === categoria);
              let hasValidData = false;

              empsInCategory.forEach(emp => {
                if (emp.totalValue === 0 && emp.category !== 'Fixos') return;

                hasValidData = true;
                const isOutraEntidade = emp.category === 'Outras Entidades';
                
                let conta = isOutraEntidade ? '1136001' : '1135001';
                let subconta = isOutraEntidade ? '1122' : emp.code;
                
                if (emp.overrideAccount && emp.overrideAccount.trim() !== '') {
                  conta = emp.overrideAccount.trim();
                }
                if (isOutraEntidade && emp.overrideSubaccount && emp.overrideSubaccount.trim() !== '') {
                  subconta = emp.overrideSubaccount.trim();
                }

                const fundo = '10'; 
                const departamento = '110150501';
                const restricao = '0A';
                
                const valorStr = (emp.totalValue * 100).toFixed(0);
                const aviso = isOutraEntidade ? 'Y' : 'N';
                
                let finalidade = isOutraEntidade 
                  ? `${emp.name} e Família - Refeições - ${period}`
                  : `Adto. Salário - Refeições ${period}`;

                rows.push([conta, subconta, fundo, departamento, restricao, valorStr, aviso, finalidade].join(';'));
              });

              if (hasValidData) {
                rows.push([`Fim do Cálculo dos ${categoria}`, '', '', '', '', '', '', ''].join(';'));
              }
            });

            const csvContent = rows.join('\n');
            const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.setAttribute('download', `Rateio_Refeicoes_${period.replace('/', '_')}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
          };

          const showNotification = (msg, type = 'success') => {
            setNotification({ msg, type });
            setTimeout(() => setNotification(null), 4000);
          };

          // Ecrã de Loading enquanto o Firebase conecta e puxa os dados
          if (!dataLoaded) {
             return (
               <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans">
                 <Calculator className="h-12 w-12 text-blue-600 mb-4 animate-pulse" />
                 <h2 className="text-xl font-bold text-slate-700">Carregando seus dados...</h2>
                 <p className="text-sm text-slate-500 mt-2">Sincronizando com o banco de dados</p>
               </div>
             );
          }

          // Se não houver utilizador logado no APP, mostrar a tela de Login
          if (!appUser) {
             return <LoginView onLogin={handleAppLogin} />;
          }

          return (
            <div className="min-h-screen pb-12 print:bg-white print:pb-0">
              {notification && (
                <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg flex items-center text-white print:hidden ${notification.type === 'error' ? 'bg-red-600' : 'bg-green-600'}`}>
                  <CheckCircle2 className="w-5 h-5 mr-2" /> {notification.msg}
                </div>
              )}

              <header className="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-40 print:hidden shadow-sm">
                <div className="max-w-6xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div className="flex items-center space-x-2">
                    <div className="bg-blue-600 p-2 rounded-lg"><Calculator className="h-6 w-6 text-white" /></div>
                    <h1 className="text-xl font-bold text-blue-800">RateioRefeições</h1>
                  </div>
                  
                  <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 w-full md:w-auto">
                      <nav className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-lg">
                        <button onClick={() => setActiveTab('import')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${activeTab === 'import' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Importar CSV</button>
                        <button onClick={() => setActiveTab('manual')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${activeTab === 'manual' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Lançamentos Manuais</button>
                        <button onClick={() => setActiveTab('dashboard')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${activeTab === 'dashboard' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Relatórios & Exportar</button>
                        
                        {/* Apenas administradores veem a aba de configurações */}
                        {appUser.role === 'admin' && (
                            <button onClick={() => setActiveTab('config')} className={`px-4 py-2 text-sm font-medium rounded-md transition-all ${activeTab === 'config' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Configurações</button>
                        )}
                      </nav>

                      {/* Controle de Utilizador (Header Direito) */}
                      <div className="flex items-center border-l border-slate-200 pl-4 ml-2">
                          <div className="flex flex-col text-right mr-3 hidden md:flex">
                              <span className="text-sm font-bold text-slate-800 leading-tight">{appUser.email.split('@')[0]}</span>
                              <span className="text-xs text-slate-500 font-medium">{appUser.role === 'admin' ? 'Administrador' : 'Usuário'}</span>
                          </div>
                          <button onClick={handleAppLogout} className="bg-red-50 text-red-600 hover:bg-red-100 hover:text-red-700 p-2 rounded-lg transition-colors" title="Sair">
                              <LogOut className="w-5 h-5" />
                          </button>
                      </div>
                  </div>
                </div>
              </header>

              <main className="max-w-6xl mx-auto p-4 md:p-6 mt-2 md:mt-4 print:p-0 print:m-0 print:max-w-none">
                {activeTab === 'import' && <ImportView period={period} setPeriod={setPeriod} handleFileUpload={handleFileUpload} />}
                {activeTab === 'manual' && <ManualChargeView employees={employees} manualCharges={manualCharges} setManualCharges={setManualCharges} showNotification={showNotification} />}
                {activeTab === 'dashboard' && <DashboardView processedData={processedData} exportToCSV={exportToCSV} period={period} />}
                {activeTab === 'config' && appUser.role === 'admin' && <ConfigView settings={settings} setSettings={setSettings} employees={employees} setEmployees={setEmployees} appUsers={appUsers} setAppUsers={setAppUsers} appUserRole={appUser.role} showNotification={showNotification} />}
              </main>
            </div>
          );
        }

        function AppLoader() {
           const [firebaseApi, setFirebaseApi] = useState(window.FirebaseAPI);

           useEffect(() => {
              if (!firebaseApi) {
                 const handleLoad = () => setFirebaseApi(window.FirebaseAPI);
                 window.addEventListener('firebase-loaded', handleLoad);
                 return () => window.removeEventListener('firebase-loaded', handleLoad);
              }
           }, [firebaseApi]);

           if (!firebaseApi) {
             return (
               <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center font-sans">
                 <div className="h-10 w-10 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
                 <p className="text-slate-500 font-medium">Iniciando o sistema...</p>
               </div>
             );
           }

           return <RateioApp firebaseApi={firebaseApi} />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AppLoader />);
    </script>
</body>
</html>
