<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Extrato Custo Transferência</title>
<style>
  :root { --azul:#12355b; --azul2:#e4ebf3; --borda:#d9e2ec; --texto:#1f2933; --cinza:#627d98; --verm:#9b2c2c; --verde:#1f6f43; }
  * { box-sizing: border-box; }
  body { font-family: "Segoe UI", Arial, sans-serif; color: var(--texto); background: #f5f7fa; margin: 0; font-size: 14px; }
  header { background: var(--azul); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .info { font-size: 12px; color: #bcccdc; }
  header .acoes { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--borda); background: #fff; color: var(--azul); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--azul2); }
  button.prim { background: var(--azul); color: #fff; border-color: var(--azul); }
  button.prim:hover { background: #1d4b7d; }
  button:disabled { opacity: .5; cursor: default; }
  header button { border-color: #3d5f85; }
  header button.prim { background: #fff; color: var(--azul); border-color: #fff; font-weight: 600; }
  header button.prim:hover { background: var(--azul2); }
  header label { font-size: 13px; color: #dbe5ef; display: flex; gap: 5px; align-items: center; }
  main { padding: 18px 24px 40px; max-width: 1280px; margin: 0 auto; }
  .cartoes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 6px; padding: 10px 12px; }
  .cartao b { display: block; font-size: 11px; color: var(--cinza); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
  .cartao span { font-size: 20px; font-weight: 600; color: var(--azul); }
  .cartao.alerta span { color: var(--verm); }
  .grupo { background: #fff; border: 1px solid var(--borda); border-radius: 6px; margin-bottom: 16px; overflow: hidden; }
  .grupo h2 { margin: 0; font-size: 15px; padding: 10px 14px; background: var(--azul2); color: var(--azul); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .grupo h2 .tot { margin-left: auto; font-variant-numeric: tabular-nums; }
  .grupo.semdest h2 { background: #fdf3f3; color: var(--verm); }
  .grupo.pagos h2 { background: #eef7f1; color: var(--verde); }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--cinza); font-weight: 600; padding: 7px 8px; border-bottom: 1px solid var(--borda); }
  td { padding: 6px 8px; border-bottom: 1px solid #eef1f4; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mono { font-family: Consolas, monospace; }
  input[type=text], input[type=number] { font: inherit; border: 1px solid var(--borda); border-radius: 4px; padding: 4px 6px; }
  input.ded { width: 100px; text-align: right; }
  input.dest { width: 260px; }
  .tag { font-size: 11px; border-radius: 3px; padding: 1px 5px; margin-left: 4px; }
  .tag.sug { background: #fff4d6; color: #8a5a00; }
  .tag.man { background: #e4ebf3; color: var(--azul); }
  .rodape-grupo { display: flex; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--borda); background: #fafbfc; flex-wrap: wrap; }
  .vazio { color: var(--cinza); padding: 30px; text-align: center; background: #fff; border: 1px dashed var(--borda); border-radius: 6px; }
  .nota { font-size: 12px; color: var(--cinza); margin: -8px 0 14px; }
  #msg { position: fixed; bottom: 18px; right: 18px; background: var(--azul); color: #fff; padding: 10px 16px; border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.2); display: none; max-width: 420px; z-index: 60; }
  #msg.erro { background: var(--verm); }
  .carregando { opacity: .5; pointer-events: none; }
  details { font-size: 12px; color: var(--cinza); }
  details table td { padding: 2px 6px; font-size: 12px; }
  .so-local { display: none; }
  body.local .so-local { display: inline-block; }
  #gate { position: fixed; inset: 0; background: var(--azul); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  #gate .caixa { background: #fff; border-radius: 8px; padding: 34px 30px; width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.3); text-align: center; }
  #gate h1 { color: var(--azul); font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  #gate p.sub { color: var(--cinza); font-size: 13px; margin: 0 0 22px; }
  #gate label { display: block; text-align: left; font-size: 13px; color: #556; margin: 12px 0 4px; }
  #gate input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #c9d6e2; border-radius: 4px; font-family: inherit; }
  #gate button { width: 100%; margin-top: 20px; padding: 11px; background: var(--azul); color: #fff; border: none; border-radius: 4px; font-size: 15px; }
  #gate .erro { color: var(--verm); font-size: 13px; margin-top: 12px; min-height: 18px; }
  body.trancado header, body.trancado main { visibility: hidden; }
  @media (max-width: 900px) { .cartoes { grid-template-columns: repeat(2, 1fr); } input.dest { width: 170px; } main { padding: 12px; } header { padding: 12px; } }
</style>
</head>
<body>
<div id="gate">
  <div class="caixa">
    <h1>Custo de Transferência</h1>
    <p class="sub">ANP – acesso restrito</p>
    <form id="form-login">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" autocomplete="username">
      <label for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password">
      <button type="submit">Entrar</button>
      <div class="erro" id="erro"></div>
    </form>
  </div>
</div>
<header>
  <div>
    <h1>Extrato de Pagamento – Custo por Transferência</h1>
    <div class="info" id="info">Carregando…</div>
  </div>
  <div class="acoes">
    <label><input type="checkbox" id="verPagos"> Mostrar pagos</label>
    <button id="btnPasta" class="so-local">Abrir pasta de extratos</button>
    <button id="btnAtualizar" class="prim so-local">Atualizar APS / AASI e publicar</button>
  </div>
</header>
<main id="main">
  <div class="cartoes" id="cartoes"></div>
  <p class="nota" id="nota"></p>
  <div id="grupos"></div>
</main>
<datalist id="ents"></datalist>
<div id="msg"></div>

const FB = { chave: 'AIzaSyDlHIgR3kuTpsugpMjbI1uxLN2G4JlLoTQ', projeto: 'relatorio-cartao-corporativo',
             doc: 'transf_controle/1622' };
const URL_DOC = `https://firestore.googleapis.com/v1/projects/${FB.projeto}/databases/(default)/documents/${FB.doc}`;
let token = null;

async function obterToken(novo) {
  if (token && !novo) return token;
  const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.chave}`,
    {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{"returnSecureToken":true}'});
  token = (await r.json()).idToken;
  return token;
}
async function fb(metodo, corpo, tentativa) {
  const r = await fetch(URL_DOC, {method: metodo, headers: {'Authorization': 'Bearer ' + await obterToken(tentativa),
    'Content-Type': 'application/json'}, body: corpo ? JSON.stringify(corpo) : undefined});
  if (r.status === 401 && !tentativa) return fb(metodo, corpo, true);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error('Firebase ' + r.status);
  return r.json();
}
function vazio() { return {competencia_inicial: 202601, destinos: {}, pagos: {}, deducoes: {}, nomes_entidade: {}}; }
async function lerControle() {
  const d = await fb('GET');
  const c = d ? JSON.parse(d.fields.json.stringValue) : vazio();
  return Object.assign(vazio(), c);
}
/* lê, aplica e grava em seguida — assim duas pessoas mexendo não se atropelam */
async function alterarControle(fn) {
  const c = await lerControle();
  fn(c);
  await fb('PATCH', {fields: {json: {stringValue: JSON.stringify(c)},
                              atualizado: {timestampValue: new Date().toISOString()}}});
  CTRL = c;
}

async function api(url, corpo) {

  if (j.erro) throw new Error(j.erro);

    <div class="cartao"><b>Líquido a pagar</b><span>R$ ${fmt(pend.reduce((s, i) => s + i.liquido, 0))}</span></div>
    <div class="cartao"><b>Funcionários pendentes</b><span>${pend.length}</span></div>
    <div class="cartao"><b>Entidades a receber</b><span>${Object.keys(grupos).length}</span></div>
    <div class="cartao ${semDest.length ? 'alerta' : ''}"><b>Sem entidade definida</b><span>${semDest.length}</span></div>`;

  let h = '';
  if (semDest.length) h += grupo(semDest, null);
  Object.keys(grupos).sort().forEach(k => h += grupo(grupos[k], k));
  if (!pend.length) h += '<div class="vazio">Nenhum custo de transferência pendente.</div>';
  if (document.getElementById('verPagos').checked) h += grupoPagos(ITENS.filter(i => i.pago));
  document.getElementById('grupos').innerHTML = h;
}

function linha(i) {
  return `<tr data-id="${i.id}">
    <td><input type="checkbox" class="chk" ${sel.has(i.id) ? 'checked' : ''}></td>
    <td>${esc(i.competencia)}</td>
    <td class="mono">${esc(i.matricula)}</td>
    <td>${esc(i.nome)}
      <details><summary>verbas</summary><table>${i.verbas.map(v =>
        `<tr><td class="mono">${v.codigo}</td><td>${esc(B.verbas[v.codigo][1])}</td><td class="num">${fmt(v.valor)}</td></tr>`).join('')}</table></details></td>
    <td class="num">${fmt(i.bruto)}</td>
    <td class="num"><input type="number" step="0.01" min="0" class="ded" value="${i.deducao.toFixed(2)}"
        title="Saldo da 1135015 no AASI: ${fmt(i.saldo_1135015)}">${i.deducao_manual ? '<span class="tag man" title="Valor digitado à mão">manual</span>' : ''}</td>
    <td class="num"><b>${fmt(i.liquido)}</b></td>
    <td><input type="text" class="dest" list="ents" placeholder="Escolha a entidade…" value="${esc(nomeEnt(i.destino))}">
      ${i.destino_sugerido ? '<span class="tag sug" title="Mesma pessoa admitida nessa entidade no APS">sugerido</span>' : ''}</td>
    <td><button class="btnPago">Pago</button></td>
  </tr>`;
}

function grupo(lista, dest) {
  const tot = lista.reduce((s, i) => s + i.liquido, 0);
  const titulo = dest ? esc(nomeEnt(dest)) : 'Sem entidade definida – escolha para quem vai o pagamento';
  return `<section class="grupo ${dest ? '' : 'semdest'}" data-dest="${dest || ''}">
    <h2>${titulo}<span class="tot">${lista.length} func. · R$ ${fmt(tot)}</span></h2>
    <div class="tabela"><table><thead><tr><th><input type="checkbox" class="chkTodos"></th><th>Comp.</th><th>Matr.</th><th>Funcionário</th>
      <th class="num">Bruto</th><th class="num">(−) Adto 13º</th><th class="num">Líquido</th><th>Entidade creditada</th><th></th></tr></thead>
    <tbody>${lista.map(linha).join('')}</tbody></table></div>
    ${dest ? `<div class="rodape-grupo">
      <button class="btnPagarSel">Marcar selecionados como pagos</button>
      <button class="prim btnExtrato">Gerar extrato em PDF</button></div>` : ''}
  </section>`;
}

function grupoPagos(lista) {
  if (!lista.length) return '';
  return `<section class="grupo pagos"><h2>Já pagos<span class="tot">${lista.length} func.</span></h2>
    <div class="tabela"><table><thead><tr><th>Comp.</th><th>Matr.</th><th>Funcionário</th><th>Entidade</th><th class="num">Líquido</th><th>Marcado em</th><th></th></tr></thead><tbody>
    ${lista.map(i => `<tr data-id="${i.id}"><td>${esc(i.competencia)}</td><td class="mono">${esc(i.matricula)}</td><td>${esc(i.nome)}</td>
      <td><input type="text" class="dest" list="ents" placeholder="Escolha a entidade…" value="${esc(nomeEnt(i.destino))}"></td>
      <td class="num">${fmt(i.liquido)}</td>
      <td>${esc(i.pago.data.split('-').reverse().join('/'))} ${esc(i.pago.obs || '')}</td>
      <td><button class="btnDesfazer">Desfazer</button></td></tr>`).join('')}
    </tbody></table></div></section>`;
}

async function salvar(fn, texto) {
  try { await alterarControle(fn); if (texto) aviso(texto); render(); }
  catch (e) { aviso('Erro ao salvar: ' + e.message, true); }
}
function hojeISO() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); }

/* ------------------------------------------------------------ o extrato */
function montarExtrato(dest, lista) {
  lista = [...lista].sort((a, b) => a.comp_ord - b.comp_ord || a.nome.localeCompare(b.nome));
  const ordem = Object.keys(B.verbas), resumo = {}, linhas = [];
  for (const i of lista) {
    linhas.push(`<tbody><tr class="func"><td colspan="4">Matrícula ${esc(i.matricula)} · ${esc(i.nome)} · competência ${esc(i.competencia)}</td></tr></tbody><tbody class="linhas">`);
    for (const v of i.verbas) {
      linhas.push(`<tr><td class="mono">${v.codigo}</td><td>${esc(B.verbas[v.codigo][0])}</td><td class="c">${v.ref ? fmt(v.ref) : ''}</td><td class="num">${fmt(v.valor)}</td></tr>`);
      resumo[v.codigo] = (resumo[v.codigo] || 0) + v.valor;
    }
    linhas.push(`</tbody><tbody>
      <tr class="subtot bruto"><td colspan="3">Total bruto – ${esc(i.nome)}</td><td class="num">${fmt(i.bruto)}</td></tr>
      <tr class="ded"><td class="mono">Dedução</td><td>(−) Adto 13º Salário</td><td class="c"></td><td class="num">${fmt(i.deducao)}</td></tr>
      <tr class="subtot"><td colspan="3">Líquido – ${esc(i.nome)}</td><td class="num">${fmt(i.liquido)}</td></tr></tbody>`);
  }
  const bruto = lista.reduce((s, i) => s + i.bruto, 0), ded = lista.reduce((s, i) => s + i.deducao, 0);
  const liq = lista.reduce((s, i) => s + i.liquido, 0);
  const comps = [...new Map(lista.map(i => [i.comp_ord, i.competencia])).entries()].sort((a, b) => a[0] - b[0]).map(c => c[1]);
  const n = lista.length;
  const valores = {
    LOGO, PAGADORA: esc(nomeEnt('1622')), DESTINO: esc(nomeEnt(dest)),
    EMISSAO: new Date().toLocaleDateString('pt-BR'), LIQUIDO: fmt(liq), BRUTO: fmt(bruto), DEDUCOES: fmt(ded),
    QTD: `${n} funcionário${n > 1 ? 's' : ''}`, LINHAS: linhas.join('\n'), COMPETENCIAS: comps.join(', '),
    RESUMO: ordem.filter(c => c in resumo).map(c =>
      `<tr><td class="mono">${c}</td><td>${esc(B.verbas[c][1])}</td><td class="num">${fmt(resumo[c])}</td></tr>`).join('\n'),
  };
  const nome = `Extrato_Custo_Transferencia_${dest}_` + (comps.length === 1 ? comps[0].replace('/', '-') : hojeISO());
  let pagina = MODELO.replace(/\{\{(\w+)\}\}/g, (_, k) => valores[k] ?? '');
  pagina = pagina.replace(/<title>.*?<\/title>/, `<title>${nome}</title>`);
  return {pagina, nome};
}

async function gerarExtrato(dest, ids, botao) {
  const lista = ITENS.filter(i => ids.includes(i.id) && i.destino === dest);
  if (!lista.length) return aviso('Nenhum funcionário para essa entidade.', true);
  const {pagina, nome} = montarExtrato(dest, lista);
  if (LOCAL) {
    botao.disabled = true; botao.textContent = 'Gerando…';
    try { const r = await api('/api/pdf', {html: pagina, nome}); aviso(`Extrato gerado: ${r.arquivo} (pasta Extratos)`); }
    catch (e) { aviso('Erro ao gerar: ' + e.message, true); }
    botao.disabled = false; botao.textContent = 'Gerar extrato em PDF';
  } else {
    /* no site: abre o extrato e chama a impressão (escolher "Salvar como PDF") */
    const w = window.open('', '_blank');
    if (!w) return aviso('O navegador bloqueou a janela do extrato. Libere pop-ups para o site.', true);
    w.document.open(); w.document.write(pagina); w.document.close();
    setTimeout(() => w.print(), 600);
    aviso('Na janela de impressão, escolha "Salvar como PDF".');
  }
}

/* ------------------------------------------------------------- eventos */
function codigoDe(txt) { const m = String(txt).trim().match(/^(\d+)/); return m ? m[1] : ''; }

document.addEventListener('change', e => {
  const tr = e.target.closest('tr[data-id]');
  if (e.target.classList.contains('chkTodos')) {
    e.target.closest('table').querySelectorAll('tbody tr[data-id]').forEach(r => {
      r.querySelector('.chk').checked = e.target.checked;
      e.target.checked ? sel.add(r.dataset.id) : sel.delete(r.dataset.id);
    });
    return;
  }
  if (!tr) return;
  const id = tr.dataset.id;
  if (e.target.classList.contains('chk')) e.target.checked ? sel.add(id) : sel.delete(id);
  if (e.target.classList.contains('ded')) {
    const item = ITENS.find(i => i.id === id);
    const v = e.target.value === '' ? null : Math.round(Number(e.target.value) * 100) / 100;
    const volta = v === null || Math.abs(v - item.saldo_1135015) < 0.005;
    salvar(c => { if (volta) delete c.deducoes[id]; else c.deducoes[id] = v; }, volta ? 'Dedução voltou ao saldo da 1135015.' : 'Dedução salva.');
  }
  if (e.target.classList.contains('dest')) {
    const cod = codigoDe(e.target.value);
    if (e.target.value.trim() && !cod) return aviso('Informe o código da entidade (ex.: 105122).', true);
    let nome = null;
    if (cod && !NOMES[cod]) nome = prompt(`A entidade ${cod} não está cadastrada no APS. Qual o nome dela?`);
    salvar(c => { if (cod) c.destinos[id] = cod; else delete c.destinos[id]; if (nome) c.nomes_entidade[cod] = nome; },
           cod ? `Destino salvo: ${cod}` : 'Destino removido.');
  }
});

document.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (e.target.classList.contains('btnPago')) {
    const i = ITENS.find(x => x.id === tr.dataset.id);
    if (confirm(`Marcar como pago: ${i.nome} (R$ ${fmt(i.liquido)})?`))
      salvar(c => c.pagos[i.id] = {data: hojeISO(), obs: ''}, 'Marcado como pago.');
  }
  if (e.target.classList.contains('btnDesfazer')) salvar(c => delete c.pagos[tr.dataset.id], 'Voltou para pendentes.');
  const sec = e.target.closest('section.grupo');
  if (!sec) return;
  const todos = [...sec.querySelectorAll('tbody tr[data-id]')].map(r => r.dataset.id);
  const idsSel = todos.filter(id => sel.has(id));
  if (e.target.classList.contains('btnPagarSel')) {
    if (!idsSel.length) return aviso('Selecione os funcionários.', true);
    if (confirm(`Marcar ${idsSel.length} funcionário(s) como pagos?`))
      salvar(c => idsSel.forEach(id => c.pagos[id] = {data: hojeISO(), obs: ''}), 'Marcados como pagos.');
  }
  if (e.target.classList.contains('btnExtrato')) gerarExtrato(sec.dataset.dest, idsSel.length ? idsSel : todos, e.target);
});

document.getElementById('btnAtualizar').onclick = () => carregar(true);
document.getElementById('btnPasta').onclick = () => api('/api/abrir_pasta', {}).catch(e => aviso(e.message, true));
document.getElementById('verPagos').onchange = render;

/* Trela simples, igual à dos demais painéis da pasta /anp (mesma chave anp_ok).
   No computador (servidor local) entra direto. */
(function trela() {
  if (LOCAL || location.protocol === 'file:' || sessionStorage.getItem('anp_ok') === '1') { carregar(); return; }
  document.body.classList.add('trancado');
  document.getElementById('gate').style.display = 'flex';
  document.getElementById('usuario').focus();
  document.getElementById('form-login').addEventListener('submit', ev => {
    ev.preventDefault();
    const u = document.getElementById('usuario').value.trim(), s = document.getElementById('senha').value;
    if (u === 'ANP@IASD' && s === 'Anp1622') {
      sessionStorage.setItem('anp_ok', '1');
      document.getElementById('gate').style.display = 'none';
      document.body.classList.remove('trancado');
      carregar();
    } else {
      document.getElementById('erro').textContent = 'Usuário ou senha incorretos.';
      document.getElementById('senha').value = '';
    }
  });
})();
</script>
