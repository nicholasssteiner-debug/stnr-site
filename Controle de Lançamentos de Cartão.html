                                                        <td className="px-6 py-4"><span className="block font-bold text-slate-800">{v.emitenteNota || v.entryData?.fornecedor}</span></td>
                                                        <td className="px-6 py-4"><span className="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-bold mr-2">{v.tipoNota}</span><span className="text-xs font-medium text-slate-600">{v.numeroNota || 'S/N'}</span></td>
                                                        <td className="px-6 py-4 text-right font-black text-slate-900">{formatCurrency(v.valorTotalFinal)}</td>
                                                        <td className="px-6 py-4 text-center">
                                                            <button onClick={() => setExpandedId(expandedId === v.id ? null : v.id)} className={`p-2 rounded-md border shadow-sm transition-colors ${expandedId === v.id ? 'bg-blue-100 border-blue-200 text-blue-700' : 'bg-white border-slate-200 text-blue-600 hover:bg-blue-50'}`} title="Visualizar Detalhes">{expandedId === v.id ? <EyeOff size={16}/> : <Eye size={16}/>}</button>
                                                        </td>
                                                    </tr>

                                                    {/* CARTÃO DETALHADO */}
                                                    {expandedId === v.id && (
                                                        <tr>
                                                            <td colSpan="6" className="p-0 border-b-4 border-b-blue-500 bg-slate-50">
                                                                <div className="p-6 md:p-8 m-4 bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden relative">
                                                                    <button onClick={() => setExpandedId(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-700"><X size={20}/></button>

                                                                    <div className="flex flex-col lg:flex-row justify-between gap-6 mb-8 border-b border-slate-100 pb-6">
                                                                        <div className="flex items-center space-x-4">
                                                                            <div className="bg-blue-50 p-3 rounded-lg border border-blue-100 text-blue-600"><FileSpreadsheet size={32}/></div>
                                                                            <div>
                                                                                <h3 className="text-xl font-bold text-slate-800">Lançamento Detalhado <span className="text-sm font-medium text-slate-500 ml-2">({activeMenu.toUpperCase()})</span></h3>
                                                                                <p className="text-sm text-slate-500">Documento base: {v.tipoNota} {v.numeroNota && `Nº ${v.numeroNota}`}</p>
                                                                            </div>
                                                                        </div>
                                                                        <div className="text-right bg-slate-50 p-4 rounded-lg border border-slate-100 min-w-[200px]">
                                                                            <span className="text-[10px] uppercase font-bold text-slate-400 block leading-tight">Valor Lançamento</span>
                                                                            <span className="text-3xl font-black text-blue-700">{formatCurrency(v.valorTotalFinal)}</span>
                                                                        </div>
                                                                    </div>
                                                                    
                                                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                                                        {/* Coluna Esquerda: Documentos e Dados */}
                                                                        <div className="lg:col-span-1 space-y-6">
                                                                            <div>
                                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 border-b border-slate-100 pb-1">Informações Fiscais</h4>
                                                                                <div className="bg-slate-50 rounded p-3 text-sm space-y-2 border border-slate-100">
                                                                                    <div className="flex justify-between"><span className="text-slate-500">Tipo Nota:</span><span className="font-bold text-slate-800">{v.tipoNota}</span></div>
                                                                                    <div className="flex justify-between"><span className="text-slate-500">Número:</span><span className="font-bold text-slate-800">{v.numeroNota || 'N/A'}</span></div>
                                                                                    <div className="flex justify-between"><span className="text-slate-500">Emitente:</span><span className="font-bold text-slate-800 text-right truncate max-w-[150px]" title={v.emitenteNota}>{v.emitenteNota || 'N/A'}</span></div>
                                                                                    <div className="flex justify-between"><span className="text-slate-500">Data Emissão:</span><span className="font-bold text-slate-800">{v.dataEmissao ? new Date(v.dataEmissao).toLocaleDateString('pt-BR',{timeZone:'UTC'}) : 'N/A'}</span></div>
                                                                                    <div className="flex justify-between"><span className="text-slate-500">Valor da Nota:</span><span className="font-bold text-slate-800">{formatCurrency(v.valorTotalNota || 0)}</span></div>
                                                                                    <div className="flex justify-between flex-col mt-2">
                                                                                        <span className="text-slate-500">Chave de Acesso:</span>
                                                                                        <span className="font-mono text-[10px] text-slate-700 break-all bg-white p-1.5 rounded border border-slate-200 mt-1">{v.chaveAcesso || 'N/A'}</span>
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                            <div>
                                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 border-b border-slate-100 pb-1">Anexos / Documentos</h4>
                                                                                {(!v.links || v.links.length === 0) ? <div className="text-xs text-slate-400 italic">Sem links anexados.</div> : (
                                                                                    <ul className="space-y-1">
                                                                                        {v.links.map((lnk, i) => (
                                                                                            <li key={i}>
                                                                                                <a href={lnk} target="_blank" rel="noreferrer" className="text-xs text-blue-600 hover:underline flex items-center truncate bg-blue-50 p-1.5 rounded"><Link size={12} className="mr-1.5 flex-shrink-0"/> Anexo {i+1}</a>
                                                                                            </li>
                                                                                        ))}
                                                                                    </ul>
                                                                                )}
                                                                            </div>
                                                                            <div>
                                                                                <h4 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 border-b border-slate-100 pb-1">Dados Específicos</h4>
                                                                                <div className="text-xs space-y-1 text-slate-600 bg-slate-50 p-3 rounded border border-slate-100">
                                                                                    {activeMenu === 'cartao' && (
                                                                                        <><p className="flex justify-between"><span>Cartão:</span> <span className="font-bold">{v.entryData?.cartao}</span></p><p className="flex justify-between"><span>Desconto Aplicado:</span> <span className="font-bold text-rose-500">{formatCurrency(v.descontoAplicado)}</span></p></>
                                                                                    )}
                                                                                    {activeMenu === 'adiantamento' && (
                                                                                        <><p className="flex justify-between"><span>Cartão:</span> <span className="font-bold">{v.entryData?.cartao}</span></p><p className="flex justify-between"><span>Condição Acerto:</span> <span className="font-bold uppercase">{v.adiantamentoOption}</span></p><p className="flex justify-between"><span>Desconto Aplicado:</span> <span className="font-bold text-rose-500">{formatCurrency(v.descontoAplicado || 0)}</span></p></>
                                                                                    )}
                                                                                    {activeMenu === 'boleto' && (
                                                                                        <><p className="flex justify-between flex-col mb-2"><span>Linha Digitável / Pix:</span> <span className="font-mono mt-1 text-[10px] break-all bg-white border p-1 rounded">{v.codigoBoleto}</span></p><p className="flex justify-between"><span>Vencimento:</span> <span className="font-bold text-rose-600">{new Date(v.dataVencimento+'T00:00:00').toLocaleDateString('pt-BR')}</span></p><p className="flex justify-between"><span>Desconto Aplicado:</span> <span className="font-bold text-rose-500">{formatCurrency(v.descontoAplicado || 0)}</span></p></>
                                                                                    )}
                                                                                    <p className="flex justify-between border-t border-slate-200 mt-2 pt-2"><span>Lançado por:</span> <span className="font-medium">{v.vinculadoPor}</span></p>
                                                                                </div>
                                                                            </div>
                                                                        </div>

                                                                        {/* Coluna Direita: Rateio Contábil */}
                                                                        <div className="lg:col-span-2 flex flex-col h-full">
                                                                            <h4 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4 flex items-center bg-slate-100 p-2 rounded-t-lg border-b border-slate-200">
                                                                                <FileSignature size={16} className="mr-2 text-slate-500"/> Espelho do Rateio para Contabilização
                                                                            </h4>
                                                                            <div className="space-y-6 flex-1 pr-2">
                                                                                {/* Render Rateio for CARTAO */}
                                                                                {activeMenu === 'cartao' && (v.rotasData ? v.rotasData : [{ codigo: v.rotaData?.codigo, observacao: v.rotaData?.observacao, itensRecalculados: v.itensProporcionais }]).map((rota, rIdx) => (
                                                                                    <div key={rIdx} className="mb-4">
                                                                                        {v.rotasData && (
                                                                                            <div className="mb-3 pl-2 border-l-2 border-blue-400">
                                                                                                <div className="text-xs font-bold text-blue-700 uppercase tracking-widest mb-0.5">Protocolo ROTA: {rota.codigo}</div>
                                                                                                <div className="text-sm text-slate-600 italic bg-amber-50 p-2 rounded text-justify border border-amber-100"><span className="font-bold not-italic text-amber-800">Finalidade:</span> {rota.observacao || 'Nenhuma observação registada para esta requisição.'}</div>
                                                                                            </div>
                                                                                        )}
                                                                                        <div className="space-y-3 pl-4">
                                                                                            {(rota.itensRecalculados || []).map((item, i) => (
                                                                                                <div key={i} className="border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                                                                                                    <div className="bg-slate-100 px-4 py-2.5 font-bold text-sm text-slate-800 flex justify-between items-center border-b border-slate-200"><span>{item.qtd}x {item.nome}</span><span className="text-blue-700">{formatCurrency(item.newTotal)}</span></div>
                                                                                                    <div className="divide-y divide-slate-100 bg-white">
                                                                                                        {item.newRateio.map((r, ri) => (
                                                                                                            <div key={ri} className="px-4 py-3 text-xs flex justify-between items-center hover:bg-slate-50"><div className="flex items-center"><span className="bg-slate-200 text-slate-600 font-mono text-[10px] px-2 py-0.5 rounded mr-3">{r.qtd} und</span><span className="font-semibold text-slate-700 uppercase">{r.nome}</span></div><span className="font-black text-slate-900 text-sm">{formatCurrency(r.costNew)}</span></div>
                                                                                                        ))}
                                                                                                    </div>
                                                                                                </div>
                                                                                            ))}
                                                                                        </div>
                                                                                    </div>
                                                                                ))}

                                                                                {/* Render Rateio for ADIANTAMENTO or BOLETO */}
                                                                                {(activeMenu === 'adiantamento' || activeMenu === 'boleto') && v.itensRateio && (
                                                                                    <div className="space-y-3 pl-2 border-l-2 border-emerald-400">
                                                                                        {v.itensRateio.map((item, i) => (
                                                                                            <div key={i} className="border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                                                                                                <div className="bg-slate-100 px-4 py-2.5 font-bold text-sm text-slate-800 flex justify-between items-center border-b border-slate-200"><span>{item.qtd}x {item.nome}</span><span className="text-blue-700">{formatCurrency(item.newTotal !== undefined ? item.newTotal : item.total)}</span></div>
                                                                                                <div className="divide-y divide-slate-100 bg-white">
                                                                                                    {(item.newRateio || item.rateio).map((r, ri) => (
                                                                                                        <div key={ri} className="px-4 py-3 text-xs flex justify-between items-center hover:bg-slate-50"><div className="flex items-center"><span className="bg-slate-200 text-slate-600 font-mono text-[10px] px-2 py-0.5 rounded mr-3">{r.qtd} und</span><span className="font-semibold text-slate-700 uppercase">{r.nome}</span></div><span className="font-black text-slate-900 text-sm">{formatCurrency(r.costNew !== undefined ? r.costNew : ((r.qtd/item.qtd)*item.total))}</span></div>
                                                                                                    ))}
                                                                                                </div>
                                                                                            </div>
                                                                                        ))}
                                                                                    </div>
                                                                                )}
                                                                            </div>
                                                                            
                                                                            {/* Botões de Ação */}
                                                                            <div className="mt-8 flex justify-between items-center border-t-2 border-slate-100 pt-6">
                                                                                {v.status === 'pendente' && (
                                                                                    <>
                                                                                        {activeMenu !== 'boleto' ? (
                                                                                            <button onClick={() => handleReabrirParaVinculo(v.id)} className="text-rose-500 hover:text-rose-700 text-xs font-bold flex items-center transition-colors bg-rose-50 px-3 py-2 rounded-md"><RotateCcw size={14} className="mr-1.5"/> Devolver p/ Vínculo</button>
                                                                                        ) : (
                                                                                            <button onClick={() => {if(window.confirm('Apagar este lançamento de boleto?')){deleteDoc(getDocRef('vinculos',v.id)); setExpandedId(null);}}} className="text-rose-500 hover:text-rose-700 text-xs font-bold flex items-center transition-colors bg-rose-50 px-3 py-2 rounded-md"><Trash2 size={14} className="mr-1.5"/> Apagar Boleto</button>
                                                                                        )}
                                                                                        <button onClick={() => handleMarcarRegistrado(v)} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg flex items-center transition-colors text-sm"><CheckSquare size={18} className="mr-2"/> Lançamento Concluído</button>
                                                                                    </>
                                                                                )}
                                                                                {v.status === 'registrado' && (
                                                                                    <>
                                                                                        <button onClick={() => handleReabrirPendente(v)} className="text-amber-600 hover:text-amber-700 text-xs font-bold flex items-center transition-colors bg-amber-50 px-3 py-2 rounded-md"><RotateCcw size={14} className="mr-1.5"/> Reabrir para Pendente</button>
                                                                                        <div className="bg-emerald-50 text-emerald-700 px-6 py-3 rounded-lg text-sm font-bold flex items-center border border-emerald-200"><CheckCircle2 size={18} className="mr-2"/> Registrado por {v.registradoPor}</div>
                                                                                    </>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )}
                                                </React.Fragment>
                                            ))
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE R.O.T.A (Mantido igual anterior) ---
        const RotaTab = ({ departamentos }) => {
            const [setoresTemporarios, setSetoresTemporarios] = useState([]);
            const [produtosDaCompra, setProdutosDaCompra] = useState([]);
            const [historicoCompras, setHistoricoCompras] = useState([]);
            const [rotasFinalizadas, setRotasFinalizadas] = useState([]);
            
            const [formCompra, setFormCompra] = useState({ fornecedor: '', solicitante: '', dataCompra: '', prioridade: 'Média', observacao: '', codigo: '' });
            const [formItem, setFormItem] = useState({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 });
            const [formSetor, setFormSetor] = useState({ depto: '', qtd: '' });

            const [modalFinalizadas, setModalFinalizadas] = useState(false);
            const [selectedRotas, setSelectedRotas] = useState({});
            const [editingRotaId, setEditingRotaId] = useState(null);
            
            const [alertConfig, setAlertConfig] = useState({ show: false, title: '', msg: '', type: 'success' });

            // Busca os dados do Firebase em Tempo Real
            useEffect(() => {
                const unsubAtivas = onSnapshot(getCollectionPath('rotas_ativas'), snapshot => {
                    setHistoricoCompras(snapshot.docs.map(d => d.data()));
                });
                const unsubFinalizadas = onSnapshot(getCollectionPath('rotas_finalizadas'), snapshot => {
                    setRotasFinalizadas(snapshot.docs.map(d => d.data()));
                });
                return () => { unsubAtivas(); unsubFinalizadas(); };
            }, []);
            
            // Lógica inteligente para definir o próximo sequencial da Rota
            const todasRotas = [...historicoCompras, ...rotasFinalizadas];
            let maxSeq = 0;
            todasRotas.forEach(r => {
                const parts = r.codigo?.split(' - ');
                if (parts && parts.length === 3) {
                    const num = parseInt(parts[2], 10);
                    if (num > maxSeq) maxSeq = num;
                }
            });
            const codigoAtual = editingRotaId && formCompra.codigo 
                ? formCompra.codigo 
                : `CMPA - ${new Date().getFullYear()} - ${String(maxSeq + 1).padStart(3, '0')}`;
            
            const formItemQtd = parseFloat(formItem.qtd) || 0;
            const itemTotal = (formItemQtd * (parseFloat(formItem.vlr) || 0)) - (parseFloat(formItem.desc) || 0);
            const totalItemCalc = itemTotal > 0 ? itemTotal : 0;
            const somaRateio = setoresTemporarios.reduce((acc, s) => acc + s.qtd, 0);

            const showAlert = (title, msg, type) => setAlertConfig({ show: true, title, msg, type });
            const closeAlert = () => setAlertConfig({ ...alertConfig, show: false });

            const adicionarSetorNaLista = () => {
                const q = parseFloat(formSetor.qtd) || 0;
                if (!formSetor.depto || q <= 0) return;
                
                setSetoresTemporarios(prev => {
                    const index = prev.findIndex(s => s.nome === formSetor.depto);
                    if (index >= 0) {
                        const next = [...prev];
                        next[index].qtd += q;
                        return next;
                    }
                    return [...prev, { nome: formSetor.depto, qtd: q }];
                });
                setFormSetor({ depto: '', qtd: '' });
            };

            const removerSetor = (index) => setSetoresTemporarios(prev => prev.filter((_, i) => i !== index));
            
            const editarSetor = (index) => {
                const s = setoresTemporarios[index];
                setFormSetor({ depto: s.nome, qtd: s.qtd });
                removerSetor(index);
            };

            const salvarProdutoNaCompra = () => {
                if (!formItem.nome) return showAlert('Erro', 'Informe o produto.', 'error');
                const newItem = {
                    id: formItem.id || Date.now().toString(),
                    nome: formItem.nome,
                    qtd: formItemQtd || 1,
                    un: formItem.un || 'UN',
                    vlr: parseFloat(formItem.vlr) || 0,
                    desc: parseFloat(formItem.desc) || 0,
                    total: totalItemCalc,
                    rateio: [...setoresTemporarios]
                };
                setProdutosDaCompra(prev => [...prev.filter(p => p.id !== newItem.id), newItem]);
                setFormItem({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 });
                setSetoresTemporarios([]);
            };

            const prepararEdicaoProduto = (id) => {
                const p = produtosDaCompra.find(x => x.id === id);
                if (!p) return;
                setFormItem({ id: p.id, nome: p.nome, qtd: p.qtd, un: p.un, vlr: p.vlr, desc: p.desc });
                setSetoresTemporarios([...p.rateio]);
                setProdutosDaCompra(prev => prev.filter(x => x.id !== id));
                showAlert('Edição de Produto', 'O produto foi carregado para o formulário.', 'success');
            };

            const removerProdutoAberto = (id) => setProdutosDaCompra(prev => prev.filter(p => p.id !== id));

            const finalizarRequisicao = async () => {
                if (!formCompra.fornecedor || produtosDaCompra.length === 0) 
                    return showAlert('Atenção', 'Informe o fornecedor e adicione produtos.', 'warning');
                
                const totalCompra = produtosDaCompra.reduce((acc, p) => acc + p.total, 0);
                const novaCompra = {
                    id: editingRotaId || Date.now().toString(),
                    codigo: codigoAtual,
                    fornecedor: formCompra.fornecedor,
                    solicitante: formCompra.solicitante,
                    dataCompra: formCompra.dataCompra,
                    prioridade: formCompra.prioridade,
                    observacao: formCompra.observacao,
                    itens: [...produtosDaCompra],
                    total: totalCompra,
                    data: formCompra.dataCompra ? new Date(formCompra.dataCompra).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : new Date().toLocaleDateString('pt-BR')
                };
                
                try {
                    await setDoc(getDocRef('rotas_ativas', novaCompra.id), novaCompra);
                    setProdutosDaCompra([]);
                    setFormCompra({ fornecedor: '', solicitante: '', dataCompra: '', prioridade: 'Média', observacao: '', codigo: '' });
                    setEditingRotaId(null);
                    showAlert('Sucesso', editingRotaId ? 'Requisição atualizada com sucesso!' : 'Requisição registada com sucesso!', 'success');
                } catch (error) {
                    showAlert('Erro', 'Falha ao conectar com o banco de dados.', 'error');
                }
            };

            const editarRota = (rota) => {
                setFormCompra({
                    codigo: rota.codigo,
                    fornecedor: rota.fornecedor,
                    solicitante: rota.solicitante || '',
                    dataCompra: rota.dataCompra || '',
                    prioridade: rota.prioridade || 'Média',
                    observacao: rota.observacao || ''
                });
                setProdutosDaCompra(rota.itens || []);
                setEditingRotaId(rota.id);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const cancelarEdicaoRota = () => {
                setFormCompra({ fornecedor: '', solicitante: '', dataCompra: '', prioridade: 'Média', observacao: '', codigo: '' });
                setProdutosDaCompra([]);
                setEditingRotaId(null);
            };

            const excluirRota = async (id) => {
                if (window.confirm("Atenção: Tem certeza que deseja apagar esta rota permanentemente?")) {
                    await deleteDoc(getDocRef('rotas_ativas', id));
                    showAlert('Excluída', 'A rota foi apagada do sistema.', 'success');
                }
            };

            const toggleSelectAll = (e) => {
                const isChecked = e.target.checked;
                const newSelected = {};
                if (isChecked) historicoCompras.forEach((_, i) => newSelected[i] = true);
                setSelectedRotas(newSelected);
            };

            const finalizarRotaSelecionada = async () => {
                const indicesToFinish = Object.keys(selectedRotas).filter(k => selectedRotas[k]).map(Number);
                if (indicesToFinish.length === 0) return showAlert('Aviso', 'Selecione as rotas que deseja finalizar.', 'warning');

                try {
                    for (let idx of indicesToFinish) {
                        const item = historicoCompras[idx];
                        if (item) {
                            item.dataFim = new Date().toLocaleDateString('pt-BR');
                            await setDoc(getDocRef('rotas_finalizadas', item.id), item);
                            await deleteDoc(getDocRef('rotas_ativas', item.id));
                        }
                    }
                    setSelectedRotas({});
                    showAlert('Rota Finalizada', 'Requisições movidas para o histórico.', 'success');
                } catch (error) {
                    showAlert('Erro', 'Ocorreu um problema ao finalizar as rotas.', 'error');
                }
            };

            const imprimirRelatorio = () => {
                const indicesToPrint = Object.keys(selectedRotas).filter(k => selectedRotas[k]).map(Number);
                if (indicesToPrint.length === 0) return showAlert('Aviso', 'Selecione ao menos uma compra para imprimir.', 'warning');
                const selecionados = indicesToPrint.map(i => historicoCompras[i]).sort((a, b) => a.codigo.localeCompare(b.codigo));

                const printWindow = window.open('', '_blank');
                let html = `<html><head><title>Relatório R.O.T.A</title><style>body{font-family:sans-serif;padding:20px;}.block{border:2px solid #000;margin-bottom:30px;padding:20px;page-break-inside:avoid;}.header{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding-bottom:10px;margin-bottom:15px;}.code{font-size:24px;font-weight:bold;}table{width:100%;border-collapse:collapse;margin-top:10px;}th,td{border:1px solid #eee;padding:8px;text-align:left;font-size:12px;}th{background:#f4f4f4;}.total{text-align:right;font-weight:bold;font-size:16px;margin-top:10px;}.obs{margin-top:10px;font-style:italic;font-size:11px;color:#555;}</style></head><body><h1 style="text-align:center">R.O.T.A — REQUISIÇÕES DE COMPRA</h1>`;
                selecionados.forEach(c => {
                    html += `<div class="block"><div class="header"><div><span class="code">${c.codigo}</span><br>Fornecedor: <b>${c.fornecedor}</b><br>Data: ${c.dataCompra ? new Date(c.dataCompra).toLocaleDateString('pt-BR', {timeZone: 'UTC'}) : c.data}</div><div style="text-align:right">Solicitante: ${c.solicitante}</div></div><table><thead><tr><th>Produto</th><th>Qtd</th><th>Unid</th><th>Total</th><th>Rateio</th></tr></thead><tbody>${c.itens.map(it => `<tr><td>${it.nome}</td><td>${it.qtd}</td><td>${it.un}</td><td>${formatCurrency(it.total)}</td><td>${it.rateio.map(r => r.nome + '(' + r.qtd + ')').join(', ')}</td></tr>`).join('')}</tbody></table><div class="obs">Obs: ${c.observacao || 'Nenhuma'}</div><div class="total">VALOR TOTAL: ${formatCurrency(c.total)}</div></div>`;
                });
                html += `</body></html>`;
                printWindow.document.write(html);
                printWindow.document.close();
                setTimeout(() => { printWindow.print(); }, 500);
            };

            const reabrirRota = async (id) => {
                const item = rotasFinalizadas.find(r => r.id === id);
                if(!item) return;
                try {
                    delete item.dataFim;
                    await setDoc(getDocRef('rotas_ativas', item.id), item);
                    await deleteDoc(getDocRef('rotas_finalizadas', item.id));
                    showAlert('Sucesso', 'Rota reaberta com sucesso.', 'success');
                } catch (error) {
                    showAlert('Erro', 'Não foi possível reabrir a rota.', 'error');
                }
            };

            return (
                <div className="bg-slate-50 min-h-[60vh] animate-in fade-in duration-500">
                    <main className="container mx-auto max-w-6xl relative font-sans">
                        
                        <div className="absolute top-0 right-0 mt-[-10px] mr-0 md:mr-6 z-10">
                            <button onClick={() => setModalFinalizadas(!modalFinalizadas)} className="bg-slate-800 hover:bg-black text-white px-4 py-2 rounded-lg text-xs font-bold shadow-lg transition-all flex items-center">
                                <svg className="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" strokeWidth="2" strokeLinecap="round"/></svg>
                                Rotas Finalizadas ({rotasFinalizadas.length})
                            </button>
                        </div>

                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 bg-white p-6 rounded-xl shadow-sm border border-slate-200 mt-8 md:mt-0">
                            <div className="flex items-center space-x-5 mb-4 md:mb-0">
                                <div className="w-14 h-14 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-200">
                                    <svg viewBox="0 0 24 24" className="w-8 h-8 text-white" fill="none" stroke="currentColor" strokeWidth="2">
                                        <path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" strokeLinecap="round" strokeLinejoin="round"/>
                                    </svg>
                                </div>
                                <div>
                                    <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">R.O.T.A</h1>
                                    <p className="text-sm text-blue-600 font-medium uppercase tracking-tight">Registro de Operações de Transporte e Aquisição</p>
                                </div>
                            </div>
                            <div className="bg-blue-50 border border-blue-100 p-3 rounded-lg text-right">
                                <span className="text-[10px] font-bold text-blue-400 uppercase tracking-widest block mb-1">
                                    {editingRotaId ? 'Editando Protocolo' : 'Protocolo de Compra'}
                                </span>
                                <div className={`text-2xl font-mono font-black leading-none ${editingRotaId ? 'text-amber-600' : 'text-blue-700'}`}>
                                    {codigoAtual}
                                </div>
                            </div>
                        </div>

                        <div className={`bg-white border rounded-lg p-6 mb-6 shadow-sm transition-colors ${editingRotaId ? 'border-amber-300 ring-2 ring-amber-50' : 'border-slate-200'}`}>
                            <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-4 flex items-center">
                                <span className={`w-2 h-2 rounded-full mr-2 ${editingRotaId ? 'bg-amber-500' : 'bg-blue-600'}`}></span>
                                Informações da Requisição
                            </h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="md:col-span-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-2 uppercase">Fornecedor</label>
                                    <input type="text" value={formCompra.fornecedor} onChange={e => setFormCompra({...formCompra, fornecedor: e.target.value})} placeholder="Pesquisar..." className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
                                </div>
                                <div className="md:col-span-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-2 uppercase">Solicitante</label>
                                    <input type="text" value={formCompra.solicitante} onChange={e => setFormCompra({...formCompra, solicitante: e.target.value})} placeholder="Nome" className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
                                </div>
                                <div className="md:col-span-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-2 uppercase">Data da Compra</label>
                                    <input type="date" value={formCompra.dataCompra} onChange={e => setFormCompra({...formCompra, dataCompra: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"/>
                                </div>
                                <div className="md:col-span-1">
                                    <label className="block text-xs font-bold text-slate-700 mb-2 uppercase">Prioridade</label>
                                    <select value={formCompra.prioridade} onChange={e => setFormCompra({...formCompra, prioridade: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                        <option value="Baixa">Baixa</option>
                                        <option value="Média">Média</option>
                                        <option value="Alta">Alta</option>
                                        <option value="Urgente">Urgente</option>
                                    </select>
                                </div>
                                <div className="md:col-span-2">

                    </main>

                    {modalFinalizadas && (

                                        <thead className="bg-slate-100 uppercase text-slate-600">

                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {rotasFinalizadas.length === 0 ? <tr><td colSpan="5" className="p-10 text-center italic">Vazio.</td></tr> :
                                                rotasFinalizadas.map((c, i) => (
                                                    <tr key={c.id}>
                                                        <td className="p-3 font-bold">{c.codigo}</td><td className="p-3">{c.fornecedor}</td><td className="p-3">{c.dataFim}</td><td className="p-3 text-right font-bold">{formatCurrency(c.total)}</td>
                                                        <td className="p-3 text-center"><button onClick={() => reabrirRota(c.id)} className="text-blue-600 font-bold hover:underline">Reabrir</button></td>

                                    </table>

                            </div>
                        </div>
                    )}

            );
        };


        // --- ESTADO INICIAL DO FORMULÁRIO COM RATEIO SIMPLIFICADO ---
        const initialFormState = {
          status: 'Compra', cartao: '', dataCompra: '', valor: '', parcelas: '1',
          possuiNf: 'Sim', numNota: '', fornecedor: '', observacao: '',
          rateio: [''] 
        };

        const seedDepartamentos = [];
        const seedCartoes = [];
        const seedUsers = [
          { id: 'u1', nome: 'Nicholas Ganhadeiro', email: 'nicholas.ganhadeiro@adventistas.org', senha: 'Fap1624', role: 'admin' }
        ];

        function App() {
          const [activeTab, setActiveTab] = useState('dashboard');
          const [showSuccess, setShowSuccess] = useState(false);
          
          const [entries, setEntries] = useState([]);
          const [departamentos, setDepartamentos] = useState([]);
          const [cartoes, setCartoes] = useState([]);
          const [users, setUsers] = useState([]);
          const [authRequests, setAuthRequests] = useState([]); 
          
          // Estados Novos (ROTA)
          const [rotasAtivas, setRotasAtivas] = useState([]);
          const [rotasFinalizadas, setRotasFinalizadas] = useState([]);
          const [vinculos, setVinculos] = useState([]);

          const [firebaseUser, setFirebaseUser] = useState(null);
          const [loadingData, setLoadingData] = useState(true);

          const [formData, setFormData] = useState(initialFormState);
          const [editingEntryId, setEditingEntryId] = useState(null);

          const [newDeptCodigo, setNewDeptCodigo] = useState('');
          const [newDeptNome, setNewDeptNome] = useState('');
          const [editingDeptId, setEditingDeptId] = useState(null);
          const fileInputRef = useRef(null);
          const [csvEncoding, setCsvEncoding] = useState('UTF-8');
          
          const [newCartaoNome, setNewCartaoNome] = useState('');
          const [editingCartaoId, setEditingCartaoId] = useState(null);

          const [newUserName, setNewUserName] = useState('');
          const [newUserEmail, setNewUserEmail] = useState('');
          const [newUserSenha, setNewUserSenha] = useState('');
          const [newUserRole, setNewUserRole] = useState('registrador');
          const [editingUserId, setEditingUserId] = useState(null);

          const [filterStatus, setFilterStatus] = useState('');
          const [filterCartao, setFilterCartao] = useState('');
          const [filterSetor, setFilterSetor] = useState('');
          const [filterPossuiNf, setFilterPossuiNf] = useState('');
          const [filterData, setFilterData] = useState('');
          const [filterValor, setFilterValor] = useState('');
          const [filterParcelas, setFilterParcelas] = useState('');
          const [filterFornecedor, setFilterFornecedor] = useState('');
          const [filterNumNota, setFilterNumNota] = useState('');
          const [filterObservacao, setFilterObservacao] = useState('');

          const [currentUser, setCurrentUser] = useState(null);
          const [loginEmail, setLoginEmail] = useState('');
          const [loginSenha, setLoginSenha] = useState('');
          const [loginError, setLoginError] = useState('');
          const [showNotifications, setShowNotifications] = useState(false);
          const [authModalOpen, setAuthModalOpen] = useState(false);
          const [targetEntry, setTargetEntry] = useState(null);
          const [authCode, setAuthCode] = useState('');

          const [navTargetMenu, setNavTargetMenu] = useState('');

          useEffect(() => {
            const initAuth = async () => {
              try { await signInAnonymously(auth); } catch (error) { console.error("Erro auth:", error); }
            };
            initAuth();
            const unsubscribe = onAuthStateChanged(auth, (user) => { setFirebaseUser(user); });
            return () => unsubscribe();
          }, []);

          useEffect(() => {
            if (!firebaseUser) return;
            let loadedCollections = 0;
            const checkAllLoaded = () => { loadedCollections++; if (loadedCollections === 8) setLoadingData(false); };

            const unsubUsers = onSnapshot(getCollectionPath('users'), (snapshot) => {
              const docs = snapshot.docs.map(d => d.data());
              if (docs.length === 0) setDoc(getDocRef('users', seedUsers[0].id), seedUsers[0]);
              else {
                setUsers(docs);
                if (currentUser) {
                  const updatedSelf = docs.find(u => u.id === currentUser.id);
                  if (updatedSelf) setCurrentUser(updatedSelf); else setCurrentUser(null);
                }
              }
              checkAllLoaded();
            }, console.error);

            const unsubEntries = onSnapshot(getCollectionPath('entries'), (snapshot) => {
              setEntries(snapshot.docs.map(d => d.data()).sort((a, b) => b.id - a.id));
              checkAllLoaded();
            }, console.error);

            const unsubCartoes = onSnapshot(getCollectionPath('cartoes'), (snapshot) => {
              setCartoes(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            const unsubDept = onSnapshot(getCollectionPath('departamentos'), (snapshot) => {
              setDepartamentos(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            const unsubRequests = onSnapshot(getCollectionPath('auth_requests'), (snapshot) => {
              setAuthRequests(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            const unsubRotasAtivas = onSnapshot(getCollectionPath('rotas_ativas'), (snapshot) => {
              setRotasAtivas(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            const unsubRotasFinalizadas = onSnapshot(getCollectionPath('rotas_finalizadas'), (snapshot) => {
              setRotasFinalizadas(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            const unsubVinculos = onSnapshot(getCollectionPath('vinculos'), (snapshot) => {
              setVinculos(snapshot.docs.map(d => d.data()));
              checkAllLoaded();
            }, console.error);

            return () => { unsubUsers(); unsubEntries(); unsubCartoes(); unsubDept(); unsubRequests(); unsubRotasAtivas(); unsubRotasFinalizadas(); unsubVinculos(); };
          }, [firebaseUser]); 

          const handleInputChange = (e) => {
            const { name, value } = e.target;
            setFormData(prev => {
                const newData = { ...prev, [name]: value };
                if (name === 'possuiNf' && value !== 'Sim') newData.numNota = '';
                return newData;
            });
          };

          const handleRateioChange = (index, value) => {
             const newRateio = [...formData.rateio];
             newRateio[index] = value;
             setFormData(prev => ({ ...prev, rateio: newRateio }));
          };

          const handleSetorKeyDown = (e, index) => {
              if (e.key === 'Enter') {
                  e.preventDefault(); e.stopPropagation();
                  const currentValue = formData.rateio[index].toLowerCase().trim();
                  if (!currentValue) return;
                  const match = departamentos.find(d => 
                      `${d.codigo} - ${d.nome}`.toLowerCase().includes(currentValue) || 
                      d.nome.toLowerCase().includes(currentValue) || d.codigo.includes(currentValue)
                  );
                  if (match) handleRateioChange(index, `${match.codigo} - ${match.nome}`);
                  const form = e.currentTarget.closest('form');
                  if (form) {
                      const elements = Array.from(form.elements).filter(el => !el.disabled && !el.readOnly && el.tabIndex !== -1 && el.type !== 'hidden');
                      const idx = elements.indexOf(e.currentTarget);
                      if (idx > -1 && idx < elements.length - 1) elements[idx + 1].focus();
                  }
              }
          };

          const addRateio = () => setFormData(prev => ({ ...prev, rateio: [...prev.rateio, ''] }));
          const removeRateio = (index) => {
             if (formData.rateio.length === 1) return;
             setFormData(prev => ({ ...prev, rateio: formData.rateio.filter((_, i) => i !== index) }));
          };

          const handleFormKeyDown = (e) => {
              if (e.key === 'Enter') {
                  const isButton = e.target.tagName === 'BUTTON';
                  const isTextarea = e.target.tagName === 'TEXTAREA';
                  if (!isButton && !isTextarea) {
                      e.preventDefault();
                      const elements = Array.from(e.currentTarget.elements).filter(el => !el.disabled && !el.readOnly && el.tabIndex !== -1 && el.type !== 'hidden');
                      const index = elements.indexOf(e.target);
                      if (index > -1 && index < elements.length - 1) elements[index + 1].focus();
                  }
              }
          };

          const handleSubmit = async (e) => {
            e.preventDefault();
            if (formData.rateio.some(r => !r.trim())) return alert('Atenção: Selecione um departamento para todos os campos da lista.');
            const stringsDepto = departamentos.map(d => `${d.codigo} - ${d.nome}`);
            const setorInvalido = formData.rateio.find(r => !stringsDepto.includes(r.trim()));
            if (setorInvalido) return alert(`Atenção: A opção "${setorInvalido}" não existe no sistema.`);

            const totalValor = parseFloat(formData.valor) || 0;
            const entryId = editingEntryId ? editingEntryId : Date.now();
            
            const newEntry = { ...formData, id: entryId, valor: totalValor, parcelas: parseInt(formData.parcelas) || 1, cadastradoPor: currentUser ? currentUser.nome : 'Desconhecido' };

            try {
              await setDoc(getDocRef('entries', entryId.toString()), newEntry);
              setFormData(initialFormState); setEditingEntryId(null); setShowSuccess(true);
              setTimeout(() => { setShowSuccess(false); setActiveTab('table'); }, 2000);
            } catch (error) { alert("Erro ao salvar: " + error.message); }
          };

          const handleInitiateAction = async (entry, action) => {
            if (action === 'edit') { loadIntoForm(entry); return; }
            if (currentUser.role === 'admin') {
                if (window.confirm(`Confirma a exclusão do registo de R$ ${entry.valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}?`)) {
                  await deleteDoc(getDocRef('entries', entry.id.toString()));
                  await deleteDoc(getDocRef('auth_requests', entry.id.toString()));
                }
            } else { setTargetEntry(entry); setAuthCode(''); setAuthModalOpen(true); }
          };

          const loadIntoForm = (entry) => {
            let rateioAdaptado = [''];
            if (entry.rateio && entry.rateio.length > 0) {
                if (typeof entry.rateio[0] === 'object') rateioAdaptado = entry.rateio.map(r => r.setor);
                else rateioAdaptado = [...entry.rateio];
            } else if (entry.setor) { rateioAdaptado = [entry.setor]; }
            
            const formattedRateio = rateioAdaptado.map(r => {
                if (r && !r.includes(' - ')) {
                    const found = departamentos.find(d => d.nome === r);
                    if (found) return `${found.codigo} - ${found.nome}`;
                }
                return r;
            });

            setFormData({
              status: entry.status || 'Compra', cartao: entry.cartao || '', dataCompra: entry.dataCompra || '',
              valor: entry.valor || '', parcelas: entry.parcelas || '1', possuiNf: entry.possuiNf || 'Sim',
              numNota: entry.numNota || '', fornecedor: entry.fornecedor || '', observacao: entry.observacao || '', rateio: formattedRateio
            });
            setEditingEntryId(entry.id); setActiveTab('form');
          };

          const cancelEdit = () => { setFormData(initialFormState); setEditingEntryId(null); };

          const handleRequestAuthCode = async () => {
            if (!targetEntry) return;
            const code = Math.floor(100000 + Math.random() * 900000).toString(); 
            const request = {
              id: targetEntry.id.toString(), entryId: targetEntry.id, action: 'delete',
              entryDesc: `Excluir: ${targetEntry.status} de R$ ${targetEntry.valor} (${targetEntry.fornecedor || 'S/ Fornecedor'})`,
              requestedBy: currentUser.nome, code: code, timestamp: Date.now()
            };
            await setDoc(getDocRef('auth_requests', request.id), request);
          };

          const handleConfirmAuthCode = async () => {
            if (!targetEntry) return;
            const request = authRequests.find(r => r.id === targetEntry.id.toString());
            if (request && request.code === authCode) {
              await deleteDoc(getDocRef('auth_requests', request.id));
              setAuthModalOpen(false);
              await deleteDoc(getDocRef('entries', targetEntry.id.toString()));
              alert('Código válido! Registo excluído com sucesso.');
              setTargetEntry(null); setAuthCode('');
            } else { alert('Código incorreto, inválido ou a solicitação foi apagada pelo Administrador.'); }
          };

          const handleDismissNotification = async (reqId) => {
            await deleteDoc(getDocRef('auth_requests', reqId));
            if (authRequests.length === 1 && boletoAlerts.length === 0) setShowNotifications(false);
          };

          const closeAuthModal = () => { setAuthModalOpen(false); setTargetEntry(null); setAuthCode(''); };

          // --- ADMIN FUNCTIONS ---
          const handleAddDept = async (e) => {
            e.preventDefault(); if (!newDeptCodigo || !newDeptNome) return;
            const deptData = { codigo: newDeptCodigo, nome: newDeptNome };
            if (editingDeptId) {
               deptData.id = editingDeptId; await setDoc(getDocRef('departamentos', editingDeptId), deptData); setEditingDeptId(null);
            } else {
               const novoDept = { id: Date.now().toString(), ...deptData }; await setDoc(getDocRef('departamentos', novoDept.id), novoDept);
            }
            setNewDeptCodigo(''); setNewDeptNome('');
          };

          const handleEditDept = (dept) => { setNewDeptCodigo(dept.codigo); setNewDeptNome(dept.nome); setEditingDeptId(dept.id); };
          const cancelEditDept = () => { setNewDeptCodigo(''); setNewDeptNome(''); setEditingDeptId(null); };
          const handleRemoveDept = async (id) => { await deleteDoc(getDocRef('departamentos', id)); };

          const handleCsvUpload = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
              const text = event.target.result.replace(/^\uFEFF/, '').replace(/\r/g, '');
              const lines = text.split('\n');
              const newDepts = [];
              const separator = lines[0].includes(';') ? ';' : ',';
              lines.forEach((line) => {
                const cleanLine = line.trim(); if (!cleanLine) return; 
                if (cleanLine.toLowerCase().includes('código') || cleanLine.toLowerCase().includes('codigo')) return;
                const parts = cleanLine.split(separator);
                if (parts.length >= 2) {
                  const codigo = parts[0].trim().replace(/^"|"$/g, '');
                  let nome = parts.slice(1).join(separator).trim();
                  if (nome.startsWith('"') && nome.endsWith('"')) nome = nome.substring(1, nome.length - 1).trim();
                  if (codigo !== '') newDepts.push({ id: codigo + '-' + Math.random().toString(36).substring(2, 9), codigo, nome });
                }
              });
              if (newDepts.length > 0) {
                try {
                  const codigosVistos = new Set(departamentos.map(d => d.codigo));
                  const envios = [];
                  for (const dept of newDepts) {
                     if (!codigosVistos.has(dept.codigo)) { codigosVistos.add(dept.codigo); envios.push(setDoc(getDocRef('departamentos', dept.id), dept)); }
                  }
                  await Promise.all(envios); alert(`${envios.length} departamentos importados! (Duplicados ignorados)`);
                } catch(e) { alert('Erro CSV: ' + e.message); }
              } else { alert('Nenhum departamento válido no ficheiro.'); }
            };
            reader.readAsText(file, csvEncoding);
            if (fileInputRef.current) fileInputRef.current.value = '';
          };

          const handleAddCartao = async (e) => {
            e.preventDefault(); if (!newCartaoNome) return;
            if (editingCartaoId) {
               await setDoc(getDocRef('cartoes', editingCartaoId), { id: editingCartaoId, nome: newCartaoNome }); setEditingCartaoId(null);
            } else {
               const novoCartao = { id: Date.now().toString(), nome: newCartaoNome }; await setDoc(getDocRef('cartoes', novoCartao.id), novoCartao);
            }
            setNewCartaoNome('');
          };
          const handleEditCartao = (cartao) => { setNewCartaoNome(cartao.nome); setEditingCartaoId(cartao.id); };
          const cancelEditCartao = () => { setNewCartaoNome(''); setEditingCartaoId(null); };
          const handleRemoveCartao = async (id) => { await deleteDoc(getDocRef('cartoes', id)); };

          const handleAddUser = async (e) => {
            e.preventDefault(); if (!newUserName || !newUserEmail || !newUserSenha) return;
            const existingUser = users.find(u => u.email === newUserEmail);
            if (existingUser && existingUser.id !== editingUserId) return alert('E-mail já registado no sistema para outro utilizador.'); 
            const userData = { nome: newUserName, email: newUserEmail, senha: newUserSenha, role: newUserRole };
            if (editingUserId) {
               userData.id = editingUserId; await setDoc(getDocRef('users', editingUserId), userData); setEditingUserId(null);
            } else {
               const newUser = { id: Date.now().toString(), ...userData }; await setDoc(getDocRef('users', newUser.id), newUser);
            }
            setNewUserName(''); setNewUserEmail(''); setNewUserSenha(''); setNewUserRole('registrador');
          };
          const handleEditUser = (user) => { setNewUserName(user.nome); setNewUserEmail(user.email); setNewUserSenha(user.senha); setNewUserRole(user.role); setEditingUserId(user.id); };
          const cancelEditUser = () => { setNewUserName(''); setNewUserEmail(''); setNewUserSenha(''); setNewUserRole('registrador'); setEditingUserId(null); };
          const handleRemoveUser = async (id) => { if (id === currentUser.id) return alert('Ação negada: Não é possível remover a própria conta.'); await deleteDoc(getDocRef('users', id)); };

          const handleLogin = (e) => {
            e.preventDefault();
            const user = users.find(u => u.email === loginEmail && u.senha === loginSenha);
            if (user) { setCurrentUser(user); setLoginError(''); setLoginEmail(''); setLoginSenha(''); setActiveTab('dashboard'); }
            else { setLoginError('Credenciais inválidas. Verifique o seu e-mail e senha.'); }
          };
          const handleLogout = () => { setCurrentUser(null); setActiveTab('dashboard'); setShowNotifications(false); };

          const filteredEntries = useMemo(() => {
            return entries.filter(entry => {
              const matchStatus = filterStatus ? entry.status === filterStatus : true;
              const matchCartao = filterCartao ? entry.cartao === filterCartao : true;
              const matchSetor = filterSetor ? (
                  (entry.rateio && entry.rateio.some(r => {
                      if(typeof r === 'object') return r.setor === filterSetor;
                      return r === filterSetor;
                  })) || (!entry.rateio && entry.setor === filterSetor)
              ) : true;
              const matchPossuiNf = filterPossuiNf ? entry.possuiNf === filterPossuiNf : true;
              const matchData = filterData ? entry.dataCompra === filterData : true;
              const matchValor = filterValor ? entry.valor.toString().includes(filterValor) : true;
              const matchParcelas = filterParcelas ? entry.parcelas.toString() === filterParcelas : true;
              const matchFornecedor = filterFornecedor ? (entry.fornecedor || '').toLowerCase().includes(filterFornecedor.toLowerCase()) : true;
              const matchNumNota = filterNumNota ? (entry.numNota || '').toLowerCase().includes(filterNumNota.toLowerCase()) : true;
              const matchObservacao = filterObservacao ? (entry.observacao || '').toLowerCase().includes(filterObservacao.toLowerCase()) : true;
              return matchStatus && matchCartao && matchSetor && matchPossuiNf && matchData && matchValor && matchParcelas && matchFornecedor && matchNumNota && matchObservacao;
            });
          }, [entries, filterStatus, filterCartao, filterSetor, filterPossuiNf, filterData, filterValor, filterParcelas, filterFornecedor, filterNumNota, filterObservacao]);

          const dashboardStats = useMemo(() => {
            let totalCompras = 0, valorTotalCompras = 0, cancelamentos = 0, valorCancelamentos = 0, devolucoes = 0, valorDevolucoes = 0;
            const gastosPorCartao = {}; let comprasComNfValor = 0; let adiantamentosValor = 0;
            entries.forEach(entry => {
              if (entry.status === 'Compra') {
                totalCompras++; valorTotalCompras += entry.valor;
                const cartao = entry.cartao || 'Não Informado'; gastosPorCartao[cartao] = (gastosPorCartao[cartao] || 0) + entry.valor;
                if(entry.possuiNf === 'Sim') comprasComNfValor += entry.valor; else adiantamentosValor += entry.valor;
              } else if (entry.status === 'Cancelamento') { cancelamentos++; valorCancelamentos += entry.valor;
              } else if (entry.status === 'Devolução') { devolucoes++; valorDevolucoes += entry.valor; }
            });
            const topCartoes = Object.entries(gastosPorCartao).map(([nome, valor]) => ({ nome, valor })).sort((a, b) => b.valor - a.valor);
            const ultimasTransacoes = entries.slice(0, 5); 
            return { totalCompras, valorTotalCompras, cancelamentos, valorCancelamentos, devolucoes, valorDevolucoes, topCartoes, comprasComNfValor, adiantamentosValor, ultimasTransacoes };
          }, [entries]);

          // Alertas de Boletos
          const boletoAlerts = useMemo(() => {
             const today = new Date();
             today.setHours(0,0,0,0);
             return vinculos.filter(v => v.tipoVinculo === 'boleto' && v.status === 'pendente' && v.dataVencimento).map(v => {
                 const due = new Date(v.dataVencimento + 'T00:00:00');
                 const diffTime = due - today;
                 const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                 if ([7, 3, 1, 0].includes(diffDays) || diffDays < 0) {
                     return { ...v, diffDays };
                 }
                 return null;
             }).filter(Boolean);
          }, [vinculos]);

          // --- UI COMPONENTS ---
          const CardInfo = ({ title, value, icon: Icon, colorClass, subtext }) => (
            <div className="bg-white p-5 rounded-lg border border-slate-200 shadow-sm flex items-start space-x-4">
              <div className={`p-3 rounded-md ${colorClass} bg-opacity-10`}><Icon size={22} className={colorClass.replace('bg-', 'text-')} /></div>
              <div className="flex-1">
                <p className="text-sm font-medium text-slate-500 mb-1">{title}</p>
                <p className="text-2xl font-bold text-slate-800 tracking-tight">{value}</p>
                {subtext && <p className="text-xs font-medium text-slate-400 mt-1">{subtext}</p>}
              </div>
            </div>
          );

          const renderDashboard = () => (
            <div className="space-y-6 animate-in fade-in duration-500">
              <div className="flex flex-col md:flex-row md:items-end justify-between border-b border-slate-200 pb-4">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">Visão Geral</h2>
                  <p className="text-slate-500 text-sm mt-1">Métricas financeiras e controlo de movimentos em tempo real.</p>
                </div>
                <div className="mt-4 md:mt-0 flex items-center text-sm font-medium text-slate-500 bg-white px-3 py-1.5 rounded-md border border-slate-200 shadow-sm">
                  <Activity size={16} className="mr-2 text-blue-600" /> Sistema Ativo
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <CardInfo title="Total de Compras" value={`R$ ${dashboardStats.valorTotalCompras.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`} icon={DollarSign} colorClass="bg-emerald-600 text-emerald-600" subtext={`${dashboardStats.totalCompras} transações registadas`} />
                <CardInfo title="Ticket Médio" value={`R$ ${dashboardStats.totalCompras > 0 ? (dashboardStats.valorTotalCompras / dashboardStats.totalCompras).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '0,00'}`} icon={PieChart} colorClass="bg-blue-600 text-blue-600" subtext="Por compra efetuada" />
                <CardInfo title="Cancelamentos" value={`R$ ${dashboardStats.valorCancelamentos.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`} icon={Ban} colorClass="bg-rose-600 text-rose-600" subtext={`${dashboardStats.cancelamentos} itens anulados`} />
                <CardInfo title="Devoluções" value={`R$ ${dashboardStats.valorDevolucoes.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`} icon={RotateCcw} colorClass="bg-amber-500 text-amber-500" subtext={`${dashboardStats.devolucoes} itens devolvidos`} />
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-sm flex flex-col h-[350px]">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6 flex items-center"><FileCheck2 size={16} className="mr-2 text-slate-400"/> Composição de Compras</h3>
                  {dashboardStats.totalCompras > 0 ? (
                    <div className="space-y-6 flex-1 flex flex-col justify-center">
                        <div className="group">
                            <div className="flex justify-between text-sm mb-2">
                                <div className="flex items-center"><span className="w-3 h-3 rounded-full bg-emerald-500 mr-2"></span><span className="font-medium text-slate-700">Compras com Nota Fiscal</span></div>
                                <span className="text-slate-900 font-bold whitespace-nowrap">R$ {dashboardStats.comprasComNfValor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                              <div className="bg-emerald-500 h-2 rounded-full transition-all duration-500 ease-out" style={{ width: `${(dashboardStats.comprasComNfValor / dashboardStats.valorTotalCompras) * 100}%` }}></div>
                            </div>
                            <p className="text-xs text-slate-400 mt-1 text-right">{((dashboardStats.comprasComNfValor / dashboardStats.valorTotalCompras) * 100).toFixed(1)}% do total</p>
                        </div>
                        <div className="group">
                            <div className="flex justify-between text-sm mb-2">
                                <div className="flex items-center"><span className="w-3 h-3 rounded-full bg-amber-500 mr-2"></span><span className="font-medium text-slate-700">Adiantamentos (Entrega Posterior)</span></div>
                                <span className="text-slate-900 font-bold whitespace-nowrap">R$ {dashboardStats.adiantamentosValor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                              <div className="bg-amber-500 h-2 rounded-full transition-all duration-500 ease-out" style={{ width: `${(dashboardStats.adiantamentosValor / dashboardStats.valorTotalCompras) * 100}%` }}></div>
                            </div>
                            <p className="text-xs text-slate-400 mt-1 text-right">{((dashboardStats.adiantamentosValor / dashboardStats.valorTotalCompras) * 100).toFixed(1)}% do total</p>
                        </div>
                    </div>
                  ) : (<div className="flex-1 flex items-center justify-center text-slate-400 text-sm border-2 border-dashed border-slate-100 rounded-lg">Dados insuficientes.</div>)}
                </div>

                <div className="bg-white p-6 rounded-lg border border-slate-200 shadow-sm flex flex-col h-[350px]">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-6 flex items-center"><CreditCard size={16} className="mr-2 text-slate-400"/> Gasto por Cartão</h3>
                  {dashboardStats.topCartoes.length > 0 ? (
                    <div className="space-y-5 flex-1 overflow-y-auto pr-4 custom-scrollbar">
                      {dashboardStats.topCartoes.map((cartao, index) => {
                        const maxValor = dashboardStats.topCartoes[0].valor; const percentagem = (cartao.valor / maxValor) * 100;
                        return (
                          <div key={index}>
                            <div className="flex justify-between text-sm mb-1.5">
                              <span className="font-medium text-slate-700 truncate mr-4">{cartao.nome}</span>
                              <span className="text-slate-900 font-semibold whitespace-nowrap">R$ {cartao.valor.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</span>
                            </div>
                            <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                              <div className="bg-slate-800 h-1.5 rounded-full transition-all duration-500 ease-out" style={{ width: `${percentagem}%` }}></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (<div className="flex-1 flex items-center justify-center text-slate-400 text-sm border-2 border-dashed border-slate-100 rounded-lg">Dados insuficientes.</div>)}
                </div>
              </div>

              <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <div className="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider flex items-center"><Clock size={16} className="mr-2 text-slate-400"/> Últimos Lançamentos</h3>
                  <button onClick={() => setActiveTab('table')} className="text-xs font-medium text-blue-600 hover:text-blue-800 transition-colors">Ver Todos &rarr;</button>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm text-left divide-y divide-slate-200">
                    <thead className="bg-white"><tr className="text-xs text-slate-500 uppercase"><th className="px-6 py-3">Data</th><th className="px-6 py-3">Natureza</th><th className="px-6 py-3">Favorecido & Rateio</th><th className="px-6 py-3 text-right">Valor Total</th></tr></thead>
                    <tbody className="divide-y divide-slate-100">
                      {dashboardStats.ultimasTransacoes.length === 0 ? (
                        <tr><td colSpan="4" className="px-6 py-8 text-center text-slate-400">Nenhuma atividade recente.</td></tr>
                      ) : (
                        dashboardStats.ultimasTransacoes.map(entry => (
                          <tr key={entry.id} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-3 font-medium text-slate-900 align-top">{entry.dataCompra ? new Date(entry.dataCompra).toLocaleDateString('pt-BR', {timeZone:'UTC'}) : '-'}</td>
                            <td className="px-6 py-3 align-top"><span className={`inline-flex items-center px-2 py-0.5 rounded text-[11px] font-bold uppercase tracking-wider ${entry.status==='Compra'?'bg-emerald-100 text-emerald-700':entry.status==='Cancelamento'?'bg-rose-100 text-rose-700':'bg-amber-100 text-amber-700'}`}>{entry.status}</span></td>
                            <td className="px-6 py-3 align-top">
                               <span className="block text-slate-800 font-bold truncate max-w-[250px]" title={entry.fornecedor}>{entry.fornecedor || 'N/A'}</span>
                               {entry.rateio && entry.rateio.length > 1 ? (
                                   <span className="block text-[11px] text-blue-600 font-medium">{entry.rateio.length} Departamentos envolvidos</span>
                               ) : (
                                   <span className="block text-xs text-slate-500 truncate max-w-[250px]" title={entry.rateio?.[0]?.setor || entry.rateio?.[0] || entry.setor}>{entry.rateio?.[0]?.setor || entry.rateio?.[0] || entry.setor || 'N/A'}</span>
                               )}
                            </td>
                            <td className="px-6 py-3 text-right font-bold text-slate-900 align-top">R$ {entry.valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          );

          const renderForm = () => (
            <div className="max-w-4xl mx-auto animate-in fade-in duration-500">
               <div className="mb-6 border-b border-slate-200 pb-4">
                  <h2 className="text-2xl font-bold text-slate-900">{editingEntryId ? 'Editar Lançamento' : 'Novo Lançamento'}</h2>
                  <p className="text-slate-500 text-sm mt-1">{editingEntryId ? 'Corrija os dados da transação previamente registada.' : 'Registe uma nova compra, cancelamento ou devolução.'}</p>
              </div>
              {showSuccess && (
                <div className="mb-6 bg-emerald-50 border border-emerald-200 text-emerald-800 p-4 rounded-md shadow-sm flex items-center">
                  <CheckCircle2 size={20} className="mr-3 text-emerald-600" />
                  <span className="font-medium">O registo foi {editingEntryId ? 'atualizado' : 'sincronizado'} com sucesso na base de dados.</span>
                </div>
              )}
              <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <form onSubmit={handleSubmit} onKeyDown={handleFormKeyDown} className="p-8 space-y-8">
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Detalhes da Transação</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1.5">Natureza do Registo *</label>
                        <select name="status" value={formData.status} onChange={handleInputChange} required className="w-full px-3 py-2.5 text-sm bg-slate-50 border border-slate-300 rounded-md focus:bg-white focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                          <option value="Compra">Compra</option><option value="Cancelamento">Cancelamento</option><option value="Devolução">Devolução</option>
