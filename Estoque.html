<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsbarcode/3.11.6/JsBarcode.all.min.js"></script>
<style>
  :root { --bg:#0f0f17; --card:#1a1a27; --border:#2d2d3a; --accent:#6c63ff; --accent-hover:#8b85ff; --text:#fff; --muted:rgba(255,255,255,.65); --danger:#ff5c7a; --ok:#3ddc97; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; min-height:100vh; }
  header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; letter-spacing:.03em; }
  header h1 span { color:var(--accent); }
  main { max-width:900px; margin:0 auto; padding:18px; }
  .btn { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:9px 14px; font-size:14px; cursor:pointer; font-family:inherit; }
  .btn:hover { border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .btn.primary:hover { background:var(--accent-hover); }
  .btn.danger { color:var(--danger); }
  .btn.sm { padding:5px 9px; font-size:12px; }
  input { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:14px; font-family:inherit; width:100%; }
  input:focus { outline:none; border-color:var(--accent); }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .muted { color:var(--muted); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .group { cursor:pointer; transition:.15s; }
  .group:hover { border-color:var(--accent); transform:translateY(-2px); }
  .group h3 { margin:0 0 6px; font-size:16px; }
  .plus { display:flex; align-items:center; justify-content:center; font-size:48px; color:var(--accent); border-style:dashed; min-height:96px; cursor:pointer; }
  .plus:hover { border-color:var(--accent); }
  .tabs { display:flex; gap:6px; margin:4px 0 16px; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:10px; border:1px solid var(--border); background:var(--card); cursor:pointer; font-size:14px; }
  .tab.on { background:var(--accent); border-color:var(--accent); font-weight:600; }
  .row { display:flex; gap:10px; align-items:center; }
  .row > * { flex:1; }
  .row > .fit { flex:none; }
  .item { display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:8px; flex-wrap:wrap; }
  .item .info { flex:1; min-width:140px; }
  .item .info b { display:block; font-size:15px; }
  .item svg { background:#fff; border-radius:6px; padding:4px; max-width:170px; height:auto; }
  .tag { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--border); }
  .tag.sold { color:var(--danger); border-color:var(--danger); }
  .tag.free { color:var(--ok); border-color:var(--ok); }
  .total { font-size:22px; font-weight:700; text-align:right; margin:12px 0; }
  .empty { text-align:center; padding:30px; color:var(--muted); }
  .msg { min-height:18px; font-size:13px; margin-top:6px; }
  .msg.err { color:var(--danger); } .msg.ok { color:var(--ok); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; padding:16px; z-index:20; }
  .modal { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; width:100%; max-width:420px; max-height:90vh; overflow:auto; }
  .modal h2 { margin:0 0 6px; font-size:18px; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <button class="btn hidden" id="back">← Grupos</button>
  <h1 id="title">Estoque <span>•</span></h1>
  <span class="muted" id="cloud" title="Sincronização com a nuvem">⏳</span>
</header>
<main id="app"></main>

<script>
const KEY = 'stnr_estoque_v1';
let db = load();
let view = { screen: 'home', groupId: null, tab: 'estoque' };
let cart = {}; // groupId -> [itemId]

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.groups) return d; } catch (e) {}
  return { groups: [], seq: 1000, noteSeq: 0, updatedAt: 0 };
}
function save() {
  db.updatedAt = Date.now();
  localStorage.setItem(KEY, JSON.stringify(db));
  pushCloud();
}

/* ---------- Nuvem (Firebase) ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyD1X4SsLtWWKTX_O7OzWEpIzA0E8Bm1CBw",
  authDomain: "faturas-e-extratos.firebaseapp.com",
  projectId: "faturas-e-extratos",
  storageBucket: "faturas-e-extratos.firebasestorage.app",
  messagingSenderId: "461188792473",
  appId: "1:461188792473:web:f09bae1f7ddc5698dab808",
  measurementId: "G-XJFVH7JYPQ"
};
let cloudDoc = null, pushTimer = null;
const denied = e => e.code === 'permission-denied' ? 'as regras do Firestore negam a coleção "estoque_app".' : e.message;
function cloudStatus(t, tip) { const el = document.getElementById('cloud'); if (el) { el.textContent = t; el.title = tip || ''; } }
function pushCloud() {
  if (!cloudDoc) return;
  clearTimeout(pushTimer);
  cloudStatus('⏳', 'Salvando na nuvem…');
  pushTimer = setTimeout(() => {
    cloudDoc.set({ json: JSON.stringify(db), updatedAt: db.updatedAt })
      .then(() => cloudStatus('☁️', 'Salvo na nuvem'))
      .catch(e => cloudStatus('⚠️', 'Falha ao salvar na nuvem: ' + denied(e)));
  }, 400);
}
function initCloud() {
  if (typeof firebase === 'undefined' || !firebase.firestore) { cloudStatus('📴', 'Sem Firebase — usando só este navegador'); return; }
  try {
    firebase.initializeApp(firebaseConfig);
    cloudDoc = firebase.firestore().collection('estoque_app').doc('principal');
  } catch (e) { cloudStatus('⚠️', e.message); return; }
  cloudDoc.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (!snap.exists) { if (db.groups.length) pushCloud(); else cloudStatus('☁️', 'Conectado'); return; }
    const d = snap.data();
    if ((d.updatedAt || 0) > (db.updatedAt || 0)) {
      try { db = JSON.parse(d.json); } catch (e) { return; }
      localStorage.setItem(KEY, JSON.stringify(db));
      const a = document.activeElement;
      if (!(a && a.tagName === 'INPUT')) render();
    } else if ((d.updatedAt || 0) < (db.updatedAt || 0)) { pushCloud(); return; }
    cloudStatus('☁️', 'Sincronizado');
  }, e => cloudStatus('⚠️', denied(e)));
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const group = () => db.groups.find(g => g.id === view.groupId);
const $ = id => document.getElementById(id);

function go(screen, groupId, tab) {
  view = { screen, groupId: groupId || null, tab: tab || 'estoque' };
  render();
}
$('back').onclick = () => go('home');

function render() {
  const g = view.screen === 'group' ? group() : null;
  if (view.screen === 'group' && !g) return go('home');
  $('back').classList.toggle('hidden', !g);
  $('title').innerHTML = g ? esc(g.name) : 'Estoque <span>•</span>';
  $('app').innerHTML = g ? renderGroup(g) : renderHome();
  drawBarcodes();
  if (g && view.tab === 'marcado') $('code') && $('code').focus();
}

function drawBarcodes() {
  document.querySelectorAll('svg[data-code]').forEach(el => {
    const opts = { height: 40, width: 1.6, fontSize: 13, margin: 2 };
    const code = el.dataset.code;
    // códigos EAN-13/UPC-A/EAN-8 válidos usam o formato próprio; o resto vai em Code128
    const fmt = /^\d{13}$/.test(code) ? 'EAN13' : /^\d{12}$/.test(code) ? 'UPC' : /^\d{8}$/.test(code) ? 'EAN8' : 'CODE128';
    try { JsBarcode(el, code, { ...opts, format: fmt }); }
    catch (e) { try { JsBarcode(el, code, { ...opts, format: 'CODE128' }); } catch (e2) {} }
  });
}

/* ---------- Home ---------- */
function renderHome() {
  const cards = db.groups.map(g => {
    return `<div class="card group" onclick="go('group','${g.id}')">
      <h3>${esc(g.name)}</h3>
      <div class="muted">${g.items.length} item(ns) cadastrado(s)</div>
      <div class="muted">${g.notes.length} nota(s)</div></div>`;
  }).join('');
  return `<div class="grid"><div class="card plus" onclick="newGroup()" title="Novo grupo">+</div>${cards}</div>
    ${db.groups.length ? '' : '<div class="empty">Clique no + para criar o primeiro grupo.</div>'}`;
}

function newGroup() {
  modal(`<h2>Novo grupo</h2><label>Nome do grupo</label><input id="m1" autofocus>`, () => {
    const name = $('m1').value.trim(); if (!name) return false;
    db.groups.push({ id: uid(), name, items: [], notes: [] }); save(); render();
  });
}
function delGroup(id) {
  if (!confirm('Excluir este grupo com todos os itens e notas?')) return;
  db.groups = db.groups.filter(g => g.id !== id); save(); go('home');
}

/* ---------- Grupo ---------- */
function renderGroup(g) {
  const tabs = [['estoque','Estoque'],['marcado','Marcado'],['historico','Histórico']]
    .map(([k, n]) => `<div class="tab ${view.tab === k ? 'on' : ''}" onclick="go('group','${g.id}','${k}')">${n}</div>`).join('');
  let body = '';
  if (view.tab === 'estoque') body = renderEstoque(g);
  else if (view.tab === 'marcado') body = renderMarcado(g);
  else body = renderHistorico(g);
  return `<div class="tabs">${tabs}</div>${body}
    <div style="margin-top:30px;text-align:center"><button class="btn sm danger" onclick="delGroup('${g.id}')">Excluir grupo</button></div>`;
}

function soldQty(g, code) {
  return g.notes.reduce((s, n) => s + n.items.filter(i => i.code === code).reduce((a, i) => a + (i.qty || 1), 0), 0);
}
function renderEstoque(g) {
  const list = g.items.map(i => `<div class="card item">
      <div class="info"><b>${esc(i.name)}</b><span class="muted">${brl(i.price)} · código ${esc(i.code)}</span>
        <span class="tag">${soldQty(g, i.code)} vendido(s)</span></div>
      <svg data-code="${esc(i.code)}"></svg>
      <div><button class="btn sm" onclick="printLabel('${i.id}')">Imprimir</button>
      <button class="btn sm danger" onclick="delItem('${i.id}')">✕</button></div></div>`).join('');
  return `<div class="card" style="margin-bottom:14px">
      <div class="row"><div><label>Nome do item</label><input id="iname" onkeydown="if(event.key==='Enter')$('iprice').focus()"></div>
      <div><label>Valor (R$)</label><input id="iprice" type="number" step="0.01" min="0" inputmode="decimal" onkeydown="if(event.key==='Enter')addItem()"></div></div>
      <label>Código de barras <span class="muted">(opcional — leia o código da embalagem ou deixe vazio para gerar um)</span></label>
      <input id="icode" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();addItem()}">
      <div style="margin-top:12px"><button class="btn primary" onclick="addItem()">Adicionar item</button>
        ${g.items.length ? '<button class="btn" style="margin-left:8px" onclick="printAllLabels()">Imprimir todas as etiquetas</button>' : ''}</div>
      <div class="msg" id="imsg"></div></div>
    ${list || '<div class="empty">Nenhum item neste grupo.</div>'}`;
}

function addItem() {
  const g = group(), name = $('iname').value.trim(), price = parseFloat($('iprice').value);
  let code = cleanCode($('icode').value);
  const err = t => { const m = $('imsg'); m.className = 'msg err'; m.textContent = t; };
  if (!name || isNaN(price) || price < 0) return err('Informe nome e valor.');
  if (/[*]/.test(code)) return err('O código não pode conter "*".');
  if (code) { if (g.items.some(i => i.code.toLowerCase() === code.toLowerCase())) return err('Já existe um item com esse código neste grupo.'); }
  else { do { db.seq++; code = String(db.seq); } while (g.items.some(i => i.code === code)); }
  g.items.unshift({ id: uid(), name, price, code });
  save(); render();
  $('iname').focus();
}
function delItem(id) {
  if (!confirm('Excluir este item? (as notas já geradas não mudam)')) return;
  const g = group(); g.items = g.items.filter(i => i.id !== id);
  cart[g.id] = (cart[g.id] || []).filter(l => l.id !== id); save(); render();
}
const cleanCode = s => String(s).replace(/[\x00-\x1f\x7f]/g, '').trim();
// Etiqueta para impressão: barras grossas, altura generosa e margem branca (quiet zone) larga
function labelSVG(code) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const fmt = /^\d{13}$/.test(code) ? 'EAN13' : /^\d{12}$/.test(code) ? 'UPC' : /^\d{8}$/.test(code) ? 'EAN8' : 'CODE128';
  const opts = { width: 3, height: 90, fontSize: 20, margin: 20, marginTop: 8, marginBottom: 8, background: '#ffffff', lineColor: '#000000' };
  try { JsBarcode(el, code, { ...opts, format: fmt }); } catch (e) { JsBarcode(el, code, { ...opts, format: 'CODE128' }); }
  if (!el.getAttribute('viewBox')) el.setAttribute('viewBox', `0 0 ${parseFloat(el.getAttribute('width'))} ${parseFloat(el.getAttribute('height'))}`);
  el.removeAttribute('width'); el.removeAttribute('height');
  return el.outerHTML;
}
function printLabels(items, copies) {
  const labels = items.flatMap(i => Array(copies).fill(`<div class="l"><div class="n">${esc(i.name)}</div><div class="p">${brl(i.price)}</div>${labelSVG(i.code)}</div>`)).join('');
  const w = window.open('', '_blank');
  if (!w) return alert('Permita pop-ups para imprimir as etiquetas.');
  w.document.write(`<!DOCTYPE html><meta charset="UTF-8"><title>Etiquetas</title><style>
    @page{margin:6mm} body{margin:0;font-family:Arial,sans-serif;color:#000}
    .l{display:inline-block;vertical-align:top;width:62mm;padding:3mm;margin:1mm;border:1px dashed #bbb;text-align:center;break-inside:avoid;page-break-inside:avoid}
    .n{font-size:11pt;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.p{font-size:10pt;margin-bottom:1mm}
    svg{width:100%;height:auto;display:block}
    @media print{.l{border-color:#fff}}</style><body>${labels}<script>onload=()=>setTimeout(()=>print(),200)<\/script>`);
  w.document.close();
}
function printLabel(id) {
  const i = group().items.find(x => x.id === id);
  const n = parseInt(prompt('Quantas etiquetas imprimir?', '1'));
  if (n >= 1) printLabels([i], Math.min(n, 200));
}
function printAllLabels() {
  const g = group(); if (!g.items.length) return;
  printLabels(g.items, 1);
}

/* ---------- Marcado ---------- */
let draft = { buyer: '', qty: 1, msg: '', ok: true };
function cartLines(g) {
  const lines = cart[g.id] = (cart[g.id] || []).filter(l => g.items.some(i => i.id === l.id));
  return lines.map(l => ({ ...l, item: g.items.find(i => i.id === l.id) }));
}
function renderMarcado(g) {
  const lines = cartLines(g);
  const total = lines.reduce((s, l) => s + l.item.price * l.qty, 0);
  const units = lines.reduce((s, l) => s + l.qty, 0);
  const rows = lines.map(l => `<div class="card item">
      <div class="info"><b>${esc(l.item.name)}</b><span class="muted">${esc(l.item.code)} · ${brl(l.item.price)} cada</span></div>
      <div class="row" style="flex:none;gap:4px">
        <button class="btn sm" onclick="chgQty('${l.id}',-1)">−</button>
        <input type="number" min="1" value="${l.qty}" style="width:64px;text-align:center" onchange="setQty('${l.id}',this.value)" onfocus="this.select()">
        <button class="btn sm" onclick="chgQty('${l.id}',1)">+</button></div>
      <div style="min-width:90px;text-align:right"><b>${brl(l.item.price * l.qty)}</b></div>
      <button class="btn sm danger" onclick="unmark('${l.id}')">✕</button></div>`).join('');
  return `<div class="card" style="margin-bottom:14px">
      <label>Código de barras <span class="muted">(leitor, ou digite; use <b>5*código</b> para várias unidades)</span></label>
      <div class="row"><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="send"
        placeholder="Leia ou digite o código e pressione Enter" onkeydown="codeKey(event)">
        <input id="qty" class="fit" type="number" min="1" value="${draft.qty}" title="Quantidade" style="width:76px;text-align:center"
          onchange="draft.qty=Math.max(1,parseInt(this.value)||1)" onkeydown="if(event.key==='Enter'){event.preventDefault();$('code').focus()}">
        <button class="btn primary fit" onclick="mark()">Enviar</button></div>
      <div class="msg ${draft.ok ? 'ok' : 'err'}" id="cmsg">${esc(draft.msg)}</div></div>
    ${rows || '<div class="empty">Nenhum item marcado.</div>'}
    ${lines.length ? `<div class="total">${units} un. · Total: ${brl(total)}</div>
      <label>Nome de quem está comprando</label><input id="buyer" value="${esc(draft.buyer)}" placeholder="Nome do comprador"
        oninput="draft.buyer=this.value" onkeydown="if(event.key==='Enter')makeNote()">
      <div style="margin-top:12px"><button class="btn primary" onclick="makeNote()">Gerar nota</button></div>` : ''}`;
}
// Leitores de código de barras "digitam" o código e terminam com Enter (alguns com Tab)
function codeKey(e) {
  if (e.key === 'Enter' || (e.key === 'Tab' && e.target.value.trim())) { e.preventDefault(); mark(); }
}
function flash(text, ok) { draft.msg = text; draft.ok = ok; const m = $('cmsg'); if (m) { m.className = 'msg ' + (ok ? 'ok' : 'err'); m.textContent = text; } }
function mark() {
  const g = group(), input = $('code');
  let raw = cleanCode(input.value), qty = Math.max(1, parseInt($('qty').value) || 1);
  if (!raw) return;
  // "5*código", "5x código" ou "código*5"
  let it = findItem(g, raw), m;
  if (!it && (m = raw.match(/^(\d+)\s*[*xX]\s*(.+)$/)) && findItem(g, m[2].trim())) { qty = parseInt(m[1]); raw = m[2].trim(); it = findItem(g, raw); }
  else if (!it && (m = raw.match(/^(.+?)\s*[*xX]\s*(\d+)$/)) && findItem(g, m[1].trim())) { raw = m[1].trim(); qty = parseInt(m[2]); it = findItem(g, raw); }
  qty = Math.max(1, qty);
  if (!it) { input.value = ''; flash(`Código "${raw}" não encontrado neste grupo.`, false); input.focus(); beep(false); return; }
  const list = cart[g.id] = cart[g.id] || [];
  const line = list.find(l => l.id === it.id);
  if (line) line.qty += qty; else list.push({ id: it.id, qty });
  draft.qty = 1;
  draft.msg = `${it.name} ×${qty} adicionado (${(line || list[list.length - 1]).qty} no total).`; draft.ok = true;
  render(); beep(true);
}
const findItem = (g, code) => g.items.find(i => i.code.toLowerCase() === code.toLowerCase());
function beep(ok) {
  try {
    const c = beep.c = beep.c || new (window.AudioContext || window.webkitAudioContext)();
    const o = c.createOscillator(), gn = c.createGain();
    o.frequency.value = ok ? 1000 : 250; gn.gain.value = 0.05;
    o.connect(gn); gn.connect(c.destination); o.start(); o.stop(c.currentTime + (ok ? 0.06 : 0.25));
  } catch (e) {}
}
function unmark(id) { const g = group(); cart[g.id] = cart[g.id].filter(l => l.id !== id); render(); }
function setQty(id, v) {
  const l = cart[group().id].find(l => l.id === id); if (!l) return;
  const q = parseInt(v); if (q >= 1) l.qty = q; render();
}
function chgQty(id, d) {
  const l = cart[group().id].find(l => l.id === id); if (!l) return;
  l.qty = Math.max(1, l.qty + d); render();
}

// Se o leitor disparar sem o campo focado, redireciona as teclas para o campo do código
document.addEventListener('keydown', e => {
  if (view.screen !== 'group' || view.tab !== 'marcado' || document.querySelector('.modal-bg')) return;
  const t = e.target, code = $('code');
  if (!code || t === code || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
  if (e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  code.focus();
});

function makeNote() {
  const g = group(), lines = cartLines(g), buyer = draft.buyer.trim();
  if (!lines.length) return;
  if (!buyer) { flash('Informe o nome do comprador.', false); $('buyer').focus(); return; }
  db.noteSeq++;
  const note = { id: uid(), num: db.noteSeq, buyer, date: new Date().toISOString(),
    items: lines.map(l => ({ name: l.item.name, code: l.item.code, price: l.item.price, qty: l.qty })),
    total: lines.reduce((s, l) => s + l.item.price * l.qty, 0) };
  g.notes.unshift(note); cart[g.id] = []; draft = { buyer: '', qty: 1, msg: '', ok: true }; save();
  downloadNote(g, note);
  go('group', g.id, 'historico');
}

/* ---------- Histórico / notas ---------- */
function renderHistorico(g) {
  if (!g.notes.length) return '<div class="empty">Nenhuma nota gerada.</div>';
  return g.notes.map(n => `<div class="card item">
    <div class="info"><b>Nota nº ${String(n.num).padStart(4, '0')} — ${esc(n.buyer)}</b>
      <span class="muted">${new Date(n.date).toLocaleString('pt-BR')} · ${n.items.reduce((s, i) => s + (i.qty || 1), 0)} un.</span></div>
    <div><b>${brl(n.total)}</b></div>
    <div><button class="btn sm" onclick="viewNote('${n.id}')">Ver</button>
    <button class="btn sm" onclick="dl('${n.id}')">Baixar</button>
    <button class="btn sm danger" onclick="delNote('${n.id}')">✕</button></div></div>`).join('');
}
function noteHTML(g, n) {
  const rows = n.items.map(i => { const q = i.qty || 1;
    return `<tr><td>${esc(i.name)}</td><td>${esc(i.code)}</td><td style="text-align:right">${q}</td><td style="text-align:right">${brl(i.price)}</td><td style="text-align:right">${brl(i.price * q)}</td></tr>`; }).join('');
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Nota ${String(n.num).padStart(4,'0')} - ${esc(n.buyer)}</title>
<style>body{font-family:Segoe UI,Arial,sans-serif;max-width:560px;margin:30px auto;padding:0 16px;color:#111}
h1{font-size:20px;margin:0}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:left;font-size:14px}
.t{text-align:right;font-size:20px;font-weight:700}.m{color:#555;font-size:13px}</style></head><body>
<h1>${esc(g.name)}</h1><div class="m">Nota nº ${String(n.num).padStart(4,'0')} · ${new Date(n.date).toLocaleString('pt-BR')}</div>
<p><b>Comprador:</b> ${esc(n.buyer)}</p>
<table><tr><th>Item</th><th>Código</th><th style="text-align:right">Qtd</th><th style="text-align:right">Unit.</th><th style="text-align:right">Subtotal</th></tr>${rows}</table>
<div class="t">Total: ${brl(n.total)}</div></body></html>`;
}
function downloadNote(g, n) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([noteHTML(g, n)], { type: 'text/html' }));
  a.download = `Nota ${String(n.num).padStart(4, '0')} - ${n.buyer.replace(/[\\/:*?"<>|]/g, '')}.html`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const findNote = id => group().notes.find(n => n.id === id);
function dl(id) { downloadNote(group(), findNote(id)); }
function viewNote(id) {
  const w = window.open('', '_blank'); w.document.write(noteHTML(group(), findNote(id))); w.document.close();
}
function delNote(id) {
  if (!confirm('Excluir esta nota do histórico?')) return;
  const g = group();
  g.notes = g.notes.filter(x => x.id !== id); save(); render();
}

/* ---------- Modal ---------- */
function modal(html, onOk) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}<div class="actions"><button class="btn" id="mc">Cancelar</button><button class="btn primary" id="mo">Criar</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('#mc').onclick = close;
  bg.querySelector('#mo').onclick = () => { if (onOk() !== false) close(); };
  bg.querySelector('input').onkeydown = e => { if (e.key === 'Enter') bg.querySelector('#mo').click(); };
  bg.querySelector('input').focus();
}

render();
initCloud();
</script>
</body>
</html>
