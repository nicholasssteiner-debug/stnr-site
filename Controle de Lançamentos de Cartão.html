<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COFRE - Controle Operacional Financeiro de Recursos e Estoque</title>
    
    <!-- Tailwind CSS para os Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuração de Tema do Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Babel para compilar o React no navegador -->
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

    <!-- Mapeamento de Módulos (Import Map) -->
  <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.2.0",
          "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
          "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
          "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js",
          "firebase/analytics": "https://www.gstatic.com/firebasejs/10.6.0/firebase-analytics.js",
          "firebase/auth": "https://www.gstatic.com/firebasejs/10.6.0/firebase-auth.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js"
        }
      }
</script>
     <style>
        body { font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Estilos base para inputs corporativos */
        input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="password"], select, textarea {
            transition: all 0.2s ease-in-out;
        }
        
        /* Personalização da Scrollbar interna */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useRef, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          LayoutDashboard, FilePlus, Table as TableIcon, CreditCard, DollarSign, Ban, RotateCcw,
          CheckCircle2, Settings, Trash2, Upload, Plus, Search, Filter, Clock, Activity, PieChart,
          User, Users, Lock, LogOut, Shield, Loader2, Bell, X, AlertTriangle, FileText, Pencil, Hash, FileCheck2,
          ChevronRight, Building, Link, Receipt, Percent, Archive, FileSignature, CheckSquare, FileSpreadsheet,
          Eye, EyeOff, Calendar, FileBox, AlertCircle
        } from 'lucide-react';

        // --- FIREBASE CONFIGURAÇÃO ---
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "firebase/auth";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "firebase/firestore";

        const firebaseConfig = {
          apiKey: "AIzaSyB7ov_J4nPV2XKmKaRhozTFdMB_3-sI6bY",
          authDomain: "mapa-de-analise-por-conta.firebaseapp.com",
          projectId: "mapa-de-analise-por-conta",
          storageBucket: "mapa-de-analise-por-conta.firebasestorage.app",
          messagingSenderId: "181460577763",
          appId: "1:181460577763:web:5f7821f5a597dcfd44c4d6",
          measurementId: "G-HL4MBDKSFZ"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const appId = 'mapa-de-analise-local-v1';
        const getCollectionPath = (collectionName) => collection(db, 'artifacts', appId, 'public', 'data', collectionName);
        const getDocRef = (collectionName, documentId) => doc(db, 'artifacts', appId, 'public', 'data', collectionName, documentId);

        const formatCurrency = (v) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v);

        // --- COMPONENTE VÍNCULO ---
        const VinculoTab = ({ entries, rotasAtivas, rotasFinalizadas, vinculos, currentUser, cartoes, departamentos }) => {
            const [activeMenu, setActiveMenu] = useState('cartao'); // 'cartao', 'adiantamento', 'boleto'
            const [subView, setSubView] = useState('pendentes'); // 'pendentes', 'gerar'
            
            // Filtros de pesquisa gerais
            const [filterPesquisa, setFilterPesquisa] = useState('');
            const [filterCartao, setFilterCartao] = useState('');

            // Estados Comuns
            const [selectedEntryId, setSelectedEntryId] = useState('');
            const [tipoNota, setTipoNota] = useState('NFe');
            const [chaveAcesso, setChaveAcesso] = useState('');
            const [numeroNota, setNumeroNota] = useState('');
            const [dataEmissao, setDataEmissao] = useState('');
            const [valorTotalNota, setValorTotalNota] = useState('');
            const [emitenteNota, setEmitenteNota] = useState('');
            const [link1, setLink1] = useState('');
            const [link2, setLink2] = useState('');
            const [link3, setLink3] = useState('');

            // Específicos Cartão -> ROTA
            const [selectedRotaIds, setSelectedRotaIds] = useState([]); 
            const [rotaSelectTemp, setRotaSelectTemp] = useState('');
            const [manualDiscount, setManualDiscount] = useState('');

            // Específicos Adiantamento & Boletos (Rateio Local)
            const [adiantamentoOption, setAdiantamentoOption] = useState('parcial'); // 'parcial', 'desconto'
            const [codigoBoleto, setCodigoBoleto] = useState('');
            const [dataVencimentoBoleto, setDataVencimentoBoleto] = useState('');
            
            const [produtosRateio, setProdutosRateio] = useState([]);
            const [formItem, setFormItem] = useState({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 });
            const [formSetor, setFormSetor] = useState({ depto: '', qtd: '' });
            const [setoresTemporarios, setSetoresTemporarios] = useState([]);

            const allRotas = useMemo(() => [...rotasAtivas, ...rotasFinalizadas], [rotasAtivas, rotasFinalizadas]);
            
            // Determina quais ROTAS já estão vinculadas para não aparecerem novamente
            const rotasVinculadasIds = useMemo(() => vinculos.flatMap(v => v.rotaIds || (v.rotaId ? [v.rotaId] : [])), [vinculos]);
            const rotasDisponiveis = useMemo(() => allRotas.filter(r => !rotasVinculadasIds.includes(r.id)), [allRotas, rotasVinculadasIds]);

            // Listas baseadas no menu ativo
            const pendentesCartao = useMemo(() => entries.filter(e => e.status === 'Compra' && e.possuiNf === 'Sim' && !vinculos.some(v => v.entryId === e.id.toString())), [entries, vinculos]);
            const pendentesAdiantamento = useMemo(() => entries.filter(e => e.status === 'Compra' && e.possuiNf === 'É adiantamento ( NF com entrega posterior )' && !vinculos.some(v => v.entryId === e.id.toString())), [entries, vinculos]);

            const listToFilter = activeMenu === 'cartao' ? pendentesCartao : pendentesAdiantamento;
            
            const filteredEntries = useMemo(() => {
                return listToFilter.filter(e => {
                    const matchCartao = filterCartao ? e.cartao === filterCartao : true;
                    const termo = filterPesquisa.toLowerCase();
                    const matchPesquisa = termo === '' ? true : ((e.fornecedor || '').toLowerCase().includes(termo) || (e.valor.toString().includes(termo)) || (e.observacao || '').toLowerCase().includes(termo));
                    return matchCartao && matchPesquisa;
                });
            }, [listToFilter, filterCartao, filterPesquisa]);

            const selectedEntry = listToFilter.find(e => e.id.toString() === selectedEntryId);

            // Mudar Menu Principal (limpa tudo)
            const handleSwitchMenu = (menu) => {
                setActiveMenu(menu);
                setSubView(menu === 'boleto' ? 'gerar' : 'pendentes'); // Boleto não tem pendentes (criação direta)
                
                // Clear explicitly
                setSelectedEntryId(''); setSelectedRotaIds([]); setRotaSelectTemp('');
                setTipoNota('NFe'); setChaveAcesso(''); setNumeroNota(''); setDataEmissao(''); setValorTotalNota(''); setEmitenteNota('');
                setLink1(''); setLink2(''); setLink3(''); setManualDiscount('');
                setAdiantamentoOption('parcial'); setCodigoBoleto(''); setDataVencimentoBoleto('');
                setProdutosRateio([]); setFormItem({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 }); setFormSetor({ depto: '', qtd: '' }); setSetoresTemporarios([]);
            };

            const iniciarVinculo = (entryId) => {
                const entry = listToFilter.find(e => e.id.toString() === entryId);
                
                // Reset tudo primeiro para garantir estado limpo
                setSelectedRotaIds([]); setRotaSelectTemp('');
                setTipoNota('NFe'); setChaveAcesso(''); setLink1(''); setLink2(''); setLink3(''); setManualDiscount('');
                setAdiantamentoOption('parcial'); setCodigoBoleto(''); setDataVencimentoBoleto('');
                setProdutosRateio([]); setFormItem({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 }); setFormSetor({ depto: '', qtd: '' }); setSetoresTemporarios([]);

                setSelectedEntryId(entryId);
                setNumeroNota(entry?.numNota || ''); 
                setDataEmissao(entry?.dataCompra || ''); 
                setValorTotalNota(entry?.valor || ''); 
                setEmitenteNota(entry?.fornecedor || '');
                
                setSubView('gerar');
            };

            // Lógica Rateio Builder (Adiantamentos e Boletos)
            const formItemQtd = parseFloat(formItem.qtd) || 0;
            const itemTotal = (formItemQtd * (parseFloat(formItem.vlr) || 0)) - (parseFloat(formItem.desc) || 0);
            const totalItemCalc = itemTotal > 0 ? itemTotal : 0;
            const somaRateio = setoresTemporarios.reduce((acc, s) => acc + s.qtd, 0);

            const adicionarSetorNaLista = () => {
                const q = parseFloat(formSetor.qtd) || 0;
                if (!formSetor.depto || q <= 0) return;
                setSetoresTemporarios(prev => {
                    const index = prev.findIndex(s => s.nome === formSetor.depto);
                    if (index >= 0) { const next = [...prev]; next[index].qtd += q; return next; }
                    return [...prev, { nome: formSetor.depto, qtd: q }];
                });
                setFormSetor({ depto: '', qtd: '' });
            };
            
            const removerSetor = (index) => setSetoresTemporarios(prev => prev.filter((_, i) => i !== index));
            
            const salvarProdutoRateio = () => {
                if (!formItem.nome) return alert('Informe o produto.');
                const newItem = { id: formItem.id || Date.now().toString(), nome: formItem.nome, qtd: formItemQtd || 1, un: formItem.un || 'UN', vlr: parseFloat(formItem.vlr) || 0, desc: parseFloat(formItem.desc) || 0, total: totalItemCalc, rateio: [...setoresTemporarios] };
                setProdutosRateio(prev => [...prev.filter(p => p.id !== newItem.id), newItem]);
                setFormItem({ id: null, nome: '', qtd: 1, un: '', vlr: 0, desc: 0 }); setSetoresTemporarios([]);
            };
            
            const removerProdutoRateio = (id) => setProdutosRateio(prev => prev.filter(p => p.id !== id));

            // Proporcionalidade Local (Adiantamento / Boleto)
            const recalculatedRateioLocal = useMemo(() => {
                if (produtosRateio.length === 0) return null;
                
                const totalOriginal = produtosRateio.reduce((sum, p) => sum + p.total, 0);
                let desconto = manualDiscount !== '' ? parseFloat(manualDiscount) : 0;
                if (isNaN(desconto)) desconto = 0;
                
                const finalValue = totalOriginal - desconto;
                const ratio = totalOriginal > 0 ? (finalValue / totalOriginal) : 1;

                const itens = produtosRateio.map(item => {
                    const oldTotal = item.total;
                    const newTotal = oldTotal * ratio;
                    const newRateio = item.rateio.map(r => {
                        const costOrig = (r.qtd / item.qtd) * oldTotal;
                        const costNew = costOrig * ratio;
                        return { ...r, costOrig, costNew };
                    });
                    return { ...item, oldTotal, newTotal, newRateio };
                });

                return { totalOriginal, descontoAplicado: desconto, finalValue, itens };
            }, [produtosRateio, manualDiscount]);

            // Proporcionalidade ROTA (apenas menu Cartão)
            const proportionData = useMemo(() => {
                if (activeMenu !== 'cartao' || !selectedEntry || selectedRotaIds.length === 0) return null;
                const selectedRotasObjs = allRotas.filter(r => selectedRotaIds.includes(r.id));
                const valRotaTotalOriginal = selectedRotasObjs.reduce((sum, r) => sum + (r.total || 0), 0);
                const valEntry = selectedEntry.valor || 0;
                
                // Desconto automático para cartão é a diferença entre a Rota e o Cartão
                let desconto = valRotaTotalOriginal - valEntry;
                if (isNaN(desconto)) desconto = 0;
                
                const finalValue = valRotaTotalOriginal - desconto; // Equals valEntry
                const ratio = valRotaTotalOriginal > 0 ? (finalValue / valRotaTotalOriginal) : 1;
                
                const recalculatedRotas = selectedRotasObjs.map(rota => {
                    const recalculatedItems = rota.itens.map(item => {
                        const oldTotal = item.total; const newTotal = oldTotal * ratio;
                        const newRateio = item.rateio.map(r => {
                            const costOrig = (r.qtd / item.qtd) * oldTotal;
                            const costNew = costOrig * ratio;
                            return { ...r, costOrig, costNew };
                        });
                        return { ...item, newTotal, oldTotal, newRateio };
                    });
                    return { ...rota, itensRecalculados: recalculatedItems };
                });
                return { descontoAplicado: desconto, finalValue, recalculatedRotas, valRotaTotalOriginal, ratio };
            }, [activeMenu, selectedEntry, selectedRotaIds, allRotas]);

            // Handler para adicionar ROTA ao Vínculo (Para Cartão)
            const handleAddRota = () => {
                if (rotaSelectTemp && !selectedRotaIds.includes(rotaSelectTemp)) {
                    setSelectedRotaIds([...selectedRotaIds, rotaSelectTemp]);
                }
                setRotaSelectTemp('');
            };

            const handleRemoveRota = (idToRemove) => {
                setSelectedRotaIds(selectedRotaIds.filter(id => id !== idToRemove));
            };

            const handleGravarVinculo = async () => {
                const vinculoId = Date.now().toString();
                let novoVinculo = {
                    id: vinculoId,
                    tipoVinculo: activeMenu,
                    tipoNota, chaveAcesso, numeroNota, dataEmissao, 
                    valorTotalNota: parseFloat(valorTotalNota) || 0, emitenteNota,
                    links: [link1, link2, link3].filter(l => l.trim() !== ''),
                    status: 'pendente', vinculadoPor: currentUser.nome, dataVinculo: new Date().toISOString()
                };

                if (activeMenu === 'cartao') {
                    if (!selectedEntry || selectedRotaIds.length === 0 || !proportionData) return alert('Selecione os dados da requisição corretamente.');
                    novoVinculo = { ...novoVinculo, entryId: selectedEntry.id.toString(), entryData: selectedEntry, rotaIds: selectedRotaIds, rotasData: proportionData.recalculatedRotas, descontoAplicado: proportionData.descontoAplicado, valorTotalFinal: proportionData.finalValue };
                } else if (activeMenu === 'adiantamento') {
                    if (!selectedEntry || !recalculatedRateioLocal || recalculatedRateioLocal.itens.length === 0) return alert('Adicione os produtos rateados.');
                    novoVinculo = { ...novoVinculo, entryId: selectedEntry.id.toString(), entryData: selectedEntry, adiantamentoOption, itensRateio: recalculatedRateioLocal.itens, valorTotalFinal: recalculatedRateioLocal.finalValue, descontoAplicado: recalculatedRateioLocal.descontoAplicado };
                } else if (activeMenu === 'boleto') {
                    if (!codigoBoleto || !dataVencimentoBoleto || !recalculatedRateioLocal || recalculatedRateioLocal.itens.length === 0) return alert('Preencha os dados do boleto e adicione os itens do rateio.');
                    novoVinculo = { ...novoVinculo, codigoBoleto, dataVencimento: dataVencimentoBoleto, itensRateio: recalculatedRateioLocal.itens, valorTotalFinal: recalculatedRateioLocal.finalValue, descontoAplicado: recalculatedRateioLocal.descontoAplicado };
                }

                try {
                    await setDoc(getDocRef('vinculos', vinculoId), novoVinculo);
                    alert('Lançamento enviado com sucesso para a contabilidade.');
                    setSubView(activeMenu === 'boleto' ? 'gerar' : 'pendentes');
                    if (activeMenu === 'boleto') handleSwitchMenu('boleto');
                } catch(e) { alert('Erro ao salvar: ' + e.message); }
            };

            const renderRateioBuilder = () => (
                <div className="bg-white border border-slate-200 rounded-lg p-6 shadow-sm mb-6">
                    <h2 className="text-sm font-bold text-slate-400 uppercase tracking-wider mb-6 flex items-center"><FileBox size={18} className="mr-2 text-blue-600"/> Adicionar Produtos ao Rateio</h2>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <div className="space-y-4">
                            <div><label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Produto / Descrição</label><input type="text" value={formItem.nome} onChange={e => setFormItem({...formItem, nome: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500"/></div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Qtd Total</label><input type="number" value={formItem.qtd} onChange={e => setFormItem({...formItem, qtd: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm font-bold text-blue-600 focus:ring-2 focus:ring-blue-500"/></div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Unidade</label>
                                    <input type="text" list="unidadesListV" value={formItem.un} onChange={e => setFormItem({...formItem, un: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500"/>
                                    <datalist id="unidadesListV">
                                        <option value="Unidade (UN)"></option><option value="Peça (PC)"></option><option value="Item (IT)"></option>
                                        <option value="Par (PR)"></option><option value="Jogo (JG)"></option><option value="Kit (KIT)"></option>
                                        <option value="Quilograma (KG)"></option><option value="Grama (G)"></option><option value="Miligrama (MG)"></option><option value="Tonelada (T)"></option>
                                        <option value="Metro (M)"></option><option value="Centímetro (CM)"></option><option value="Milímetro (MM)"></option><option value="Quilômetro (KM)"></option>
                                        <option value="Metro quadrado (M²)"></option><option value="Centímetro quadrado (CM²)"></option>
                                        <option value="Litro (L)"></option><option value="Mililitro (ML)"></option><option value="Metro cúbico (M³)"></option>
                                        <option value="Pacote (PCT)"></option><option value="Caixa (CX)"></option><option value="Caixa com X unidades (CX c/12 etc)"></option>
                                        <option value="Fardo (FD)"></option><option value="Saco (SC)"></option><option value="Lata (LT)"></option>
                                        <option value="Garrafa (GF)"></option><option value="Frasco (FR)"></option><option value="Tubo (TB)"></option>
                                        <option value="Balde (BD)"></option><option value="Barril (BR)"></option><option value="Palete (PLT)"></option><option value="Container (CNT)"></option>
                                        <option value="Rolo (RL)"></option><option value="Bobina (BOB)"></option><option value="Barra (BR)"></option>
                                        <option value="Placa (PL)"></option><option value="Folha (FL)"></option>
                                        <option value="Porção (POR)"></option><option value="Dose (DS)"></option>
                                        <option value="Cartela (CRT)"></option><option value="Envelope (ENV)"></option><option value="Bloco (BLC)"></option><option value="Resma (RSM)"></option>
                                    </datalist>
                                </div>
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Vlr. Unitário (R$)</label><input type="number" step="0.01" value={formItem.vlr} onChange={e => setFormItem({...formItem, vlr: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500"/></div>
                                <div><label className="block text-xs font-bold text-slate-700 mb-1 uppercase">Desc. Total (R$)</label><input type="number" step="0.01" value={formItem.desc} onChange={e => setFormItem({...formItem, desc: e.target.value})} className="w-full border border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500"/></div>
                            </div>
                            <div className="bg-slate-50 p-3 rounded-lg border border-dashed border-slate-300 flex justify-between items-center"><span className="text-xs font-bold text-slate-500 uppercase">Subtotal do Produto:</span><span className="text-lg font-black text-slate-800 tracking-tight">{formatCurrency(totalItemCalc)}</span></div>
                        </div>
                        <div className="bg-blue-50/50 p-5 rounded-xl border border-blue-100">
                            <label className="block text-xs font-bold text-blue-800 mb-3 uppercase tracking-wider">Distribuição por Setor</label>
                            <div className="flex flex-col sm:flex-row gap-2 mb-4">
                                <div className="flex-grow">
                                    <input type="text" list="rotaDeptoListV" value={formSetor.depto} onChange={e => setFormSetor({...formSetor, depto: e.target.value})} placeholder="Buscar setor..." className="w-full border border-blue-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"/>
                                    <datalist id="rotaDeptoListV">{departamentos.map(d => <option key={d.id} value={`${d.codigo} - ${d.nome}`} />)}</datalist>
                                </div>
                                <div className="w-24"><input type="number" value={formSetor.qtd} onChange={e => setFormSetor({...formSetor, qtd: e.target.value})} placeholder="Qtd" className="w-full border border-blue-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"/></div>
                                <button type="button" onClick={adicionarSetorNaLista} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm">Add</button>
                            </div>
                            <div className="space-y-2 max-h-32 overflow-y-auto pr-1 custom-scrollbar">
                                {setoresTemporarios.map((s, i) => (
                                    <div key={i} className="flex items-center justify-between bg-white p-2 rounded-lg border border-blue-100 shadow-sm">
                                        <span className="text-[10px] font-bold truncate flex-grow mr-2">{s.nome}</span>
                                        <div className="flex items-center space-x-2 shrink-0"><span className="text-xs font-black text-blue-600">{s.qtd} un.</span><button onClick={() => removerSetor(i)} className="text-slate-300 hover:text-red-500"><Trash2 size={14}/></button></div>
                                    </div>
                                ))}
                            </div>
                            {somaRateio > 0 && somaRateio !== formItemQtd && <div className="mt-2 text-[10px] font-bold text-amber-600">Aviso: Rateio {somaRateio} ≠ Qtd {formItemQtd}</div>}
                            {somaRateio > 0 && somaRateio === formItemQtd && <div className="mt-2 text-[10px] font-bold text-emerald-600">✓ Rateio completo</div>}
                        </div>
                    </div>
                    <div className="mt-6 flex justify-end"><button type="button" onClick={salvarProdutoRateio} className="bg-blue-600 hover:bg-blue-700 transition-colors text-white font-bold py-2.5 px-6 rounded-lg flex items-center"><Plus size={18} className="mr-2"/> Adicionar à Lista</button></div>

                    {produtosRateio.length > 0 && (
                        <div className="mt-6 border-t border-slate-200 pt-4">
                            <h4 className="text-xs font-bold text-slate-500 uppercase mb-3">Itens Adicionados ({produtosRateio.length})</h4>
                            <div className="space-y-2">
                                {produtosRateio.map(p => (
                                    <div key={p.id} className="bg-slate-50 border border-slate-100 p-3 rounded flex justify-between items-center">
                                        <div>
                                            <span className="font-bold text-sm text-slate-800">{p.qtd}x {p.nome}</span>
                                            <div className="text-[10px] text-slate-500 mt-1">{p.rateio.map(r=>`${r.nome}(${r.qtd})`).join(', ')}</div>
                                        </div>
                                        <div className="flex items-center"><span className="font-black text-slate-700 mr-4">{formatCurrency(p.total)}</span><button onClick={()=>removerProdutoRateio(p.id)} className="text-rose-400 hover:text-rose-600"><Trash2 size={16}/></button></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );

            return (
                <div className="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden min-h-[70vh] animate-in fade-in duration-500">
                    {/* MENU LATERAL */}
                    <div className="w-64 shrink-0 bg-slate-50 border-r border-slate-200 flex flex-col">
                        <div className="p-6 border-b border-slate-200">
                            <h2 className="text-lg font-black text-slate-800 flex items-center"><Link size={20} className="mr-2 text-blue-600"/> Vínculos</h2>
                            <p className="text-xs text-slate-500 mt-1 leading-tight">Envie despesas para lançamento.</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => handleSwitchMenu('cartao')} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'cartao' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <div className="flex items-center"><CreditCard size={16} className="mr-3" /> Vínculo Cartão</div>
                                {pendentesCartao.length > 0 && <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeMenu === 'cartao' ? 'bg-white text-blue-600' : 'bg-slate-300 text-slate-700'}`}>{pendentesCartao.length}</span>}
                            </button>
                            <button onClick={() => handleSwitchMenu('adiantamento')} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'adiantamento' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <div className="flex items-center"><Clock size={16} className="mr-3" /> Acertos (Adiant.)</div>
                                {pendentesAdiantamento.length > 0 && <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeMenu === 'adiantamento' ? 'bg-white text-blue-600' : 'bg-slate-300 text-slate-700'}`}>{pendentesAdiantamento.length}</span>}
                            </button>
                            <button onClick={() => handleSwitchMenu('boleto')} className={`w-full flex items-center px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'boleto' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <FileText size={16} className="mr-3" /> Pgto. de Boletos
                            </button>
                        </nav>
                    </div>

                    {/* CONTEÚDO PRINCIPAL */}
                    <div className="flex-1 overflow-y-auto bg-slate-100 p-8">
                        
                        {/* TABELA DE PENDENTES (Cartão ou Adiantamento) */}
                        {subView === 'pendentes' && (activeMenu === 'cartao' || activeMenu === 'adiantamento') && (
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm animate-in fade-in">
                                <div className="border-b border-slate-200 pb-4 mb-6">
                                    <h3 className="text-xl font-bold text-slate-900">{activeMenu === 'cartao' ? 'Compras Pendentes de Vínculo' : 'Adiantamentos Pendentes de Acerto'}</h3>
                                    <p className="text-sm text-slate-500 mt-1">
                                        {activeMenu === 'cartao' ? 'Compras no cartão com Nota Fiscal.' : 'Pagamentos antecipados que requerem fecho com a NF final.'}
                                    </p>
                                </div>
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200 mb-6 flex flex-col md:flex-row gap-4">
                                    <div className="flex-1"><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Pesquisar</label><input type="text" placeholder="Fornecedor, valor..." value={filterPesquisa} onChange={e=>setFilterPesquisa(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500" /></div>
                                    <div className="w-full md:w-64"><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Filtrar por Cartão</label><select value={filterCartao} onChange={e=>setFilterCartao(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"><option value="">Todos</option>{cartoes.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}</select></div>
                                </div>
                                <div className="border border-slate-200 rounded-lg overflow-x-auto shadow-sm">
                                    <table className="min-w-full text-sm text-left divide-y divide-slate-200">
                                        <thead className="bg-slate-100 text-slate-600 uppercase text-xs font-semibold">
                                            <tr>
                                                <th className="px-6 py-3 whitespace-nowrap">Data</th>
                                                <th className="px-6 py-3 whitespace-nowrap">Cartão</th>
                                                <th className="px-6 py-3 min-w-[250px]">Fornecedor</th>
                                                <th className="px-6 py-3 text-right whitespace-nowrap">Valor Pago</th>
                                                <th className="px-6 py-3 text-center whitespace-nowrap w-32">Ação</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100 bg-white">
                                            {filteredEntries.length === 0 ? <tr><td colSpan="5" className="px-6 py-12 text-center text-slate-400">Sem registos pendentes.</td></tr> : 
                                                filteredEntries.map(e => (
                                                    <tr key={e.id} className="hover:bg-slate-50">
                                                        <td className="px-6 py-4 font-medium whitespace-nowrap">{new Date(e.dataCompra).toLocaleDateString('pt-BR',{timeZone:'UTC'})}</td>
                                                        <td className="px-6 py-4 text-slate-500 whitespace-nowrap">{e.cartao}</td>
                                                        <td className="px-6 py-4">
                                                            <span className="font-bold text-slate-800 block truncate max-w-[300px]" title={e.fornecedor || 'S/ Fornecedor'}>{e.fornecedor || 'S/ Fornecedor'}</span>
                                                            <span className="text-xs text-slate-400 truncate block max-w-[300px]" title={e.observacao}>{e.observacao}</span>
                                                        </td>
                                                        <td className="px-6 py-4 font-black text-right whitespace-nowrap">{formatCurrency(e.valor)}</td>
                                                        <td className="px-6 py-4 text-center">
                                                            <button type="button" onClick={() => iniciarVinculo(e.id.toString())} className="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-4 py-2 rounded-md font-bold text-xs shadow-sm border border-blue-200 w-full whitespace-nowrap transition-colors">
                                                                Vincular
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))
                                            }
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* VIEW: GERAR (Para qualquer dos 3 tipos) */}
                        {subView === 'gerar' && (
                            <div className="space-y-6 animate-in slide-in-from-right-4">
                                <div className="flex items-center justify-between border-b border-slate-200 pb-4 mb-6">
                                    <div>
                                        <h3 className="text-xl font-bold text-slate-900 flex items-center"><FileText size={20} className="mr-2 text-blue-600"/> 
                                            {activeMenu === 'cartao' ? 'Vincular Cartão a R.O.T.A.' : activeMenu === 'adiantamento' ? 'Acerto de Adiantamento' : 'Novo Pagamento de Boleto'}
                                        </h3>
                                    </div>
                                    {activeMenu !== 'boleto' && <button type="button" onClick={() => setSubView('pendentes')} className="text-sm font-medium text-slate-500 hover:text-slate-800">← Voltar à Lista</button>}
                                </div>

                                {/* Resumo Compra (Se Cartão ou Adiantamento) */}
                                {(activeMenu === 'cartao' || activeMenu === 'adiantamento') && selectedEntry && (
                                    <div className="bg-slate-800 rounded-xl p-5 text-white flex flex-wrap gap-6 items-center justify-between shadow-md">
                                        <div className="flex items-center space-x-3">
                                            <div className="bg-slate-700 p-3 rounded-lg"><CreditCard size={24} className="text-blue-300"/></div>
                                            <div>
                                                <p className="text-xs text-slate-400 uppercase tracking-wider font-bold">{activeMenu === 'adiantamento' ? 'Pagamento Antecipado' : 'Origem: Cartão Corporativo'}</p>
                                                <p className="font-semibold text-lg">{selectedEntry.fornecedor || 'S/ Fornecedor'}</p>
                                            </div>
                                        </div>
                                        <div className="flex gap-6 items-center">
                                            <div><p className="text-[10px] text-slate-400 uppercase font-bold">Data Pgto</p><p className="font-medium">{new Date(selectedEntry.dataCompra).toLocaleDateString('pt-BR',{timeZone:'UTC'})}</p></div>
                                            <div><p className="text-[10px] text-slate-400 uppercase font-bold">Cartão</p><p className="font-medium">{selectedEntry.cartao}</p></div>
                                            <div className="text-right border-l border-slate-600 pl-6"><p className="text-[10px] text-slate-400 uppercase font-bold">Valor Debitado</p><p className="font-black text-2xl text-emerald-400">{formatCurrency(selectedEntry.valor)}</p></div>
                                        </div>
                                    </div>
                                )}

                                {/* Dados do Boleto Específicos */}
                                {activeMenu === 'boleto' && (
                                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-2 gap-6">
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Código de Barras / Pix</label><input type="text" value={codigoBoleto} onChange={e=>setCodigoBoleto(e.target.value)} placeholder="Linha digitável..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Data de Vencimento</label><input type="date" value={dataVencimentoBoleto} onChange={e=>setDataVencimentoBoleto(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                    </div>
                                )}

                                {/* Informações Fiscais Globais e Desconto */}
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                    <h4 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Informações Fiscais da Nota</h4>
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Tipo de Documento</label>
                                            <select value={tipoNota} onChange={e => setTipoNota(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500">
                                                <option value="NFe">NFe</option><option value="NFSe">NFSe</option><option value="NFCe">NFCe</option><option value="DACTE">DACTE</option><option value="DACTEoS">DACTEoS</option><option value="Outro">Outro Recibo</option>
                                            </select>
                                        </div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Número da Nota</label><input type="text" value={numeroNota} onChange={e => setNumeroNota(e.target.value)} placeholder="Ex: 123456" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Chave de Acesso</label><input type="text" value={chaveAcesso} onChange={e => setChaveAcesso(e.target.value)} placeholder="0000..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Emitente</label><input type="text" value={emitenteNota} onChange={e => setEmitenteNota(e.target.value)} placeholder="Razão Social" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Data de Emissão</label><input type="date" value={dataEmissao} onChange={e => setDataEmissao(e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        <div><label className="block text-xs font-bold text-slate-600 mb-1.5 uppercase">Valor Total da Nota (R$)</label><input type="number" step="0.01" value={valorTotalNota} onChange={e => setValorTotalNota(e.target.value)} placeholder="0.00" className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/></div>
                                        
                                        {/* DESCONTO GERAL - APENAS PARA ADIANTAMENTOS E BOLETOS */}
                                        {activeMenu !== 'cartao' && (
                                            <div className="md:col-span-3 mt-2 bg-rose-50 p-4 rounded-lg border border-rose-100 flex flex-col md:flex-row items-center justify-between">
                                                <div>
                                                    <h5 className="font-bold text-rose-700 uppercase tracking-wider text-xs mb-1">Desconto Geral Concedido na Nota (R$)</h5>
                                                    <p className="text-[10px] text-rose-600">Será aplicado de forma automática e proporcional no rateio abaixo.</p>
                                                </div>
                                                <div className="mt-3 md:mt-0 w-full md:w-64">
                                                    <input type="number" step="0.01" value={manualDiscount} onChange={e=>setManualDiscount(e.target.value)} placeholder="Ex: 10.00" className="w-full px-4 py-2.5 font-black text-rose-600 border border-rose-300 rounded-md focus:ring-2 focus:ring-rose-500 bg-white"/>
                                                </div>
                                            </div>
                                        )}

                                        <div className="md:col-span-3 mt-2"><label className="block text-xs font-bold text-slate-600 uppercase mb-2">Links de Anexos (Drive/Nuvem)</label>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                                <input type="url" value={link1} onChange={e=>setLink1(e.target.value)} placeholder="URL do Anexo 1..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/>
                                                <input type="url" value={link2} onChange={e=>setLink2(e.target.value)} placeholder="URL do Anexo 2..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/>
                                                <input type="url" value={link3} onChange={e=>setLink3(e.target.value)} placeholder="URL do Anexo 3..." className="w-full px-3 py-2 text-sm border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500"/>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* BLOCAGEM CONFORME MENU */}
                                {activeMenu === 'cartao' && (
                                    <>
                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                            <label className="block text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 flex items-center"><FileText size={16} className="mr-2 text-blue-600"/> Selecionar Requisições (R.O.T.A)</label>
                                            <div className="flex gap-3 mb-4">
                                                <select value={rotaSelectTemp} onChange={e => setRotaSelectTemp(e.target.value)} className="flex-1 px-4 py-3 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                                    <option value="">-- Escolha uma requisição --</option>
                                                    {rotasDisponiveis.filter(r => !selectedRotaIds.includes(r.id)).map(r => (<option key={r.id} value={r.id}>{r.codigo} | R$ {r.total.toLocaleString('pt-BR',{minimumFractionDigits:2})} | {r.fornecedor}</option>))}
                                                </select>
                                                <button type="button" onClick={handleAddRota} disabled={!rotaSelectTemp} className={`px-6 py-3 rounded-lg font-bold text-sm shadow-sm transition-colors ${rotaSelectTemp ? 'bg-blue-600 hover:bg-blue-700 text-white' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>Adicionar</button>
                                            </div>
                                            {selectedRotaIds.length > 0 && (
                                                <ul className="divide-y divide-slate-100 border border-slate-200 rounded-lg bg-slate-50">
                                                    {selectedRotaIds.map(id => {
                                                        const r = allRotas.find(x => x.id === id); if(!r) return null;
                                                        return (<li key={id} className="p-3 flex justify-between items-center"><div><span className="font-mono font-bold text-blue-700 mr-3">{r.codigo}</span><span className="font-medium text-slate-800">{r.fornecedor}</span></div><div className="flex items-center"><span className="font-bold text-slate-700 mr-4">{formatCurrency(r.total)}</span><button type="button" onClick={() => handleRemoveRota(id)} className="text-rose-500"><Trash2 size={16}/></button></div></li>);
                                                    })}
                                                </ul>
                                            )}
                                        </div>

                                        {selectedRotaIds.length > 0 && proportionData && (
                                            <div className="border border-emerald-200 rounded-xl overflow-hidden shadow-sm bg-white">
                                                <div className="bg-emerald-50 p-4 border-b border-emerald-100 flex flex-wrap gap-4 items-end justify-between">
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Soma das Requisições</span><div className="text-lg font-medium text-slate-700">{formatCurrency(proportionData.valRotaTotalOriginal)}</div></div>
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Desconto Proporcional Aplicado</span><div className="text-lg font-bold text-rose-600">-{formatCurrency(proportionData.descontoAplicado)}</div></div>
                                                    <div className="text-right"><span className="text-[10px] text-emerald-700 uppercase font-black block mb-1">Valor Final a Lançar (Cartão)</span><div className="text-2xl font-black text-emerald-700">{formatCurrency(proportionData.finalValue)}</div></div>
                                                </div>
                                                <div className="p-6">
                                                    <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Espelho do Rateio Final Proporcional</h5>
                                                    <div className="space-y-6">
                                                        {proportionData.recalculatedRotas.map(rota => (
                                                            <div key={rota.id} className="space-y-3">
                                                                <div className="text-xs font-bold text-blue-700 uppercase tracking-widest bg-blue-50 inline-block px-2 py-1 rounded">Protocolo: {rota.codigo}</div>
                                                                {rota.itensRecalculados.map((item, i) => (
                                                                    <div key={i} className="border border-slate-200 rounded bg-slate-50 p-3 ml-2">
                                                                        <div className="flex justify-between border-b border-slate-200 pb-2 mb-2"><span className="font-bold text-sm text-slate-800">{item.nome}</span><div className="text-right">{proportionData.descontoAplicado ? <span className="text-xs text-slate-400 line-through mr-2">{formatCurrency(item.oldTotal)}</span> : null}<span className="text-sm font-black text-emerald-600">{formatCurrency(item.newTotal)}</span></div></div>
                                                                        {item.newRateio.map((r, ri) => (<div key={ri} className="flex justify-between text-xs mb-1"><span className="text-slate-600">{r.qtd}x {r.nome}</span><div>{proportionData.descontoAplicado ? <span className="text-[10px] text-slate-400 line-through mr-2">{formatCurrency(r.costOrig)}</span> : null}<span className="font-bold text-blue-600">{formatCurrency(r.costNew)}</span></div></div>))}
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}

                                {activeMenu === 'adiantamento' && (
                                    <>
                                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                                            <h4 className="text-sm font-bold text-slate-800 uppercase tracking-wider mb-4">Condição do Adiantamento</h4>
                                            <div className="flex gap-6">
                                                <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" checked={adiantamentoOption==='parcial'} onChange={()=>setAdiantamentoOption('parcial')} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/><span className="text-sm font-medium text-slate-700">Adiantamento Parcial (Ainda resta valor a pagar)</span></label>
                                                <label className="flex items-center space-x-2 cursor-pointer"><input type="radio" checked={adiantamentoOption==='desconto'} onChange={()=>setAdiantamentoOption('desconto')} className="w-4 h-4 text-blue-600 focus:ring-blue-500"/><span className="text-sm font-medium text-slate-700">Desconto fora da NF (Compra quitada/Sem saldo pendente)</span></label>
                                            </div>
                                        </div>
                                        {renderRateioBuilder()}
                                        
                                        {produtosRateio.length > 0 && recalculatedRateioLocal && (
                                            <div className="border border-emerald-200 rounded-xl overflow-hidden shadow-sm bg-white mt-6">
                                                <div className="bg-emerald-50 p-4 border-b border-emerald-100 flex flex-wrap gap-4 items-end justify-between">
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Soma Original dos Produtos</span><div className="text-lg font-medium text-slate-700">{formatCurrency(recalculatedRateioLocal.totalOriginal)}</div></div>
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Desconto Proporcional Aplicado</span><div className="text-lg font-bold text-rose-600">-{formatCurrency(recalculatedRateioLocal.descontoAplicado)}</div></div>
                                                    <div className="text-right"><span className="text-[10px] text-emerald-700 uppercase font-black block mb-1">Valor Final a Lançar</span><div className="text-2xl font-black text-emerald-700">{formatCurrency(recalculatedRateioLocal.finalValue)}</div></div>
                                                </div>
                                                <div className="p-6">
                                                    <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Espelho do Rateio Final Proporcional</h5>
                                                    <div className="space-y-3">
                                                        {recalculatedRateioLocal.itens.map((item, i) => (
                                                            <div key={i} className="border border-slate-200 rounded bg-slate-50 p-3">
                                                                <div className="flex justify-between border-b border-slate-200 pb-2 mb-2">
                                                                    <span className="font-bold text-sm text-slate-800">{item.nome}</span>
                                                                    <div className="text-right">{manualDiscount ? <span className="text-xs text-slate-400 line-through mr-2">{formatCurrency(item.oldTotal)}</span> : null}<span className="text-sm font-black text-emerald-600">{formatCurrency(item.newTotal)}</span></div>
                                                                </div>
                                                                {item.newRateio.map((r, ri) => (
                                                                    <div key={ri} className="flex justify-between text-xs mb-1">
                                                                        <span className="text-slate-600">{r.qtd}x {r.nome}</span>
                                                                        <div>{manualDiscount ? <span className="text-[10px] text-slate-400 line-through mr-2">{formatCurrency(r.costOrig)}</span> : null}<span className="font-bold text-blue-600">{formatCurrency(r.costNew)}</span></div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}

                                {activeMenu === 'boleto' && (
                                    <>
                                        {renderRateioBuilder()}
                                        {produtosRateio.length > 0 && recalculatedRateioLocal && (
                                            <div className="border border-emerald-200 rounded-xl overflow-hidden shadow-sm bg-white mt-6">
                                                <div className="bg-emerald-50 p-4 border-b border-emerald-100 flex flex-wrap gap-4 items-end justify-between">
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Soma Original dos Produtos</span><div className="text-lg font-medium text-slate-700">{formatCurrency(recalculatedRateioLocal.totalOriginal)}</div></div>
                                                    <div><span className="text-[10px] text-slate-500 uppercase font-bold block mb-1">Desconto Proporcional Aplicado</span><div className="text-lg font-bold text-rose-600">-{formatCurrency(recalculatedRateioLocal.descontoAplicado)}</div></div>
                                                    <div className="text-right"><span className="text-[10px] text-emerald-700 uppercase font-black block mb-1">Valor Final a Lançar</span><div className="text-2xl font-black text-emerald-700">{formatCurrency(recalculatedRateioLocal.finalValue)}</div></div>
                                                </div>
                                                <div className="p-6">
                                                    <h5 className="text-xs font-bold text-slate-600 uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">Espelho do Rateio Final Proporcional</h5>
                                                    <div className="space-y-3">
                                                        {recalculatedRateioLocal.itens.map((item, i) => (
                                                            <div key={i} className="border border-slate-200 rounded bg-slate-50 p-3">
                                                                <div className="flex justify-between border-b border-slate-200 pb-2 mb-2">
                                                                    <span className="font-bold text-sm text-slate-800">{item.nome}</span>
                                                                    <div className="text-right">{manualDiscount ? <span className="text-xs text-slate-400 line-through mr-2">{formatCurrency(item.oldTotal)}</span> : null}<span className="text-sm font-black text-emerald-600">{formatCurrency(item.newTotal)}</span></div>
                                                                </div>
                                                                {item.newRateio.map((r, ri) => (
                                                                    <div key={ri} className="flex justify-between text-xs mb-1">
                                                                        <span className="text-slate-600">{r.qtd}x {r.nome}</span>
                                                                        <div>{manualDiscount ? <span className="text-[10px] text-slate-400 line-through mr-2">{formatCurrency(r.costOrig)}</span> : null}<span className="font-bold text-blue-600">{formatCurrency(r.costNew)}</span></div>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </>
                                )}

                                {/* Save Button renders if we have at least proportionData valid for the selected flow */}
                                {((activeMenu === 'cartao' && proportionData) || ((activeMenu === 'adiantamento' || activeMenu === 'boleto') && produtosRateio.length > 0)) && (
                                    <div className="flex justify-end pt-4 pb-12">
                                        <button type="button" onClick={handleGravarVinculo} className="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-4 rounded-xl font-bold shadow-lg flex items-center transition-colors text-lg">
                                            <CheckCircle2 size={24} className="mr-3"/> Enviar para Lançamento Contábil
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- COMPONENTE LANÇAMENTOS (Contabilidade) ---
        const LancamentoTab = ({ vinculos, currentUser, cartoes, navTargetMenu }) => {
            const [activeMenu, setActiveMenu] = useState(navTargetMenu || 'cartao'); // 'cartao', 'adiantamento', 'boleto'
            const [viewMode, setViewMode] = useState('pendentes'); // 'pendentes' | 'concluidos'
            const [expandedId, setExpandedId] = useState(null);

            // Respeita nav exterior
            useEffect(() => { if(navTargetMenu) setActiveMenu(navTargetMenu); }, [navTargetMenu]);

            // Filtros de Pesquisa
            const [fCartao, setFCartao] = useState('');
            const [fTipoNota, setFTipoNota] = useState('');
            const [fNumNota, setFNumNota] = useState('');
            const [fEmitente, setFEmitente] = useState('');
            const [fChave, setFChave] = useState('');
            const [fDataEmissao, setFDataEmissao] = useState('');
            const [fVencimento, setFVencimento] = useState('');
            
            useEffect(() => { setExpandedId(null); }, [viewMode, activeMenu]);

            const baseList = useMemo(() => {
                const expectedStatus = viewMode === 'pendentes' ? 'pendente' : 'registrado';
                return vinculos.filter(v => (v.tipoVinculo || 'cartao') === activeMenu && v.status === expectedStatus)
                               .sort((a,b) => viewMode === 'pendentes' ? new Date(b.dataVinculo) - new Date(a.dataVinculo) : new Date(b.dataRegistro || 0) - new Date(a.dataRegistro || 0));
            }, [vinculos, activeMenu, viewMode]);

            const filteredList = useMemo(() => {
                return baseList.filter(v => {
                    const matchCartao = fCartao ? v.entryData?.cartao === fCartao : true;
                    const matchTipoNota = fTipoNota ? v.tipoNota === fTipoNota : true;
                    const matchNumNota = fNumNota ? (v.numeroNota || '').includes(fNumNota) : true;
                    const matchEmitente = fEmitente ? (v.emitenteNota || v.entryData?.fornecedor || '').toLowerCase().includes(fEmitente.toLowerCase()) : true;
                    const matchChave = fChave ? (v.chaveAcesso || '').includes(fChave) : true;
                    const matchData = fDataEmissao ? v.dataEmissao === fDataEmissao : true;
                    const matchVencimento = fVencimento && activeMenu === 'boleto' ? v.dataVencimento === fVencimento : true;
                    return matchCartao && matchTipoNota && matchNumNota && matchEmitente && matchChave && matchData && matchVencimento;
                });
            }, [baseList, fCartao, fTipoNota, fNumNota, fEmitente, fChave, fDataEmissao, fVencimento, activeMenu]);

            const getCount = (menu, status) => vinculos.filter(v => (v.tipoVinculo || 'cartao') === menu && v.status === status).length;

            const handleMarcarRegistrado = async (vinculo) => {
                if (window.confirm('Tem a certeza que o lançamento foi completamente registrado no sistema contábil?')) {
                    try {
                        await setDoc(getDocRef('vinculos', vinculo.id), { ...vinculo, status: 'registrado', registradoPor: currentUser.nome, dataRegistro: new Date().toISOString() });
                        alert('Lançamento arquivado nos concluídos!'); setExpandedId(null);
                    } catch(e) { alert('Erro ao atualizar: ' + e.message); }
                }
            };

            const handleReabrirParaVinculo = async (vinculoId) => {
                if (window.confirm('Atenção: Ao devolver para a área de vínculos, este lançamento contábil será apagado e a compra retornará para a fila de pendentes. Deseja continuar?')) {
                    try { await deleteDoc(getDocRef('vinculos', vinculoId)); alert('Lançamento devolvido para a área de Vínculos com sucesso!'); setExpandedId(null); } 
                    catch(e) { alert('Erro ao devolver: ' + e.message); }
                }
            };

            const handleReabrirPendente = async (vinculo) => {
                if (window.confirm('Deseja reabrir este lançamento para a fila de pendentes contábeis?')) {
                    try {
                        const atualizado = { ...vinculo, status: 'pendente' };
                        delete atualizado.registradoPor; delete atualizado.dataRegistro;
                        await setDoc(getDocRef('vinculos', vinculo.id), atualizado);
                        alert('Lançamento reaberto para pendentes!'); setExpandedId(null);
                    } catch(e) { alert('Erro ao atualizar: ' + e.message); }
                }
            };

            return (
                <div className="flex bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden min-h-[75vh] animate-in fade-in duration-500">
                    {/* Menu Lateral Lançamentos */}
                    <div className="w-64 shrink-0 bg-slate-50 border-r border-slate-200 flex flex-col">
                        <div className="p-6 border-b border-slate-200">
                            <h2 className="text-lg font-black text-slate-800 flex items-center"><FileSpreadsheet size={20} className="mr-2 text-blue-600"/> Lançamentos</h2>
                            <p className="text-xs text-slate-500 mt-1 leading-tight">Painel de registos contábeis separados por tipologia.</p>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            <button onClick={() => setActiveMenu('cartao')} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'cartao' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <div className="flex items-center"><CreditCard size={16} className="mr-3" /> Cartão Vínculos</div>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeMenu === 'cartao' ? 'bg-white text-blue-600' : 'bg-slate-300 text-slate-700'}`}>{getCount('cartao','pendente')}</span>
                            </button>
                            <button onClick={() => setActiveMenu('adiantamento')} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'adiantamento' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <div className="flex items-center"><Clock size={16} className="mr-3" /> Adiantamentos</div>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeMenu === 'adiantamento' ? 'bg-white text-blue-600' : 'bg-slate-300 text-slate-700'}`}>{getCount('adiantamento','pendente')}</span>
                            </button>
                            <button onClick={() => setActiveMenu('boleto')} className={`w-full flex items-center justify-between px-4 py-3 text-sm font-semibold rounded-lg transition-colors ${activeMenu === 'boleto' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-200'}`}>
                                <div className="flex items-center"><FileText size={16} className="mr-3" /> Boletos</div>
                                <span className={`text-[10px] px-2 py-0.5 rounded-full ${activeMenu === 'boleto' ? 'bg-white text-blue-600' : 'bg-slate-300 text-slate-700'}`}>{getCount('boleto','pendente')}</span>
                            </button>
                        </nav>
                    </div>

                    <div className="flex-1 overflow-y-auto bg-slate-100 p-8">
                        <div className="flex justify-end border-b border-slate-200 pb-4 mb-6">
                            <div className="flex items-center space-x-2 bg-white p-1 rounded-lg border border-slate-300 shadow-sm">
                                <button onClick={()=>setViewMode('pendentes')} className={`px-5 py-2 text-sm font-bold rounded-md transition-all ${viewMode === 'pendentes' ? 'bg-slate-800 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Pendentes</button>
                                <button onClick={()=>setViewMode('concluidos')} className={`px-5 py-2 text-sm font-bold rounded-md transition-all ${viewMode === 'concluidos' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>Concluídos</button>
                            </div>
                        </div>

                        {/* BARRA DE FILTROS */}
                        <div className="bg-white p-5 rounded-lg shadow-sm border border-slate-200 mb-6">
                            <div className="flex items-center mb-4 text-xs font-bold text-slate-800 uppercase tracking-wider"><Filter size={14} className="mr-2 text-slate-400" /> Filtros de Lançamento</div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-4">
                                {activeMenu !== 'boleto' && (
                                    <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Cartão</label>
                                        <select value={fCartao} onChange={e=>setFCartao(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todos</option>{cartoes && cartoes.map(c => <option key={c.id} value={c.nome}>{c.nome}</option>)}</select>
                                    </div>
                                )}
                                <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Tipo de Nota</label>
                                    <select value={fTipoNota} onChange={e=>setFTipoNota(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white"><option value="">Todos</option><option value="NFe">NFe</option><option value="NFSe">NFSe</option><option value="NFCe">NFCe</option><option value="DACTE">DACTE</option><option value="DACTEoS">DACTEoS</option><option value="Outro">Outro</option></select>
                                </div>
                                <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Nº Nota</label><input type="text" placeholder="Pesquisar..." value={fNumNota} onChange={e=>setFNumNota(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white" /></div>
                                <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Emitente/Forn.</label><input type="text" placeholder="Pesquisar..." value={fEmitente} onChange={e=>setFEmitente(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white" /></div>
                                {activeMenu === 'boleto' && (
                                    <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Data Vencimento</label><input type="date" value={fVencimento} onChange={e=>setFVencimento(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white" /></div>
                                )}
                                <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Chave Acesso</label><input type="text" placeholder="Pesquisar..." value={fChave} onChange={e=>setFChave(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white" /></div>
                                <div><label className="block text-[10px] uppercase font-bold text-slate-500 mb-1">Data Emissão</label><input type="date" value={fDataEmissao} onChange={e=>setFDataEmissao(e.target.value)} className="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-md text-slate-700 focus:bg-white" /></div>
                            </div>
                        </div>

                        <div className="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                            <div className="overflow-x-auto">
                                <table className="min-w-full text-sm text-left divide-y divide-slate-200">
                                    <thead className="bg-slate-50 text-xs text-slate-500 uppercase font-semibold">
                                        <tr>
                                            <th className="px-6 py-4">{activeMenu === 'boleto' ? 'Vencimento / Doc' : 'Requisições (ROTA)'}</th>
                                            <th className="px-6 py-4">{activeMenu === 'boleto' ? 'Código de Barras' : 'Cartão / Pagamento'}</th>
                                            <th className="px-6 py-4">Emitente / Fornecedor</th>
                                            <th className="px-6 py-4">Nota Fiscal</th>
                                            <th className="px-6 py-4 text-right">Valor Final</th>
                                            <th className="px-6 py-4 text-center">Visualizar</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-slate-100">
                                        {filteredList.length === 0 ? (
                                            <tr><td colSpan="6" className="px-6 py-16 text-center text-slate-400"><Archive size={40} className="mx-auto mb-3 text-slate-200" /><p className="font-medium">Nenhum registo encontrado com os filtros atuais.</p></td></tr>
                                        ) : (
                                            filteredList.map(v => (
                                                <React.Fragment key={v.id}>
                                                    {/* LINHA COMPACTA */}
                                                    <tr className={`hover:bg-slate-50 transition-colors ${expandedId === v.id ? 'bg-blue-50/30' : ''}`}>
                                                        <td className="px-6 py-4">
                                                            {activeMenu === 'boleto' ? (
                                                                <span className="font-bold text-rose-600 block">{new Date(v.dataVencimento+'T00:00:00').toLocaleDateString('pt-BR')}</span>
                                                            ) : (
                                                                <span className="text-[11px] font-mono font-bold text-blue-600 break-words max-w-[150px] block">{v.rotasData ? v.rotasData.map(r=>r.codigo).join(', ') : (v.rotaData?.codigo || 'N/A')}</span>
                                                            )}
                                                        </td>
                                                        <td className="px-6 py-4">
                                                            {activeMenu === 'boleto' ? (
                                                                <span className="block font-mono text-[10px] text-slate-500 truncate max-w-[150px]" title={v.codigoBoleto}>{v.codigoBoleto}</span>
                                                            ) : (
                                                                <><span className="block font-medium text-slate-700">{v.entryData?.cartao}</span><span className="text-[11px] text-slate-400">{v.entryData?.dataCompra ? new Date(v.entryData.dataCompra).toLocaleDateString('pt-BR',{timeZone:'UTC'}) : ''}</span></>
                                                            )}
                                                        </td>
