<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VAZA - Verificação e Autorização de Zona Acadêmica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Exo+2:ital,wght@1,900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Exo 2', 'sans-serif'],
                    },
                    colors: {
                        cyan: { 400: '#00d9e6', 500: '#00f2ff' },
                        navy: { 900: '#06162e' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #06162e; font-family: 'Inter', sans-serif; color: #e6f1ff; margin: 0; overflow-x: hidden; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .logo-font { font-family: 'Exo 2', sans-serif; font-style: italic; letter-spacing: -0.02em; }
        .glow-text { text-shadow: 0 0 25px rgba(0, 217, 230, 0.5); }
        input, textarea, select { background: rgba(255, 255, 255, 0.05) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: white !important; outline: none; transition: all 0.2s; }
        input:focus, select:focus { border-color: #00d9e6 !important; box-shadow: 0 0 15px rgba(0, 217, 230, 0.2); }
        .btn-primary { background: #00d9e6; color: #06162e; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary:hover { background: #00f2ff; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 217, 230, 0.4); }
        .status-badge { font-weight: 800; text-transform: uppercase; font-size: 0.6rem; padding: 0.2rem 0.5rem; border-radius: 0.3rem; }
        
        /* Estilos para input file */
        input[type="file"]::file-selector-button {
            margin-right: 20px; border: none; background: #00d9e6; padding: 10px 20px;
            border-radius: 10px; color: #06162e; cursor: pointer; font-weight: bold;
        }

        /* Estilo para abas do admin */
        .admin-tab { transition: all 0.3s ease; border: 1px solid transparent; }
        .admin-tab.active { background: #00d9e6; color: #06162e; font-weight: 900; box-shadow: 0 0 15px rgba(0, 217, 230, 0.3); }
        .admin-tab.inactive { background: rgba(255,255,255,0.05); color: #94a3b8; border-color: rgba(255,255,255,0.1); }
        .admin-tab.inactive:hover { background: rgba(255,255,255,0.1); color: white; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #06162e; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d9e6; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <!-- Container para Notificações (Toasts) -->
    <div id="toast-container" class="fixed bottom-4 left-4 z-[9999] flex flex-col gap-3 pointer-events-none"></div>
    
    <button id="fullscreenBtn" class="fixed bottom-4 right-4 z-50 bg-white/5 hover:bg-cyan-400/20 text-gray-400 hover:text-cyan-400 p-3 rounded-full backdrop-blur-sm border border-white/5 transition-all shadow-lg group" title="Tela Cheia">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, query, onSnapshot, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // --- SISTEMA DE NOTIFICAÇÃO (TOAST) ---
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800/90 border-gray-700';
            let icon = 'ℹ️';
            
            if (type === 'success') {
                bgClass = 'bg-green-900/90 border-green-700 text-green-100';
                icon = '✅';
            } else if (type === 'error') {
                bgClass = 'bg-red-900/90 border-red-700 text-red-100';
                icon = '❌';
            } else if (type === 'warning') {
                bgClass = 'bg-amber-900/90 border-amber-700 text-amber-100';
                icon = '⚠️';
            } else {
                bgClass = 'bg-blue-900/90 border-blue-700 text-blue-100';
                icon = '⏳';
            }
            
            toast.className = `${bgClass} backdrop-blur-md border px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transform transition-all duration-500 translate-y-10 opacity-0 pointer-events-auto min-w-[250px] max-w-sm`;
            toast.innerHTML = `
                <span class="text-lg">${icon}</span>
                <span class="text-xs font-bold uppercase tracking-wide">${message}</span>
            `;
            
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-10'); 
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function log(msg, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${msg}`);
            if(type === 'error' || type === 'success' || msg.includes("Iniciando") || msg.includes("Conectando") || msg.includes("Bem-vindo") || msg.includes("Local")) {
                showToast(msg, type);
            }
        }

        const firebaseConfig = {
            apiKey: "AIzaSyD_BQH9Re7ynHnGyynxbY2dOMS5MlgN7Jc",
            authDomain: "vaza-84361.firebaseapp.com",
            projectId: "vaza-84361",
            storageBucket: "vaza-84361.firebasestorage.app",
            messagingSenderId: "362255002224",
            appId: "1:362255002224:web:ea3eb4d7c6d37ceb4062b5",
            measurementId: "G-YGPYBVJ2E4"
        };

        let app, auth, db;
        const appId = 'vaza-app-production';
        let userProfile = null;
        let isLoading = false;
        let isAuthReady = false;

        // USUÁRIOS LOCAIS DE SEGURANÇA (Funcionam mesmo sem internet/banco)
        const LOCAL_USERS = {
            'admin': { name: 'Super Admin', role: 'admin', password: 'Fap1624' },
            'portaria': { name: 'Portaria (Local)', role: 'portaria', password: '123' },
            'preceptoria': { name: 'Preceptor (Local)', role: 'preceptor', password: '123' },
            '1001': { name: 'Aluno Teste', role: 'aluno', password: '123' }
        };

        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            log("Erro fatal na config do Firebase: " + e.message, 'error');
        }

        document.getElementById('fullscreenBtn').onclick = () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => console.log(e));
            else if (document.exitFullscreen) document.exitFullscreen();
        };

        function getLogoHTML(sizeClass = "text-6xl") {
            return `
                <div class="logo-font ${sizeClass} font-black select-none flex items-center justify-center gap-[2px]">
                    <span class="text-white">VA</span>
                    <span class="text-[#00d9e6] glow-text relative" style="top: 2px;">7</span>
                    <span class="text-white">A</span>
                </div>
            `;
        }

        // --- SISTEMA DE LOGIN HÍBRIDO (NUVEM + LOCAL) ---
        async function handleLogin(e) {
            e.preventDefault();
            
            const identifier = document.getElementById('login_user').value.trim();
            const pass = document.getElementById('login_pass').value.trim();
            
            if(!identifier || !pass) return;

            showLoading(true);

            // 1. Tenta buscar no Firebase (Nuvem)
            try {
                if (isAuthReady) {
                    const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', identifier);
                    const userSnap = await getDoc(userDocRef);
                    
                    if (userSnap.exists()) {
                        const userData = userSnap.data();
                        if (userData.password === pass) {
                            userProfile = { uid: identifier, name: userData.name, role: userData.role };
                            log(`Bem-vindo, ${userData.name}!`, 'success');
                            render();
                            return; // Login bem-sucedido na nuvem
                        } else {
                            // Se achou o usuário na nuvem mas a senha está errada, para aqui por segurança
                            log("Senha incorreta (Nuvem).", 'error');
                            showLoading(false);
                            return;
                        }
                    }
                }
            } catch (err) {
                console.warn("Falha no Firebase, tentando local...", err);
            }

            // 2. Fallback: Tenta autenticação Local (Hardcoded)
            if (LOCAL_USERS[identifier]) {
                const localUser = LOCAL_USERS[identifier];
                if (localUser.password === pass) {
                    userProfile = { uid: identifier, name: localUser.name, role: localUser.role };
                    log(`Login Local: ${localUser.name}`, 'success');
                    showToast("⚠️ Modo Local ativado (Banco pode estar vazio)", 'warning');
                    render();
                } else {
                    log("Senha incorreta.", 'error');
                }
            } else {
                log("Usuário não encontrado.", 'error');
            }
            
            showLoading(false);
        }

        // --- FUNÇÕES DE ADMINISTRAÇÃO E SEED ---

        window.seedUsers = async () => {
            if(!confirm("Resetar banco de dados?\nIsso criará o usuário admin (Fap1624) e outros de teste.")) return;
            
            showToast("Iniciando processo...", 'info');
            showLoading(true);
            
            try {
                if(!auth.currentUser) {
                    showToast("Autenticando no sistema...", 'info');
                    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Firebase demorou a responder")), 10000));
                    await Promise.race([signInAnonymously(auth), timeoutPromise]);
                }

                const users = [
                    { id: 'admin', data: { name: 'Administrador', role: 'admin', password: 'Fap1624' } },
                    { id: 'portaria', data: { name: 'Portaria Central', role: 'portaria', password: '123' } },
                    { id: 'preceptoria', data: { name: 'Coordenação Acadêmica', role: 'preceptor', password: '123' } },
                    { id: '1001', data: { name: 'Ana Souza', role: 'aluno', password: '123' } },
                    { id: '1002', data: { name: 'Carlos Lima', role: 'aluno', password: '123' } },
                    { id: '1003', data: { name: 'Beatriz Costa', role: 'aluno', password: '123' } }
                ];

                for(const u of users) {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', u.id), u.data);
                }
                
                showToast("Sucesso! Admin: admin / Fap1624", 'success');
            } catch (error) {
                console.error(error);
                log("Erro ao criar: " + error.message, 'error');
                showToast("Dica: Tente logar com admin/Fap1624 mesmo assim.", 'warning');
            } finally {
                showLoading(false);
            }
        };

        window.safeSeedUsers = () => {
            if (typeof window.seedUsers === 'function') {
                window.seedUsers();
            } else {
                alert("O sistema ainda está carregando. Aguarde alguns segundos e tente novamente.");
            }
        };

        async function deleteAllUsers() {
            const querySnapshot = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'usuarios'));
            const deletePromises = [];
            querySnapshot.forEach((doc) => deletePromises.push(deleteDoc(doc.ref)));
            await Promise.all(deletePromises);
        }

        async function processCSV(file, mode) {
            const reader = new FileReader();
            reader.onload = async (e) => {
                const text = e.target.result;
                const rows = text.split('\n');
                let count = 0, errors = 0;

                showLoading(true);
                showToast("Processando arquivo...", 'info');
                
                if (mode === 'replace') {
                    showToast("Limpando base antiga...", 'info');
                    await deleteAllUsers();
                }

                for (let i = 0; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;
                    const cols = row.split(',');
                    if (cols.length < 4) {
                        if(i === 0 && row.toLowerCase().includes('tipo')) continue;
                        errors++; continue;
                    }
                    const [role, id, name, password] = cols.map(c => c.trim());
                    if(!role || !id || !name || !password) { errors++; continue; }

                    try {
                        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', id), { role, name, password });
                        count++;
                    } catch (err) { errors++; }
                }
                showLoading(false);
                showToast(`Concluído: ${count} ok, ${errors} erros.`, 'success');
                if(document.getElementById('admin-users-list')) renderAdminUserList();
            };
            reader.readAsText(file);
        }

        window.handleManualAdd = async () => {
            const role = document.getElementById('new_role').value;
            const id = document.getElementById('new_id').value;
            const name = document.getElementById('new_name').value;
            const pass = document.getElementById('new_pass').value;
            if(!role || !id || !name || !pass) { log("Preencha todos os campos", 'error'); return; }
            showLoading(true);
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', id), { role, name, password: pass });
                showToast("Usuário adicionado!", 'success');
                document.getElementById('new_id').value = ''; document.getElementById('new_name').value = '';
                renderAdminUserList();
            } catch (e) { log("Erro ao adicionar: " + e.message, 'error'); } finally { showLoading(false); }
        };

        window.handleCSVUpload = () => {
            const fileInput = document.getElementById('csv_file');
            const mode = document.getElementById('csv_mode').value;
            if (!fileInput.files.length) { log("Selecione um arquivo CSV.", 'error'); return; }
            if (mode === 'replace' && !confirm("ATENÇÃO: Substituir apagará TODOS os usuários atuais. Confirmar?")) return;
            processCSV(fileInput.files[0], mode);
        };

        window.renderAdminUserList = async () => {
            const list = document.getElementById('admin-users-list');
            if(!list) return;
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'usuarios'));
            if (snap.empty) { list.innerHTML = '<tr><td colspan="5" class="p-4 text-center italic">Nenhum usuário encontrado.</td></tr>'; return; }
            list.innerHTML = snap.docs.map(d => {
                const u = d.data();
                const colors = { admin: 'text-purple-400', aluno: 'text-cyan-400', preceptor: 'text-amber-400', portaria: 'text-green-400' };
                return `<tr class="border-b border-white/5 hover:bg-white/[0.02]"><td class="p-3 font-bold uppercase text-[10px] ${colors[u.role] || 'text-white'}">${u.role}</td><td class="p-3 font-mono text-xs">${d.id}</td><td class="p-3 font-bold text-white">${u.name}</td><td class="p-3 font-mono text-xs opacity-50">${u.password}</td><td class="p-3 text-right"><button onclick="window.deleteUser('${d.id}')" class="text-red-500 hover:text-red-400 text-[10px] uppercase font-bold">Excluir</button></td></tr>`;
            }).join('');
        };

        window.deleteUser = async (id) => {
            if(!confirm(`Excluir usuário ${id}?`)) return;
            try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios', id)); renderAdminUserList(); showToast("Usuário excluído.", 'success'); } catch(e) { log("Erro: " + e.message, 'error'); }
        };

        // --- INICIALIZAÇÃO ---
        async function init() {
            render(); 
            try {
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Timeout conexão")), 5000));
                await Promise.race([signInAnonymously(auth), timeoutPromise]);
                log("Sistema Conectado!", 'success');
            } catch (error) {
                log("Falha na conexão inicial: " + error.message, 'error');
            }
            onAuthStateChanged(auth, (user) => { 
                isAuthReady = !!user;
                if (!userProfile) render(); 
            });
        }

        function showLoading(val) { 
            isLoading = val; 
            const app = document.getElementById('app');
            if (!userProfile && app) renderLogin(app);
        }

        // Renderizadores
        function render() {
            const container = document.getElementById('app');
            if (!userProfile) renderLogin(container);
            else renderDashboard(container);
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
                    <div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-cyan-400/10 rounded-full blur-[100px]"></div>
                    <div class="absolute bottom-[-10%] left-[-10%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[100px]"></div>
                    <div class="max-w-md w-full glass-card p-12 rounded-[2.5rem] shadow-2xl relative z-10">
                        ${isLoading ? `<div class="absolute inset-0 bg-[#06162e]/90 z-50 flex flex-col items-center justify-center rounded-[2.5rem] backdrop-blur-sm"><span class="text-cyan-400 text-xs font-bold uppercase tracking-widest animate-pulse">Carregando...</span></div>` : ''}
                        <div class="text-center mb-12">${getLogoHTML("text-7xl")}<p class="text-cyan-400/60 text-[10px] font-bold uppercase tracking-[0.15em] mt-4 leading-relaxed">Verificação e Autorização de<br>Zona Acadêmica</p></div>
                        <form id="loginForm" class="space-y-6">
                            <div class="relative group"><label class="block text-[10px] font-bold text-gray-500 uppercase ml-1 mb-2 tracking-[0.2em] text-center">Identificação</label><input type="text" id="login_user" class="w-full p-4 rounded-2xl text-lg text-center font-bold" placeholder="ID / RA / Admin" required></div>
                            <div class="relative group"><label class="block text-[10px] font-bold text-gray-500 uppercase ml-1 mb-2 tracking-[0.2em] text-center">Credencial</label><input type="password" id="login_pass" class="w-full p-4 rounded-2xl text-lg text-center font-bold" placeholder="Senha" required></div>
                            <button type="submit" class="w-full btn-primary py-5 rounded-2xl shadow-lg mt-4 text-sm font-black tracking-widest">Entrar</button>
                        </form>
                        <div class="mt-8 pt-6 border-t border-white/5 text-center">
                            <button onclick="window.safeSeedUsers()" class="text-[10px] text-gray-500 hover:text-cyan-400 transition-colors uppercase tracking-wider font-bold">[ Criar Usuários de Teste ]</button>
                            <p class="text-[9px] text-gray-600 mt-4 uppercase">Status: ${isAuthReady ? '<span class="text-green-500 font-bold">Online</span>' : '<span class="text-amber-500 animate-pulse">Conectando...</span>'}</p>
                        </div>
                    </div>
                </div>`;
            const form = document.getElementById('loginForm');
            if(form) form.onsubmit = handleLogin;
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="min-h-screen flex flex-col">
                    <nav class="bg-[#06162e]/80 backdrop-blur-md border-b border-white/5 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
                        <div class="flex items-center gap-4">${getLogoHTML("text-3xl")}<span class="bg-cyan-400/10 border border-cyan-400/20 text-cyan-400 px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest">${userProfile.role}</span></div>
                        <div class="flex items-center gap-6"><div class="text-right hidden md:block"><p class="text-xs font-bold text-white tracking-wide">${userProfile.name}</p><p class="text-[9px] text-cyan-400/60 uppercase font-black tracking-widest mt-0.5">ID: ${userProfile.uid}</p></div><button id="logoutBtn" class="bg-white/5 hover:bg-red-500/10 hover:text-red-400 text-gray-400 px-5 py-2.5 rounded-xl text-[10px] font-bold uppercase tracking-wider transition-all border border-transparent hover:border-red-500/20">Sair</button></div>
                    </nav>
                    <main id="dashboard-content" class="flex-1 max-w-6xl w-full mx-auto p-6 md:p-8"></main>
                </div>`;
            document.getElementById('logoutBtn').onclick = () => { userProfile = null; render(); };
            const content = document.getElementById('dashboard-content');
            
            // LÓGICA DO PAINEL ADMIN COM ABAS
            if (userProfile.role === 'admin') {
                renderAdminDashboard(content);
            } else if (userProfile.role === 'aluno') {
                renderAluno(content);
            } else if (userProfile.role === 'preceptor') {
                renderPreceptor(content);
            } else {
                renderPortaria(content);
            }
        }

        // --- SISTEMA DE ABAS DO ADMIN ---
        function renderAdminDashboard(container) {
            container.innerHTML = `
                <div class="mb-8 flex flex-wrap gap-3 justify-center md:justify-start border-b border-white/10 pb-6">
                    <button onclick="window.switchTab('management')" id="tab-management" class="admin-tab active px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Gestão (Admin)</button>
                    <button onclick="window.switchTab('aluno')" id="tab-aluno" class="admin-tab inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Aluno</button>
                    <button onclick="window.switchTab('preceptor')" id="tab-preceptor" class="admin-tab inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Preceptor</button>
                    <button onclick="window.switchTab('portaria')" id="tab-portaria" class="admin-tab inactive px-6 py-3 rounded-xl text-xs uppercase tracking-widest font-bold">Visão Portaria</button>
                </div>
                <div id="admin-view-area"></div>
            `;

            window.switchTab = (view) => {
                // Atualiza estilos dos botões
                document.querySelectorAll('.admin-tab').forEach(btn => {
                    btn.classList.remove('active');
                    btn.classList.add('inactive');
                });
                const activeBtn = document.getElementById(`tab-${view}`);
                if(activeBtn) {
                    activeBtn.classList.remove('inactive');
                    activeBtn.classList.add('active');
                }

                // Renderiza a view correspondente
                const area = document.getElementById('admin-view-area');
                if(view === 'management') renderAdminTools(area);
                else if(view === 'aluno') renderAluno(area);
                else if(view === 'preceptor') renderPreceptor(area);
                else if(view === 'portaria') renderPortaria(area);
            };

            // Inicia na aba de gestão
            window.switchTab('management');
        }

        function renderAdminTools(container) {
            container.innerHTML = `
                <div class="grid lg:grid-cols-2 gap-8">
                    <div class="glass-card p-8 rounded-[2rem]">
                        <h2 class="font-bold text-white text-lg mb-6 uppercase tracking-wide border-b border-white/10 pb-4">📁 Importação em Massa (CSV)</h2>
                        <div class="space-y-6"><div class="p-4 bg-blue-900/20 border border-blue-500/30 rounded-xl"><p class="text-[10px] text-gray-300 uppercase font-bold mb-2">Formato:</p><code class="block bg-black/40 p-2 rounded text-xs text-cyan-400 font-mono">tipo,login,nome,senha</code></div>
                        <div><label class="text-[10px] uppercase font-bold text-gray-500 mb-2 block">Modo</label><select id="csv_mode" class="w-full p-4 rounded-xl text-sm font-bold bg-[#0a1f3d]"><option value="append">Adicionar / Atualizar</option><option value="replace">SUBSTITUIR TUDO</option></select></div>
                        <div><label class="text-[10px] uppercase font-bold text-gray-500 mb-2 block">Arquivo</label><input type="file" id="csv_file" accept=".csv" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-cyan-400 file:text-navy-900 hover:file:bg-cyan-300"></div>
                        <button onclick="window.handleCSVUpload()" class="w-full btn-primary py-4 rounded-xl text-xs font-black tracking-wider">Processar CSV</button></div>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem]">
                        <h2 class="font-bold text-white text-lg mb-6 uppercase tracking-wide border-b border-white/10 pb-4">👤 Cadastro Manual</h2>
                        <div class="space-y-4"><div class="grid grid-cols-2 gap-4"><div><label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Tipo</label><select id="new_role" class="w-full p-3 rounded-xl text-sm font-bold"><option value="aluno">Aluno</option><option value="preceptor">Preceptor</option><option value="portaria">Portaria</option><option value="admin">Admin</option></select></div><div><label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Login</label><input type="text" id="new_id" class="w-full p-3 rounded-xl text-sm font-bold"></div></div><div><label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Nome</label><input type="text" id="new_name" class="w-full p-3 rounded-xl text-sm font-bold"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Senha</label><input type="text" id="new_pass" class="w-full p-3 rounded-xl text-sm font-bold" value="123"></div><button onclick="window.handleManualAdd()" class="w-full bg-white/10 hover:bg-white/20 text-white py-4 rounded-xl text-xs font-bold tracking-wider transition-all border border-white/10">Adicionar</button></div>
                    </div>
                    <div class="glass-card p-8 rounded-[2rem] lg:col-span-2"><h2 class="font-bold text-white text-lg mb-6 uppercase tracking-wide flex justify-between items-center"><span>Base de Usuários</span><button onclick="window.renderAdminUserList()" class="text-[10px] bg-white/5 px-3 py-1 rounded hover:bg-white/10">Atualizar</button></h2><div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="text-[10px] text-gray-500 uppercase border-b border-white/10"><th class="p-3">Tipo</th><th class="p-3">Login</th><th class="p-3">Nome</th><th class="p-3">Senha</th><th class="p-3 text-right">Ação</th></tr></thead><tbody id="admin-users-list" class="text-sm text-gray-300"><tr><td colspan="5" class="p-4 text-center italic text-gray-600">Carregando...</td></tr></tbody></table></div></div>
                </div>`;
            window.renderAdminUserList();
        }

        async function renderAluno(container) {
            container.innerHTML = `<div class="grid lg:grid-cols-5 gap-8"><div class="lg:col-span-2 space-y-6"><div class="glass-card p-8 rounded-[2rem] relative overflow-hidden"><h2 class="font-bold text-white text-lg mb-8 uppercase tracking-wide flex items-center gap-2"><span class="w-1.5 h-1.5 bg-cyan-400 rounded-full"></span> Nova Saída</h2><div class="space-y-5"><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Destino</label><input type="text" id="destino" class="w-full p-4 rounded-xl text-sm font-semibold" placeholder="Ex: Biblioteca Central"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Motivo</label><textarea id="motivo" class="w-full p-4 rounded-xl text-sm font-semibold" rows="3" placeholder="Ex: Pesquisa para TCC"></textarea></div><div class="grid grid-cols-2 gap-4"><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Saída</label><input type="time" id="h_saida" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div><div><label class="text-[10px] uppercase font-bold text-gray-500 ml-2 mb-1 block tracking-wider">Retorno</label><input type="time" id="h_volta" class="w-full p-4 rounded-xl text-center font-bold text-gray-300"></div></div><button id="btnSolicitar" class="w-full btn-primary py-4 rounded-xl text-xs font-black tracking-wider mt-2">Solicitar Autorização</button></div></div></div><div class="lg:col-span-3"><h2 class="font-bold text-sm mb-6 text-gray-500 uppercase tracking-widest pl-2">Meus Pedidos</h2><div id="lista-pedidos-aluno" class="space-y-4"></div></div></div>`;
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                const docs = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.ra === userProfile.uid);
                const listEl = document.getElementById('lista-pedidos-aluno');
                if (!listEl) return;
                listEl.innerHTML = docs.sort((a,b) => b.criadoEm.localeCompare(a.criadoEm)).map(s => `<div class="glass-card p-6 rounded-2xl flex justify-between items-center hover:bg-white/[0.05] transition-all group border-l-4 ${getStatusColor(s.status)}"><div><span class="status-badge ${getStatusBadgeColor(s.status)}">${s.status}</span><p class="font-bold text-white text-base mt-2 group-hover:text-cyan-400 transition-colors">${s.motivo}</p><p class="text-[10px] text-gray-500 uppercase mt-1 tracking-wider flex items-center gap-2"><span>${s.destino}</span></p></div><div class="text-right pl-4 border-l border-white/5"><p class="text-xs font-bold text-gray-400 mb-1">Horário</p><p class="text-sm font-black text-cyan-400 whitespace-nowrap">${s.h_saida} <span class="text-white/20 mx-1">➜</span> ${s.h_volta}</p></div></div>`).join('') || '<p class="text-gray-500 italic text-center">Nenhum pedido.</p>';
            });
            document.getElementById('btnSolicitar').onclick = async () => {
                const destino = document.getElementById('destino').value, motivo = document.getElementById('motivo').value, h_saida = document.getElementById('h_saida').value, h_volta = document.getElementById('h_volta').value;
                if(!destino || !motivo || !h_saida || !h_volta) { showToast("Preencha tudo!", 'error'); return; }
                const btn = document.getElementById('btnSolicitar'); btn.innerText = "ENVIANDO..."; btn.disabled = true;
                try { await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes'), { ra: userProfile.uid, aluno: userProfile.name, destino, motivo, h_saida, h_volta, status: 'pendente', criadoEm: new Date().toISOString() }); document.getElementById('destino').value = ''; document.getElementById('motivo').value = ''; showToast("Enviado!", 'success'); } catch (e) { showToast("Erro: " + e.message, 'error'); } finally { btn.innerText = "Solicitar Autorização"; btn.disabled = false; }
            };
        }

        function renderPreceptor(container) {
            container.innerHTML = `<div class="flex justify-between items-end mb-8"><h2 class="font-bold text-white text-xl uppercase tracking-wide flex items-center gap-3"><span class="w-2 h-8 bg-amber-400 rounded-full"></span> Autorizações Pendentes</h2></div><div id="lista-preceptor" class="grid md:grid-cols-2 gap-6"></div>`;
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                const pendentes = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.status === 'pendente');
                const listEl = document.getElementById('lista-preceptor');
                if (!listEl) return;
                listEl.innerHTML = pendentes.map(s => `<div class="glass-card p-8 rounded-[2rem] relative overflow-hidden group hover:border-amber-400/30 transition-colors"><div class="absolute top-0 left-0 w-1.5 h-full bg-amber-400"></div><div class="flex justify-between items-start mb-4"><div><h3 class="font-bold text-lg text-white mb-1 group-hover:text-amber-400 transition-colors">${s.aluno}</h3><p class="text-[10px] text-gray-500 uppercase tracking-widest">RA: ${s.ra}</p></div><div class="text-right"><span class="block text-[10px] font-bold text-amber-400 bg-amber-400/10 px-2 py-1 rounded mb-1">PENDENTE</span><span class="text-xs font-bold text-white">${s.h_saida} - ${s.h_volta}</span></div></div><div class="bg-black/30 p-4 rounded-xl mb-6 border border-white/5"><p class="text-[10px] text-gray-500 uppercase font-bold mb-1">Motivo</p><p class="text-sm text-gray-300 italic">"${s.motivo}"</p><p class="text-[10px] text-gray-500 uppercase font-bold mt-3 mb-1">Destino</p><p class="text-xs text-white font-bold">${s.destino}</p></div><div class="flex gap-3"><button onclick="window.atualizarPedido('${s.id}', 'aprovado')" class="flex-1 btn-primary py-3 rounded-xl text-[10px] font-black tracking-wider shadow-lg hover:shadow-cyan-400/20">AUTORIZAR</button><button onclick="window.atualizarPedido('${s.id}', 'recusado')" class="flex-1 bg-white/5 hover:bg-red-500/10 text-red-400 border border-white/10 hover:border-red-500/30 py-3 rounded-xl text-[10px] font-bold tracking-wider transition-all">NEGAR</button></div></div>`).join('') || '<p class="text-gray-500 italic col-span-full text-center">Tudo limpo.</p>';
            });
        }

        function renderPortaria(container) {
            container.innerHTML = `<div class="flex justify-between items-end mb-8"><h2 class="font-bold text-white text-xl uppercase tracking-wide flex items-center gap-3"><span class="w-2 h-8 bg-cyan-400 rounded-full"></span> Saídas Autorizadas</h2></div><div id="lista-portaria" class="space-y-4"></div>`;
            onSnapshot(query(collection(db, 'artifacts', appId, 'public', 'data', 'solicitacoes')), (snap) => {
                const aprovados = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(s => s.status === 'aprovado');
                const listEl = document.getElementById('lista-portaria');
                if (!listEl) return;
                listEl.innerHTML = aprovados.map(s => `<div class="glass-card p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-6 border-l-4 border-cyan-400 shadow-[0_0_30px_rgba(0,0,0,0.3)]"><div class="flex-1"><div class="flex items-center gap-3 mb-2"><h3 class="font-bold text-white text-xl">${s.aluno}</h3><span class="bg-cyan-400 text-[#06162e] text-[9px] font-black px-2 py-0.5 rounded uppercase">Autorizado</span></div><div class="flex gap-6 text-sm"><div><span class="text-[10px] text-gray-500 uppercase font-bold block">Destino</span><span class="text-cyan-50 font-medium">${s.destino}</span></div><div><span class="text-[10px] text-gray-500 uppercase font-bold block">Horário</span><span class="text-cyan-400 font-bold">${s.h_saida} <span class="text-white/30 mx-1">-</span> ${s.h_volta}</span></div></div></div><button onclick="window.atualizarPedido('${s.id}', 'finalizado')" class="w-full md:w-auto bg-cyan-400 hover:bg-cyan-300 text-[#06162e] px-8 py-4 rounded-xl text-xs font-black uppercase tracking-widest transition-all shadow-[0_0_20px_rgba(0,217,230,0.3)] hover:shadow-[0_0_30px_rgba(0,217,230,0.5)] transform hover:-translate-y-1">Confirmar Saída</button></div>`).join('') || '<p class="text-gray-500 italic text-center">Nenhuma saída autorizada.</p>';
            });
        }

        // Helpers de Status (inalterados)
        function getStatusColor(s){ if(s=='aprovado')return 'border-cyan-400'; if(s=='pendente')return 'border-amber-400'; return 'border-red-400'; }
        function getStatusBadgeColor(s){ if(s=='aprovado')return 'bg-cyan-400/20 text-cyan-400'; if(s=='pendente')return 'bg-amber-400/20 text-amber-400'; return 'bg-red-400/20 text-red-400'; }

        // --- MISSING FUNCTION RESTORED ---
        window.atualizarPedido = async (id, status) => {
            showLoading(true);
            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'solicitacoes', id), { status });
                showToast("Status atualizado.", 'success');
            } catch (e) {
                showToast("Erro: " + e.message, 'error');
            } finally {
                showLoading(false);
            }
        };

        init();
    </script>
</body>
</html>
