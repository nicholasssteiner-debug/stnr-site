<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Atendimento TIM</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar for Modal */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen relative">

    <!-- Loading State -->
    <div id="loading" class="fixed inset-0 bg-slate-50 z-50 flex items-center justify-center transition-opacity duration-300">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen" class="hidden fixed inset-0 z-40 bg-slate-50 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-lg border border-slate-200">
            <div class="text-center">
                <div class="flex items-center justify-center gap-6">
                    <img src="https://logo-marque.com/wp-content/uploads/2021/03/TIM-Logo.png" alt="Logo TIM" class="h-10 sm:h-12 w-auto object-contain" />
                    <div class="h-10 w-px bg-slate-200"></div>
                    <img src="https://ac-landing-pages-user-uploads-production.s3.amazonaws.com/0000134440/ffc592cb-f28e-4dae-a2e6-055d10bffd22.png" alt="Educação Adventista" class="h-10 sm:h-12 w-auto object-contain" />
                </div>
                <h2 class="mt-6 text-3xl font-extrabold text-slate-900">Acesso Restrito</h2>
                <p class="mt-2 text-sm text-slate-600">Insira as suas credenciais para continuar</p>
            </div>
            <form id="login-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm space-y-4">
                    <div>
                        <label for="email-address" class="text-sm font-medium text-slate-700">Endereço de Email</label>
                        <input id="email-address" name="email" type="email" required class="mt-1 appearance-none rounded-lg relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="exemplo@adventistas.org">
                    </div>
                    <div>
                        <label for="password" class="text-sm font-medium text-slate-700">Palavra-passe</label>
                        <input id="password" name="password" type="password" required class="mt-1 appearance-none rounded-lg relative block w-full px-3 py-2 border border-slate-300 placeholder-slate-400 text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="••••••••">
                    </div>
                </div>
                <div id="login-error" class="hidden text-red-600 text-sm text-center font-medium bg-red-50 py-2 rounded-lg border border-red-100">
                    Credenciais inválidas. Tente novamente.
                </div>
                <div>
                    <button type="submit" class="w-full flex justify-center py-2.5 px-4 border border-transparent text-sm font-bold rounded-lg text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 shadow-md transition-all">
                        Entrar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Content (Hidden initially) -->
    <div id="app" class="hidden min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <img 
                        src="https://logo-marque.com/wp-content/uploads/2021/03/TIM-Logo.png" 
                        alt="Logo TIM" 
                        class="h-8 w-auto object-contain"
                    />
                    <div class="h-6 w-px bg-slate-200"></div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-800">Controle de Atendimento</h1>
                </div>
                <button 
                    onclick="window.openModal()"
                    class="flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition-colors shadow-sm"
                >
                    <i data-lucide="plus" class="w-5 h-5"></i>
                    <span class="hidden sm:inline">Novo Protocolo</span>
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
            
            <!-- Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="stats-container">
                <!-- Injected via JS -->
            </div>

            <!-- Filters -->
            <div class="flex flex-col md:flex-row gap-4 mb-6">
                <div class="relative flex-1">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input 
                        type="text" 
                        id="search-input"
                        placeholder="Buscar por linha, protocolo ou descrição..."
                        class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all"
                    />
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0" id="filter-container">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Table -->
            <div class="bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200">
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Data / Linha</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Protocolo / Categoria</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Descrição Detalhada</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Status / Prioridade</th>
                                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-body" class="divide-y divide-slate-100">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
                <h2 id="modal-title" class="text-lg font-bold text-slate-800">Novo Registro TIM</h2>
                <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <form id="ticket-form" class="overflow-y-auto p-6 space-y-5 custom-scroll">
                <input type="hidden" id="ticket-id">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Data do Atendimento</label>
                        <input type="date" id="data" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Número da Linha (DDD)</label>
                        <input type="text" id="linha" placeholder="(11) 99999-9999" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Protocolo TIM</label>
                        <input type="text" id="protocolo" placeholder="2024..." required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none font-mono">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Categoria</label>
                        <select id="categoria" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none appearance-none">
                            <!-- Options injected via JS -->
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700">Descrição Detalhada</label>
                    <textarea id="descricao" rows="3" placeholder="Explique o que aconteceu..." required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Prioridade</label>
                        <div class="flex gap-2" id="priority-selector">
                            <!-- Injected via JS -->
                        </div>
                        <input type="hidden" id="prioridade" value="Média">
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700">Status Atual</label>
                        <select id="status" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none">
                            <!-- Options injected via JS -->
                        </select>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-sm font-semibold text-slate-700">Resolução / Observações Finais</label>
                    <textarea id="resolucao" rows="2" placeholder="Solução, estornos, etc." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-green-500/20 focus:border-green-500 outline-none resize-none"></textarea>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="window.closeModal()" class="flex-1 px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition-all">Cancelar</button>
                    <button type="submit" id="save-btn" class="flex-[2] px-4 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/30 transition-all">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Logic (Firebase Client Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyA2pd4xEo0r4v3yTIhRX26UQQVEuhkszpM",
            authDomain: "controle-de-verbas-manuais.firebaseapp.com",
            projectId: "controle-de-verbas-manuais",
            storageBucket: "controle-de-verbas-manuais.firebasestorage.app",
            messagingSenderId: "193934709366",
            appId: "1:193934709366:web:7135dc45d1e80f3f648557",
            measurementId: "G-SKNFBZ6YW7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- CONSTANTS ---
        const CATEGORIAS = ['Cobrança Indevida', 'Problema Técnico', 'Alteração de Plano', 'Cancelamento', 'Portabilidade', 'Outros'];
        const PRIORIDADES = [
            { label: 'Baixa', color: 'bg-blue-100 text-blue-700' },
            { label: 'Média', color: 'bg-yellow-100 text-yellow-700' },
            { label: 'Alta', color: 'bg-red-100 text-red-700' }
        ];
        const STATUS_OPTIONS = [
            { label: 'Aberto - Aguardando TIM', color: 'bg-orange-100 text-orange-700', icon: 'clock' },
            { label: 'Em Tratativa', color: 'bg-blue-100 text-blue-700', icon: 'alert-circle' },
            { label: 'Resolvido', color: 'bg-green-100 text-green-700', icon: 'check-circle-2' },
            { label: 'Cancelado', color: 'bg-gray-100 text-gray-700', icon: 'x' }
        ];

        // --- STATE ---
        let state = {
            user: null,
            tickets: [],
            filterStatus: 'Todos',
            searchTerm: '',
            editingId: null
        };

        // --- AUTH CREDENTIALS ---
        const VALID_EMAILS = ["auxiap.cont@adventistas.org", "nicholas.ganhadeiro@adventistas.org"];
        const VALID_PASS = "Fap1624";

        function checkLoginState() {
            const isLogged = sessionStorage.getItem('tim_tracker_logged');
            if (isLogged === 'true') {
                init();
            } else {
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email-address').value;
            const pass = document.getElementById('password').value;

            if (VALID_EMAILS.includes(email) && pass === VALID_PASS) {
                sessionStorage.setItem('tim_tracker_logged', 'true');
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');
                init();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('login-error').classList.add('hidden');
                }, 3000);
            }
        }

        // --- INIT ---
        async function init() {
            // Populate Static Form Options
            const catSelect = document.getElementById('categoria');
            CATEGORIAS.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                catSelect.appendChild(opt);
            });

            const statusSelect = document.getElementById('status');
            STATUS_OPTIONS.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.label;
                opt.textContent = s.label;
                statusSelect.appendChild(opt);
            });

            // Search Listener
            document.getElementById('search-input').addEventListener('input', (e) => {
                state.searchTerm = e.target.value;
                renderTickets();
            });

            // Form Submit Listener
            document.getElementById('ticket-form').addEventListener('submit', handleFormSubmit);

            renderFilters();
            renderPrioritySelector();

            // Init Firebase Auth
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    state.user = user;
                    if (user) {
                        setupListener();
                    }
                });
            } catch (error) {
                console.error("Erro na autenticação Firebase:", error);
                alert("Não foi possível conectar ao Firebase. Verifique as permissões de acesso.");
            }
        }

        function setupListener() {
            if (!state.user) return;
            
            // Referência à coleção dentro do seu Firestore
            const colRef = collection(db, 'artifacts', 'tim-tracker', 'public', 'data', 'atendimentos');
            const q = query(colRef);

            onSnapshot(q, (snapshot) => {
                const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                
                // Ordenar por data mais recente
                data.sort((a, b) => new Date(b.data) - new Date(a.data));
                state.tickets = data;
                
                // Ocultar Loading e Mostrar App
                document.getElementById('loading').classList.add('opacity-0');
                setTimeout(() => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');
                }, 300);

                renderApp();
            }, (error) => {
                console.error("Erro ao sincronizar dados:", error);
                alert("Erro ao ler dados. O banco de dados pode estar com restrições de permissão.");
            });
        }

        // --- RENDER FUNCTIONS ---
        function renderApp() {
            renderStats();
            renderTickets();
            lucide.createIcons();
        }

        function renderStats() {
            const total = state.tickets.length;
            const abertos = state.tickets.filter(t => t.status.includes('Aberto') || t.status === 'Em Tratativa').length;
            const resolvidos = state.tickets.filter(t => t.status === 'Resolvido').length;

            const html = `
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-slate-500 text-sm font-medium">Total de Registros</p>
                    <p class="text-3xl font-bold mt-1">${total}</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-orange-600 text-sm font-medium">Pendentes / Em Aberto</p>
                    <p class="text-3xl font-bold mt-1 text-orange-600">${abertos}</p>
                </div>
                <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <p class="text-green-600 text-sm font-medium">Casos Resolvidos</p>
                    <p class="text-3xl font-bold mt-1 text-green-600">${resolvidos}</p>
                </div>
            `;
            document.getElementById('stats-container').innerHTML = html;
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            const statuses = ['Todos', ...STATUS_OPTIONS.map(s => s.label)];
            
            container.innerHTML = statuses.map(status => {
                const isActive = state.filterStatus === status;
                const classes = isActive 
                    ? 'bg-blue-600 border-blue-600 text-white' 
                    : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300';
                return `<button type="button" onclick="window.setFilter('${status}')" class="whitespace-nowrap px-4 py-2 rounded-lg text-sm font-medium border transition-all ${classes}">${status}</button>`;
            }).join('');
        }

        function renderTickets() {
            const tbody = document.getElementById('tickets-body');
            
            const filtered = state.tickets.filter(t => {
                const matchesSearch = 
                    (t.linha || '').toLowerCase().includes(state.searchTerm.toLowerCase()) || 
                    (t.protocolo || '').toLowerCase().includes(state.searchTerm.toLowerCase()) ||
                    (t.descricao || '').toLowerCase().includes(state.searchTerm.toLowerCase());
                
                const matchesStatus = state.filterStatus === 'Todos' || t.status === state.filterStatus;
                
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(t => {
                const statusInfo = STATUS_OPTIONS.find(s => s.label === t.status) || STATUS_OPTIONS[0];
                const prioInfo = PRIORIDADES.find(p => p.label === t.prioridade) || PRIORIDADES[1];
                
                // Tratar datas de maneira robusta
                let dateStr = t.data;
                try {
                    dateStr = new Date(t.data + 'T12:00:00Z').toLocaleDateString('pt-BR');
                } catch(e) {}

                return `
                    <tr class="hover:bg-slate-50/50 transition-colors group">
                        <td class="px-6 py-4">
                            <div class="text-sm font-medium text-slate-900">${dateStr}</div>
                            <div class="text-xs text-slate-500 flex items-center gap-1 mt-1">
                                <i data-lucide="phone" class="w-3 h-3"></i> ${t.linha}
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-mono text-slate-700">${t.protocolo}</div>
                            <div class="text-xs text-slate-500 mt-1">${t.categoria}</div>
                        </td>
                        <td class="px-6 py-4 max-w-xs">
                            <div class="text-sm text-slate-600 line-clamp-2 leading-relaxed">${t.descricao}</div>
                            ${t.resolucao ? `
                            <div class="text-xs text-green-600 mt-2 italic flex items-start gap-1">
                                <i data-lucide="check-circle-2" class="w-3 h-3 mt-0.5 flex-shrink-0"></i>
                                <span class="line-clamp-1">${t.resolucao}</span>
                            </div>` : ''}
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex flex-col gap-2">
                                <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium w-fit ${statusInfo.color}">
                                    <i data-lucide="${statusInfo.icon}" class="w-3 h-3"></i>
                                    ${t.status}
                                </span>
                                <span class="inline-flex px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider w-fit ${prioInfo.color}">
                                    ${t.prioridade}
                                </span>
                            </div>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="window.editTicket('${t.id}')" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all" title="Editar">
                                    <i data-lucide="edit-2" class="w-4 h-4"></i>
                                </button>
                                <button type="button" onclick="window.deleteTicket('${t.id}')" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all" title="Excluir">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderPrioritySelector() {
            const container = document.getElementById('priority-selector');
            const current = document.getElementById('prioridade').value;
            
            container.innerHTML = PRIORIDADES.map(p => {
                const isActive = current === p.label;
                const classes = isActive 
                    ? `${p.color} border-current` 
                    : 'bg-white border-slate-200 text-slate-400';
                
                return `
                    <button type="button" 
                        onclick="window.setPriority('${p.label}')"
                        class="flex-1 py-2 text-xs font-bold rounded-lg border transition-all ${classes}"
                    >
                        ${p.label}
                    </button>
                `;
            }).join('');
        }

        // --- GLOBAL ACTIONS ---
        window.setFilter = (status) => {
            state.filterStatus = status;
            renderFilters();
            renderTickets();
            lucide.createIcons();
        };

        window.setPriority = (prio) => {
            document.getElementById('prioridade').value = prio;
            renderPrioritySelector();
        };

        window.openModal = () => {
            state.editingId = null;
            document.getElementById('modal-title').textContent = 'Novo Registro TIM';
            document.getElementById('save-btn').textContent = 'Cadastrar Protocolo';
            
            document.getElementById('ticket-form').reset();
            document.getElementById('data').value = new Date().toISOString().split('T')[0];
            document.getElementById('prioridade').value = 'Média';
            renderPrioritySelector();
            
            document.getElementById('modal').classList.remove('hidden');
        };

        window.editTicket = (id) => {
            const ticket = state.tickets.find(t => t.id === id);
            if (!ticket) return;

            state.editingId = id;
            document.getElementById('modal-title').textContent = 'Editar Protocolo';
            document.getElementById('save-btn').textContent = 'Salvar Alterações';

            document.getElementById('data').value = ticket.data || '';
            document.getElementById('linha').value = ticket.linha || '';
            document.getElementById('protocolo').value = ticket.protocolo || '';
            document.getElementById('categoria').value = ticket.categoria || '';
            document.getElementById('descricao').value = ticket.descricao || '';
            document.getElementById('prioridade').value = ticket.prioridade || 'Média';
            document.getElementById('status').value = ticket.status || '';
            document.getElementById('resolucao').value = ticket.resolucao || '';
            
            renderPrioritySelector();
            document.getElementById('modal').classList.remove('hidden');
        };

        window.closeModal = () => {
            document.getElementById('modal').classList.add('hidden');
        };

        window.deleteTicket = async (id) => {
            if (!state.user) return;
            if (!confirm("Deseja realmente excluir este registro?")) return;
            
            try {
                await deleteDoc(doc(db, 'artifacts', 'tim-tracker', 'public', 'data', 'atendimentos', id));
            } catch (error) {
                console.error("Erro ao deletar:", error);
                alert("Erro ao excluir do servidor.");
            }
        };

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!state.user) {
                alert("Aguarde a conexão com o servidor...");
                return;
            }

            const formData = {
                data: document.getElementById('data').value,
                linha: document.getElementById('linha').value,
                protocolo: document.getElementById('protocolo').value,
                categoria: document.getElementById('categoria').value,
                descricao: document.getElementById('descricao').value,
                prioridade: document.getElementById('prioridade').value,
                status: document.getElementById('status').value,
                resolucao: document.getElementById('resolucao').value
            };

            const btn = document.getElementById('save-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Salvando...';
            btn.disabled = true;

            try {
                const colRef = collection(db, 'artifacts', 'tim-tracker', 'public', 'data', 'atendimentos');
                
                if (state.editingId) {
                    await updateDoc(doc(colRef, state.editingId), formData);
                } else {
                    await addDoc(colRef, {
                        ...formData,
                        createdAt: new Date().toISOString()
                    });
                }
                window.closeModal();
            } catch (error) {
                console.error("Erro ao salvar no Firestore:", error);
                alert("Erro ao salvar o protocolo. Verifique as regras do seu Firebase.");
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }

        // --- START ---
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                document.getElementById('login-form').addEventListener('submit', handleLogin);
                checkLoginState();
            });
        } else {
            document.getElementById('login-form').addEventListener('submit', handleLogin);
            checkLoginState();
        }
    </script>
</body>
</html>
